 **woodcut** print with **letterpress** text: a single sheet divided into two halves by a **tree** that is dead on the left and alive on the right."],["Function","**Protestant** teaching: it explains **Lutheran** doctrine visually and could be mass-produced and widely distributed."],["Content","**Left (Law)**: Moses shows the commandments; death and the devil drive a naked man into hell; Adam and Eve and the Last Judgment appear in the background. **Right (Grace)**: John the Baptist points the man to the **crucified Christ**, whose blood falls on him; the risen Christ defeats death. Salvation comes through **faith and grace**, not good works."],["Context","**Lucas Cranach the Elder** was a friend of **Martin Luther**. The **Reformation** used print to spread its message."],["Exam hooks","Cranach · woodcut · Lutheran · law vs. grace · faith not works · Reformation · print as propaganda"],["Compare with","Adam and Eve (#74): print. Il Gesù (#82): Counter-Reformation response."]]},{n:80,title:"Venus of Urbino",maker:"Titian",date:"c. 1538 C.E.",medium:"Oil on canvas",context:"A nude reclining on rumpled sheets in a contemporary Venetian bedroom, looking straight at the viewer while servants dig in a chest behind her. Roses, a sleeping dog and myrtle suggest love and fidelity, so it may be a marriage picture — but the frank gaze and domestic setting make the title 'Venus' a thin cover.",unit:3,unitName:"Early Europe and Colonial Americas",year:1538,images:[{src:"cb/80-1.jpg",w:992,h:696,caption:"Venus of Urbino",credit:"© Scala/Ministero per i Beni e la Attività culturali/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",0,4,8,7],notes:[["Form","An **oil on canvas** painting of a reclining nude woman looking directly at the viewer, using Venetian **colorito** (rich color and soft modeling) rather than disegno. The background is a domestic interior where maids search a **cassone** (marriage chest)."],["Function","Bought by **Guidobaldo della Rovere**, Duke of Urbino, perhaps a marriage-related painting or simply an erotic image."],["Content","**Venus** (or a courtesan) holds roses; a sleeping **dog** suggests fidelity; the cassone suggests marriage. Her gaze and pose are seductive and frank."],["Context","**Titian**, Venice. It became a model for later reclining nudes such as Ingres (#107) and especially **Manet's Olympia** (#115), which parodies it."],["Exam hooks","Titian · Venetian color · reclining nude · direct gaze · cassone/marriage · dog = fidelity · model for Olympia"],["Compare with","Birth of Venus (#72). Olympia (#115). La Grande Odalisque (#107)."]]},{n:81,title:"Frontispiece of the Codex Mendoza",maker:"Viceroyalty of New Spain",date:"c. 1541–1542 C.E.",medium:"Ink and color on paper",context:"Made by Nahua scribes for the Spanish crown. Tenochtitlan appears as a diagonal cross of canals with the eagle on a cactus at the centre, ten founding lords around it and conquests below, with Spanish glosses added afterward. Indigenous pictorial convention carrying information for a European reader — a hybrid document of conquest.",unit:3,unitName:"Early Europe and Colonial Americas",year:1541,images:[{src:"cb/81-1.jpg",w:721,h:1030,caption:"Frontispiece of the Codex Mendoza",credit:"© The Bodleian Libraries, The University of Oxford"}],thumb:["thumbs/t2-u3.webp",1,4,8,7],notes:[["Form","A page in ink and color on European paper. It combines **Aztec pictographic** conventions (glyphs, flat figures, footprints) with Spanish annotations in **alphabetic** writing."],["Function","Commissioned by **Viceroy Antonio de Mendoza** to inform **Emperor Charles V** about the Aztec (Mexica) empire, its history, tribute and daily life."],["Content","The **founding of Tenochtitlan**: an **eagle on a cactus** (nopal) growing from a rock (the city's glyph) at the center, surrounded by founders. Blue water channels divide the city into four quarters. The year-count border marks dates. Battles with neighboring cities appear below."],["Context","Made by **Indigenous scribes** after the conquest, during the colonial period: a mix of cultures. The eagle on the cactus is now on the **Mexican flag**."],["Exam hooks","Codex Mendoza · Tenochtitlan founding · eagle on cactus · Aztec pictographs + Spanish text · colonial · made for Charles V"],["Compare with","Templo Mayor (#157): Tenochtitlan. Feather headdress (#158). Spaniard and Indian (#97): colonial New Spain."]]},{n:82,title:"Il Gesù, including Triumph of the Name of Jesus ceiling fresco",maker:"Giacomo da Vignola (plan); Giacomo della Porta (facade); Giovanni Battista Gaulli (fresco); Rome, Italy",date:"Church 16th century C.E.; facade 1568–1584 C.E.; fresco and stucco 1676–1679 C.E.",medium:"Brick, marble, fresco, and stucco",context:"The Jesuit mother church: one wide nave with side chapels instead of aisles, so the whole congregation can see and hear the preacher — Counter-Reformation planning. Scrolls tie the tall centre of the façade to its lower sides. Gaulli's ceiling breaks the vault open, gilded stucco figures spilling past the frame onto the coffers.",unit:3,unitName:"Early Europe and Colonial Americas",year:1500,images:[{src:"cb/82-1.jpg",w:993,h:686,caption:"Il Gesù",credit:"© Scala/Art Resource, NY"},{src:"cb/82-2.jpg",w:760,h:1030,caption:"Triumph of the Name of Jesus",credit:"© The Bridgeman Art Library"},{src:"cb/82-3.jpg",w:714,h:1022,caption:"Il Gesù",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",2,4,8,7],notes:[["Form","The mother church of the **Jesuits** in Rome. **Vignola**'s **Latin-cross** plan: a wide single nave without aisles, so everyone could see and hear the preacher, with side chapels and a dome at the crossing. **Della Porta**'s facade has two stories linked by **volutes** (scrolls), framed with paired pilasters and a central portal. Later, **Gaulli** painted the ceiling fresco **Triumph of the Name of Jesus**, with **stucco** figures by Antonio Raggi."],["Function","Preaching and **Counter-Reformation** worship, and a model for Jesuit churches worldwide."],["Content","The ceiling: the monogram **IHS** in blinding light; the saved rise toward it while the damned fall, apparently spilling out of the frame over the real architecture (**quadratura** and di sotto in sù illusion)."],["Context","The **Society of Jesus** (Jesuits) was founded by Ignatius of Loyola in 1540. The Counter-Reformation used **emotional, theatrical art** to reaffirm Catholicism."],["Exam hooks","Jesuit · Counter-Reformation · Latin cross, single nave · volute facade · Triumph of the Name of Jesus · ceiling illusion · IHS"],["Compare with","Allegory of Law and Grace (#79): Protestant. Ecstasy of St. Teresa (#89): Baroque theatricality. San Carlo (#88)."]]},{n:83,title:"Hunters in the Snow",maker:"Pieter Bruegel the Elder",date:"1565 C.E.",medium:"Oil on wood",context:"From a series of the months. A high viewpoint and a diagonal of trees pull the eye from the tired hunters and their dogs down to skaters on frozen ponds and jagged peaks that do not belong in Flanders. Peasant life is observed without allegory or mockery — a landscape in which people are simply part of the season.",unit:3,unitName:"Early Europe and Colonial Americas",year:1565,images:[{src:"cb/83-1.jpg",w:992,h:718,caption:"Hunters in the Snow",credit:"© The Art Archive at Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",3,4,8,7],notes:[["Form","An **oil on wood** winter landscape seen from a **high viewpoint**, with a strong diagonal. The palette is cold: white snow, gray-green sky and ice. Small skaters on frozen ponds recede into the distance, and dark tree trunks and hunters form a rhythm."],["Function","Part of a **series** of six paintings of the **months or seasons** commissioned by the wealthy Antwerp merchant **Nicolaes Jonghelinck** for his home."],["Content","Weary hunters return with one meager fox, followed by tired dogs. An inn sign hangs crookedly, people prepare a fire, and skaters play below. Mountains are invented, since Flanders is flat. Peasant life is set in the cycle of nature."],["Context","**Pieter Bruegel the Elder**: Northern genre and landscape painting. It may reflect the **Little Ice Age**. Landscape here becomes an independent subject, and its secular theme suited a Protestant-leaning market."],["Exam hooks","Bruegel · landscape + genre · months/seasons series · high viewpoint · peasants · Little Ice Age · merchant patron"],["Compare with","The Oxbow (#109): landscape. Travelers among Mountains and Streams (#201)."]]},{n:84,title:"Mosque of Selim II",maker:"Sinan (architect); Edirne, Turkey",date:"1568–1575 C.E.",medium:"Brick and stone",context:"Sinan's own choice for his masterpiece: a single 102-foot dome on eight piers, so the interior is one undivided volume with no forest of supports. Four pencil minarets, among the tallest ever built, mark the corners. He set out to exceed the dome of Hagia Sophia, and claimed he had done it.",unit:3,unitName:"Early Europe and Colonial Americas",year:1568,images:[{src:"cb/84-1.jpg",w:791,h:1032,caption:"Mosque of Selim II",credit:"© Giraudon/The Bridgeman Art Library"},{src:"cb/84-2.jpg",w:703,h:1030,caption:"Mosque of Selim II",credit:"© Vanni Archive/Art Resource, NY"},{src:"cb/84-3.jpg",w:884,h:1029,caption:"Mosque of Selim II plan",credit:""}],thumb:["thumbs/t2-u3.webp",4,4,8,7],notes:[["Form","A **central dome** (about 102 feet across) on **eight piers** forming an octagon, so the interior is open and unified, lit by many windows. Four tall, slender **minarets** stand at the corners. The interior has **Iznik tile**, calligraphy and a raised royal loge (box)."],["Function","An imperial **Friday mosque** (külliye complex with a madrasa and other buildings) for Sultan **Selim II** at **Edirne**."],["Context","Designed by **Sinan**, the greatest Ottoman architect, who considered it his masterpiece. He aimed to surpass **Hagia Sophia**'s dome. The single unified space suits congregational prayer."],["Exam hooks","Sinan · Ottoman · dome on octagon of piers · four minarets · Iznik tiles · rivalry with Hagia Sophia · Edirne"],["Compare with","Hagia Sophia (#52): the model. Taj Mahal (#209). Dome of the Rock (#185)."]]},{n:85,title:"Calling of Saint Matthew",maker:"Caravaggio",date:"c. 1597–1601 C.E.",medium:"Oil on canvas",context:"Christ steps into a dark tavern and points; a shaft of light rakes the wall above the tax collectors' heads. Tenebrism does the dramatic work. The men wear contemporary clothes, which drags the miracle into the viewer's own world — precisely what Counter-Reformation art wanted. Which figure is Matthew is still argued.",unit:3,unitName:"Early Europe and Colonial Americas",year:1597,images:[{src:"cb/85-1.jpg",w:1e3,h:940,caption:"Calling of Saint Matthew",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",5,4,8,7],notes:[["Form","An **oil on canvas** painting with strong **tenebrism**: dramatic dark-and-light contrast. A beam of light enters from the upper right, following Christ's pointing hand (echoing Michelangelo's Adam). The figures are life-size and ordinary, in contemporary clothes, set in a tavern-like room."],["Function","For the **Contarelli Chapel**, San Luigi dei Francesi, Rome, as part of a cycle on St. Matthew."],["Content","Christ (with Peter) points to **Matthew**, a tax collector counting money. Matthew points to himself, 'me?' (or to the young man next to him; scholars debate which figure is Matthew). The light suggests **divine grace** calling a sinner."],["Context","**Caravaggio**'s **naturalism** and theatrical lighting fit the **Counter-Reformation** desire for accessible, emotionally direct art. He used ordinary people as models."],["Exam hooks","Caravaggio · tenebrism · light = grace · Contarelli Chapel · contemporary dress · Counter-Reformation · naturalism"],["Compare with","Last Supper (#73): a dramatic biblical moment. Ecstasy of St. Teresa (#89): Baroque."]]},{n:86,title:"Henri IV Receives the Portrait of Marie de' Medici, from the Marie de' Medici Cycle",maker:"Peter Paul Rubens",date:"1621–1625 C.E.",medium:"Oil on canvas",context:"One of 24 canvases mythologising an unpopular queen's life. Henri, in armour, is shown her portrait by Cupid and Hymen while Jupiter and Juno look down from a cloud and France murmurs in his ear. An arranged political marriage restaged as divinely arranged love, in Baroque diagonals and warm flesh.",unit:3,unitName:"Early Europe and Colonial Americas",year:1621,images:[{src:"cb/86-1.jpg",w:775,h:1020,caption:"Henri IV Receives the Portrait of Marie de’ Medici",credit:"© RMN-Grand Palais/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",6,4,8,7],notes:[["Form","A large **oil on canvas**, one of 24 paintings in a cycle, in **Baroque** style: energetic brushwork, rich color, swirling diagonals, and fleshy, dynamic figures (Rubens's style)."],["Function","Commissioned by **Marie de' Medici**, queen mother of France, to glorify her life and justify her role, for the Luxembourg Palace in Paris."],["Content","**Henri IV** gazes in love at a **portrait** of Marie, his future bride, presented by Cupid and Hymen (god of marriage). **Jupiter and Juno** look down approvingly, and France (personified) encourages him. Gods and allegory turn a political marriage into destiny."],["Context","Marie had been exiled after conflicts with her son Louis XIII. **Peter Paul Rubens**, the Flemish painter and diplomat, had to make an unremarkable life heroic, so he relied on **allegory**."],["Exam hooks","Rubens · Baroque allegory · Marie de' Medici cycle · portrait within painting · gods approve · political propaganda"],["Compare with","Versailles (#93): French royal display. Augustus (#43): political image. Las Meninas (#91): painting within painting."]]},{n:87,title:"Self-Portrait with Saskia",maker:"Rembrandt van Rijn",date:"1636 C.E.",medium:"Etching",context:"A small etched double portrait: Rembrandt at a table with a drawing tool, Saskia behind him, built from rapid crosshatched line. He wears contemporary dress with a plumed cap. Prints were how his reputation travelled, and he made dozens of self-portraits, treating his own face as a lifelong subject.",unit:3,unitName:"Early Europe and Colonial Americas",year:1636,images:[{src:"cb/87-1.jpg",w:946,h:1029,caption:"Self-Portrait with Saskia",credit:"© The Pierpont Morgan Library/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",7,4,8,7],notes:[["Form","An **etching**: lines drawn through a wax ground on a copper plate, then bitten with acid, which gives freer and more spontaneous lines than engraving."],["Function","A self-portrait print for sale and circulation, and to present himself."],["Content","**Rembrandt** at his work with his wife **Saskia** sitting behind him. He looks out at the viewer (looking into a mirror), wearing an artist's beret; she is smaller and in shadow."],["Context","The Dutch Republic had a commercial art market with no church or court as patron, so prints sold widely. Rembrandt made many self-portraits examining himself. Saskia died young in 1642."],["Exam hooks","Rembrandt · etching · self-portrait · Saskia · Dutch art market · artist as subject"],["Compare with","Las Meninas (#91): an artist portraying himself. Adam and Eve (#74): print. Self-Portrait (#105)."]]},{n:88,title:"San Carlo alle Quattro Fontane",maker:"Francesco Borromini (architect); Rome, Italy",date:"1638–1646 C.E.",medium:"Stone and stucco",context:"A tiny church on a cramped corner site whose walls undulate in and out in one continuous serpentine. The plan is built from interlocking ovals and triangles; the oval dome is coffered with crosses, hexagons and octagons that shrink upward to fake height. Baroque architecture as elastic geometry rather than post and lintel.",unit:3,unitName:"Early Europe and Colonial Americas",year:1638,images:[{src:"cb/88-1.jpg",w:814,h:1032,caption:"San Carlo alle Quattro Fontane",credit:"© Scala/Art Resource, NY"},{src:"cb/88-2.jpg",w:822,h:1030,caption:"San Carlo alle Quattro Fontane",credit:"© Andrea Jemolo/Scala/Art Resource, NY"},{src:"cb/88-3.jpg",w:993,h:986,caption:"San Carlo alle Quattro Fontane plan",credit:""}],thumb:["thumbs/t2-u3.webp",0,5,8,7],notes:[["Form","A small church on a cramped corner site in Rome. Its **undulating facade** has concave-convex-concave curves, so the wall seems to move. Inside, an **oval dome** with deeply cut coffers in **crosses, octagons and hexagons** shrinks toward the lantern. The interior is white, with light from hidden windows."],["Function","A church for the **Discalced Trinitarians**, a Spanish order."],["Context","**Francesco Borromini**, Bernini's rival. Baroque architecture rejected classical regularity for **dynamic, geometric complexity**. The plan is based on intersecting geometric shapes."],["Exam hooks","Borromini · undulating facade · oval dome · complex geometry · Baroque architecture · Trinity symbolism"],["Compare with","Il Gesù (#82): facade. Pantheon (#46): coffers. Guggenheim Bilbao (#240): curving modern form."]]},{n:89,title:"Ecstasy of Saint Teresa",maker:"Gian Lorenzo Bernini; Cornaro Chapel, Santa Maria della Vittoria, Rome",date:"c. 1647–1652 C.E.",medium:"Marble (sculpture); stucco and gilt bronze (chapel)",context:"Teresa's own account of an angel piercing her heart, staged as theatre: a hidden window, gilt bronze rays, the saint swooning on a cloud with a slack hand and a bare foot, drapery churning. Members of the Cornaro family watch from marble opera boxes on either side. Sculpture, architecture and light designed as one experience.",unit:3,unitName:"Early Europe and Colonial Americas",year:1647,images:[{src:"cb/89-1.jpg",w:775,h:1034,caption:"Church of Santa Maria della Vittoria",credit:"© ANDREW MEDICHINI/AP/Corbis"},{src:"cb/89-2.jpg",w:729,h:1034,caption:"Cornaro Chapel",credit:"© Nimatallah/Art Resource, NY"},{src:"cb/89-3.jpg",w:667,h:1026,caption:"Ecstasy of Saint Teresa",credit:"© Nimatallah/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",1,5,8,7],notes:[["Form","A marble group set in a theatrical chapel. **St. Teresa** swoons on a cloud as an angel prepares to pierce her heart with a golden arrow. Gilt bronze rays and hidden windows light her. Bernini made marble look like soft cloth and flesh. The **Cornaro family** sit in theater boxes on the side walls, watching and discussing."],["Function","A funerary chapel for **Cardinal Federico Cornaro** in Santa Maria della Vittoria, Rome."],["Content","Teresa of Ávila's mystical **vision**, described in her writings: divine love felt as sweet pain. Her expression is ecstatic, and it has been read as spiritual and physical."],["Context","**Gian Lorenzo Bernini**: a **bel composto** that unites sculpture, architecture and painting into one theatrical whole. **Counter-Reformation**: it showed a recently canonized Spanish saint and personal religious experience."],["Exam hooks","Bernini · bel composto · theatrical · hidden light · Cornaro family boxes · mystical vision · Counter-Reformation"],["Compare with","Calling of St. Matthew (#85): light and drama. Il Gesù (#82). Winged Victory (#37): theatrical sculpture."]]},{n:90,title:"Angel with Arquebus, Asiel Timor Dei",maker:"Master of Calamarca (La Paz School)",date:"c. 17th century C.E.",medium:"Oil on canvas",context:"An androgynous angel in aristocratic Spanish lace and plumes holds a matchlock gun in a pose taken from a European military drill manual. Painted in the Andes for indigenous congregations: armed angels merged Catholic hierarchy with local sky and star deities, and the flat patterned surface is typical of the Cuzco and La Paz schools.",unit:3,unitName:"Early Europe and Colonial Americas",year:1600,images:[{src:"cb/90-1.jpg",w:737,h:1036,caption:"Angel with Arquebus, Asiel Timor Dei",credit:"© Paul Maeyaert/The Bridgeman Art Library"}],thumb:["thumbs/t2-u3.webp",2,5,8,7],notes:[["Form","An **oil on canvas** painting of a single angel in elaborate **Spanish aristocratic** military dress, with a broad-brimmed hat with feathers, lace and gold brocade, loading an **arquebus** (a type of gun). It is elegant, decorative and flat, with a dark background."],["Function","Part of a series of **angels** at the church of Calamarca, Bolivia, used in Catholic devotion in the Andes."],["Content","**Asiel**, 'Fear of God', an angel named in apocryphal texts. Armed with a gun, he is a soldier of God."],["Context","Colonial **Viceroyalty of Peru**: the Spanish used images to convert Indigenous people. Andean angels may have absorbed associations with pre-Hispanic beliefs about sky beings or celestial warriors. A local workshop (Master of Calamarca, La Paz School)."],["Exam hooks","colonial Andes · angel with gun · Spanish fashion · Asiel 'Fear of God' · conversion · syncretism · La Paz"],["Compare with","Virgin of Guadalupe (#95): colonial devotion. Cusco/Santo Domingo (#159): Spanish colonial Peru."]]},{n:91,title:"Las Meninas",maker:"Diego Velázquez",date:"c. 1656 C.E.",medium:"Oil on canvas",context:"The Infanta and her attendants in the painter's studio; Velázquez stands at a huge canvas whose face we cannot see; the king and queen appear only in a mirror at the back, standing where we stand. A courtier pauses in the lit doorway behind. The subject keeps shifting depending on who you decide is being painted.",unit:3,unitName:"Early Europe and Colonial Americas",year:1656,images:[{src:"cb/91-1.jpg",w:900,h:1033,caption:"Las Meninas",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",3,5,8,7],notes:[["Form","A huge **oil on canvas** painting with complex space, loose brushwork (from close up the forms dissolve) and **naturalistic** light. It is a group portrait: the princess **Infanta Margarita** with her **meninas** (maids of honor), a dwarf and a dog, a chaperone and a guard. **Velázquez** himself stands at a large canvas. A **mirror** at the back reflects **King Philip IV and Queen Mariana**. A courtier stands in a lit doorway."],["Function","Hung in the king's private office, a work for royal viewing."],["Content","Who is being painted? Perhaps the king and queen, standing where the viewer stands. The painting toys with **viewer, subject and artist**."],["Context","Velázquez, the court painter, wears the red cross of the **Order of Santiago** (added later), claiming **nobility for painting** as an intellectual art rather than a craft."],["Exam hooks","Velázquez · mirror reflecting king and queen · painter self-portrait · viewer's position · Order of Santiago · status of painting"],["Compare with","Arnolfini Portrait (#68): a mirror. Self-Portrait with Saskia (#87). Henri IV (#86): painting within painting."]]},{n:92,title:"Woman Holding a Balance",maker:"Johannes Vermeer",date:"c. 1664 C.E.",medium:"Oil on canvas",context:"A woman stands in soft window light before a Last Judgment painting, holding an empty balance above pearls and gold. The scales are level and hold nothing — she is weighing, not being weighed. The vanishing point sits at her hand. The mood is stillness and self-examination rather than vanitas scolding.",unit:3,unitName:"Early Europe and Colonial Americas",year:1664,images:[{src:"cb/92-1.jpg",w:915,h:1035,caption:"Woman Holding a Balance",credit:"© National Gallery of Art, Washington D.C., USA/The Bridgeman Art Library"}],thumb:["thumbs/t2-u3.webp",4,5,8,7],notes:[["Form","A small **oil on canvas** with soft, diffused light from a window at the left. It has a quiet, still atmosphere, precise geometry and subtle color. Vermeer may have used a **camera obscura**."],["Function","A **genre** scene for the Dutch art market (private collectors)."],["Content","A woman (possibly pregnant, or it is the fashion) holds an empty **balance**. Behind her is a painting of the **Last Judgment**; on the table are pearls and gold. The theme: **weighing earthly goods against the soul**, balance and moderation, and the judgment of her life."],["Context","**Johannes Vermeer**, Delft, Dutch Golden Age. Domestic, moral, quiet interiors suit a Protestant merchant culture."],["Exam hooks","Vermeer · genre · window light · empty balance · Last Judgment in background · moral meaning · Dutch Golden Age"],["Compare with","Arnolfini (#68): domestic symbolism. Last judgment of Hu-Nefer (#24): weighing."]]},{n:93,title:"The Palace at Versailles",maker:"Louis Le Vau and Jules Hardouin-Mansart (architects); Versailles, France",date:"Begun 1669 C.E.",medium:"Masonry, stone, wood, iron, and gold leaf (architecture); marble and bronze (sculpture); gardens",context:"Louis XIV moved the court out of Paris and into a controlled stage set. The Hall of Mirrors answers seventeen windows with seventeen mirrored arches; Le Nôtre's park imposes axial geometry on the landscape for miles. Court ceremony, down to the king rising and going to bed, was choreographed around sun-king imagery.",unit:3,unitName:"Early Europe and Colonial Americas",year:1669,images:[{src:"cb/93-1.jpg",w:992,h:670,caption:"The Palace at Versailles",credit:"© Yann Arthus-Bertrand/ALTITUDE"},{src:"cb/93-2.jpg",w:997,h:670,caption:"The Palace at Versailles",credit:"© RMN-Grand Palais/Art Resource, NY"},{src:"cb/93-3.jpg",w:1024,h:683,caption:"Courtyard",credit:"© Warren Jacobi/Corbis"},{src:"cb/93-4.jpg",w:980,h:682,caption:"Hall of Mirrors",credit:"© RMN-Grand Palais/Art Resource, NY"},{src:"cb/93-5.jpg",w:1200,h:805,caption:"Gardens",credit:"© Adam Woolfitt/Corbis"}],thumb:["thumbs/t2-u3.webp",5,5,8,7],notes:[["Form","A huge palace and gardens begun from Louis XIII's hunting lodge, with a long, symmetrical, classical facade. The **Hall of Mirrors** has 17 arched mirrors facing 17 windows, with chandeliers and a painted ceiling celebrating Louis's victories. The geometric **gardens** by **André Le Nôtre** have axial paths, fountains and sculptures, and extend the king's control over nature."],["Function","The residence of **Louis XIV** (the Sun King) and the seat of government from 1682. The nobility were required to live there, which made them dependent on him."],["Context","Architects **Le Vau** and **Hardouin-Mansart**, with interiors by Le Brun. It expresses **absolute monarchy**: the king's bedroom is at the center, and his daily rituals were public ceremonies. The Treaty of Versailles was signed in the Hall of Mirrors in 1919."],["Exam hooks","Louis XIV · absolutism · Hall of Mirrors · Le Nôtre gardens · control of nature and nobility · axial symmetry"],["Compare with","Forbidden City (#206): imperial palace. Nan Madol (#213): rulers controlling nobles. Henri IV (#86)."]]},{n:94,title:"Screen with the Siege of Belgrade and hunting scene",maker:"Circle of the González Family",date:"c. 1697–1701 C.E.",medium:"Tempera and resin on wood, shell inlay",context:"A ten-panel biombo painted on both sides — a European battle on one, a courtly hunt on the other — so it could divide a room and be read from either side. The folding-screen form arrived from Japan via the Manila galleon, and the shell inlay (enconchado) shimmers. One object routing Asia, Europe and New Spain.",unit:3,unitName:"Early Europe and Colonial Americas",year:1697,images:[{src:"cb/94-1.jpg",w:992,h:747,caption:"Siege of Belgrade (front)",credit:"© González Family. Folding Screen with the Siege of Belgrade (front) and Hunting Scene (reverse), ca.1697-1701. Oil on wood, inlaid with mother-of- pearl, 90 1/2 x 108 5/8 in. (229.9 x 275.8 cm). Brooklyn Museum, Gift of Lilla Brown in memory of her husband John W. Brown, by exchange, 2012.21"},{src:"cb/94-2.jpg",w:970,h:756,caption:"Hunting scene (reverse)",credit:"© González Family. Folding Screen with the Siege of Belgrade (front) and Hunting Scene (reverse), ca.1697-1701. Oil on wood, inlaid with mother-of- pearl, 90 1/2 x 108 5/8 in. (229.9 x 275.8 cm). Brooklyn Museum, Gift of Lilla Brown in memory of her husband John W. Brown, by exchange, 2012.21"}],thumb:["thumbs/t2-u3.webp",6,5,8,7],notes:[["Form","A folding **biombo** screen (from the Japanese byobu) in tempera and resin on wood with **mother-of-pearl** inlay (**enconchado**), with a decorative floral border."],["Function","A luxury furnishing in the home of an elite family in **New Spain** (Mexico) that divided rooms and displayed wealth."],["Content","**Front**: the **Siege of Belgrade** (1688), when Habsburg forces fought the Ottomans, a European victory. **Back**: a **hunting scene** with aristocrats hunting."],["Context","It shows **global trade**: Japanese screens arrived via the **Manila galleons** linking Asia and Mexico. A Mexican workshop (the González family) combined Asian form, European subject and local materials. Colonial elites identified with Spain's victories."],["Exam hooks","biombo (from Japanese byobu) · enconchado (shell inlay) · Manila galleon trade · Siege of Belgrade · New Spain · global exchange"],["Compare with","Virgin of Guadalupe (#95): enconchado. White and Red Plum Blossoms (#210): Japanese screen."]]},{n:95,title:"The Virgin of Guadalupe (Virgen de Guadalupe)",maker:"Miguel González",date:"c. 1698 C.E.",medium:"Oil on canvas on wood, inlaid with mother-of-pearl",context:"A painted copy of the miraculous image — the Virgin standing on a crescent moon inside a mandorla of golden rays — framed by four corner scenes of the apparition to Juan Diego. Mother-of-pearl inlay under thin glazes makes the surface glimmer. Copies like this exported a creole religious identity: proof that God had favoured New Spain in particular.",unit:3,unitName:"Early Europe and Colonial Americas",year:1698,images:[{src:"cb/95-1.jpg",w:682,h:903,caption:"Virgen de Guadalupe",credit:"Digital Image © 2011 Museum Associates/LACMA. Licensed by Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",7,5,8,7],notes:[["Form","An oil painting on canvas mounted on wood, with **enconchado**: mother-of-pearl inlay that glimmers. The image of the Virgin is surrounded by rays and angels, with **four corner vignettes** telling the story of her apparition."],["Function","A devotional image of the **Virgin of Guadalupe**, patroness of Mexico."],["Content","According to tradition, in 1531 Mary appeared to **Juan Diego**, an Indigenous convert, at Tepeyac, and her image miraculously appeared on his cloak (tilma) filled with roses when he showed it to the bishop. The corners show these events."],["Context","Tepeyac was the site of an Aztec mother goddess (**Tonantzin**), and the Virgin may have helped convert Indigenous people. She became a symbol of **Mexican identity**. **Miguel González** made it in New Spain."],["Exam hooks","Virgin of Guadalupe · Juan Diego · enconchado · Tepeyac/Tonantzin · Mexican identity · colonial devotion"],["Compare with","Theotokos icon (#54). Angel with Arquebus (#90). Biombo (#94): enconchado."]]},{n:96,title:"Fruit and Insects",maker:"Rachel Ruysch",date:"1711 C.E.",medium:"Oil on wood",context:"A dark ground crowded with peaches, grapes, wheat and a bird's nest, with insects and lizards creeping among them. Ruysch's father was a botanist and anatomist and her specimens are accurate. Fruits of different seasons appear together, so the abundance is constructed — and the decay and the insects are the reminder of transience.",unit:3,unitName:"Early Europe and Colonial Americas",year:1711,images:[{src:"cb/96-1.jpg",w:1e3,h:750,caption:"Fruit and Insects",credit:"© Galleria degli Uffizi, Florence, Italy/The Bridgeman Art Library"}],thumb:["thumbs/t2-u3.webp",0,6,8,7],notes:[["Form","An **oil on wood** still life: a lush arrangement of fruit, grain, nuts and plants with **insects**, a lizard and a bird's nest in a forest-floor setting, with dark background and intense detail. Each species is accurately observed."],["Function","A collectible painting for wealthy buyers, and a display of skill."],["Content","Ripening and decaying fruit, with insects eating, suggests a **vanitas** (transience of life and death). It also shows interest in **natural science**."],["Context","**Rachel Ruysch**, daughter of a scientist (anatomy and botany), was one of the most successful Dutch painters of her time, a court painter. Women had limited training opportunities, so still life was accessible. She was very well paid."],["Exam hooks","Rachel Ruysch · still life · vanitas · natural science · woman artist success · Dutch"],["Compare with","Woman Holding a Balance (#92): Dutch moral painting. Pink Panther (#230): object with excess."]]},{n:97,title:"Spaniard and Indian Produce a Mestizo",maker:"Attributed to Juan Rodríguez Juárez",date:"c. 1715 C.E.",medium:"Oil on canvas",context:"From a casta series charting mixed-race combinations in New Spain, each canvas labelled and each family posed with clothing and setting that signal caste and class. Ostensibly documentary, it is really an argument that society can be sorted and ranked. Painted largely for export to Spain.",unit:3,unitName:"Early Europe and Colonial Americas",year:1715,images:[{src:"cb/97-1.jpg",w:1e3,h:782,caption:"Spaniard and Indian Produce a Mestizo",credit:"© Breamore House, Hampshire, UK/The Bridgeman Art Library"}],thumb:["thumbs/t2-u3.webp",1,6,8,7],notes:[["Form","An **oil on canvas** painting, one of a series of **casta paintings**. A family group is shown with detailed clothing and setting, with a caption identifying the racial mixture."],["Function","Casta series categorized the racial mixtures of **New Spain** (colonial Mexico), often for European audiences or elites."],["Content","A **Spaniard** (father, wearing a European suit) and an **Indian** (mother, in Indigenous dress) with their child, a **mestizo**. The family appears harmonious, while the series ranked people by percentage of Spanish blood."],["Context","The **casta system** was a colonial hierarchy that tied status, taxes and rights to ancestry. The paintings presented Spanish blood as superior and mixed populations as orderly and classifiable. Attributed to **Juan Rodríguez Juárez**."],["Exam hooks","casta painting · racial classification · New Spain · Spaniard + Indian = mestizo · colonial hierarchy"],["Compare with","Codex Mendoza (#81). Portrait of Sor Juana (#99): New Spain."]]},{n:98,title:"The Tête à Tête, from Marriage à la Mode",maker:"William Hogarth",date:"c. 1743 C.E.",medium:"Oil on canvas",context:"The second of six scenes satirising a marriage arranged between aristocratic title and merchant money. The husband slumps home at dawn with a dog pulling a woman's cap from his pocket; the wife stretches after her own party; the steward walks out clutching unpaid bills. Every object narrates. Sold widely as engravings.",unit:3,unitName:"Early Europe and Colonial Americas",year:1743,images:[{src:"cb/98-1.jpg",w:1e3,h:767,caption:"The Tête à Tête",credit:"© National Gallery, London, UK/The Bridgeman Art Library"}],thumb:["thumbs/t2-u3.webp",2,6,8,7],notes:[["Form","An **oil on canvas** painting, the second of six in a series. It is satirical and detailed, with a crowded interior, symbols and expressions, and reads like a **narrative** with Rococo touches."],["Function","A **moralizing satire** on the fashionable aristocratic marriage of convenience; the series was also sold as **engravings** to a wider public."],["Content","The young married couple, the morning after a late night. The husband slumps, exhausted, with a woman's cap in his pocket (an affair) and a dog sniffing it. The wife stretches, careless. The steward leaves holding unpaid bills, rolling his eyes. The room is a mess with broken sword and cards, and the paintings on the wall are telling details."],["Context","**William Hogarth**, English. It mocks the upper class's moral emptiness and arranged marriages for money and title. The story ends in tragedy, with the couple's deaths."],["Exam hooks","Hogarth · satire · Marriage à la Mode · narrative series · engravings · moralizing · English aristocracy"],["Compare with","The Swing (#101): aristocratic frivolity, celebrated rather than mocked. Bayeux Tapestry (#59): sequential narrative."]]},{n:99,title:"Portrait of Sor Juana Inés de la Cruz",maker:"Miguel Cabrera",date:"c. 1750 C.E.",medium:"Oil on canvas",context:"A posthumous portrait of the Hieronymite nun, poet and scholar, seated in her library among hundreds of books with a rosary and an inkwell — the attributes of a mind rather than a saint. Church authorities eventually pressured her into silence. Cabrera, of indigenous descent, was the leading painter in New Spain.",unit:4,unitName:"Later Europe and Americas",year:1750,images:[{src:"cb/99-1.jpg",w:760,h:1043,caption:"Portrait of Sor Juana Inés de la Cruz",credit:"© Jean-Pierre Courau/The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",0,0,8,7],notes:[["Form","An **oil on canvas** portrait in rich color, showing the sitter seated in her library before shelves of books. She wears the **nun's habit** with a large **escutcheon** (medallion) of the Annunciation on her chest."],["Function","A posthumous portrait honoring the famous nun and writer."],["Content","**Sor Juana Inés de la Cruz** (1648–1695), a self-taught scholar, poet and playwright, among the Americas' great intellectuals. She is surrounded by books and writing tools; one hand on a book, the other turns a page."],["Context","Painted about 50 years after her death by **Miguel Cabrera**, a leading painter in New Spain. Sor Juana defended women's right to education and was criticized by church authorities, eventually renouncing her studies. She became a symbol of **Mexican intellectual pride** and is on the Mexican banknote."],["Exam hooks","Sor Juana · Cabrera · nun-scholar · library · women's education · New Spain · posthumous"],["Compare with","Spaniard and Indian (#97): colonial Mexico. Self-Portrait (#105): a woman artist."]]},{n:100,title:"A Philosopher Giving a Lecture on the Orrery",maker:"Joseph Wright of Derby",date:"c. 1763–1765 C.E.",medium:"Oil on canvas",context:"A candle-lit demonstration of a mechanical solar system, with a lamp standing in for the sun at the centre. The faces around it register wonder, calculation and boredom. Wright applies the lighting of religious painting to a scientific gathering — the Enlightenment given the visual authority of a nativity.",unit:4,unitName:"Later Europe and Americas",year:1763,images:[{src:"cb/100-1.jpg",w:1e3,h:712,caption:"A Philosopher Giving a Lecture on the Orrery",credit:"© The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",1,0,8,7],notes:[["Form","An **oil on canvas** painting of a nighttime scene lit by a single concealed lamp at the center (in place of the sun), with **tenebrism** borrowed from Caravaggio and figures' faces glowing."],["Function","A painting of scientific demonstration for the educated middle class, exhibited in London."],["Content","A philosopher explains the **orrery**, a mechanical model of the **solar system**, to a group of rapt listeners: children, adults and a note-taker. Faces show wonder and curiosity."],["Context","**Enlightenment**: science, reason and education spread to the middle class. **Joseph Wright of Derby** painted science and industry and gave it the drama once reserved for religious subjects; the light suggests enlightenment."],["Exam hooks","Enlightenment · orrery · science as subject · tenebrism · Wright of Derby · middle-class audience"],["Compare with","Calling of St. Matthew (#85): tenebrism. The Swing (#101): contemporary Rococo frivolity."]]},{n:101,title:"The Swing",maker:"Jean-Honoré Fragonard",date:"1767 C.E.",medium:"Oil on canvas",context:"Rococo at its most knowing: a young woman swings in froths of pink silk while her lover, hidden in the bushes, looks up her skirts and a bishop pushes the swing from the shadows. She kicks off a shoe; a statue of Cupid holds a finger to his lips. A French courtier commissioned it to those specifications.",unit:4,unitName:"Later Europe and Americas",year:1767,images:[{src:"cb/101-1.jpg",w:791,h:1022,caption:"The Swing",credit:"© Wallace Collection, London, UK/The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",2,0,8,7],notes:[["Form","An **oil on canvas** painting in **Rococo** style: pastel colors (pink, green), feathery brushwork, lush foliage and a light, playful mood."],["Function","Commissioned by a **French courtier** (Baron de Saint-Julien) who requested that his mistress be painted on a swing pushed by a bishop, with himself looking up her skirt."],["Content","A young woman swings, kicking off a **shoe**. Her hidden lover in the bushes looks up her skirt; an older man pushes the swing from the shadows (the bishop was replaced). A statue of **Cupid** holds a finger to his lips, a sign of secrecy. Symbols of love, flirtation and infidelity are everywhere."],["Context","**Jean-Honoré Fragonard**. The Rococo expressed aristocratic leisure and frivolity just before the **French Revolution**. Enlightenment critics condemned such art."],["Exam hooks","Fragonard · Rococo · pastel · flirtation · aristocratic frivolity · Cupid · pre-Revolution"],["Compare with","The Swing (after Fragonard) (#244): Shonibare's critique. Oath of the Horatii (#103): Neoclassical reaction. Tête à Tête (#98)."]]},{n:102,title:"Monticello",maker:"Thomas Jefferson (architect); Virginia, U.S.",date:"1768–1809 C.E.",medium:"Brick, glass, stone, and wood",context:"Jefferson redesigned his own house for forty years, moving from Palladian toward a French-influenced low dome and an apparent single storey. Neoclassicism was for him a political style — the architecture of republics. The house sat on a plantation worked by enslaved people whose quarters and workshops lined Mulberry Row below.",unit:4,unitName:"Later Europe and Americas",year:1768,images:[{src:"cb/102-1.jpg",w:1101,h:734,caption:"Monticello",credit:"© David Muenker/Alamy"},{src:"cb/102-2.jpg",w:884,h:709,caption:"Monticello plan",credit:""}],thumb:["thumbs/t2-u4.webp",3,0,8,7],notes:[["Form","A **Neoclassical** villa of brick with white wood trim: a **portico** with a triangular **pediment** and a **dome** over an octagonal drum, the first dome on an American house. The plan is symmetrical, with clever interior gadgets (a dumbwaiter and a two-faced clock)."],["Function","The home and plantation of **Thomas Jefferson** in Virginia."],["Context","Jefferson admired **Palladio** (Italian Renaissance architect) and Roman architecture, such as the Pantheon (#46) and the Maison Carrée, and remodeled the house after living in France. The classical style linked the new American republic to the ideals of Rome. The house was built and run by **enslaved people**, which contradicts the ideals of liberty."],["Exam hooks","Jefferson · Neoclassical · Palladio · portico and dome · Roman republic ideals · enslaved labor · plantation"],["Compare with","Pantheon (#46): source. Palazzo Rucellai (#70): classical revival. George Washington (#104): new republic."]]},{n:103,title:"The Oath of the Horatii",maker:"Jacques-Louis David",date:"1784 C.E.",medium:"Oil on canvas",context:"Three brothers salute their father and the swords in a stark Roman space of three round arches. The men are rigid straight lines; the women collapse into curves at the right. Painted for the French crown but read as a call to civic sacrifice on the eve of revolution — Neoclassical clarity displacing Rococo froth.",unit:4,unitName:"Later Europe and Americas",year:1784,images:[{src:"cb/103-1.jpg",w:1e3,h:769,caption:"The Oath of the Horatii",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"}],thumb:["thumbs/t2-u4.webp",4,0,8,7],notes:[["Form","An **oil on canvas** painting in **Neoclassical** style: a clear, shallow, stage-like space with three Roman arches, sharp contours, sculptural figures and restrained color. It is divided into three groups with strong vertical and horizontal lines."],["Function","Commissioned for the **French king** (Louis XVI), who wanted moralizing history painting. It was exhibited at the Salon of 1785, where it was a sensation."],["Content","The three **Horatii brothers** swear an oath to their father, who holds up swords, to fight the Curiatii for Rome, even though one sister is engaged to a Curiatius. The men are rigid and heroic; the women collapse in grief on the right."],["Context","**Jacques-Louis David**. It came to be read as a call for **civic virtue and self-sacrifice for the state**, and **David** became the painter of the French Revolution."],["Exam hooks","David · Neoclassical · oath · civic virtue · Roman subject · men vs. women grouping · French Revolution"],["Compare with","The Swing (#101): Rococo versus Neoclassical. Liberty Leading the People (#108): revolution. Monticello (#102)."]]},{n:104,title:"George Washington",maker:"Jean-Antoine Houdon",date:"1788–1792 C.E.",medium:"Marble",context:"Commissioned by Virginia; Houdon travelled to Mount Vernon to take a life mask. Washington stands in contemporary uniform, one hand on a walking stick and the other on a fasces of thirteen rods, his sword hung up and a plough behind him — Cincinnatus, the general who goes back to the farm.",unit:4,unitName:"Later Europe and Americas",year:1788,images:[{src:"cb/104-1.jpg",w:424,h:771,caption:"George Washington",credit:"© Buddy Mays/Corbis"}],thumb:["thumbs/t2-u4.webp",5,0,8,7],notes:[["Form","A life-size **marble** statue of George Washington in **contrapposto**, wearing contemporary military uniform. His left hand rests on a **fasces** (a bundle of rods, a Roman symbol of civic power) with a sword hanging on it; behind him is a **plow** (peace and farming)."],["Function","Commissioned by the **Virginia General Assembly** for the state capitol in Richmond (designed by Jefferson)."],["Content","Washington as **Cincinnatus**, the Roman general who left his farm to save Rome, then returned to his plow, giving up power. The modern dress was Washington's own preference."],["Context","**Jean-Antoine Houdon**, a French sculptor, traveled to Mount Vernon to make a **life mask**. Neoclassical: it links the American republic to Roman civic virtue."],["Exam hooks","Houdon · Cincinnatus · fasces · plow · contemporary dress · contrapposto · life mask · Virginia capitol"],["Compare with","Augustus of Prima Porta (#43): ruler statue. Doryphoros (#34): contrapposto. Monticello (#102)."]]},{n:105,title:"Self-Portrait",maker:"Elisabeth Louise Vigée Le Brun",date:"1790 C.E.",medium:"Oil on canvas",context:"Painted in Rome after she fled the Revolution, for the Uffizi's collection of artists' self-portraits. She shows herself at work — palette and brushes in hand, simple dark dress, lace collar — turning to the viewer with an open smile. A working professional and a charming woman at once, from the painter who had been Marie Antoinette's portraitist.",unit:4,unitName:"Later Europe and Americas",year:1790,images:[{src:"cb/105-1.jpg",w:760,h:1007,caption:"Self-Portrait",credit:"© Galleria degli Uffizi, Florence, Italy/The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",6,0,8,7],notes:[["Form","An **oil on canvas** self-portrait with soft brushwork, fresh color and a natural, relaxed pose. The artist turns toward the viewer while painting, palette and brushes in hand, in a dark dress with a red sash and a white ruffled collar."],["Function","Made for the **Uffizi** collection of artists' self-portraits in Florence, a great honor. It also presents her to clients and the art world."],["Content","**Vigée Le Brun** paints a portrait of **Marie Antoinette**, her most important patron, on the easel."],["Context","She had fled France at the start of the **French Revolution** (1789) because of her royal ties. As one of the few women admitted to the **French Royal Academy**, she shows herself as a professional artist, not merely a subject: a statement about women's ability."],["Exam hooks","Vigée Le Brun · woman artist · self-portrait · Marie Antoinette on easel · Uffizi · exile from Revolution · Royal Academy"],["Compare with","Las Meninas (#91): the artist at work. Self-Portrait with Saskia (#87). The Swing (#101): Rococo patrons."]]},{n:106,title:"Y no hai remedio (And There's Nothing to Be Done), from Los Desastres de la Guerra, plate 15",maker:"Francisco de Goya",date:"1810–1823 C.E. (published 1863)",medium:"Etching, drypoint, burin, and burnishing",context:"A blindfolded man tied to a post waits for a firing squad whose rifle barrels intrude from the right edge; another corpse lies below. No heroics, no glory, no named battle. Goya made the series during the Peninsular War, but it was too damning to publish and appeared 35 years after his death.",unit:4,unitName:"Later Europe and Americas",year:1810,images:[{src:"cb/106-1.jpg",w:992,h:833,caption:"Y no hai remedio",credit:"© Private Collection/Index/The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",7,0,8,7],notes:[["Form","A print using **etching** with **drypoint, burin and burnishing**: harsh, scratchy lines and stark contrasts with a blank, almost empty background. A plate from a series of 82."],["Function","A personal protest against war, published only in **1863**, after Goya's death, because the content was too dangerous during his lifetime."],["Content","A blindfolded man is tied to a post, about to be shot by a firing squad whose rifles project into the frame. Behind him lie dead bodies and other prisoners. The title says 'And there's nothing to be done.'"],["Context","**Francisco de Goya** recorded atrocities during the **Peninsular War** (1808–1814), when Napoleon's French troops occupied Spain and Spanish guerrillas resisted. The series condemns brutality on both sides, a modern anti-war image that rejects heroism."],["Exam hooks","Goya · Disasters of War · etching · firing squad · Napoleon in Spain · anti-war · published after his death"],["Compare with","Liberty Leading the People (#108): heroic versus brutal views of conflict. Memorial Sheet for Karl Liebknecht (#134): a print as protest."]]},{n:107,title:"La Grande Odalisque",maker:"Jean-Auguste-Dominique Ingres",date:"1814 C.E.",medium:"Oil on canvas",context:"A cool, linear nude in a Turkish harem fantasy, with three extra vertebrae, a boneless right arm and an impossible pelvis — anatomy sacrificed to the long elegant curve. Critics attacked it. Orientalism let a French painter present a nude as exotic rather than indecent. Commissioned by Napoleon's sister.",unit:4,unitName:"Later Europe and Americas",year:1814,images:[{src:"cb/107-1.jpg",w:992,h:559,caption:"La Grande Odalisque",credit:"© Giraudon/The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",0,1,8,7],notes:[["Form","An **oil on canvas** painting with smooth, invisible brushwork in a **Neoclassical** technique. The anatomy is deliberately **distorted**: her back has extra vertebrae and her arm and back are elongated for a long, sinuous line."],["Function","Commissioned by Caroline Murat, Napoleon's sister and Queen of Naples, but never delivered after the Murats fell."],["Content","A reclining nude **odalisque** (a concubine in a Turkish harem) looks back over her shoulder at the viewer. Exotic props include a peacock-feather fan, a hookah and a turban."],["Context","**Ingres**. It is a key example of **Orientalism**, the European fantasy of the 'East' as sensual and exotic, built on colonial ideas. Critics mocked the anatomical errors. It mixes Neoclassical line with a Romantic exotic subject."],["Exam hooks","Ingres · odalisque · Orientalism · elongated anatomy · Neoclassical line · exotic fantasy"],["Compare with","Venus of Urbino (#80): the reclining nude. Olympia (#115): the parody. Rebellious Silence (#235): an Iranian artist answering Orientalism."]]},{n:108,title:"Liberty Leading the People",maker:"Eugène Delacroix",date:"1830 C.E.",medium:"Oil on canvas",context:"The July Revolution as allegory: a bare-breasted Liberty in a Phrygian cap strides over corpses with the tricolour and a bayoneted musket, flanked by a top-hatted bourgeois, a street boy with pistols and a worker. Romantic diagonal, loose paint, heat. The government bought it and then kept it out of sight for years.",unit:4,unitName:"Later Europe and Americas",year:1830,images:[{src:"cb/108-1.jpg",w:840,h:674,caption:"Liberty Leading the People",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u4.webp",1,1,8,7],notes:[["Form","An **oil on canvas** painting in **Romantic** style with a **pyramidal** composition and loose, energetic brushwork. Smoke and light create drama, with dead bodies at the base. Color picks out the tricolor (red, white, blue)."],["Function","Commemorates the **July Revolution of 1830**, which overthrew King Charles X. The new government bought it, then hid it because it was too revolutionary."],["Content","**Liberty**, an allegorical woman in a Phrygian cap (a symbol of freedom), holds the **French flag** and a musket, leading people of different classes over the barricades: a worker with a sword, a bourgeois man in a top hat (sometimes said to be Delacroix), and a boy with pistols who inspired Gavroche in Les Misérables. Notre-Dame is visible through the smoke."],["Context","**Eugène Delacroix**. Romanticism emphasizes emotion, color and movement, in contrast to Neoclassical restraint. Liberty is both a real woman (bare breasted, barefoot) and an ideal."],["Exam hooks","Delacroix · Romanticism · July Revolution 1830 · Liberty allegory · tricolor · classes united · pyramid composition"],["Compare with","Oath of the Horatii (#103): Neoclassical revolution. Y no hai remedio (#106): war's reality. Raft of the Medusa (not on the list)."]]},{n:109,title:"The Oxbow (View from Mount Holyoke, Northampton, Massachusetts, after a Thunderstorm)",maker:"Thomas Cole",date:"1836 C.E.",medium:"Oil on canvas",context:"One canvas split by a diagonal: storm-blasted wilderness on the left, cultivated valley in sunlight on the right, the Connecticut River looping between them. Cole put himself, tiny, at the bottom edge, painting. Hudson River School landscape as an argument about Manifest Destiny — and a worry about it.",unit:4,unitName:"Later Europe and Americas",year:1836,images:[{src:"cb/109-1.jpg",w:1008,h:683,caption:"The Oxbow (View from Mount Holyoke, Northampton, Massachusetts, after a",credit:"Thunderstorm) Image © The Metropolitan Museum of Art/Image source © Art Resource, NY"}],thumb:["thumbs/t2-u4.webp",2,1,8,7],notes:[["Form","A landscape **oil on canvas** divided by a **diagonal**: on the left a wild, dark **stormy wilderness**; on the right a sunlit, cultivated valley with a river **oxbow** bend and farms. The painter appears small in the foreground with his easel."],["Function","Exhibited at the National Academy of Design in New York."],["Content","The contrast of **wilderness versus civilization** raises the question of American expansion. The hillside farmland, read upside down, has been interpreted as spelling **'Noah'** in Hebrew, as if God's covenant with America were written in the land."],["Context","**Thomas Cole**, founder of the **Hudson River School**. Romanticism and the **sublime** (awe and fear in nature) feed into American identity and **Manifest Destiny**. Cole worried about losing wilderness."],["Exam hooks","Cole · Hudson River School · sublime · wilderness vs. cultivation · Manifest Destiny · artist in painting"],["Compare with","Valley of Mexico (#118): national landscape. Hunters in the Snow (#83): landscape. Spiral Jetty (#151): land itself as art."]]},{n:110,title:"Still Life in Studio",maker:"Louis-Jacques-Mandé Daguerre",date:"1837 C.E.",medium:"Daguerreotype",context:"One of the earliest surviving daguerreotypes: plaster casts, a wicker-covered flask and a framed print arranged in raking light. The subject is a traditional still life on purpose — the new medium borrowing painting's authority. A silvered copper plate, unique and unreproducible, with astonishing fine detail.",unit:4,unitName:"Later Europe and Americas",year:1837,images:[{src:"cb/110-1.jpg",w:938,h:737,caption:"Still Life in Studio",credit:"© Louis Daguerre/Time & Life Pictures/Getty Images"}],thumb:["thumbs/t2-u4.webp",3,1,8,7],notes:[["Form","A **daguerreotype**, one of the earliest successful photographs: a unique, highly detailed image on a silvered copper plate, with no negative so it cannot be reproduced. It was a long exposure (minutes)."],["Function","A demonstration of the new process, made by its inventor."],["Content","A **still life** of plaster casts of classical sculpture (cherubs and a relief), a wicker bottle, a framed print and drapery. Objects were chosen because they **stayed still** during the long exposure; the subject also claims photography's place alongside the art of the past."],["Context","**Louis-Jacques-Mandé Daguerre** announced the process in **1839**. Photography challenged painting's role in recording reality. The **vanitas**-like arrangement imitates painting traditions."],["Exam hooks","Daguerre · daguerreotype · early photography · unique image · long exposure · still life · 1839"],["Compare with","The Horse in Motion (#117): photography and time. Nadar (#114): photography as art. Fruit and Insects (#96): still life."]]},{n:111,title:"Slave Ship (Slavers Throwing Overboard the Dead and Dying, Typhoon Coming On)",maker:"Joseph Mallord William Turner",date:"1840 C.E.",medium:"Oil on canvas",context:"A ship recedes into a boiling orange sunset while shackled limbs and fish thrash in the foreground. It refers to the Zong, whose captain threw sick enslaved people overboard to claim insurance. Turner exhibited it while Britain debated abolition; the paint is so loose that the horror only resolves as you keep looking.",unit:4,unitName:"Later Europe and Americas",year:1840,images:[{src:"cb/111-1.jpg",w:992,h:736,caption:"Slave Ship (Slavers Throwing Overboard the Dead and Dying, Typhoon",credit:"Coming On) Photograph © 2013 Museum of Fine Arts, Boston"}],thumb:["thumbs/t2-u4.webp",4,1,8,7],notes:[["Form","An **oil on canvas** painting with swirling, almost **abstract** brushwork in a blazing orange-red sunset and a stormy sea. Forms dissolve in light and color. A ship tosses at the left; in the right foreground, the legs of shackled people sink amid fish and birds attacking."],["Function","Exhibited at the **Royal Academy** in 1840, at the time of an anti-slavery convention in London."],["Content","Based on the **Zong massacre** (1781): the captain threw over 130 sick enslaved Africans overboard to claim insurance for 'lost cargo', which insurance covered only for deaths at sea. A typhoon approaches like divine judgment."],["Context","**J. M. W. Turner**, Romanticism and the **sublime**. Britain abolished slavery in its empire in 1833, but the slave trade continued elsewhere. The painting condemns cruelty and greed, joining moral outrage to nature's violence."],["Exam hooks","Turner · sublime · Zong massacre · abolition · near-abstract color · Royal Academy · Romanticism"],["Compare with","The Oxbow (#109): sublime nature. Darkytown Rebellion (#243): the history of slavery. Liberty (#108): Romanticism."]]},{n:112,title:"Palace of Westminster (Houses of Parliament)",maker:"Charles Barry and Augustus W. N. Pugin (architects); London",date:"1840–1870 C.E.",medium:"Limestone masonry and glass",context:"Rebuilt after the 1834 fire on Barry's symmetrical, classically planned frame, then dressed head to toe by Pugin in Perpendicular Gothic — down to the wallpaper, inkstands and coat hooks. Gothic Revival was chosen as the national, Christian, specifically English style, against Neoclassicism's republican associations.",unit:4,unitName:"Later Europe and Americas",year:1840,images:[{src:"cb/112-1.jpg",w:992,h:667,caption:"Palace of Westminster",credit:"© Vanni Archive/Art Resource, NY"},{src:"cb/112-2.jpg",w:993,h:670,caption:"Central Lobby",credit:"© Adam Woolfitt/Corbis"},{src:"cb/112-3.jpg",w:993,h:658,caption:"Westminster Hall",credit:"© Adam Woolfitt/Corbis"}],thumb:["thumbs/t2-u4.webp",5,1,8,7],notes:[["Form","A huge **Gothic Revival** building on the Thames, with picturesque towers (including the **Victoria Tower** and the **clock tower**, Big Ben, now the Elizabeth Tower), pointed arches, tracery and rich, intricate Gothic ornament, over a symmetrical classical plan by Barry."],["Function","The seat of **Parliament** (House of Lords and House of Commons), rebuilt after a fire in 1834 destroyed the old palace."],["Content","Westminster Hall, a medieval survivor, was incorporated. The **Central Lobby** joins the two houses."],["Context","Architects **Charles Barry** (plan) and **Augustus W. N. Pugin** (Gothic details and interiors). **Gothic** was chosen as a **national English style** linked to the medieval past, Christianity and British institutions, rather than classical (associated with revolutionary France and America). Its construction used modern iron framing."],["Exam hooks","Gothic Revival · Barry and Pugin · Parliament · national identity · fire of 1834 · Big Ben"],["Compare with","Chartres (#60): real Gothic. Monticello (#102): classical revival as national style."]]},{n:113,title:"The Stone Breakers",maker:"Gustave Courbet",date:"1849 C.E. (destroyed in 1945)",medium:"Oil on canvas",context:"An old man and a boy breaking rock at the roadside, painted life-size — a scale reserved for history painting. Neither face is visible. No moral, no sentiment, no story: Realism insisted that ordinary labour deserved the wall. Destroyed in a bombing raid on Dresden.",unit:4,unitName:"Later Europe and Americas",year:1849,images:[{src:"cb/113-1.jpg",w:992,h:610,caption:"The Stone Breakers",credit:"© Staatliche Kunstsammlungen Dresden/The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",6,1,8,7],notes:[["Form","A large **oil on canvas**, life-size in scale, with dull earthy colors and heavy paint. The figures face away from the viewer, so they are anonymous types rather than individuals. (The painting was destroyed in **1945** during World War II.)"],["Function","Exhibited at the **Salon of 1850**, where it was controversial: a monumental painting given to a lowly subject."],["Content","Two road workers, an old man and a boy, break stones for road building by hand. Their clothes are ragged and torn; the work is exhausting, endless and hopeless, from youth to old age."],["Context","**Gustave Courbet**, founder of **Realism**: 'show me an angel and I'll paint one'. After the Revolution of 1848, it showed the reality of rural poverty and was taken as a socialist statement."],["Exam hooks","Courbet · Realism · laborers · anonymous · Salon 1850 · destroyed 1945 · social critique"],["Compare with","Olympia (#115): Realist challenge. Hunters in the Snow (#83): peasants. The Migration Series (#141)."]]},{n:114,title:"Nadar Raising Photography to the Height of Art",maker:"Honoré Daumier",date:"1862 C.E.",medium:"Lithograph",context:"A caricature of the photographer Nadar leaning out of a balloon over Paris, hat flying off, camera aimed down, while every building below is labelled PHOTOGRAPHIE. A joke about the photography craze and about the live argument over whether a camera could make art. Lithography made satire like this cheap and fast.",unit:4,unitName:"Later Europe and Americas",year:1862,images:[{src:"cb/114-1.jpg",w:791,h:1016,caption:"Nadar Raising Photography to the Height of Art",credit:"© The Stapleton Collection/The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",7,1,8,7],notes:[["Form","A **lithograph** (a print drawn with grease on stone), a caricature with loose, sketchy lines."],["Function","Published in a popular newspaper (Le Boulevard): political and cultural **satire** for a mass audience."],["Content","The photographer **Nadar** in a **hot-air balloon** above Paris, leaning out with his camera as his top hat flies off. The buildings below are all labeled 'Photographie', as if the city were full of photo studios."],["Context","**Honoré Daumier**. Nadar took the first aerial photographs from a balloon. The title mocks the claim that photography is a fine art, though it may be affectionate. Lithography allowed fast, cheap mass production of images."],["Exam hooks","Daumier · lithograph · Nadar · balloon · photography as art · satire · mass media"],["Compare with","Still Life in Studio (#110): early photography. The Horse in Motion (#117)."]]},{n:115,title:"Olympia",maker:"Édouard Manet",date:"1863 C.E.",medium:"Oil on canvas",context:"A courtesan, not a goddess, stares straight out with her hand clamped over her thigh while a Black maid brings flowers from a client. Flat light and hard outlines flatten the body. The pose quotes Titian's Venus of Urbino — which is exactly why the Salon crowd was outraged.",unit:4,unitName:"Later Europe and Americas",year:1863,images:[{src:"cb/115-1.jpg",w:992,h:673,caption:"Olympia",credit:"© The Gallery Collection/Corbis"}],thumb:["thumbs/t2-u4.webp",0,2,8,7],notes:[["Form","An **oil on canvas** painting with **flat**, harsh, frontal lighting, little modeling, sharp contrasts and a shallow space. Brushwork is visible."],["Function","Shown at the **Salon of 1865**; it caused a scandal, and guards had to protect it."],["Content","A nude **prostitute** (her name, Olympia, was a common name for prostitutes) reclines on a bed, wearing a black ribbon, a bracelet, an orchid and slippers. She looks directly at the viewer, confident and confrontational. A Black maid, Laure, brings flowers from a client. A **black cat** with raised tail replaces Titian's sleeping dog (fidelity), a sign of sexuality and independence."],["Context","**Édouard Manet** parodies **Titian's Venus of Urbino** (#80): a modern, real woman, not a goddess. Critics were outraged by the flatness and the subject. Today scholars also discuss the representation of race in the figure of Laure."],["Exam hooks","Manet · parody of Venus of Urbino · prostitute · direct gaze · black cat · flat light · Salon scandal · modernity"],["Compare with","Venus of Urbino (#80). La Grande Odalisque (#107). Les Demoiselles d'Avignon (#126)."]]},{n:116,title:"The Saint-Lazare Station",maker:"Claude Monet",date:"1877 C.E.",medium:"Oil on canvas",context:"Steam and smoke under an iron-and-glass train shed, engines dissolving into vapour and light. Monet painted the series on the spot, chasing changing atmosphere rather than describing objects. Modern industrial subject, broken brushwork, unmixed colour — Impressionism taking the railway as its cathedral.",unit:4,unitName:"Later Europe and Americas",year:1877,images:[{src:"cb/116-1.jpg",w:992,h:742,caption:"The Saint-Lazare Station",credit:"© Musée d’Orsay, Paris, France/The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",1,2,8,7],notes:[["Form","An **oil on canvas** painting with loose, broken **brushstrokes**, sketch-like. It is atmospheric, dissolving in steam and smoke, with light filtered through the glass roof of the iron train shed."],["Function","One of a series of about a dozen views of the station, shown at the 1877 **Impressionist** exhibition."],["Content","The Gare Saint-Lazare train station in Paris: locomotives, steam, smoke, travelers and iron structure."],["Context","**Claude Monet**, Impressionism. It captures **modern life**: industrialization, trains and the speed of the city. Impressionists painted fleeting effects of light and atmosphere. The station's iron and glass are new building materials."],["Exam hooks","Monet · Impressionism · modern life · steam and light · train station · series · broken brushwork"],["Compare with","The Starry Night (#120): expressive brushwork. Valley of Mexico (#118): a train in landscape. Carson Pirie Scott (#124): iron and glass."]]},{n:117,title:"The Horse in Motion",maker:"Eadweard Muybridge",date:"1878 C.E.",medium:"Albumen print",context:"Twelve cameras with trip wires along a track produced sequential photographs proving that a galloping horse lifts all four hooves at once, settling a bet for Leland Stanford. The grid changed how painters drew horses and pointed directly toward motion pictures.",unit:4,unitName:"Later Europe and Americas",year:1878,images:[{src:"cb/117-1.jpg",w:992,h:619,caption:"The Horse in Motion",credit:"Courtesy of the Library of Congress # LC-USZ62-58070"}],thumb:["thumbs/t2-u4.webp",2,2,8,7],notes:[["Form","A sequence of **albumen print** photographs in a grid showing a horse galloping, captured by a row of **cameras with trip-wires** placed along the track."],["Function","It settled a debate, reportedly financed by **Leland Stanford** (former governor of California and founder of Stanford University), about whether a galloping horse ever has all four hooves off the ground. It does, when its legs are gathered beneath it, not stretched out as painters had shown."],["Context","**Eadweard Muybridge** studied motion and sequence. The work influenced painting, science (biomechanics) and the development of **motion pictures**. Photography revealed things the eye could not see."],["Exam hooks","Muybridge · sequential photography · Leland Stanford · all four hooves off ground · motion · precursor to film"],["Compare with","Still Life in Studio (#110): early photography. Electronic Superhighway (#238): moving images."]]},{n:118,title:"The Valley of Mexico from the Hillside of Santa Isabel",maker:"Jose María Velasco",date:"1882 C.E.",medium:"Oil on canvas",context:"A wide luminous panorama with two volcanoes on the horizon, an eagle overhead and tiny figures on the path — the Aztec origin story translated into nineteenth-century landscape. Velasco trained in science as well as painting, and the geology and botany are accurate. National identity built out of land.",unit:4,unitName:"Later Europe and Americas",year:1882,images:[{src:"cb/118-1.jpg",w:992,h:715,caption:"El Valle de México desde el Cerro de Santa Isabel",credit:"© Art Resource, NY"}],thumb:["thumbs/t2-u4.webp",3,2,8,7],notes:[["Form","A panoramic landscape **oil on canvas** with an extremely detailed, high viewpoint, clear light, a deep and wide view and an atmospheric distance. Volcanoes rise on the horizon."],["Function","Exhibited nationally and internationally, including at world fairs."],["Content","The **Valley of Mexico** with Mexico City in the distance, **Lake Texcoco**, and in the foreground a mother and child, a cactus and an **eagle** (recalling the Tenochtitlan founding legend). A train crosses the valley, a symbol of modernization."],["Context","**José María Velasco**, a scientific and patriotic painter who was trained in botany and geology. After independence, landscape built **national identity**, connecting Mexico's Aztec past and modern progress."],["Exam hooks","Velasco · Mexican national landscape · panorama · eagle (Aztec legend) · train = modernity · science and patriotism"],["Compare with","The Oxbow (#109): national landscape. Codex Mendoza (#81): the eagle on the cactus."]]},{n:119,title:"The Burghers of Calais",maker:"Auguste Rodin",date:"1884–1895 C.E.",medium:"Bronze",context:"Six citizens who offered their lives to save their besieged city, shown as individuals in dread rather than a heroic group — hollow eyes, oversized hands and feet, ropes at their necks. Rodin wanted them at ground level so viewers would walk among them; Calais refused at first.",unit:4,unitName:"Later Europe and Americas",year:1884,images:[{src:"cb/119-1.jpg",w:993,h:979,caption:"The Burghers of Calais",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u4.webp",4,2,8,7],notes:[["Form","A life-size **bronze** group of six standing men, each an individual, with rough, expressive, textured surfaces. They are arranged as **separate figures** rather than a unified pyramid. They stood at **ground level** with no pedestal, as Rodin wished, though the city put them on one."],["Function","A **public monument** commissioned by the city of **Calais**."],["Content","In 1347, during the **Hundred Years' War**, six leading citizens (burghers) offered their lives to England's King Edward III to end the siege of Calais. They wear sackcloth and nooses around their necks, carry the keys to the city, and show despair, resignation and courage. (They were spared after the queen intervened.)"],["Context","**Auguste Rodin**. Rather than heroic triumph, he showed **inner anguish**. The city was disappointed at the lack of heroism. Placing the figures at ground level puts them on the viewer's level."],["Exam hooks","Rodin · bronze · six burghers · Hundred Years' War · self-sacrifice · no pedestal · psychological realism"],["Compare with","Vietnam Veterans Memorial (#225): an anti-heroic memorial. George Washington (#104): a heroic monument."]]},{n:120,title:"The Starry Night",maker:"Vincent van Gogh",date:"1889 C.E.",medium:"Oil on canvas",context:"Painted from memory and imagination in the asylum at Saint-Rémy: a cypress like a flame, a village with a northern-looking spire, and a sky churning in thick impasto swirls. Complementary blues and yellows, and paint laid on so heavily that it becomes relief. Expression rather than observation.",unit:4,unitName:"Later Europe and Americas",year:1889,images:[{src:"cb/120-1.jpg",w:993,h:799,caption:"The Starry Night",credit:"Digital Image © The Museum of Modern Art/Licensed by SCALA/Art Resource, NY"}],thumb:["thumbs/t2-u4.webp",5,2,8,7],notes:[["Form","An **oil on canvas** painting with thick **impasto**, **swirling**, rhythmic brushstrokes and intense, expressive color (blues, yellows). A huge flame-like **cypress** in the foreground links earth and sky."],["Function","Painted from memory and imagination, not observation, to express emotion."],["Content","A night sky with whirling stars, a crescent moon and clouds over a sleeping village with a church steeple (like a Dutch steeple). The cypress, associated with death and graveyards, may suggest death, eternity or a link to the heavens."],["Context","**Vincent van Gogh**, **Post-Impressionism**. Painted at the **asylum at Saint-Rémy**, where he admitted himself after a mental health crisis; the view is from his window. He used color and line to convey feeling."],["Exam hooks","van Gogh · Post-Impressionism · impasto · swirling sky · cypress · Saint-Rémy asylum · emotion through color"],["Compare with","Saint-Lazare Station (#116): Impressionist brushwork. The Scream (#122): Expressionist emotion. Mont Sainte-Victoire (#125)."]]},{n:121,title:"The Coiffure",maker:"Mary Cassatt",date:"1890–1891 C.E.",medium:"Drypoint and aquatint",context:"A woman seen from behind at her toilette, arms raised to her hair before a mirror, in flat colour areas, patterned wallpaper and a high tilted viewpoint — all learned from the Japanese prints Cassatt saw at a Paris exhibition. She built the plates up in colour with aquatint and printed them herself.",unit:4,unitName:"Later Europe and Americas",year:1890,images:[{src:"cb/121-1.jpg",w:754,h:999,caption:"The Coiffure",credit:"Used by Permission"}],thumb:["thumbs/t2-u4.webp",6,2,8,7],notes:[["Form","A color print combining **drypoint** and **aquatint** (tonal areas) with flat areas of color, patterned surfaces, a tilted perspective and cropping. It is influenced by **Japanese ukiyo-e woodblock prints**, which Cassatt saw at a Paris exhibition in 1890."],["Function","One of a series of ten color prints of women's daily life."],["Content","A woman, nude to the waist, arranges her hair before a mirror in a private, intimate moment."],["Context","**Mary Cassatt**, an American Impressionist in Paris. As a woman she painted **women's private, domestic worlds**, spaces accessible to her. **Japonisme** (Japanese influence) shaped European art."],["Exam hooks","Cassatt · drypoint and aquatint · Japonisme/ukiyo-e influence · women's private world · Impressionism"],["Compare with","Under the Wave off Kanagawa (#211): Japanese print. La Grande Odalisque (#107): the female nude by a man."]]},{n:122,title:"The Scream",maker:"Edvard Munch",date:"1893 C.E.",medium:"Tempera and pastels on cardboard",context:"A skull-like figure on a bridge holds its head while the sky bleeds orange in undulating bands and two indifferent figures walk away behind. Munch described feeling 'a great scream pass through nature' — the sound is in the landscape, not the figure. Symbolist anxiety, made in four versions.",unit:4,unitName:"Later Europe and Americas",year:1893,images:[{src:"cb/122-1.jpg",w:791,h:1004,caption:"The Scream",credit:"Digital Image © Bridgeman Art Library © 2013 The Munch Museum/The Munch-Ellingsen Group/Artists Rights Society (ARS), New York"}],thumb:["thumbs/t2-u4.webp",7,2,8,7],notes:[["Form","Tempera and pastel on **cardboard**: wavy, swirling lines in the sky and landscape, with intense unnatural colors, especially a blood-red sky. A strong **diagonal** railing. The figure is simplified: skull-like and sexless."],["Function","Part of Munch's series **The Frieze of Life**, about love, fear and death."],["Content","A figure on a bridge holds its head and screams, or hears 'the infinite scream passing through nature', as Munch wrote in his diary. Two figures walk away in the background."],["Context","**Edvard Munch**, Norwegian, a forerunner of **Expressionism**: **anxiety** and inner emotion distort the outside world. He made several versions, painted and printed."],["Exam hooks","Munch · Expressionism · anxiety · scream through nature · Frieze of Life · distortion · red sky"],["Compare with","The Starry Night (#120): emotional landscape. Self-Portrait as a Soldier (#133): German Expressionism."]]},{n:123,title:"Where Do We Come From? What Are We? Where Are We Going?",maker:"Paul Gauguin",date:"1897–1898 C.E.",medium:"Oil on canvas",context:"A twelve-foot frieze read right to left, from an infant to an old woman, with a fruit-picking figure at the centre and a blue idol behind. Painted in Tahiti while ill and suicidal. The flat colour and simplified forms are Gauguin's Primitivism — a French artist's fantasy of a place he found already colonised.",unit:4,unitName:"Later Europe and Americas",year:1897,images:[{src:"cb/123-1.jpg",w:1200,h:441,caption:"Where Do We Come From? What Are We? Where Are We Going?",credit:"Photograph © 2013 Museum of Fine Arts, Boston"}],thumb:["thumbs/t2-u4.webp",0,3,8,7],notes:[["Form","A huge **oil on canvas** frieze read right to left, with flat areas of strong color, simplified forms, a dreamlike, non-naturalistic space and figures in a lush landscape."],["Function","Gauguin intended it as his testament; he planned suicide after finishing it (and survived)."],["Content","The cycle of **life**: on the right, a baby (birth); in the center, a figure picking fruit (adulthood, like Eve); on the left, an old woman near death. A blue idol (spirituality) stands in the background. The painting's title asks the three philosophical questions."],["Context","**Paul Gauguin**, Post-Impressionism (**Synthetism**). He left France for **Tahiti**, seeking a 'primitive' paradise, an idea rooted in **colonial** fantasy. He painted Tahitian people as exotic symbols, and Tahiti was a French colony."],["Exam hooks","Gauguin · Tahiti · cycle of life · read right to left · Synthetism · flat color · colonial primitivism"],["Compare with","Les Demoiselles d'Avignon (#126): primitivism. Byeri (#179): Western appropriation."]]},{n:124,title:"Carson, Pirie, Scott and Company Building",maker:"Louis Sullivan (architect); Chicago",date:"1899–1903 C.E.",medium:"Iron, steel, glass, and terra cotta",context:"A steel-frame department store where the frame shows as a grid of wide Chicago windows — form following function above — while the street-level entrance is wrapped in extravagant cast-iron ornament to pull shoppers in. Two logics on one building, quite deliberately.",unit:4,unitName:"Later Europe and Americas",year:1899,images:[{src:"cb/124-1.jpg",w:915,h:732,caption:"Carson, Pirie, Scott and Company Building",credit:"© Hedrich Blessing Collection/Chicago History Museum/Getty Images"},{src:"cb/124-2.jpg",w:1101,h:728,caption:"Detail",credit:"© Raymond Boyd/Michael Ochs Archives/Getty Images"},{src:"cb/124-3.jpg",w:992,h:778,caption:"Carson, Pirie, Scott and Company Building plan",credit:""}],thumb:["thumbs/
