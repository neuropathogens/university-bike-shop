ation."],["Content","Grotesque, violent and sexual silhouettes based on stereotypes of the **antebellum South** and slavery: rebellion, violence and humiliation. The title refers to Eugène Delacroix's Liberty Leading the People (#108), a painting of revolution."],["Context","**Kara Walker**, African American. She uses the 18th–19th century genteel craft of **silhouettes** to confront the **history of slavery** and its racist stereotypes. The work is disturbing and controversial, implicating viewers through their shadows."],["Exam hooks","Kara Walker · cut-paper silhouettes · projection · viewer's shadows · slavery · stereotypes · title references Delacroix"],["Compare with","Liberty Leading the People (#108). Slave Ship (#111). The Swing (after Fragonard) (#244)."]]},{n:244,title:"The Swing (after Fragonard)",maker:"Yinka Shonibare",date:"2001 C.E.",medium:"Mixed-media installation",context:"A three-dimensional restaging of Fragonard's Rococo painting with a headless mannequin in a dress of Dutch wax fabric — cloth manufactured in Europe, based on Indonesian batik, and sold in West Africa as 'African.' Beheading the aristocrat points to the Revolution; the fabric points to who paid for the leisure.",unit:10,unitName:"Global Contemporary",year:2001,images:[{src:"cb/244-1.jpg",w:884,h:667,caption:"The Swing (after Fragonard)",credit:"© 2013 Tate, London"}],thumb:["thumbs/t2-u10.webp",4,2,8,4],notes:[["Form","A **mixed-media installation**: a headless mannequin in an 18th-century dress made of colorful **Dutch wax print fabric**, on a swing in mid-air, kicking off her shoe, with fake foliage on the floor."],["Function","A three-dimensional reenactment of Fragonard's painting."],["Content","It recreates **Fragonard's The Swing** (#101). The headless figure alludes to the **guillotine** and the French Revolution, the fate of the aristocracy whose leisure was funded by colonial wealth."],["Context","**Yinka Shonibare**, British-Nigerian. The 'African' fabric was actually produced by the Dutch, inspired by Indonesian batik, and sold in West Africa, which shows the complex **colonial** and global trade behind identity. He critiques how **colonialism** paid for European luxury."],["Exam hooks","Shonibare · Dutch wax fabric · recreates Fragonard · headless (guillotine) · colonialism and luxury · hybrid identity"],["Compare with","The Swing (#101): the original. Darkytown Rebellion (#243): history and race."]]},{n:245,title:"Old Man's Cloth",maker:"El Anatsui",date:"2003 C.E.",medium:"Aluminum and copper wire",context:"Thousands of flattened liquor-bottle caps and seals stitched together with copper wire into a shimmering sheet that hangs like cloth and is re-draped differently at every installation. The alcohol trade was part of the transatlantic slave economy; the surface recalls Ghanaian kente. Anatsui leaves the hanging to the installer. (Card image: Another Man's Cloth, the companion piece — no free photograph of Old Man's Cloth exists.)",unit:10,unitName:"Global Contemporary",year:2003,images:[{src:"cb/245-1.jpg",w:1012,h:763,caption:"Old Man’s Cloth",credit:"© Samuel P. Harn Museum of Art, University of Florida, Gainesville/Museum purchase with funds from friends of the Harn Museum"}],thumb:["thumbs/t2-u10.webp",5,2,8,4],notes:[["Form","A huge, shimmering, flexible hanging made of thousands of flattened **aluminum bottle caps** from liquor bottles, stitched together with **copper wire**. It drapes in folds and can be hung differently each time."],["Function","A wall hanging or sculpture."],["Content","It resembles **kente cloth**, the woven textile of Ghana associated with royalty and status. The title suggests an elder's garment."],["Context","**El Anatsui**, Ghanaian, working in Nigeria. The bottle caps refer to the history of **trade**: European liquor was exchanged in the **transatlantic slave trade**, and local distilleries still produce it. The work recycles waste into luxury, turning sculpture into textile."],["Exam hooks","El Anatsui · bottle caps and copper wire · kente cloth · liquor and slave trade · recycling · flexible form"],["Compare with","All-T'oqapu tunic (#162): textile and status. Golden Stool (#170): Ghana. Pisupo Lua Afe (#237): recycled consumer materials."]]},{n:246,title:"Stadia II",maker:"Julie Mehretu",date:"2004 C.E.",medium:"Ink and acrylic on canvas",context:"Layered architectural drawings of stadiums and arenas overlaid with flags, pennants, banners and bursts of colour, all suspended in a swirl over a grey ground. Built up in transparent acrylic layers so the drawing keeps showing through. Stadiums as the place where nationalism, spectacle and crowds meet.",unit:10,unitName:"Global Contemporary",year:2004,images:[{src:"cb/246-1.jpg",w:1e3,h:762,caption:"Stadia II",credit:"© Julie Mehretu, American, b. 1970, Stadia II, 2004, Carnegie Museum of Art, Pittsburgh/Photograph © 2013 Carnegie Museum of Art, Pittsburgh"}],thumb:["thumbs/t2-u10.webp",6,2,8,4],notes:[["Form","A large **ink and acrylic** painting with layered **architectural drawings**: the plans of sports **stadiums**, overlapped with expressive marks, colored shapes, flags and bands."],["Function","Part of the **Stadia** series about public gathering spaces."],["Content","Stadiums as spaces of **mass spectacle**, nationalism, competition and crowd behavior. Flags of nations and corporate logos suggest globalization and conflict."],["Context","**Julie Mehretu**, Ethiopian-American. Her work maps urban space, globalization and history through layered abstraction, mixing architecture and gesture."],["Exam hooks","Mehretu · layered architectural drawings · stadiums · spectacle and nationalism · globalization · abstraction"],["Compare with","Electronic Superhighway (#238): mapping. Colosseum (#44): stadium."]]},{n:247,title:"Preying Mantra",maker:"Wangechi Mutu",date:"2006 C.E.",medium:"Mixed media on Mylar",context:"A collaged female figure reclines on a branch with a snake, assembled from magazine fragments — motorcycle parts, fashion photography, medical illustration — over pooled ink on slick Mylar. Mutu, Kenyan-born, builds hybrid bodies that are seductive and grotesque at once, about how women, and African women in particular, get pictured.",unit:10,unitName:"Global Contemporary",year:2006,images:[{src:"cb/247-1.jpg",w:914,h:1200,caption:"Preying Mantra",credit:"© Gladstone Gallery, New York and Brussels"}],thumb:["thumbs/t2-u10.webp",7,2,8,4],notes:[["Form","A **collage** on **Mylar** (a translucent plastic film), combining magazine images, ink, paint, glitter and beads."],["Function","An artwork exhibited in galleries."],["Content","A hybrid female figure, part woman, part **praying mantis** (a predator that eats its mate) and part plant and snake, reclines on a patterned blanket. Her face is collaged from magazines; she has a snake's body and is both seductive and dangerous."],["Context","**Wangechi Mutu**, Kenyan-American. She combines African women's imagery with fashion magazines, pornography and ethnographic photos, critiquing how the media and colonial history portray **Black women's bodies**: as exotic, sexual and monstrous."],["Exam hooks","Wangechi Mutu · collage on Mylar · hybrid woman-mantis · Black women's bodies · media and colonialism · predator"],["Compare with","La Grande Odalisque (#107): reclining exotic woman. Lying with the Wolf (#242)."]]},{n:248,title:"Shibboleth",maker:"Doris Salcedo",date:"2007–2008 C.E.",medium:"Installation",context:"A crack 548 feet long running the length of Tate Modern's Turbine Hall floor, widening and forking, with chain-link fence embedded in its sides. Salcedo cast and inserted it rather than breaking the floor. A shibboleth is a word that marks outsiders; the crack stands for the division between the first world and everyone it excludes. It was filled in, and the scar left visible.",unit:10,unitName:"Global Contemporary",year:2007,images:[{src:"cb/248-1.jpg",w:833,h:1200,caption:"Shibboleth",credit:"© Luke Macgregor/Reuters/Corbis"}],thumb:["thumbs/t2-u10.webp",0,3,8,4],notes:[["Form","A **crack** in the floor of the **Turbine Hall** at Tate Modern, London, about **548 feet** long, starting as a hairline and widening and deepening as it zigzags across the floor. Its edges were lined with chain-link fencing embedded in concrete."],["Function","A temporary installation; after it closed, the crack was filled in, leaving a visible scar."],["Content","The divisions between people: **racism**, colonialism, **immigration**, and the exclusion of those from the 'Third World' from Europe. The title refers to the biblical story (Judges 12) in which pronunciation of 'shibboleth' identified enemies, who were killed."],["Context","**Doris Salcedo**, Colombian, whose art addresses violence and loss. It made visitors look down, at the foundations of modernity, which she argued rest on racism and colonial exclusion."],["Exam hooks","Salcedo · crack in Tate Modern floor · Turbine Hall · borders and exclusion · immigration · scar remains · title from Judges"],["Compare with","Kui Hua Zi (#250): same Turbine Hall. Vietnam Veterans Memorial (#225): cutting into the ground."]]},{n:249,title:"MAXXI National Museum of XXI Century Arts",maker:"Zaha Hadid",date:"2009 C.E.",medium:"Glass, steel, and cement",context:"Bands of concrete gallery that bend, cross and cantilever over each other inside a former Roman barracks, with black stairs suspended in the void and a glass roof filtering daylight. Hadid rejected the museum as a set of neutral boxes: the building is a system of flowing paths, and the route through it is not fixed.",unit:10,unitName:"Global Contemporary",year:2009,images:[{src:"cb/249-1.jpg",w:1200,h:474,caption:"MAXXI National Museum of XXI Century Arts",credit:"© Atlantide Photoravel/Corbis"},{src:"cb/249-2.jpg",w:682,h:1023,caption:"MAXXI National Museum of XXI Century Arts",credit:"© Alessandro Di Meo/epa/Corbis"}],thumb:["thumbs/t2-u10.webp",1,3,8,4],notes:[["Form","A museum of interlocking, flowing **concrete** forms: long curving galleries cross and layer over each other like bundled paths or rivers. Glass roofs with fins filter natural light; inside are suspended black staircases."],["Function","Italy's **national museum** of 21st-century art and architecture in Rome."],["Content","The building follows the flow of people through space, with no fixed route."],["Context","**Zaha Hadid**, Iraqi-British, the first woman to win the Pritzker Prize (2004). **Deconstructivism** and parametric design: dynamic, fluid forms that break with the box. It was built on the site of former military barracks."],["Exam hooks","Zaha Hadid · MAXXI · flowing concrete · curved intersecting galleries · Deconstructivism · first woman Pritzker winner"],["Compare with","Guggenheim Bilbao (#240): contemporary museum. Seagram Building (#146): the box rejected."]]},{n:250,title:"Kui Hua Zi (Sunflower Seeds)",maker:"Ai Weiwei",date:"2010–2011 C.E.",medium:"Sculpted and painted porcelain",context:"One hundred million porcelain sunflower seeds, each moulded and hand-painted by workers in Jingdezhen over two years, poured across the Turbine Hall floor. Mao was the sun and the people the sunflowers turning toward him; seeds were also shared during famine. Mass-produced-looking objects that are each in fact handmade — and visitors were stopped from walking on them because of the ceramic dust.",unit:10,unitName:"Global Contemporary",year:2010,images:[{src:"cb/250-1.jpg",w:1200,h:801,caption:"Kui Hua Zi",credit:"© Oliver Strewe/Getty Images"}],thumb:["thumbs/t2-u10.webp",2,3,8,4],notes:[["Form","About **100 million** life-size **porcelain sunflower seeds**, each sculpted and **hand-painted** by about 1,600 artisans in **Jingdezhen** over two and a half years, spread in a gray layer across the floor of the **Turbine Hall**, Tate Modern."],["Function","A large installation. Visitors were originally invited to walk on it, but this was stopped because of **ceramic dust**, a health hazard."],["Content","Under **Mao**, propaganda showed Mao as the sun and the people as sunflowers turning toward him. Sunflower seeds were also a shared snack and a source of food during famine. The seeds look mass-produced but are each **handmade**, individual within a mass."],["Context","**Ai Weiwei**, Chinese artist and activist, critic of the Chinese government (detained in 2011). Jingdezhen was the imperial porcelain center (compare the David Vases, #204), and 'Made in China' raises questions about mass production, labor and the individual within the collective."],["Exam hooks","Ai Weiwei · 100 million handmade porcelain seeds · Jingdezhen · Mao and sunflowers · individual vs. mass · Tate Modern Turbine Hall"],["Compare with","David Vases (#204): Jingdezhen. Terra cotta warriors (#193): mass and individual. Chairman Mao (#212)."]]}],Am=[{w:1,q:"How were the Apollo 11 Stones dated?",o:["Radiocarbon dating of charcoal found in the same layer","Thermoluminescence readings taken from the stone itself","Counting tree rings in wood buried beside the slabs","Comparing their style to dated cave paintings in France"],x:"The slabs were dated by the charcoal in the surrounding archaeological layer."},{w:1,q:"What makes the Apollo 11 Stones different from Lascaux's paintings?",o:["They are portable","They use red ochre alone","They show human hunters","They were found in Europe"],x:"Apollo 11 is mobiliary (portable) art; Lascaux is painted on fixed cave walls."},{w:2,q:"Which feature of the Lascaux animals is called twisted (composite) perspective?",o:["Horns shown frontally on a body drawn in profile","Animals overlapping so that depth is clearly implied","A horizon line placed high on the cave wall","Animals shrinking in size as they recede"],x:"Bodies in profile with frontal horns combine the most recognizable views."},{w:2,q:"Why was Lascaux closed to the public in 1963?",o:["Visitors' breath caused mold to grow","A rockfall blocked the main entrance passage","The French state took it over for research","Its paintings were found to be forgeries"],x:"CO₂ and humidity from crowds damaged the paintings; replicas now serve visitors."},{w:3,q:"What did the maker of the camelid sacrum do?",o:["Carved a bone that already looked like a snout","Modeled a dog's head from clay and then fired it in a kiln","Painted a coyote in ochre on a limestone slab","Cast a wolf head in metal from a stone mold"],x:"The artist recognized an animal in a natural form and enhanced it by carving and drilling."},{w:3,q:"Where was the camelid sacrum found?",o:["Central Mexico","Southern Peru","Coastal Algeria","Western Namibia"],x:"It was found at Tequixquiac in central Mexico in 1870."},{w:4,q:"What does the Tassili n'Ajjer rock art reveal about the Sahara?",o:["It was once grassland where people herded cattle","It was once covered by a shallow inland sea","It was once a Roman province of farming estates","It was once forested and thickly settled by towns"],x:"The paintings record a green Sahara and the shift from hunting to herding."},{w:4,q:"Which details suggest the Running Horned Woman is in a ritual role?",o:["Horned headdress, dotted body markings and fringes","A crown, a staff and attendants kneeling at her feet","A drum, a mask and a ring of seated spectators","A bow, arrows and an antelope she is pursuing"],x:"The horns, body decoration and raffia fringes read as ceremonial costume."},{w:5,q:"How is the decoration of the Susa beaker organized?",o:["In horizontal bands of increasingly stylized animals","In a single continuous hunting scene around the body","In vertical panels separated by painted columns","In a spiral that winds from the base to the rim"],x:"Wading birds, running dogs and a large ibex fill separate registers."},{w:5,q:"What was the context in which the Susa beaker was found?",o:["A cemetery","A temple storeroom","A royal palace","A potter's kiln"],x:"It came from a necropolis of about 2,000 graves; it was funerary."},{w:6,q:"How is the person on the Arabian anthropomorphic stele identified?",o:["By carved attributes, such as a belt and dagger","By a cuneiform inscription giving his name and title","By a naturalistic face carved from a death mask","By the color of the robe painted over the relief"],x:"Status items identify the figure rather than a likeness."},{w:6,q:"What was the Arabian stele's most likely function?",o:["A funerary or commemorative marker","A boundary stone between farmlands","A doorjamb in a royal residence","A calendar for tracking rainfall"],x:"It probably stood for a specific high-status person, perhaps at a grave."},{w:7,q:"Which statement about the shape of the jade cong is accurate?",o:["It is square outside and round inside","It is round outside and square inside","It is a flat disk with a central hole","It is a solid cylinder with no opening"],x:"Later Chinese texts linked the round inside to heaven and the square outside to earth. (The flat disk is a bi.)"},{w:7,q:"Why does the cong suggest a stratified Liangzhu society?",o:["Jade took months to grind and ended up in elite graves","Its faces portray named rulers whose deeds are recorded in its text","It was traded to Mesopotamia for copper and tin","It was made quickly in large numbers for ordinary households"],x:"Labor-intensive jade in elite burials points to hierarchy and specialists."},{w:8,q:"How are the lintels at Stonehenge attached to the uprights?",o:["Mortise-and-tenon joints","Lime mortar and rubble","Bronze clamps and pins","They rest by gravity alone"],x:"Joints borrowed from woodworking lock the lintels on; lintels join each other with tongue-and-groove."},{w:8,q:"Which feature suggests Stonehenge was used to mark time?",o:["Alignment with the summer solstice sunrise","Rows of carved symbols for each lunar month","A sundial engraved on the central altar stone","Postholes arranged to match the fixed stars"],x:"Its axis aligns with the summer solstice sunrise and winter solstice sunset."},{w:9,q:"What does the Ambum Stone appear to depict?",o:["An echidna-like animal with an embryo's body","A seated human ancestor holding a carved staff","A crocodile and a bird locked in fierce combat","A canoe prow carved with a guardian's face"],x:"The long snout and tucked limbs suggest an animal and a fetus combined."},{w:9,q:"What happened to the Ambum Stone long after it was made?",o:["Later Enga people used it in their rituals","Missionaries buried it beneath a chapel in the highlands","It was melted down and recast as a ceremonial axe","It was cut into pieces and traded across the islands"],x:"Its meaning changed over time; it is now in the National Gallery of Australia."},{w:10,q:"Where were figurines like the Tlatilco female figure found?",o:["In burials","On temple altars","In a shipwreck","In palace walls"],x:"Hundreds were buried with the dead at the village of Tlatilco."},{w:10,q:"The doubled face of the Tlatilco figurine most likely expresses:",o:["The idea of duality","Two separate queens","A carving mistake","Christian influence"],x:"Duality was a central idea in later Mesoamerican thought."},{w:11,q:"How was the Lapita fragment decorated?",o:["Pressing a toothed tool into wet clay","Painting with a fine brush after firing","Carving the surface once it had dried","Applying glaze before a second firing"],x:"Dentate stamping made rows of dots, sometimes filled with lime."},{w:11,q:"Why do archaeologists value Lapita pottery?",o:["It traces the first settlement of Remote Oceania","It proves that Europeans reached Fiji very early","It records the names of the first island chiefs","It was the earliest porcelain made in the world"],x:"Lapita seafarers were ancestors of the Polynesians, and their designs survive in tattoo and tapa."},{w:12,q:"What is the purpose of the bent-axis approach at the White Temple?",o:["Worshippers had to turn corners before reaching the door","It aligned the stair with sunrise on the solstice","It let carts haul offerings straight to the top","It kept floodwater from reaching the cella"],x:"Turning corners prolonged and dramatized the approach to the god's house."},{w:12,q:"Which god was the White Temple probably dedicated to?",o:["Anu","Shamash","Amun-Re","Marduk"],x:"Anu was the Sumerian sky god; height brought his house nearer the heavens."},{w:13,q:"What event does the Palette of King Narmer commemorate?",o:["Unification of Upper and Lower Egypt","Expulsion of the Hyksos from the delta","Building of the first stepped pyramid","Founding of the capital at Thebes"],x:"Narmer wears the White Crown on one side and the Red Crown on the other."},{w:13,q:"Which convention does the Narmer Palette establish for later Egyptian art?",o:["Composite view of the body","Linear perspective in reliefs","Contrapposto in standing kings","Atmospheric haze in landscapes"],x:"Head and legs in profile, eye and shoulders frontal, plus registers and hierarchic scale."},{w:14,q:"What did the Eshnunna votive figures do for their owners?",o:["Prayed on the donor's behalf in the temple","Guarded the city gates against evil spirits","Marked graves of priests in the temple yard","Served as toys for children of the elite"],x:"They were stand-ins for worshippers, permanently attentive to the god."},{w:14,q:"How were the Eshnunna votive figures found?",o:["Buried in a cache beneath the temple floor","Standing in rows along a processional road","Sealed inside the tomb of a Sumerian king","Built into the mud-brick walls as fill"],x:"They were ritually buried when the temple was renovated."},{w:15,q:"Why is the Seated Scribe shown with a soft, fleshy body?",o:["Realistic bodies signaled non-royal status","Old Kingdom sculptors had not learned anatomy","Scribes were required to be well fed by law","The statue copied a Greek model of a writer"],x:"Idealized bodies were reserved for royalty; his status lies in his literacy and pose."},{w:15,q:"What was the Seated Scribe made to house?",o:["The ka","A relic","Papyrus","Grain"],x:"It is a tomb statue that gave the scribe's life force a permanent body."},{w:16,q:"In what order are the Standard of Ur's registers read?",o:["From bottom to top","From top to bottom","From center outward","From right to left"],x:"Both the War and Peace sides build upward toward the king."},{w:16,q:"What does the lapis lazuli on the Standard of Ur show?",o:["Long-distance trade reaching Afghanistan","Local mining of blue stone near the city","Tribute sent from Egypt after a defeat","Glassmaking that imitated precious stone"],x:"The lapis came from Afghanistan, far from Ur."},{w:17,q:"Who built the Giza pyramids, according to current evidence?",o:["Organized crews of paid and fed workers","Captured soldiers forced into slave labor","Foreign engineers hired from Mesopotamia","Priests who worked during the flood season"],x:"Workers' villages and records show paid labor gangs."},{w:17,q:"Why were the pyramids built on the west bank of the Nile?",o:["It was linked with the setting sun and the dead","It had the best stone for the blocks","It was safer from the annual Nile flood","It faced the royal palace across the river"],x:"The west, where the sun sets, was the land of the dead."},{w:18,q:"What does the queen's embrace in King Menkaura and queen suggest?",o:["She supports and legitimizes the king","She is mourning the king after his death","She is a goddess blessing a new temple","She is his servant presenting offerings"],x:"Royal women carried dynastic continuity."},{w:18,q:"Why does the statue stay attached to its stone slab?",o:["Permanence mattered more than motion","The sculptor ran out of time and money","It was meant to be set into a wall","Greywacke cannot be carved fully free"],x:"Compact, unbroken forms suited a statue meant to last for eternity."},{w:19,q:"What does the relief at the top of the Code of Hammurabi show?",o:["Shamash giving Hammurabi symbols of authority","Hammurabi trampling enemies at the city gate","Priests reading the laws to a seated crowd","The goddess Ishtar crowning a lion hunter"],x:"The sun god of justice hands Hammurabi a rod and ring."},{w:19,q:"Where was the Code of Hammurabi found?",o:["At Susa, where it was taken as booty","At Babylon, in the temple of Marduk","At Ur, in the royal tombs of the city","At Nineveh, in the library of a king"],x:"Elamites carried it off to Susa; French archaeologists found it there in 1901."},{w:20,q:"How does the hypostyle hall at Karnak get light?",o:["Through clerestory windows","Through an oculus in a dome","Through a glass skylight","Through doors on four sides"],x:"The central aisle is raised above the sides, creating clerestory openings."},{w:20,q:"Who could enter the innermost parts of the Temple of Amun-Re?",o:["Only priests and the pharaoh","Ordinary worshippers on feast days","Pilgrims who had fasted for days","Soldiers returning from campaign"],x:"Spaces grew darker, lower and more restricted toward the sanctuary."},{w:21,q:"How does Hatshepsut's mortuary temple relate to its site?",o:["Its colonnades echo the vertical cliffs behind it","Its pyramid shape mirrors a nearby mountain","Its moat reflects the Nile at the valley edge","Its towers rise higher than the desert cliffs"],x:"Terraces and colonnades are set against, and partly cut into, the cliff."},{w:21,q:"What happened to many of Hatshepsut's images after her death?",o:["They were destroyed by her successor","They were moved to the Valley of Kings","They were recarved as images of Amun","They were sent abroad as diplomatic gifts"],x:"Thutmose III had her name and images erased."},{w:22,q:"What religious change is linked to the Akhenaton stele?",o:["Worship focused on the sun disk Aten","Worship turned to the god Osiris alone","Worship of animal gods was made official","Worship of the king's ancestors was banned"],x:"Akhenaton promoted near-monotheistic worship of the Aten."},{w:22,q:"Which feature marks the Amarna style?",o:["Elongated heads and relaxed poses","Rigid poses with the left foot forward","Registers divided by strong ground lines","Bodies modeled with linear perspective"],x:"Amarna art breaks with the old canon in its informal intimacy."},{w:23,q:"How is Tutankhamun shown on his innermost coffin?",o:["As Osiris, holding the crook and flail","As Horus, with a falcon's head and wings","As a warrior driving his chariot in battle","As a child seated on his mother's lap"],x:"He takes the form of the god of the dead to ensure rebirth."},{w:23,q:"Why is Tutankhamun's tomb so important to scholars?",o:["It was found nearly intact","It is the largest royal tomb","It contained the first mummy","It has the oldest hieroglyphs"],x:"Howard Carter found it largely unlooted in 1922."},{w:24,q:"In the Last Judgment of Hu-Nefer, what is the heart weighed against?",o:["The feather of Ma'at","A gold weight of Ra","A scarab of rebirth","The eye of Horus"],x:"A heart lighter than truth's feather allows passage to the afterlife."},{w:24,q:"Which figure waits to devour a guilty heart?",o:["Ammit","Anubis","Thoth","Isis"],x:"Ammit is part crocodile, part lion and part hippopotamus."},{w:25,q:"Why do the lamassu have five legs?",o:["They appear complete from the front and the side","They carried a fifth leg to bear the lintel's weight","They represent five provinces of the empire","They were reworked when the gate was widened"],x:"From the front the figure stands still; from the side it strides."},{w:25,q:"What was the main function of the lamassu?",o:["Guarding the citadel's gates","Supporting a royal throne room","Marking the king's burial site","Decorating a temple of Ishtar"],x:"They were apotropaic guardians at Sargon II's citadel."},{w:26,q:"What was the Athenian agora mainly used for?",o:["Civic life, trade and public debate","Burials of citizens killed in battle","Worship of Athena at her chief temple","Training athletes for the Olympic games"],x:"It was the center of Athenian democracy and daily life."},{w:26,q:"Which building type in the agora was a long covered colonnade?",o:["Stoa","Tholos","Apse","Cella"],x:"Stoas such as the Stoa of Attalos lined the agora."},{w:27,q:"Where does the Anavysos Kouros's pose come from?",o:["Egyptian standing statues","Assyrian palace reliefs","Etruscan tomb paintings","Minoan bronze figurines"],x:"The frontal, left-foot-forward stance comes from Egypt; the Greeks freed the figure from the block."},{w:27,q:"What does the inscription on the Anavysos Kouros's base ask?",o:["That passersby mourn Kroisos, killed in war","That Apollo accept the statue as an offering","That the athlete's victory be remembered","That the city honor the sculptor's skill"],x:"It is a grave marker for a young warrior."},{w:28,q:"Why does the Peplos Kore keep much of its paint?",o:["It was buried after the Persian sack","It was repainted by Roman collectors","It was kept indoors in a dark shrine","It was varnished when it was carved"],x:"Burial after 480 BCE protected the surface, showing Greek sculpture was colorful."},{w:28,q:"How does a kore differ from a kouros?",o:["A kore is clothed","A kore is seated","A kore is bronze","A kore is smaller"],x:"Korai are always clothed; kouroi are nude."},{w:29,q:"What does the Sarcophagus of the Spouses suggest about Etruscan women?",o:["They joined men at banquets","They could not attend funerals","They ruled as queens of cities","They lived apart from husbands"],x:"Greeks found this shocking; Etruscan women had more social freedom."},{w:29,q:"What material is the Sarcophagus of the Spouses made of?",o:["Terra cotta","Marble","Bronze","Alabaster"],x:"Terra cotta was a favored Etruscan sculptural medium."},{w:30,q:"What do the Apadana stairway reliefs show?",o:["Subject peoples bringing gifts to the king","Persian soldiers defeating Greek hoplites","Priests sacrificing a bull to Ahura Mazda","The king hunting lions from his chariot"],x:"Twenty-three delegations from across the empire are identified by dress."},{w:30,q:"What topped the columns of the Persepolis Apadana?",o:["Paired bull capitals","Papyrus-shaped capitals","Ionic volute capitals","Lotus bud capitals"],x:"Double-bull (protome) capitals supported the roof beams."},{w:31,q:"How does the Etruscan temple differ from a Greek temple?",o:["Steps only at the front, on a high podium","Columns on all four sides, set on a low base","A round cella under a hemispherical dome","An open courtyard surrounded by iwans"],x:"Rome later adopted the Etruscan frontal plan."},{w:31,q:"Where did the terra cotta Apollo of Veii stand?",o:["On the temple's roof ridge","Inside the temple's cella","At the foot of the stairs","In a niche of the podium"],x:"Life-size roof statues told the myth of Apollo and Herakles."},{w:32,q:"What do the Tomb of the Triclinium frescoes mainly show?",o:["Music, dancing and banqueting","Battles against invading Gauls","Judgment of the dead by gods","Farming through the four seasons"],x:"The scenes evoke a joyful funerary banquet."},{w:32,q:"Where is the Tomb of the Triclinium?",o:["Tarquinia","Pompeii","Cerveteri","Veii"],x:"It is a rock-cut chamber tomb in the Etruscan city of Tarquinia."},{w:33,q:"What is new about the Niobid Painter's figures?",o:["They stand on several ground lines","They are painted in black on red","They are lit by a single light source","They are drawn without outlines"],x:"Figures at different levels attempt spatial depth."},{w:33,q:"Why are Niobe's children being killed?",o:["Niobe boasted she had more children than Leto","Niobe refused to sacrifice to Zeus at Olympia","Niobe stole Apollo's lyre from his temple","Niobe helped Troy against the Greek army"],x:"Apollo and Artemis punish her hubris."},{w:34,q:"What pose does the Doryphoros use?",o:["Contrapposto","Frontality","Twisted perspective","Composite view"],x:"Weight on one leg tilts the hips and shoulders in opposite directions."},{w:34,q:"How do we know the Doryphoros today?",o:["From Roman marble copies","From the original bronze","From Greek vase paintings","From a written description"],x:"The bronze is lost; supports like the tree trunk are Roman additions."},{w:35,q:"Which feature of the Parthenon is an optical refinement?",o:["Columns that swell slightly and lean inward","Columns placed farther apart at the corners","A frieze carved in very shallow relief","Marble chosen for its even white color"],x:"Entasis, a curved floor and leaning columns correct optical distortion."},{w:35,q:"What does the Plaque of the Ergastines show?",o:["Women who wove Athena's peplos","Athena's birth from Zeus's head","A battle of Lapiths and centaurs","Victory tying her sandal strap"],x:"It comes from the Panathenaic frieze procession."},{w:36,q:"What is Hegeso doing on her grave stele?",o:["Examining jewelry from a box","Weaving cloth at her loom","Pouring wine for a guest","Nursing a newborn child"],x:"Jewelry, perhaps a dowry, and a servant show her wealth and domestic role."},{w:36,q:"What mood characterizes the Grave Stele of Hegeso?",o:["Quiet, restrained contemplation","Wild grief and torn garments","Triumphant celebration of victory","Comic exaggeration and satire"],x:"Classical funerary art favors dignified restraint."},{w:37,q:"What is the Winged Victory of Samothrace shown landing on?",o:["The prow of a warship","A rocky mountain peak","A column in a temple","The back of a lion"],x:"It probably commemorates a naval victory."},{w:37,q:"Which quality makes the Winged Victory typically Hellenistic?",o:["Theatrical, wind-swept movement","Calm, idealized proportions and balance","Rigid frontality and symmetry","Flat, linear surface pattern"],x:"Deeply carved drapery and strong diagonals create drama."},{w:38,q:"What battle is carved on the frieze of the Great Altar at Pergamon?",o:["Gods fighting giants","Greeks fighting Trojans","Lapiths fighting centaurs","Romans fighting Goths"],x:"The Gigantomachy stood for order defeating chaos."},{w:38,q:"What victory did the Attalid kings celebrate with the Pergamon altar?",o:["Their defeat of the Gauls","Their conquest of Ptolemaic Egypt","Their defeat of Rome","Their capture of Troy"],x:"They presented Pergamon as a new Athens of civilization against barbarians."},{w:39,q:"Who owned the House of the Vettii?",o:["Two wealthy freedmen brothers","A senator and his household","The priests of a nearby temple","A retired general of Augustus"],x:"Former slaves who became rich merchants displayed their success."},{w:39,q:"What is the open central hall of a Roman domus called?",o:["Atrium","Narthex","Apse","Cella"],x:"The atrium had an impluvium basin catching rainwater."},{w:40,q:"What is the Alexander Mosaic believed to copy?",o:["A lost Greek painting","A Persian palace relief","An Etruscan tomb fresco","A Roman triumphal frieze"],x:"It is evidence of lost Greek painting, perhaps by Philoxenos of Eretria."},{w:40,q:"How is Darius III shown in the Alexander Mosaic?",o:["Turning back in fear as his chariot flees","Charging forward with his spear raised high","Lying dead beneath his overturned chariot","Kneeling to offer his crown to Alexander"],x:"Alexander charges bareheaded while Darius's charioteer whips the horses away."},{w:41,q:"What makes the Seated Boxer typically Hellenistic?",o:["Its realistic wounds and exhaustion","Its perfect, mathematical proportions","Its frontal pose and Archaic smile","Its gold-and-ivory surface"],x:"Hellenistic art favored pathos and non-ideal subjects."},{w:41,q:"What technique was used to make the Seated Boxer?",o:["Lost-wax bronze casting","Carving from one marble block","Hammered gold over a wood core","Firing in sections of terra cotta"],x:"It is a rare surviving original Greek bronze, with inlaid copper blood."},{w:42,q:"Why does the Head of a Roman patrician show wrinkles and sagging skin?",o:["Republican Rome prized age and experience","The sculptor copied a Hellenistic boxer","Romans could not afford idealized statues","The portrait was made to mock the sitter"],x:"Verism signaled gravitas and civic virtue."},{w:42,q:"Which family custom may lie behind v <div class="runhead"><span class="runhead-title">AP Art History &middot; the 250 required works</span><span class="runhead-actions"><a href="apah-250-photo-cutouts.pdf" download>&darr;&nbsp;<span class="wide">Printable photo cutouts</span><span class="narrow">Photo cutouts</span> (PDF<span class="wide">, 63&nbsp;pp.</span>, 21&nbsp;MB)</a><a href="tests/5/">Unit 5 practice test</a><button type="button" class="theme-btn" id="theme-btn" aria-pressed="false">Dark mode</button></span></div>
<div class="runhead-rule"><hr></div>
<div id="root"></div>
<button type="button" class="totop" id="totop" aria-label="Back to top">&uarr; Top</button>
<script>
(function(){
  var root=document.documentElement, btn=document.getElementById("theme-btn");
  function sync(){var dark=root.getAttribute("data-theme")==="dark";btn.textContent=dark?"Light mode":"Dark mode";btn.setAttribute("aria-pressed",String(dark));}
  btn.addEventListener("click",function(){var dark=root.getAttribute("data-theme")!=="dark";root.setAttribute("data-theme",dark?"dark":"light");try{localStorage.setItem("apah.theme",dark?"dark":"light")}catch(e){}sync();});
  sync();
  var top=document.getElementById("totop");
  function onScroll(){top.classList.toggle("is-on",window.scrollY>900);}
  window.addEventListener("scroll",onScroll,{passive:true});onScroll();
  top.addEventListener("click",function(){window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});});
})();
</script>
