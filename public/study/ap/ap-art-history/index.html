<style>
/* ---- LaTeX theme: Latin Modern Roman + Mono, paper white, booktabs rules ---- */
@font-face{font-family:"Latin Modern";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/LM-regular.woff2") format("woff2")}
@font-face{font-family:"Latin Modern";font-style:italic;font-weight:400;font-display:swap;src:url("fonts/LM-italic.woff2") format("woff2")}
@font-face{font-family:"Latin Modern";font-style:normal;font-weight:600 700;font-display:swap;src:url("fonts/LM-bold.woff2") format("woff2")}
@font-face{font-family:"Latin Modern";font-style:italic;font-weight:600 700;font-display:swap;src:url("fonts/LM-bold-italic.woff2") format("woff2")}
@font-face{font-family:"Latin Modern Mono";font-style:normal;font-weight:400 500;font-display:swap;src:url("fonts/LM-mono.woff2") format("woff2")}
@font-face{font-family:"Latin Modern Mono";font-style:italic;font-weight:400 500;font-display:swap;src:url("fonts/LM-mono-italic.woff2") format("woff2")}
@font-face{font-family:"Latin Modern Mono";font-style:normal;font-weight:600 700;font-display:swap;src:url("fonts/LM-mono-bold.woff2") format("woff2")}

:root{
  --bg:#ffffff;--fg:#000000;--muted:#4a4a4a;--line:#c9c9c9;--plate:#f5f5f3;--ink-soft:#151515;
  --link:#00008b;
  --mono:"Latin Modern Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Latin Modern","Computer Modern Serif","CMU Serif",Georgia,serif;
}
:root[data-theme=dark]{--bg:#111110;--fg:#ecebe6;--muted:#a3a29c;--line:#34342f;--plate:#1b1b19;--ink-soft:#dcdbd6;--link:#9db4ff}

html{background:var(--bg)}
body{margin:0;font-family:var(--sans);font-size:17px;line-height:1.45;font-kerning:normal;font-variant-ligatures:common-ligatures;-moz-osx-font-smoothing:grayscale}
.mono{font-family:var(--mono)}

/* running head, as in fancyhdr */
.runhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:14px var(--gutter) 6px;max-width:1480px;margin:0 auto;font-size:14px;font-style:italic;color:var(--muted)}
.runhead-rule{max-width:1480px;margin:0 auto;padding-inline:var(--gutter)}
.runhead-rule hr{margin:0;border:0;border-top:.5px solid var(--fg)}
.runhead a{color:var(--link);text-decoration:none}
.runhead a:hover{text-decoration:underline}

/* title block, \maketitle */
.masthead{border-bottom:1.5px solid var(--fg);padding-block:30px 20px}
.wordmark{font-family:var(--sans);font-weight:700;letter-spacing:0;font-size:clamp(40px,7vw,68px);line-height:1}
.tagline{font-family:var(--sans);font-size:16px;letter-spacing:.03em;text-transform:none;font-variant:small-caps;color:var(--muted)}
.mode-label{font-family:var(--sans);font-size:16px;font-weight:700}
.mode-hint{font-size:13px;font-style:italic}

/* labels: uppercase mono -> small caps roman */
.field-label,.eyebrow,.idcard dt,.typed-fb dt{font-family:var(--sans);font-size:14px;letter-spacing:.04em;text-transform:lowercase;font-variant:small-caps}
.tag{font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;text-transform:lowercase;font-variant:small-caps;padding:0 6px}
.meter-legend,.status-line,.group-sub,.card-date,.deck-pos,.sync{font-family:var(--sans);font-size:14px}
.status-line,.group-sub{font-style:italic}

/* sectioning: \section, \subsection */
.group-head{border-bottom:.5px solid var(--fg)}
.group-title{font-family:var(--sans);font-size:24px;font-weight:700;letter-spacing:0}
.block-h{font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:0;text-transform:none;border-bottom:0;padding-bottom:0;margin-bottom:8px}
.mode-title,.detail-title,.answer-title,.q-prompt,.q-title,.summary-big{font-family:var(--sans);font-weight:700;letter-spacing:0}

/* body text: justified and hyphenated */
.prose,.note dd,.small-prose,.study-head p,.quiz>p,.setup-note,.foot{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.prose{font-size:17px;line-height:1.5}
.note dd{font-size:16px}
.note dt{font-family:var(--sans);font-size:16px;font-weight:700;letter-spacing:0}
.note--key{background:transparent;border:.5px solid var(--fg);padding:10px 14px}
.hooks{background:transparent;border:.5px solid var(--fg);border-left-width:.5px;font-size:15.5px}
.foot{font-size:14px;max-width:85ch}

/* tables: booktabs (\toprule \midrule \bottomrule) */
.idcard{border:0;border-top:1.5px solid var(--fg);border-bottom:1.5px solid var(--fg);padding:10px 2px}
.idcard dd{font-size:16px}
.rows{border-top:1.5px solid var(--fg)}
.row{border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:1.5px solid var(--fg)}
.row-num{font-family:var(--sans);font-weight:700}
.row-title,.card-title{font-weight:700;font-size:15.5px}
.row-sub,.card-sub{font-size:14px;font-style:italic}

/* figures */
.num{font-family:var(--sans);font-weight:700;font-size:13px}
.num--lg{font-size:16px}
.media-cap,.lb-credit{font-size:14px}
.view-cap{font-size:12.5px}
.pic-cap{font-size:14px}

/* controls keep their boxes, set in typewriter like \texttt */
.btn,.seg button,.mark,.toggle,.select,.search input,.typed-box input{font-family:var(--mono)}
.btn,.seg button,.mark,.toggle{font-size:14px}
.select,.search input{font-size:14.5px}
.opt{font-size:16px}
.linkish{color:var(--link)}
:root[data-theme=dark] .linkish{color:var(--link)}
/* ---- usability pass ---- */
/* data reads better in roman with tabular figures; typewriter stays on controls */
.mono{font-family:var(--sans);font-variant-numeric:tabular-nums lining-nums}
.btn .mono,.seg .mono,.key{font-family:var(--mono)}
.small{font-size:14px}
.study-head p{font-size:15px;line-height:1.45}
.q-tag{font-family:var(--sans);font-size:14px;font-variant:small-caps;letter-spacing:.04em;text-transform:lowercase}
.key{min-width:24px;height:24px;font-size:12.5px;opacity:.85}
.search input{font-family:var(--sans);font-size:16px}
.search input::placeholder{font-style:italic}
.panel-bar .mono{font-size:14px}

/* clearer interaction states */
.card-btn:hover .card-title,.row-btn:hover .row-title,.related-btn:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:.5px}
.btn:not(:disabled):hover,.seg button:not([aria-pressed=true]):hover,.mark:not(.mark--on):hover,.mode:not(.mode--on):hover{background:var(--plate)}
.btn--solid:not(:disabled):hover{background:var(--fg);opacity:.85}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.media-zoom{font-family:var(--sans);font-size:13px}

/* running head controls */
.runhead-actions{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px}
.theme-btn{background:none;border:0;padding:0;font:inherit;font-style:italic;color:var(--link);cursor:pointer}
.theme-btn:hover{text-decoration:underline}
.runhead .narrow{display:none}
@media (max-width: 640px){.runhead .narrow{display:inline}}

/* the filter bar only needs to stick while browsing */
.page:has(.study) .controls,.page:has(.quiz) .controls{position:static}
.hooks .mono{font-variant:small-caps;text-transform:lowercase;font-weight:700;letter-spacing:.04em}

/* back to top */
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:15;height:42px;padding:0 14px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .15s ease,transform .15s ease}
.totop.is-on{opacity:1;transform:none;pointer-events:auto}
.totop:hover{background:var(--plate)}
body.locked .totop{display:none}

/* touch: comfortable targets */
@media (pointer: coarse){
  .btn,.seg button,.mark{min-height:42px}
  .select,.search input{height:44px}
  .star{width:40px;height:40px}
}

/* phones */
@media (max-width: 640px){
  .prose,.note dd,.small-prose,.study-head p,.quiz>p,.setup-note,.foot{text-align:left;hyphens:manual;-webkit-hyphens:manual}
  .masthead{padding-block:18px 14px;gap:12px}
  .wordmark{font-size:40px}
  .tagline{font-size:14px}
  .field:first-child{flex-basis:100%}
  .study .meter{display:none}
  .flash-photo{min-height:180px;padding:10px}
  .flash-photo img{max-height:44vh}
  .flash--back .flash-photo img{max-height:28vh}
  .row-btn{padding-right:48px}
  .runhead{font-size:14px;padding-top:10px}
  .runhead-title,.runhead .wide{display:none}
  .runhead-actions{width:100%;justify-content:space-between}
}
</style>

 a feline-human hybrid in profile. Among the oldest figurative art in Africa. Being portable rather than fixed to a wall, the images could be carried, traded, or shared, which is evidence of symbolic thought and image-making as a practice.",unit:1,unitName:"Global Prehistory",year:-25500,images:[{src:"cb/1-1.jpg",w:900,h:689,caption:"Apollo 11 stones",credit:"© Human Origins Program, Smithsonian Institution"}],thumb:["thumbs/t2-u1.webp",0,0,6,2],notes:[["Form","Seven small, flat, portable slabs of stone. Animal drawn **in profile** with a simple charcoal outline — the profile view is the most identifiable view of an animal. One well-known figure is ambiguous: a feline-looking body with what may be **human-like hind legs** (a possible *therianthrope*, part human/part animal)."],["Function","Unknown. Because it is portable (mobiliary art), it could be carried, shown, or used in ritual. Later San rock art in southern Africa is often linked to **shamanic trance and transformation**, and some scholars read the hybrid figure this way."],["Content","Animals — possibly a feline, a rhinoceros, a zebra-like figure. No landscape, no ground line."],["Context","Named by the excavator (W. E. Wendt) because the slabs were found in **1969**, the same year as the Apollo 11 Moon landing. Dated by **radiocarbon dating of charcoal in the same layer**. Among the **oldest known figurative art in Africa**."],["Exam hooks","oldest work on the list · portable · profile view · dating by stratigraphy/associated charcoal · possible human–animal hybrid."],["One-sentence thesis","The Apollo 11 Stones show that humans in Africa were making symbolic, portable images of animals — and perhaps of transformation between human and animal — more than 25,000 years ago."],["Compare with","Lascaux (fixed cave wall vs. portable stone; both animals in profile)."]]},{n:2,title:"Great Hall of the Bulls",maker:"Paleolithic Europe; Lascaux, France",date:"15,000–13,000 B.C.E.",medium:"Rock painting (mineral pigment on limestone)",context:"A cave chamber covered with overlapping aurochs, horses, and deer in twisted perspective — bodies in profile, horns turned frontally. Painted by lamp and torchlight with blown and daubed ochre, charcoal, and manganese. No evidence of habitation this deep in the cave, so the images are usually read as ritual, hunting magic, or shamanic.",unit:1,unitName:"Global Prehistory",year:-15e3,images:[{src:"cb/2-1.jpg",w:973,h:636,caption:"Great Hall of the Bulls",credit:"© The Bridgeman Art Library"}],thumb:["thumbs/t2-u1.webp",1,0,6,2],notes:[["Form","Large aurochs (wild bulls), horses, and deer painted across the curving cave walls and ceiling, some over 5 m long. Animals overlap with no ground line or setting. **Twisted (composite) perspective** — the body in profile but horns turned to show both. Artists used **natural bulges in the rock** to give volume. Pigments: **charcoal, red and yellow ochre, manganese**, applied by brushes, pads, and **blowing pigment through hollow bones/reeds**."],["Function","Uncertain. Theories: **hunting magic** (painting animals to ensure a successful hunt), **shamanic ritual**, **initiation**, recording seasons/animal behavior. The paintings are deep inside the cave, far from where people lived, so they were **not decoration of a home** — people had to travel into darkness with **animal-fat lamps** and build **scaffolding**."],["Content",'Mostly animals; almost no humans. A strange spotted creature near the entrance is sometimes called the "unicorn." Animals shown are not always the ones people ate most (reindeer bones dominate the food remains), which weakens a simple hunting-menu reading.'],["Context","Discovered **1940** by teenagers. Opened to the public, then **closed in 1963** because visitors' breath (CO₂, humidity) caused mold and damage. Replicas (Lascaux II, IV) now let the public visit — raises questions of **preservation vs. access**."],["Exam hooks","twisted perspective · no ground line · use of rock contours · pigments and techniques · closed for conservation · animals, not people."],["One-sentence thesis","At Lascaux, Paleolithic painters used the cave's own surfaces and composite perspective to create powerful, overlapping animal images whose placement deep underground points to ritual rather than decoration."],["Compare with","Running Horned Woman (rock painting that shows a human figure and transition to herding); Apollo 11."]]},{n:3,title:"Camelid sacrum in the shape of a canine",maker:"Unknown maker; Tequixquiac, central Mexico",date:"14,000–7000 B.C.E.",medium:"Bone (fossilized camelid sacrum)",context:"A fossil sacrum from an extinct camelid, carved and drilled to sharpen the snout and nostrils of a dog or coyote. The earliest known work of art from the Americas. The maker recognized an animal already latent in a found object; sacrum bones remained sacred in later Mesoamerican cultures.",unit:1,unitName:"Global Prehistory",year:-14e3,images:[{src:"cb/3-1.jpg",w:1008,h:720,caption:"Camelid sacrum",credit:"Photo © Jorge Pérez de Lara"}],thumb:["thumbs/t2-u1.webp",2,0,6,2],notes:[["Form","The **sacrum** (the triangular bone at the base of the spine) of an extinct camelid (a relative of the llama), **carved and incised** so it looks like the head of a dog, coyote, or wolf — the natural holes became nostrils and the shape became a snout."],["Function","Unknown; possibly ritual. The artist **recognized an animal in a natural form and modified it** — transformation of one animal into another."],["Content","A canine head."],["Context",'Found in **1870** during digging of a drainage canal in the Valley of Mexico. One of the **earliest known artworks from the Americas**. The sacrum was later considered sacred in Mesoamerica (the name *sacrum* itself means "sacred bone" in Latin, and in later Mesoamerican thought the pelvic region was tied to fertility and rebirth) — note this is a **later** association, projected back.'],["Exam hooks","bone · modified found object · earliest Americas art · transformation · uncertain dating (huge date range = uncertain archaeological context)."],["One-sentence thesis","The camelid sacrum shows early Americans seeing and enhancing an animal image already suggested by a natural object, blurring the line between found form and made art."],["Compare with","Lascaux (using the natural shape of the rock); Ambum Stone (small zoomorphic stone object)."]]},{n:4,title:"Running horned woman",maker:"Unknown maker; Tassili n'Ajjer, Algeria",date:"6000–4000 B.C.E.",medium:"Pigment on rock",context:"One of thousands of Saharan rock paintings made when the region was grassland. A horned female figure with body markings and dots streaming from her arms and torso, apparently running or dancing — usually read as a fertility, ritual, or shamanic figure. Superimposition and shifting scale are typical of the site.",unit:1,unitName:"Global Prehistory",year:-6e3,images:[{src:"cb/4-1.jpg",w:605,h:719,caption:"Running horned woman",credit:"© The Granger Collection, New York"}],thumb:["thumbs/t2-u1.webp",3,0,6,2],notes:[["Form","A **running female figure** in dynamic pose with a **horned headdress**, body covered in **dotted patterns** (body paint or scarification), and **fringes/raffia** hanging from arms and legs. Pigments: white, red, and yellow ochre. Smaller figures in the background; a field of dots may represent grain."],["Function","Probably **ritual**: she may be a **goddess** or a **dancer/performer in a ceremony**. The horns may link her to **cattle** and fertility."],["Content","A female figure in motion; one of the few prehistoric works on this list centered on a person."],["Context","Tassili n'Ajjer holds **thousands** of rock paintings and engravings. The Sahara was then **green grassland with rivers and animals**; the paintings document the shift from **hunting to herding** (later layers show cattle) and then **desertification**. Paintings were recorded in the 1950s (Henri Lhote), whose team wetted surfaces to brighten them — damaging them. UNESCO World Heritage site."],["Exam hooks","Sahara was once fertile · transition to Neolithic pastoralism · human figure in motion · horns + body decoration = ritual costume · rock painting (not cave)."],["One-sentence thesis","The Running Horned Woman's decorated, dynamic body records ritual performance and the changing way of life of Saharan peoples when the desert was still green."],["Compare with","Lascaux (animals vs. human focus; stillness vs. motion); Tlatilco figurine (female body and fertility)."]]},{n:5,title:"Beaker with ibex motifs",maker:"Unknown maker; Susa, Iran",date:"4200–3500 B.C.E.",medium:"Painted terra cotta",context:"A thin, hand-built funerary beaker from a cemetery at Susa. An abstracted ibex with exaggerated horns forming a near-circle dominates the body, above bands of running dogs and long-necked wading birds. Hierarchy of scale and geometric abstraction; almost certainly a grave good for an elite burial.",unit:1,unitName:"Global Prehistory",year:-4200,images:[{src:"cb/5-1.jpg",w:773,h:1200,caption:"Beaker with ibex motifs",credit:"© RMN-Grand Palais/Art Resource, NY"}],thumb:["thumbs/t2-u1.webp",4,0,6,2],notes:[["Form","Tall, **thin-walled** ceramic beaker (about 28 cm), made on a slow wheel or by hand, painted in dark brown on buff. Decoration in **horizontal registers**: a narrow top band of **long-necked wading birds** (so stylized they become vertical lines), then **running dogs (hounds)** in a band, then a large **ibex** whose **enormous curving horns form a circle** enclosing a geometric/plant-like motif. Strong **stylization, geometric abstraction, and symmetry**."],["Function","**Funerary** — found in a **necropolis (cemetery)** at Susa with about 2,000 graves, buried with the dead. It may have held food or drink for the afterlife, or signaled status."],["Content","Animals of the region reduced to pattern. The ibex (a wild mountain goat) may symbolize fertility, abundance, or the seasons."],["Context","Susa was an early urban center (later the capital of Elam). Excavated by French archaeologists; now in the **Louvre**. The fine thin walls show a skilled **specialist potter** — sign of emerging social complexity in the Neolithic/Chalcolithic."],["Exam hooks","registers · stylized animals · horns as circle · burial context · early pottery = settled life."],["One-sentence thesis","The Susa beaker transforms local animals into abstract geometric bands, showing both highly skilled ceramic specialization and funerary practice in an early settled society."],["Compare with","Lapita fragment (Neolithic pottery with stamped geometric designs); Lascaux (naturalism vs. stylization of animals)."]]},{n:6,title:"Anthropomorphic stele",maker:"Unknown maker; Arabian Peninsula (near Ha'il, Saudi Arabia)",date:"Fourth millennium B.C.E.",medium:"Sandstone",context:"A sandstone slab carved into a schematic standing human: trapezoidal head, incised features, a belted double-bladed dagger, and a cord with an awl over one shoulder. Found in a region crossed by trade routes; likely a grave marker or commemorative image of a person or deity. One of the earliest anthropomorphic images from Arabia.",unit:1,unitName:"Global Prehistory",year:-4e3,images:[{src:"cb/6-1.jpg",w:799,h:1200,caption:"Anthropomorphic stele",credit:"© Album/Art Resource, NY"}],thumb:["thumbs/t2-u1.webp",5,0,6,2],notes:[["Form","An upright stone slab (about 1 m) carved in **low relief** into a **schematic human figure**: a rounded head with simplified face (eyes, nose, possibly a mustache), a **double cord or belt**, a robe, and a **double-bladed dagger** hanging diagonally across the body. **Frontal, flat, symmetrical**."],["Function","Likely a **funerary marker** or commemorative stone — standing in for a specific (probably male, high-status) person; possibly used in cult or ancestor ritual."],["Content","A human figure identified by **status items** (weapon, belt, garment) rather than by a realistic likeness."],["Context","Among the **earliest monumental sculptures of the Arabian Peninsula**; shows that stone sculpture of humans was developing there alongside Mesopotamia. Now in the National Museum, Riyadh."],["Exam hooks","early monumental human image · identity through attributes (weapon, belt) · low relief · funerary."],["One-sentence thesis","The Arabian stele marks a person's identity and status through carved attributes rather than likeness, an early monumental commemoration of an individual."],["Compare with","Ndop of Mishe miShyaang maMbul (identity shown through attributes, not realism); Moai (monumental ancestor figures)."]]},{n:7,title:"Jade cong",maker:"Liangzhu culture; China",date:"3300–2200 B.C.E.",medium:"Carved jade (nephrite)",context:"A tube that is square outside and circular inside — often read as an earth-and-heaven symbol — with masklike faces incised at the corners. Found stacked around bodies in elite burials. Jade cannot be cut, only abraded with sand and slurry, so every cong represents an enormous investment of labor and therefore status.",unit:1,unitName:"Global Prehistory",year:-3300,images:[{src:"cb/7-1.jpg",w:1023,h:752,caption:"Jade cong",credit:"© Asian Art & Archaeology, Inc./Corbis"}],thumb:["thumbs/t2-u1.webp",0,1,6,2],notes:[["Form","A **tube that is square on the outside and circular inside**, stacked in sections. Corners carved with **stylized faces** — large round eyes and a band for a mouth — an early version of the **taotie**-like mask later seen on Shang bronzes. Carved in **jade (nephrite)**, which is too hard to cut with tools; it was **ground with abrasive sand and water and drilled**, a process taking months."],["Function","**Ritual and status**; found in **elite burials**, often arranged around the body with **bi discs**. Later Chinese texts (much later) linked the **circle to heaven and the square to earth**, suggesting the cong connected the two realms — use this interpretation carefully because it is later."],["Content","Abstract geometry plus face/mask motifs (perhaps a deity, ancestor, or spirit-animal)."],["Context","**Liangzhu culture**, late Neolithic, in the **Yangzi River delta** near Lake Tai. The labor and material show a **stratified society with elites**. Jade remained the most valued material in Chinese culture."],["Exam hooks","square outside / round inside · jade = labor + status · burial with bi · face motifs anticipating Shang · heaven/earth reading."],["One-sentence thesis","The Liangzhu cong's labor-intensive jade and cosmic geometry marked elite status and ritual power in late Neolithic China."],["Compare with","Olmec-style mask from the Templo Mayor (jade as precious material across cultures); Stonehenge (circle and cosmos)."]]},{n:8,title:"Stonehenge",maker:"Neolithic Europe; Wiltshire, UK",date:"c. 2500–1600 B.C.E.",medium:"Sandstone (sarsen) and bluestone",context:"A megalithic henge built in phases over centuries using post-and-lintel construction, with lintels curved to the circle and locked by mortise-and-tenon joints. Sarsens were hauled about 25 km, bluestones roughly 250 km from Wales. The axis aligns with the summer solstice sunrise and winter solstice sunset; cremation burials were found on site.",unit:1,unitName:"Global Prehistory",year:-2500,images:[{src:"cb/8-1.jpg",w:775,h:825,caption:"Stonehenge",credit:"© Last Refuge/Robert Harding World Imagery/Corbis"},{src:"cb/8-2.jpg",w:1200,h:385,caption:"Stonehenge",credit:"© Luca da Ros/SOPA/Corbis"}],thumb:["thumbs/t2-u1.webp",1,1,6,2],notes:[["Form","A **henge** (circular ditch and bank) enclosing concentric stone settings built in **phases over about 1,500 years**. Outer circle of **sarsen** sandstone uprights capped by lintels (**post-and-lintel**), inside a **horseshoe of five trilithons** (two uprights + one lintel). Smaller **bluestones** in a circle and horseshoe inside. Joinery borrowed from woodworking: **mortise-and-tenon** (lintels on uprights) and **tongue-and-groove** (lintels to each other). The lintels are slightly curved to follow the circle. Outlying **Heel Stone** along the axis. It is a **megalith** (large stone) and **cromlech** (circle of megaliths)."],["Function","Ceremonial/ritual; **aligned with the summer-solstice sunrise and winter-solstice sunset**, so it likely worked as a **calendar/observatory** for seasonal ceremonies. **Cremation burials** were found there, so it also served the dead. Other theories include a place of healing."],["Content","No figures — meaning comes from arrangement, alignment, and movement through space."],["Context","Sarsens came from about 30 km away (Marlborough Downs); **bluestones were brought about 240 km from the Preseli Hills in Wales** — huge organized labor without wheels or metal tools. Evidence of a **complex society with shared belief and leadership**."],["Exam hooks","post-and-lintel · trilithons · mortise-and-tenon · solstice alignment · built in phases · bluestones from Wales."],["One-sentence thesis","Stonehenge's massive stones, carpentry-style joints, and solstice alignment reveal a Neolithic society able to organize enormous labor around the movements of the sun and the honoring of the dead."],["Compare with","Great Zimbabwe (monumental dry-stone construction), Machu Picchu (astronomical alignment), Nan Madol (megalithic architecture), Great Serpent Mound (solstice alignment, earthwork)."]]},{n:9,title:"The Ambum Stone",maker:"Unknown maker; Ambum Valley, Enga Province, Papua New Guinea",date:"c. 1500 B.C.E.",medium:"Greywacke",context:"A dense, highly polished stone carving of what is usually identified as an embryonic echidna (anteater): long snout, curved neck, stubby forelimbs held to the body. Probably a pestle or ritual object; later peoples found it and kept it as a sacred power object. It was broken and repaired in the twentieth century.",unit:1,unitName:"Global Prehistory",year:-1500,images:[{src:"cb/9-1.jpg",w:1e3,h:1197,caption:"The Ambum stone",credit:"© National Gallery of Australia, Canberra"}],thumb:["thumbs/t2-u1.webp",2,1,6,2],notes:[["Form","Small (about 20 cm), **ground and polished** hard stone sculpture of a **zoomorphic** creature: a long snout like an **echidna** (spiny anteater, which was an important food) or possibly a long-beaked bird, with a body that has been read as a **fetus or embryo** — head bent forward, limbs tucked."],["Function","Original use unknown — possibly a **pestle** (for grinding food) or a **ritual object** for fertility. Later **Enga people who found it treated it as a powerful ancestral object** and used it in ritual — a second life for the object."],["Content","Hybrid of animal and embryo — birth, growth, food, fertility."],["Context","Among the **oldest known sculptures in Oceania**. Found in the 1960s, then sold abroad; now in the **National Gallery of Australia** — its export raises issues of **cultural ownership and repatriation**."],["Exam hooks","oldest Oceanic sculpture · greywacke, ground and polished · echidna/embryo · object reused ritually by later people · ownership debates."],["One-sentence thesis","The Ambum Stone combines animal and embryonic forms in polished stone, and its reuse by later Enga communities shows how an object's meaning changes over time."],["Compare with","Camelid sacrum (small zoomorphic prehistoric object); Tlatilco figurine (fertility)."]]},{n:10,title:"Tlatilco female figurine",maker:"Unknown maker; central Mexico, site of Tlatilco",date:"1200–900 B.C.E.",medium:"Ceramic",context:"A small hand-modeled figure with two faces on one head, elaborate hair, a narrow waist, and full hips and thighs; unclothed, with no feet. Found chiefly in burials. Duality — life and death, human and supernatural — is a theme that runs through Mesoamerican art; the figurines are usually linked to fertility or shamanic transformation.",unit:1,unitName:"Global Prehistory",year:-1200,images:[{src:"cb/10-1.jpg",w:706,h:923,caption:"Tlatilco female figurine",credit:"© Princeton University Art Museum/Art Resource, NY"}],thumb:["thumbs/t2-u1.webp",3,1,6,2],notes:[["Form","Small (about 10 cm), **handmade** clay figure of a woman: **wide hips, bulbous thighs, tiny waist, stubby arms**, often nude with painted/incised details and elaborate hairstyles. The famous AP example has a **doubled face** — two faces/heads sharing features (e.g., three eyes, two noses and mouths)."],["Function","Found by the hundreds **in burials** at Tlatilco (with men, women, and children). Possibly linked to **fertility, femininity, and the continuation of life**, or to status/ritual roles. The doubled face may express **duality** (life/death, male/female, human/supernatural) — a concept central to later Mesoamerican thought."],["Content","Idealized/exaggerated female body; doubled identity."],["Context",'Tlatilco was a **farming village** on Lake Texcoco (near modern Mexico City). The site shows **Olmec influence** (trade and exchange with the Gulf Coast). Nicknamed "pretty ladies." Discovered by brickmakers digging clay.'],["Exam hooks","burials · female body · duality (two faces) · village culture · Olmec contact."],["One-sentence thesis","Buried with the dead, the Tlatilco figurine's exaggerated female body and doubled face point to early Mesoamerican ideas of fertility and duality."],["Compare with","Running Horned Woman (female body, ritual); Nukuoro female deity (abstracted female form)."]]},{n:11,title:"Terra cotta fragment",maker:"Lapita culture; Solomon Islands, Reef Islands",date:"1000 B.C.E.",medium:"Terra cotta (incised)",context:"A sherd of a Lapita vessel decorated with dentate stamping — bands of geometric marks pressed with a toothed comb — that resolve into a stylized face. Lapita pottery traces the migration of Austronesian seafarers across the Pacific and supplies the ancestral design vocabulary behind later tattoo and barkcloth patterns.",unit:1,unitName:"Global Prehistory",year:-1e3,images:[{src:"cb/11-1.jpg",w:1008,h:926,caption:"Terra cotta fragment",credit:"Courtesy of the Anthropology Photographic Archive, Department of Anthropology, The University of Auckland"}],thumb:["thumbs/t2-u1.webp",4,1,6,2],notes:[["Form","A pottery sherd decorated by **dentate stamping** — pressing a toothed (comb-like) tool into wet clay to make lines of tiny dots; sometimes **filled with white lime** to stand out. Designs are geometric bands that combine into **stylized human faces** (eyes, nose)."],["Function","Pottery for **cooking, serving, storage, and ceremonial display**; the elaborate stamped wares were probably ceremonial or status goods. The faces may be **ancestors**."],["Content","Geometric patterns and a face motif."],["Context","The **Lapita** people (named after a site in New Caledonia) were **Austronesian seafarers** who spread east across the Pacific — from the Bismarck Archipelago to **Fiji, Tonga, and Samoa** — the **first people to settle Remote Oceania**. Their pottery is how archaeologists **trace this migration**. Pottery later disappeared in Polynesia, but Lapita designs **survived in tattoo and tapa (barkcloth)** patterns."],["Exam hooks","dentate stamping · Lapita = ancestors of Polynesians · pottery traces migration · faces = ancestors · designs survive in tattoo/tapa."],["One-sentence thesis","Lapita pottery's stamped geometric faces are the material trail of the first settlers of Remote Oceania and the root of later Polynesian design."],["Compare with","Hiapo (later Polynesian geometric designs on barkcloth); Susa beaker (geometric decorated pottery)."]]},{n:12,title:"White Temple and its ziggurat",maker:"Sumerian; Uruk (modern Warka, Iraq)",date:"c. 3500–3000 B.C.E.",medium:"Mud brick",context:"A whitewashed temple raised on a 40-foot mud-brick platform at the centre of Uruk, the first true city. The ziggurat's battered sides shed rainwater, and a bent-axis stair forced worshippers to circle the building before entering. Probably dedicated to Anu, the sky god. Height put the priesthood literally closer to the gods and made the temple visible for miles across a flat plain.",unit:2,unitName:"Ancient Mediterranean",year:-3500,images:[{src:"cb/12-1.jpg",w:1008,h:1003,caption:"White Temple",credit:"© Richard Ashworth/Robert Harding World Imagery"},{src:"cb/12-2.jpg",w:977,h:307,caption:"White Temple and ziggurat (reconstruction drawing)",credit:""}],thumb:["thumbs/t2-u2.webp",0,0,8,5],notes:[["Form","A small rectangular temple, whitewashed so it gleamed, set on a **ziggurat**: a stepped platform about 40 feet high made of mud brick. The sides are **battered** (sloped) and faced with bricks set to shed rain. A ramp and stair approach at an angle, the **bent-axis approach**, so worshippers had to turn corners before reaching the door."],["Function","A temple to **Anu**, the sky god. Priests climbed to the top; only they entered the inner room, the cella, which held an altar and offering table. The height was meant to bring the god's house nearer the heavens."],["Context","Uruk was one of the first true cities, with perhaps 40,000 people. Mesopotamia had little stone or timber, so builders used **sun-dried mud brick**, which needed constant rebuilding. A temple raised high above a flat plain showed the city's wealth and its priests' power over farming surpluses."],["Exam hooks","ziggurat · mud brick · bent-axis approach · Anu · height = closeness to gods · priestly control"],["Compare with","Great Pyramids (#17): another mountain of masonry. The pyramids house a dead king, while the ziggurat is a stage for a living god's temple. Templo Mayor (#157): a sacred mountain made by human hands."]]},{n:13,title:"Palette of King Narmer",maker:"Predynastic Egypt",date:"c. 3000–2920 B.C.E.",medium:"Greywacke",context:"A ceremonial, oversized version of a cosmetic palette, carved on both faces. Narmer wears the White Crown of Upper Egypt on one side and the Red Crown of Lower Egypt on the other, commemorating unification. It fixes the conventions Egyptian art keeps for three millennia: registers, hierarchy of scale, the composite view of the body, and the king smiting an enemy.",unit:2,unitName:"Ancient Mediterranean",year:-3e3,images:[{src:"cb/13-1.jpg",w:904,h:1162,caption:"Palette of King Narmer, front",credit:"© Werner Forman/Art Resource, NY"},{src:"cb/13-2.jpg",w:887,h:1164,caption:"Palette of King Narmer, back",credit:"© Werner Forman/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",1,0,8,5],notes:[["Form","A flat, shield-shaped slab of greywacke about 2 feet tall, carved in **low relief** on both sides and arranged in **registers**. **Hierarchic scale** makes Narmer the largest figure. He is shown in **composite view**: head and legs in profile, eye and shoulders frontal. A ground line organizes each register."],["Function","A **ceremonial cosmetic palette**. Ordinary palettes were for grinding eye makeup; this oversized one was a votive or commemorative object, found in a temple deposit at Hierakonpolis. The circular depression is framed by the intertwined necks of two **serpopards**."],["Content","On one side Narmer wears the **White Crown of Upper Egypt** and smites an enemy while the falcon god **Horus** holds captives. On the other he wears the **Red Crown of Lower Egypt** and inspects rows of decapitated enemies. Hathor heads (cow-faced) crown both sides."],["Context","It commemorates the **unification of Upper and Lower Egypt**. It also sets the visual conventions Egyptian art kept for roughly 3,000 years: the smiting pose, registers, hierarchic scale and composite view."],["Exam hooks","unification · two crowns · composite view · hierarchic scale · registers · smiting pose · Horus"],["Compare with","Standard of Ur (#16): registers that tell a story of royal war and peace. Code of Hammurabi (#19): a ruler legitimized by a god."]]},{n:14,title:"Statues of votive figures, from the Square Temple at Eshnunna",maker:"Sumerian; modern Tell Asmar, Iraq",date:"c. 2700 B.C.E.",medium:"Gypsum inlaid with shell and black limestone",context:"Standing figures with clasped hands and enormous inlaid eyes, found buried in a cache beneath the temple floor. They are substitutes — left in the sanctuary to pray on the donor's behalf around the clock. Cylindrical bodies, fringed skirts, a fixed upward gaze; size probably tracks the donor's rank rather than the figure's importance.",unit:2,unitName:"Ancient Mediterranean",year:-2700,images:[{src:"cb/14-1.jpg",w:760,h:1025,caption:"Statues of votive figures",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",2,0,8,5],notes:[["Form","Standing figures in gypsum, ranging from small to about 2.5 feet tall, with cylindrical bodies, clasped hands and fringed skirts. The **huge staring eyes** are inlaid with shell and black limestone, with brows of bitumen. Bodies are simplified geometric forms with very little anatomy."],["Function","**Votive figures**. Worshippers placed them in the Square Temple to pray to the god (probably **Abu**) on their behalf, permanently. The wide eyes and clasped hands express constant attention and devotion."],["Context","They were found buried together in a cache beneath the temple floor, ritually discarded when the temple was renovated. Figures varied in size and finish, probably by the donor's wealth. They are early examples of **proxy worship** in Mesopotamia."],["Exam hooks","votive · substitute worshippers · inlaid eyes · clasped hands · buried cache · Abu"],["Compare with","Seated scribe (#15): a non-royal figure. The scribe is naturalistic and made for a tomb; the votives are stylized and made for a temple. Moai (#214): stylized figures defined by their gaze."]]},{n:15,title:"Seated scribe",maker:"Old Kingdom, Fourth Dynasty; Saqqara, Egypt",date:"c. 2620–2500 B.C.E.",medium:"Painted limestone",context:"A tomb sculpture of a scribe cross-legged with papyrus open on his lap. Unlike royal figures he has a soft belly and slack chest — a realism reserved for non-royal subjects. Inlaid rock-crystal eyes make the gaze startlingly alive. Literacy was rare and powerful, so the pose itself is the status claim.",unit:2,unitName:"Ancient Mediterranean",year:-2620,images:[{src:"cb/15-1.jpg",w:853,h:1086,caption:"Seated scribe",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",3,0,8,5],notes:[["Form","A painted limestone figure seated cross-legged, holding a papyrus scroll on his lap; his writing brush is lost. The figure is **naturalistic** for a non-royal person: a soft, sagging chest, a belly roll and a lifelike face. The eyes are **inlaid** with rock crystal, magnesite and copper."],["Function","A **tomb statue** at Saqqara that housed the **ka** (life force) of an elite official, so his spirit could keep his status in the afterlife."],["Context","Scribes were few, literate and powerful, the administrators of the Old Kingdom state. The soft, realistic body is a status code: idealization was reserved for royalty. Here, being shown seated and still, ready to write, was the honor."],["Exam hooks","ka statue · inlaid eyes · naturalism for non-royals · literacy = power · cross-legged · Saqqara"],["Compare with","King Menkaura and queen (#18): idealized royal bodies versus the scribe's realism. Votive figures (#14): a different kind of stand-in body."]]},{n:16,title:"Standard of Ur, from the Royal Tombs at Ur",maker:"Sumerian; modern Tell el-Muqayyar, Iraq",date:"c. 2600–2400 B.C.E.",medium:"Wood inlaid with shell, lapis lazuli, and red limestone",context:"A hollow box with two inlaid panels, conventionally called War and Peace. Registers read bottom to top: chariots trampling enemies, then prisoners paraded before the king; opposite, a banquet with a lyre player above a procession of goods and animals. The king is larger and breaks the register line. The lapis came from Afghanistan — evidence of long-distance trade.",unit:2,unitName:"Ancient Mediterranean",year:-2600,images:[{src:"cb/16-1.jpg",w:775,h:522,caption:"Standard of Ur, Peace",credit:"© Erich Lessing/Art Resource, NY"},{src:"cb/16-2.jpg",w:1200,h:524,caption:"Standard of Ur, War",credit:"© Eileen Tweedy/The Art Archive at Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",4,0,8,5],notes:[["Form","A hollow wooden box about 8 by 19 inches with two long sides, called **War** and **Peace**. Each is inlaid with **shell, lapis lazuli and red limestone** set in bitumen and arranged in **three registers** read from bottom to top. Hierarchic scale makes the king tallest, breaking through the top border in each top register."],["Function","Its original use is unknown. Leonard Woolley guessed a battle standard, hence the name; it may have been a sound box for a musical instrument. It was found in a royal tomb at Ur."],["Content","**War** side: chariots trample enemies (bottom), soldiers lead captives (middle), and captives are presented to the king (top). **Peace** side: people bring animals and goods (bottom and middle) to a banquet where the king and nobles drink while a lyre player performs (top)."],["Context","The lapis came from **Afghanistan**, which shows long-distance trade. The two sides present the king as both military leader and provider of prosperity. Wealthy grave goods in the Royal Tombs show a highly stratified society."],["Exam hooks","War and Peace sides · registers · hierarchic scale · lapis from Afghanistan · royal tomb · Woolley"],["Compare with","Palette of Narmer (#13): registers that tell royal narrative. Bayeux Tapestry (#59): a narrative of conquest. Benin plaque (#169): royal power shown through scale."]]},{n:17,title:"Great Pyramids (Menkaura, Khafre, Khufu) and Great Sphinx",maker:"Old Kingdom, Fourth Dynasty; Giza, Egypt",date:"c. 2550–2490 B.C.E.",medium:"Cut limestone",context:"Three pyramid tombs, once sheathed in polished white limestone, aligned to the cardinal points and set on the Nile's west bank — the land of the dead. Built by organised, paid labour rather than slaves, with associated mortuary and valley temples. The Sphinx, a lion's body with a pharaoh's head, guards Khafre's causeway.",unit:2,unitName:"Ancient Mediterranean",year:-2550,images:[{src:"cb/17-1.jpg",w:1008,h:1015,caption:"Great Pyramids with Sphinx",credit:"© Roger Wood/Corbis"},{src:"cb/17-2.jpg",w:933,h:856,caption:"Great Pyramids plan",credit:""}],thumb:["thumbs/t2-u2.webp",5,0,8,5],notes:[["Form","Three huge **true pyramids** of cut limestone at Giza, once cased in polished white **Tura limestone** that gleamed. Each was part of a complex with a **mortuary temple**, a causeway and a **valley temple** by the Nile. The **Great Sphinx**, a lion's body with a pharaoh's head (probably Khafre), is carved from the bedrock."],["Function","**Tombs** for the pharaohs Khufu (the largest), Khafre and Menkaura, built to protect the body and the ka. Funerary cults kept up offerings for eternity, and the Sphinx guards Khafre's complex."],["Context","Built on the **west bank** of the Nile, the side of the setting sun and of the dead, and aligned to the **cardinal directions**. The pyramid form may recall the primordial mound of creation or the rays of the sun god Ra. They were built by organized, paid and fed labor gangs, not slaves, which shows the power of the Old Kingdom state."],["Exam hooks","Old Kingdom · Khufu, Khafre, Menkaura · cardinal alignment · west bank · Sphinx · paid labor · mortuary and valley temples"],["Compare with","White Temple (#12): an elevated sacred structure. Stonehenge (#8): organized monumental labor. Taj Mahal (#209): a royal tomb as statement."]]},{n:18,title:"King Menkaura and queen",maker:"Old Kingdom, Fourth Dynasty; Egypt",date:"c. 2490–2472 B.C.E.",medium:"Greywacke",context:"A rigid frontal pair carved from a single block and still joined to the back slab — permanence chosen over motion. He steps forward with the left foot, fists clenched, in the nemes headdress; she embraces him, her body softly modelled under a sheer sheath. Idealised, ageless bodies made for the tomb rather than for the living.",unit:2,unitName:"Ancient Mediterranean",year:-2490,images:[{src:"cb/18-1.jpg",w:721,h:1037,caption:"King Menkaura and queen",credit:"Photograph © 2013 Museum of Fine Arts, Boston"}],thumb:["thumbs/t2-u2.webp",6,0,8,5],notes:[["Form","A near-life-size pair carved from a single block of greywacke, still attached to a back slab. **Frontal, rigid and symmetrical**, with the king's left foot forward. The bodies are **idealized**: youthful, muscular king and graceful queen. They are left unpolished at the bottom, showing it was unfinished."],["Function","A **ka statue** from Menkaura's **valley temple** at Giza, giving the king's spirit a permanent body."],["Content","The queen (probably Khamerernebty II) embraces the king, one arm around his waist and the other hand on his arm. This expresses support and legitimacy, and royal women carried dynastic continuity. He wears the nemes headcloth and false beard."],["Context","Egyptian royal sculpture valued **permanence**: compact forms, no projecting limbs, and hard stone. The striding left foot is a convention of the time; the Greek kouros (#27) borrowed it."],["Exam hooks","Old Kingdom · ka statue · frontality · idealized · left foot forward · valley temple · greywacke"],["Compare with","Anavysos Kouros (#27): Greeks adopt the stance but free the figure from the slab. Akhenaton (#22): Amarna breaks the idealized canon."]]},{n:19,title:"The Code of Hammurabi",maker:"Susian; Babylon (found at Susa, modern Iran)",date:"c. 1792–1750 B.C.E.",medium:"Basalt",context:"A seven-foot stele topped by a relief of Hammurabi standing before the enthroned sun god Shamash, who hands him the rod and ring of authority. Below run nearly 300 laws in cuneiform, with penalties scaled to the victim's class. Displayed publicly: the image is what makes the text read as divinely granted.",unit:2,unitName:"Ancient Mediterranean",year:-1792,images:[{src:"cb/19-1.jpg",w:450,h:1043,caption:"The Code of Hammurabi",credit:"© The Gallery Collection/Corbis"}],thumb:["thumbs/t2-u2.webp",7,0,8,5],notes:[["Form","A tall **basalt stele** (about 7 feet). At the top is a relief of King Hammurabi standing before the seated sun god **Shamash**, god of justice, who hands him a rod and ring, symbols of authority. Shamash wears a horned crown and flames rise from his shoulders. The figures use composite view, and Shamash is shown in a frontal-profile mix. Below, **cuneiform** text records about 282 laws."],["Function","A public **law code** displayed so subjects knew the rules and punishments. It is famous for its **lex talionis**, 'an eye for an eye', with penalties scaled by social class."],["Context","Babylonian. The relief claims **divine authority** for the laws. The Elamites carried it off as war booty to **Susa**, where French archaeologists found it in 1901; it is now in the Louvre."],["Exam hooks","law code · Shamash, god of justice · divine authority · cuneiform · basalt stele · taken to Susa"],["Compare with","Palette of Narmer (#13): a ruler backed by a god. Narmer celebrates conquest; Hammurabi records justice."]]},{n:20,title:"Temple of Amun-Re and Hypostyle Hall",maker:"New Kingdom, 18th and 19th Dynasties; Karnak, near Luxor, Egypt",date:"Temple c. 1550 B.C.E.; hall c. 1250 B.C.E.",medium:"Cut sandstone and mud brick",context:"A complex enlarged by pharaoh after pharaoh. The hypostyle hall packs 134 columns into a dense stone forest; the taller central aisle carries a clerestory that lights the processional route while the side aisles stay dark. Papyrus-bud and bell capitals, covered in painted relief. Only priests and the king went deep inside — the axial plan controls who sees what.",unit:2,unitName:"Ancient Mediterranean",year:-1550,images:[{src:"cb/20-1.jpg",w:1200,h:795,caption:"Temple of Amun-Re",credit:"© Yann Arthus-Bertrand/Corbis"},{src:"cb/20-2.jpg",w:608,h:920,caption:"Hypostyle Hall",credit:"© Jochem D. Wijnands/Getty Images"},{src:"cb/20-3.jpg",w:1200,h:692,caption:"Temple of Amun-Re plan",credit:""}],thumb:["thumbs/t2-u2.webp",0,1,8,5],notes:[["Form","A huge temple complex at Karnak built and expanded over centuries along an axis of **pylons** (monumental gateways), courts and halls. The **hypostyle hall** has 134 columns, the central ones about 70 feet tall with **papyrus capitals**. The central aisle is higher than the sides, creating **clerestory** windows that let in light."],["Function","The temple of **Amun-Re**, king of the gods. Only priests and the pharaoh could enter its deeper parts. Spaces became darker, lower and more restricted as one approached the sanctuary."],["Context","New Kingdom pharaohs, including Hatshepsut and Ramses II, added to it to display piety and power. Columns carved with papyrus and lotus forms recall the **marsh of creation**. Reliefs were painted in bright colors."],["Exam hooks","Amun-Re · hypostyle hall · clerestory · papyrus columns · pylons · axial plan · restricted access"],["Compare with","Mortuary temple of Hatshepsut (#21): architecture fitted to landscape. Chartres (#60): a clerestory that brings in divine light. Great Mosque of Córdoba (#56): a forest of columns."]]},{n:21,title:"Mortuary temple of Hatshepsut",maker:"New Kingdom, 18th Dynasty; near Luxor, Egypt",date:"c. 1473–1458 B.C.E.",medium:"Sandstone, partially carved into a rock cliff, and red granite",context:"Three colonnaded terraces climbing into the cliff at Deir el-Bahri, their verticals echoing the rock behind. Reliefs record her divine birth and the trading expedition to Punt — legitimising propaganda for a female pharaoh, who is often shown with a male body and false beard. Thutmose III later defaced many of her images.",unit:2,unitName:"Ancient Mediterranean",year:-1473,images:[{src:"cb/21-1.jpg",w:1200,h:790,caption:"Mortuary temple of Hatshepsut",credit:"© Erich Lessing/Art Resource, NY"},{src:"cb/21-2.jpg",w:527,h:962,caption:"Kneeling statue of Hatshepsut",credit:"Image © The Metropolitan Museum of Art/Image source © Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",1,1,8,5],notes:[["Form","Three **terraces** connected by ramps at Deir el-Bahri, set against and partly cut into the cliffs. **Colonnades** of rectangular piers and columns repeat the vertical lines of the cliff behind. The upper level held a sanctuary cut into the rock."],["Function","A **mortuary temple** for **Hatshepsut**, one of the few female pharaohs, and for the god Amun. It held her funerary cult; she was buried separately in the Valley of the Kings."],["Content","Reliefs record her legitimacy, including a **divine birth** (her father was Amun) and a **trade expedition to Punt**. Many statues show her with the male regalia of a pharaoh, including the false beard, as in the **kneeling statue** offering to the gods."],["Context","After her death her successor, **Thutmose III**, had many of her images destroyed and her name erased, probably to secure his own line."],["Exam hooks","female pharaoh · terraces and colonnades · cliff setting · Punt reliefs · divine birth · male regalia · images defaced"],["Compare with","Great Pyramids (#17): Old Kingdom tombs versus a New Kingdom temple. Machu Picchu (#161): architecture in dialogue with landscape."]]},{n:22,title:"Akhenaton, Nefertiti, and three daughters",maker:"New Kingdom (Amarna), 18th Dynasty; Egypt",date:"c. 1353–1335 B.C.E.",medium:"Limestone",context:"A small sunken-relief household altar. The Aten's rays end in tiny hands offering ankhs to the royal couple alone. Amarna style breaks convention: elongated skulls, heavy hips, slack bellies, and an informal domestic scene — a child tugs at her mother, another sits on Akhenaten's arm. Worship narrowed to one god, with the royal family as its only intercessors.",unit:2,unitName:"Ancient Mediterranean",year:-1353,images:[{src:"cb/22-1.jpg",w:1008,h:733,caption:"Akhenaton, Nefertiti, and three daughters",credit:"© bpk, Berlin/Staatliche Museen/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",2,1,8,5],notes:[["Form","A small **sunken relief** stele (carved below the surface), about 1 foot high. The figures have **elongated** heads, long necks, thin arms, potbellies and wide hips, a deliberate break from the old canon. The family is shown in a relaxed, intimate pose under the sun disk."],["Function","A private **house altar**: an object of devotion in an elite home, showing the royal family as intermediaries with the god."],["Content","**Akhenaton** and **Nefertiti** sit facing each other, playing affectionately with three daughters. Above them is the **Aten** sun disk, whose rays end in small hands holding ankhs (life) to their faces."],["Context","Akhenaton introduced near-**monotheism**, the worship of the Aten, and moved the capital to Amarna. The **Amarna style** is informal and curvilinear, and it ended after his death when the old gods and traditions returned under Tutankhamun."],["Exam hooks","Amarna period · Aten · monotheism · sunken relief · elongated bodies · informal intimacy · break with tradition"],["Compare with","King Menkaura and queen (#18): the rigid canon. Tutankhamun's coffin (#23): the return to tradition."]]},{n:23,title:"Tutankhamun's tomb, innermost coffin",maker:"New Kingdom, 18th Dynasty; Egypt",date:"c. 1323 B.C.E.",medium:"Gold with inlay of enamel and semiprecious stones",context:"The innermost of three nested coffins — some 240 pounds of solid gold — holding the mummy. The boy king appears as Osiris with crossed crook and flail, in the nemes headdress and false beard, while Nekhbet and Wadjet shield him with outstretched wings. Gold was the flesh of the gods and did not tarnish: it made the body eternal. (Card image: a museum replica — no free photograph of the original exists.)",unit:2,unitName:"Ancient Mediterranean",year:-1323,images:[{src:"cb/23-1.jpg",w:267,h:734,caption:"Tutankhamun’s innermost coffin",credit:"© Sandra Vannini/Corbis"}],thumb:["thumbs/t2-u2.webp",3,1,8,5],notes:[["Form","The innermost of three nested coffins, made of solid **gold** (about 240 pounds) inlaid with glass paste and semiprecious stones (lapis, carnelian, turquoise). The king is shown as **Osiris**, arms crossed holding the **crook and flail**, with feathered wings of the goddesses Isis and Nephthys wrapping the body."],["Function","To protect the mummy and present Tutankhamun as the god Osiris, king of the dead, ensuring his rebirth."],["Context","Tutankhamun was a minor king who restored the old gods after Akhenaton. His tomb (KV62) was found nearly intact by **Howard Carter in 1922**. Its riches suggest what larger royal tombs, all looted, once held."],["Exam hooks","solid gold · Osiris pose · crook and flail · nested coffins · Howard Carter 1922 · intact tomb"],["Compare with","Akhenaton stele (#22): the period before. Golden Stool (#170): gold as sacred and royal."]]},{n:24,title:"Last judgment of Hu-Nefer, from his tomb (page from the Book of the Dead)",maker:"New Kingdom, 19th Dynasty; Egypt",date:"c. 1275 B.C.E.",medium:"Painted papyrus scroll",context:"A continuous narrative read left to right: Anubis leads Hunefer in, weighs his heart against the feather of Ma'at, and Thoth records the verdict while the monster Ammit waits to devour a failure. Horus then presents him to the enthroned Osiris. Buried with him as both guidebook and insurance for the afterlife.",unit:2,unitName:"Ancient Mediterranean",year:-1275,images:[{src:"cb/24-1.jpg",w:1e3,h:499,caption:"Last judgment of Hu-Nefer",credit:"© The Trustees of the British Museum/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",4,1,8,5],notes:[["Form","A painted **papyrus** scroll page in registers, with figures in **composite view** and dense **hieroglyphic** text. It reads like a narrative from left to right."],["Function","A **Book of the Dead**: a guide of spells placed in the tomb to help the deceased (the scribe Hu-Nefer) pass judgment and reach the afterlife."],["Content","Jackal-headed **Anubis** leads Hu-Nefer to the scales, where his **heart is weighed against the feather of Ma'at** (truth). **Ammit**, part crocodile, lion and hippo, waits to devour a guilty heart. **Thoth** (ibis-headed) records the result. **Horus** presents him to **Osiris**, enthroned, with Isis and Nephthys. Above, Hu-Nefer kneels before the gods."],["Context","By the New Kingdom, the afterlife was open to non-royals who could afford funerary texts. The outcome is shown as already favorable, so the image works as a guarantee."],["Exam hooks","weighing of the heart · Ma'at feather · Anubis, Thoth, Ammit, Osiris · Book of the Dead · papyrus · non-royal afterlife"],["Compare with","Last Judgment at Sainte-Foy (#58): a medieval Christian judgment scene. Sistine altar wall (#75): another Last Judgment."]]},{n:25,title:"Lamassu from the citadel of Sargon II, Dur Sharrukin",maker:"Neo-Assyrian; modern Khorsabad, Iraq",date:"c. 720–705 B.C.E.",medium:"Alabaster",context:"Guardian figures flanking the palace gates: human head, bull or lion body, eagle's wings, horned crown of divinity. Carved with five legs so they read as standing still from the front and striding from the side — high relief that resolves from two viewpoints. Their scale and hybridity were meant to overawe arriving emissaries.",unit:2,unitName:"Ancient Mediterranean",year:-720,images:[{src:"cb/25-1.jpg",w:748,h:499,caption:"Lamassu",credit:"© Album/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",5,1,8,5],notes:[["Form","Colossal **guardian figures** (about 14 feet) carved from alabaster blocks: a **human head** with a horned crown, a bull's (or lion's) body and eagle's wings. The figure has **five legs**: seen from the front it stands still, and from the side it strides. The sculpture is a mix of high relief and sculpture in the round."],["Function","Protective spirits (**apotropaic** figures) flanking the gates of the citadel of King **Sargon II** at Dur Sharrukin. They warded off evil and impressed visitors with royal power."],["Context","The Neo-Assyrian empire used intimidating imagery. **Cuneiform** inscriptions between the legs record the king's titles and deeds. Its composite form combines the intelligence of a human, the strength of a bull or lion and the speed of an eagle."],["Exam hooks","guardian · five legs (two views) · human-bull-eagle hybrid · gateway · Sargon II · apotropaic"],["Compare with","Great Sphinx (#17): a human-animal guardian. Chavín Lanzón (#153): a composite sacred creature."]]},{n:26,title:"Athenian agora",maker:"Archaic through Hellenistic Greek; Athens, Greece",date:"600 B.C.E.–150 C.E.",medium:"Plan",context:"The open marketplace and civic heart of Athens, ringed by stoas, law courts, a mint and temples, and crossed by the Panathenaic Way. It accumulated rather than being planned in one go. The colonnaded stoas gave shaded public space for trade, philosophy and politics — democracy needed somewhere to happen, and this was it.",unit:2,unitName:"Ancient Mediterranean",year:-600,images:[{src:"cb/26-1.jpg",w:952,h:1059,caption:"Athenian agora site plan",credit:""}],thumb:["thumbs/t2-u2.webp",6,1,8,5],notes:[["Form","The open **civic center** of Athens shown as a site plan rather than a single building. It held **stoas** (long covered colonnades) such as the Stoa of Attalos, the **bouleuterion** (council house), the round **tholos**, temples (the Hephaisteion), law courts and fountains, all arranged around an open square crossed by the **Panathenaic Way**."],["Function","The heart of **Athenian democracy** and daily life: markets, politics, law courts and philosophy (Socrates taught here). Citizens met, traded and debated."],["Context","Used from the Archaic period to Roman times. It shows Greek **civic architecture** and urban planning serving a public that participated in government; compare the Acropolis above it, which was sacred."],["Exam hooks","civic space · democracy · stoa · bouleuterion · Panathenaic Way · plan (not a building)"],["Compare with","Acropolis (#35): sacred versus civic Athens. Forum of Trajan (#45): the Roman civic center."]]},{n:27,title:"Anavysos Kouros",maker:"Archaic Greek",date:"c. 530 B.C.E.",medium:"Marble with remnants of paint",context:"A grave marker for a young man named Kroisos who died in battle; the base asks passers-by to mourn him. The pose is borrowed from Egypt — frontal, left foot forward, arms at the sides — but the figure is freestanding, nude, more anatomically observed than earlier kouroi, and wears the fixed Archaic smile. Originally brightly painted.",unit:2,unitName:"Ancient Mediterranean",year:-530,images:[{src:"cb/27-1.jpg",w:512,h:1061,caption:"Anavysos Kouros",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",7,1,8,5],notes:[["Form","A life-size marble **kouros** (nude standing youth), **frontal**, with the left foot forward and arms at his sides. He has an **Archaic smile**, stylized beaded hair and a muscular but patterned anatomy. Unlike Egyptian statues, he is **freed from the stone block** and nude. Traces of paint survive."],["Function","A **grave marker** for Kroisos, a young warrior who died in battle. The base inscription asks passersby to stop and mourn him, 'whom raging Ares destroyed'."],["Context","The pose derives from Egyptian sculpture (compare #18), but the Greeks moved toward naturalism. The kouros embodied **arete** (excellence) and the ideal male citizen. It is Archaic, around 530 BCE."],["Exam hooks","kouros · Archaic smile · Egyptian influence · freed from block · nude ideal · grave marker · Kroisos"],["Compare with","King Menkaura (#18): the source of the pose. Doryphoros (#34): the Classical solution, contrapposto. Peplos Kore (#28): the clothed female counterpart."]]},{n:28,title:"Peplos Kore from the Acropolis",maker:"Archaic Greek",date:"c. 530 B.C.E.",medium:"Marble, painted details",context:"A draped female figure dedicated on the Acropolis, named for the woollen peplos once thought to be her garment. The attachment hole in her missing hand and her clothing suggest she may be a goddess, possibly Athena, rather than a mortal girl. Surviving paint on hair and eyes is a reminder that Greek marble was coloured, not white.",unit:2,unitName:"Ancient Mediterranean",year:-530,images:[{src:"cb/28-1.jpg",w:617,h:801,caption:"Peplos Kore",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",0,2,8,5],notes:[["Form","A marble **kore** (standing maiden), **frontal** and clothed, with an Archaic smile and long braided hair. One arm, now lost, was extended forward holding an offering, and a hole in her fist shows where an attribute fit. Significant traces of **paint** survive. Her dress may represent a goddess's garment rather than an ordinary peplos."],["Function","A **votive offering** on the Athenian Acropolis. She may represent a goddess (perhaps **Artemis** or Athena) or a maiden offering."],["Context","She was buried after the **Persians sacked the Acropolis in 480 BCE**, which preserved her paint. She shows that Greek sculpture was **colorful**, not plain white. Korai were always clothed, kouroi nude."],["Exam hooks","kore · clothed · Archaic smile · polychromy · votive · buried after Persian sack"],["Compare with","Anavysos Kouros (#27): the nude male counterpart. Grave stele of Hegeso (#36): Classical drapery."]]},{n:29,title:"Sarcophagus of the Spouses",maker:"Etruscan",date:"c. 520 B.C.E.",medium:"Terra cotta",context:"A married couple reclining together on a banquet couch atop a cinerary sarcophagus, modelled in four sections and fired. Upper bodies are animated and gesturing while the lower halves dissolve into the couch. The wife shares the couch as an equal — evidence that Etruscan women held a public standing Greek women did not.",unit:2,unitName:"Ancient Mediterranean",year:-520,images:[{src:"cb/29-1.jpg",w:1e3,h:801,caption:"Sarcophagus of the Spouses",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",1,2,8,5],notes:[["Form","A large **terra cotta** sarcophagus showing a married couple reclining together on a banqueting couch. The upper bodies are animated and the legs flatten; both have **Archaic smiles** and almond eyes. It was made in pieces and painted."],["Function","A container for the **cremated remains** of the dead, from a tomb at **Cerveteri**."],["Content","The husband embraces his wife; their hands once held objects, possibly perfume or food. They recline **together** at a banquet."],["Context","**Etruscan** women had higher status than Greek women: they attended banquets with their husbands, which Greeks found scandalous. Terra cotta was a favored Etruscan sculptural medium. The image expresses a joyful, social afterlife."],["Exam hooks","Etruscan · terra cotta · couple at banquet · women's social status · cremation urn · Cerveteri"],["Compare with","Tomb of the Triclinium (#32): the Etruscan banquet afterlife. Temple of Minerva (#31): Etruscan terra cotta sculpture."]]},{n:30,title:"Audience Hall (apadana) of Darius and Xerxes",maker:"Persian; Persepolis, Iran",date:"c. 520–465 B.C.E.",medium:"Limestone",context:"A hypostyle hall of 72 slender columns with paired animal-protome capitals, raised on a terrace and reached by monumental stairs. The stair reliefs show delegations from 23 subject nations bringing tribute, each in its own dress — an empire pictured as orderly submission rather than conquest. Burned by Alexander in 330 B.C.E.",unit:2,unitName:"Ancient Mediterranean",year:-520,images:[{src:"cb/30-1.jpg",w:1003,h:641,caption:"Apadana",credit:"© Imagestate Media Partners Limited - Impact Photos/Alamy"},{src:"cb/30-2.jpg",w:961,h:642,caption:"Apadana stairway",credit:"© Gérard Degeorge/Corbis"}],thumb:["thumbs/t2-u2.webp",2,2,8,5],notes:[["Form","A huge hypostyle **audience hall** at **Persepolis** with 36 columns about 65 feet tall, topped by **double-bull (protome) capitals**. It stands on a raised platform reached by grand stairways lined with relief carvings."],["Function","A reception hall where the **Persian king** received delegations and tribute from across the empire."],["Content","The **Apadana stairway** reliefs show 23 delegations of **subject peoples** from Ethiopia to India bringing gifts, each identified by dress, alternating with Persian and Median guards. Elsewhere a lion attacks a bull."],["Context","Begun by **Darius I**, continued by **Xerxes**. It shows the vast, multicultural Achaemenid empire peacefully united under the king. **Alexander the Great burned Persepolis in 330 BCE**."],["Exam hooks","Achaemenid Persia · apadana · bull capitals · tribute procession · subject peoples · Darius and Xerxes · burned by Alexander"],["Compare with","Lamassu (#25): Near Eastern royal imagery. Forbidden City (#206): architecture of imperial audience. Benin plaque (#169): court hierarchy."]]},{n:31,title:"Temple of Minerva and sculpture of Apollo",maker:"Master sculptor Vulca; Veii, near Rome, Italy",date:"c. 510–500 B.C.E.",medium:"Original temple of wood, mud brick, or tufa; terra cotta sculpture",context:"An Etruscan temple on a high podium with a deep front porch, widely spaced Tuscan columns and a single frontal stair — axial and one-sided, unlike a Greek temple you can approach from anywhere. Life-size terra cotta figures stood on the ridgepole instead of in a pediment. Apollo strides forward smiling, his drapery cut into tight patterned folds.",unit:2,unitName:"Ancient Mediterranean",year:-510,images:[{src:"cb/31-1.jpg",w:729,h:1056,caption:"Apollo",credit:"© Scala/Ministero per i Beni e le Attività culturali/Art Resource, NY"},{src:"cb/31-2.jpg",w:733,h:880,caption:"Temple of Minerva plan",credit:"Temple of Minerva elevation"},{src:"cb/31-3.jpg",w:1200,h:846,caption:"Temple of Minerva plan",credit:"Temple of Minerva elevation"}],thumb:["thumbs/t2-u2.webp",3,2,8,5],notes:[["Form","An **Etruscan temple**: a high podium, a deep porch with widely spaced columns, steps only at the **front** and a **triple cella**. Its walls were mud brick or tufa on a wooden frame, so only foundations survive. Life-size **terra cotta** statues stood on the **roof ridge**. The **Apollo** strides forward energetically with an Archaic smile."],["Function","A temple dedicated to Minerva and perhaps other gods. The roof statues told the myth of Apollo and Herakles struggling over a deer."],["Context","The sculptor **Vulca of Veii** is one of the few named Etruscan artists. Roman temples adopted the **Etruscan plan**: podium, frontal emphasis and deep porch. Vitruvius described this temple type."],["Exam hooks","Etruscan temple · podium · frontal stairs · triple cella · roof sculpture · terra cotta Apollo · Vulca"],["Compare with","Greek temple (Parthenon, #35): steps all around and stone construction. Pantheon (#46): the Roman temple porch."]]},{n:32,title:"Tomb of the Triclinium",maker:"Etruscan; Tarquinia, Italy",date:"c. 480–470 B.C.E.",medium:"Tufa and fresco",context:"A rock-cut chamber tomb frescoed with a banquet — reclining diners, musicians and dancers moving between stylised trees in flat bright colour on a light ground. Men are painted dark, women pale. The mood is celebratory rather than mournful: the funeral banquet stands in for a pleasant afterlife.",unit:2,unitName:"Ancient Mediterranean",year:-480,images:[{src:"cb/32-1.jpg",w:1200,h:849,caption:"Tomb of the Triclinium",credit:"© Nimatallah/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",4,2,8,5],notes:[["Form","An underground rock-cut **chamber tomb** at Tarquinia with **fresco** walls. Lively figures in profile dance and play music among trees and birds. On the back wall (badly damaged) couples recline on couches (triclinia) at a banquet."],["Function","A family **tomb**; the paintings evoked a joyful funerary banquet and celebration for the dead."],["Context","Etruscan tombs re-created houses for the afterlife. The scenes may record funeral games or represent an ideal afterlife of pleasure. As with #29, men and women appear together."],["Exam hooks","Etruscan · fresco · banquet (triclinium) · music and dance · tomb as house · Tarquinia"],["Compare with","Sarcophagus of the Spouses (#29): the same themes. House of the Vettii (#39): Roman fresco. Catacomb of Priscilla (#48): painted burial spaces."]]},{n:33,title:"Niobides Krater",maker:"Niobid Painter (anonymous vase painter of Classical Greece)",date:"c. 460–450 B.C.E.",medium:"Clay, red-figure technique (white highlights)",context:"A calyx krater for mixing wine with water. One side shows Apollo and Artemis killing the children of Niobe, punishment for her boasting; the other shows Herakles among heroes. Figures sit at different heights on an implied landscape rather than a single ground line — an early try at spatial depth, probably borrowed from lost wall painting.",unit:2,unitName:"Ancient Mediterranean",year:-460,images:[{src:"cb/33-1.jpg",w:1e3,h:1035,caption:"Niobides Krater",credit:"© RMN-Grand Palais/Art Resource, NY"},{src:"cb/33-2.jpg",w:1e3,h:1035,caption:"Niobides Krater",credit:"© RMN-Grand Palais/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",5,2,8,5],notes:[["Form","A Greek **calyx krater**, a vessel for mixing wine and water, painted in the **red-figure technique**: the figures are left the color of the clay and the background is painted black, allowing finer interior lines. The Niobid Painter placed figures at different levels on **multiple ground lines**, an early attempt at **spatial depth** probably borrowed from lost wall paintings. White highlights are added."],["Function","Used at a **symposium** (male drinking party)."],["Content","One side shows **Apollo and Artemis killing the children of Niobe**, who had boasted she had more children than their mother Leto. The punishment is for **hubris**. The other side shows Herakles with heroes, perhaps before Marathon."],["Context","Red-figure, invented about 530 BCE, replaced black-figure. Figures shown in three-quarter view and foreshortening reveal Classical interest in naturalism."],["Exam hooks","red-figure · krater · symposium · Niobe's hubris · Apollo and Artemis · multiple ground lines"],["Compare with","Alexander Mosaic (#40): Greek painting traditions. Doryphoros (#34): Classical naturalism."]]},{n:34,title:"Doryphoros (Spear Bearer)",maker:"Polykleitos",date:"Original 450–440 B.C.E.",medium:"Roman copy (marble) of Greek original (bronze)",context:"Polykleitos's demonstration piece for his treatise the Canon, which expressed ideal proportion as ratios. Contrapposto: weight on the right leg, engaged and relaxed limbs cross-balanced, hips and shoulders tilting against each other, so the body reads as momentarily still rather than frozen. Known only through Roman marble copies, which needed added struts.",unit:2,unitName:"Ancient Mediterranean",year:-450,images:[{src:"cb/34-1.jpg",w:651,h:1040,caption:"Doryphoros",credit:"© Museo Archeologico Nazionale, Naples, Italy/The Bridgeman Art Library"}],thumb:["thumbs/t2-u2.webp",6,2,8,5],notes:[["Form","A nude male athlete or warrior in **contrapposto**: weight on the right leg, left leg relaxed, hips and shoulders tilted in opposite directions, creating **chiastic** balance. The body is **idealized**, its proportions governed by mathematical ratios."],["Function","Demonstrated Polykleitos's **Canon**, a treatise on ideal proportion (now lost). The statue embodied it. He may represent **Achilles**."],["Context","Classical Greek. The bronze original is lost; we know it from **Roman marble copies** (the supports, such as the tree trunk, are Roman additions needed for marble). Romans admired and copied Greek works, and **Augustus of Prima Porta** (#43) adapts this pose."],["Exam hooks","contrapposto · Canon of Polykleitos · ideal proportion · Classical · Roman copy of bronze · chiasmus"],["Compare with","Anavysos Kouros (#27): the Archaic stiffness that came before. Augustus of Prima Porta (#43): borrowed pose. Donatello's David (#69): Renaissance contrapposto."]]},{n:35,title:"Acropolis",maker:"Iktinos and Kallikrates; Athens, Greece",date:"c. 447–410 B.C.E.",medium:"Marble",context:"Rebuilt after the Persians sacked the sacred rock, funded partly from the Delian League treasury. The Parthenon is a Doric temple carrying a continuous Ionic frieze, built with optical refinements — swelling columns that lean inward, a floor that curves — so it reads as perfectly straight. It housed Phidias's gold-and-ivory Athena; the sculptural programme argues for Athenian supremacy.",unit:2,unitName:"Ancient Mediterranean",year:-447,images:[{src:"cb/35-1.jpg",w:1200,h:446,caption:"Helios, horses, and Dionysus (Heracles?)",credit:"© The Trustees of the British Museum"},{src:"cb/35-2.jpg",w:652,h:499,caption:"Temple of Athena Nike",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"},{src:"cb/35-3.jpg",w:605,h:881,caption:"Victory adjusting her sandal",credit:"© Nimatallah/Art Resource, NY"},{src:"cb/35-4.jpg",w:1200,h:751,caption:"Plaque of the Ergastines",credit:"© RMN-Grand Palais/Art Resource, NY"},{src:"cb/35-5.jpg",w:474,h:1070,caption:"Acropolis plan",credit:"Parthenon © SGM/The Bridgeman Art Library"},{src:"cb/35-6.jpg",w:884,h:1097,caption:"Acropolis plan",credit:"Parthenon © SGM/The Bridgeman Art Library"}],thumb:["thumbs/t2-u2.webp",7,2,8,5],notes:[["Form","The sacred hilltop of Athens, rebuilt after the Persian sack in marble under **Pericles**. Its buildings: the **Parthenon** (Doric, with Ionic elements, by **Iktinos and Kallikrates**, sculpture overseen by **Phidias**), the **Propylaia** gateway, the **Erechtheion** with its caryatid porch, and the small Ionic **Temple of Athena Nike**. The Parthenon uses **optical refinements**: columns swell (entasis), the floor curves up and columns lean slightly inward."],["Function","A religious center dedicated to **Athena**, patron of Athens, with a colossal gold-and-ivory Athena Parthenos statue (lost). It also celebrated victory over the Persians."],["Content","Sculpture includes the **Helios, horses and Dionysus** (Heracles?) pediment figures, the **Plaque of the Ergastines** (girls who wove Athena's peplos) from the **Panathenaic frieze**, and **Victory Adjusting her Sandal** from the Nike temple parapet, with **wet drapery**."],["Context","It was funded partly with money from the **Delian League** treasury. Many sculptures (the **Elgin Marbles**) were removed to the British Museum in the early 1800s, and Greece requests their return."],["Exam hooks","Pericles · Phidias · Parthenon optical refinements · Panathenaic frieze · Nike wet drapery · Delian League funds · Elgin Marbles"],["Compare with","Athenian agora (#26): civic versus sacred. Pantheon (#46): temple of all the gods. Golden Stool (#170) and Benin (#169): restitution debates."]]},{n:36,title:"Grave stele of Hegeso",maker:"Attributed to Kallimachos",date:"c. 410 B.C.E.",medium:"Marble and paint",context:"A funerary relief set inside a shallow pediment: Hegeso, seated, lifts jewellery from a box held by a standing servant girl. The drapery is restrained Classical work, clinging in wet-drapery folds. The jewellery itself was painted, not carved. The stele commemorates her inside the domestic world that defined an Athenian woman's respectability.",unit:2,unitName:"Ancient Mediterranean",year:-410,images:[{src:"cb/36-1.jpg",w:714,h:1034,caption:"Grave stele of Hegeso",credit:"© Nimatallah/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",0,3,8,5],notes:[["Form","A marble **grave stele** carved in relief within an architectural frame (a small temple front). The seated **Hegeso** examines a piece of jewelry (once painted) taken from a box held by a standing servant girl. Graceful, clinging drapery with a quiet, contemplative mood."],["Function","A **grave marker** for Hegeso, a wealthy Athenian woman."],["Context","Late Classical. It shows women's ideal domestic roles: jewelry as dowry, and wealth shown through servants. The dignified mourning and restrained emotion are typical of Classical funerary art. It is attributed to **Kallimachos**."],["Exam hooks","grave stele · seated woman and servant · jewelry/dowr
