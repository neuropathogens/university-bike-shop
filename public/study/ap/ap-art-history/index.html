lo (masks in performance)."]]},{n:165,title:"Painted elk hide",maker:"Attributed to Cotsiogo (Cadzi Cody), Eastern Shoshone; Wind River Reservation, Wyoming",date:"c. 1890–1900 C.E.",medium:"Painted elk hide",context:"A whole hide painted with a Wolf Dance in the centre and a buffalo hunt around it. By the 1890s the buffalo were nearly gone and the Sun Dance was banned, so the scene records a way of life that had already been taken away — and substitutes a permitted dance for a forbidden one. Made for sale to tourists, which shaped what it shows.",unit:5,unitName:"Indigenous Americas",year:1890,images:[{src:"cb/165-1.jpg",w:1148,h:1035,caption:"Painted elk hide",credit:"Courtesy of School for Advanced Research, Catalog Number SAR.1978-1-87/Photograph by Addison Doty"}],thumb:["thumbs/t2-u5.webp",0,2,6,3],notes:[["Form","A large elk hide painted with flat figures of people and animals arranged across the surface. The **center** shows the **Sun Dance** (dancers around a center pole topped by a **buffalo head**); around it, a **buffalo hunt** with mounted riders. Some outlines may have been made with stencils; commercial pigments."],["Function","Made **for sale to tourists/collectors** — part of the growing market for Native art in the reservation period — and also a way to **preserve and assert cultural memory**."],["Content","The **Sun Dance** — a key religious ceremony — was being **suppressed by the U.S. government** at the time; the **buffalo** had been hunted nearly to extinction by the 1880s. So the hide shows a way of life that was **under attack or gone** — nostalgia, memory, and quiet resistance."],["Context","Continues the **Plains tradition of men painting narrative scenes** (hunts, battles, deeds) on hides; adapted to a new economic reality of reservation life and the tourist market."],["Exam hooks","Sun Dance (banned) · buffalo hunt (buffalo gone) · made for sale · reservation era · named artist."],["One-sentence thesis","Cotsiogo's painted hide records the forbidden Sun Dance and the vanished buffalo hunt for an outside market, preserving Shoshone memory under U.S. pressure."],["Compare with","Bandolier bag; Black-on-black vessel (Native art for outsiders); Transformation mask (banned ceremonies)."]]},{n:166,title:"Black-on-black ceramic vessel",maker:"Maria Martínez and Julian Martínez, Tewa, Puebloan; San Ildefonso Pueblo, New Mexico",date:"c. mid-20th century C.E.",medium:"Blackware ceramic",context:"Coil-built and stone-polished by Maria, painted by Julian, then fired in a smothered dung fire that starves the pot of oxygen and turns the clay black. The design reads only as matte against gloss. Revived from ancient sherds found on a nearby dig; the Martínezes signed their pots and turned a traditional practice into an art market that supported the pueblo.",unit:5,unitName:"Indigenous Americas",year:1950,images:[{src:"cb/166-1.jpg",w:1024,h:1034,caption:"Black-on-black ceramic vessel",credit:"© Barbara Gonzales, Great Granddaughter of Maria and Julian Martinez"}],thumb:["thumbs/t2-u5.webp",1,2,6,3],notes:[["Form","A rounded pot, **hand-built by coiling** (no potter's wheel), **slipped and burnished** with smooth stones to a **mirror-like shine**, then painted with **matte designs** (e.g., **avanyu** — the water serpent — and feather/geometric patterns). Firing in a fire **smothered with manure** cut off oxygen (**reduction firing**), turning the clay **black**. The result: **glossy black vs. matte black** — design shown only by texture and sheen."],["Makers","**Maria formed and polished** the pots; **Julian painted** the designs (until his death in 1943; later family members continued). Maria **signed** her pots — unusual for Pueblo pottery — which made them collectible as **fine art**."],["Function","Originally utilitarian forms, now made for the **art market and collectors**."],["Context","In **1908–09**, archaeologist **Edgar Lee Hewett** asked Maria to recreate pottery from **ancient sherds excavated nearby**; the Martínezes developed the black-on-black technique around 1918–1920. Their success, helped by **tourism and the railroad** in the Southwest, **revived the economy of San Ildefonso** and pottery traditions across the Pueblos. Maria taught many."],["Exam hooks","coil-built · burnished + matte = two blacks · reduction firing · Maria + Julian collaboration · signed = art market · revival from ancient sherds."],["One-sentence thesis","Maria and Julian Martínez revived and reinvented ancestral Pueblo ceramics, using contrasts of polished and matte black to create signed works that entered the modern art market and revitalized their community."],["Compare with","Mesa Verde (their Ancestral Puebloan roots); Olowe of Ise (named Indigenous artist); Painted elk hide (art for outside buyers)."]]},{n:167,title:"Conical tower and circular wall of Great Zimbabwe",maker:"Shona peoples; southeastern Zimbabwe",date:"c. 1000–1400 C.E.",medium:"Coursed granite blocks",context:"The Great Enclosure's wall runs some 800 feet, up to 32 feet high and 17 feet thick at the base, laid in even courses of shaped granite without mortar. Inside stands a solid conical tower, most often read as a giant grain bin — a symbol of the ruler's ability to feed his people. The city grew rich on gold and cattle and traded as far as China.",unit:6,unitName:"Africa",year:1e3,images:[{src:"cb/167-1.jpg",w:993,h:821,caption:"Conical tower",credit:"© Werner Forman Archive/The Bridgeman Art Library"},{src:"cb/167-2.jpg",w:993,h:827,caption:"Circular wall",credit:"© Werner Forman Archive/The Bridgeman Art Library"}],thumb:["thumbs/t2-u6.webp",0,0,6,3],notes:[["Form",'"Zimbabwe" means roughly **"houses of stone"** in Shona. The site has three areas: the **Hill Complex** (oldest; royal/ritual), the **Valley Complex**, and the **Great Enclosure** — the largest ancient structure in sub-Saharan Africa: an **elliptical wall about 250 m around and up to about 11 m high**, built of **coursed (layered) granite blocks with no mortar (dry-stone)**, topped by a **chevron (zigzag) pattern**. Walls curve and taper. Inside stands the solid **Conical Tower (about 9 m)**.'],["The tower's meaning","likely a **symbolic granary** — the ruler's granary stood for his **generosity and control of tribute/food** — and possibly a **fertility** symbol. It has **no interior** (solid), so it was symbolic."],["Function","Capital of a powerful state; the Great Enclosure was probably a **royal residence** or ritual/initiation space. Its massive walls communicated **power and prestige** rather than defense."],["Context","Wealth came from **long-distance trade of gold and ivory** through the **Swahili coast** to the Indian Ocean world — **Chinese porcelain and Persian glass** have been found there. **Soapstone Zimbabwe birds** (from the Hill Complex) are now national symbols (on the flag). Colonial Europeans (e.g., under Cecil Rhodes) **refused to believe Africans built it** and attributed it to outsiders — a racist myth disproved by archaeology. The country took the name **Zimbabwe at independence in 1980**."],["Exam hooks","dry-stone coursed granite · Great Enclosure · Conical Tower = granary/chief's generosity · gold/ivory trade to Indian Ocean · colonial denial of African authorship · national symbol."],["One-sentence thesis","Great Zimbabwe's mortarless granite walls and symbolic tower expressed the power and wealth of a Shona trading state, and its history became a battleground over African achievement under colonialism."],["Compare with","Nan Madol and Stonehenge (megalithic power architecture); Cusco (mortarless stonework)."]]},{n:168,title:"Great Mosque of Djenné",maker:"Mali",date:"Founded c. 1200 C.E.; rebuilt 1906–1907",medium:"Adobe",context:"The largest mud-brick building in the world, built of sun-dried ferey bricks and banco plaster over a wooden frame. Projecting palm beams (toron) are both decoration and permanent scaffolding: the whole town replasters the mosque each spring at a festival before the rains. Ostrich eggs on the pinnacles stand for fertility and purity.",unit:6,unitName:"Africa",year:1200,images:[{src:"cb/168-1.jpg",w:992,h:661,caption:"Great Mosque of Djenné",credit:"© George Steinmetz/Corbis"},{src:"cb/168-2.jpg",w:999,h:658,caption:"Monday market at the Great Mosque of Djenné",credit:"© Remi Benali/Corbis"}],thumb:["thumbs/t2-u6.webp",1,0,6,3],notes:[["Form","The **largest mud-brick (adobe) building in the world**, in the **Sudano-Sahelian style**. Built on a **raised platform** (protecting it from the **annual floods** of the Bani River). The **qibla wall** (facing Mecca, to the east) has **three large tower-minarets** and faces the market. **Toron** — palm-wood beams projecting from the walls — act as **permanent scaffolding** and also help with cracking. **Ostrich eggs** on top of the pinnacles (symbols of fertility and purity). Inside, a **prayer hall with a forest of about 90 thick pillars** supporting the roof; small roof vents."],["Function","**Congregational (Friday) mosque**, religious center of the town, and a center of Islamic learning."],["Maintenance as ritual","Every year the whole community participates in the **Crépissage** festival — **re-plastering** the mosque with fresh mud before the rainy season. Masons' guild leads; young men haul mud, women carry water, elders advise. The building exists only through **ongoing communal labor** — living architecture."],["Context","Founded when the ruler **Koi Konboro converted to Islam** (13th c.) and turned his palace into a mosque. That building was abandoned (the 19th-c. ruler Seku Amadu considered it too extravagant); the current mosque was **rebuilt 1906–07 under French colonial rule** by the masons' guild (led by **Ismaila Traoré**) — debated whether French influence shaped it. Djenné was a major trade city on **trans-Saharan routes**. UNESCO World Heritage site."],["Exam hooks","adobe · toron = scaffolding · annual re-plastering festival · three minarets on qibla wall · raised platform (flooding) · rebuilt 1906–07 under French rule · trans-Saharan trade + Islam."],["One-sentence thesis","The Great Mosque of Djenné is architecture sustained by community: its adobe walls, projecting toron, and annual re-plastering make Islamic worship and local identity a collective, renewing act."],["Compare with","Great Zimbabwe (monumental African architecture tied to trade); Malagan (art dependent on communal ritual); Mesa Verde (earth-and-stone architecture)."]]},{n:169,title:"Wall plaque, from Oba's palace",maker:"Edo peoples; Benin (Nigeria)",date:"16th century C.E.",medium:"Cast brass",context:"One of hundreds of lost-wax brass plaques nailed to the pillars of the Oba's palace, recording court ritual and hierarchy. The Oba or a chief appears frontally at the centre, larger than his attendants, with coral-bead regalia; the background is stippled with river-leaf pattern. Brass came from European trade. British forces looted the palace in 1897 and dispersed the plaques.",unit:6,unitName:"Africa",year:1500,images:[{src:"cb/169-1.jpg",w:893,h:1085,caption:"Wall plaque, from Oba’s palace",credit:"Image © The Metropolitan Museum of Art/Image source © Art Resource, NY"},{src:"cb/169-2.jpg",w:1105,h:1098,caption:"Contextual photograph: Oba of Benin",credit:"© Werner Forman/Art Resource, NY"}],thumb:["thumbs/t2-u6.webp",2,0,6,3],notes:[["Form","A rectangular **cast-brass relief plaque** made by the **lost-wax** process. **Hieratic scale**: the **Oba (king)** or a high-ranking figure is largest and at center, **frontal and symmetrical**, flanked by smaller attendants/warriors. Figures wear **coral-bead regalia** (collars, caps). Background covered with **quatrefoil leaf (river-leaf) motifs**, associated with **Olokun**, god of the sea and wealth. Small **Portuguese heads** often appear in the corners. Figures have oversized heads (the head = seat of wisdom and destiny)."],["Function","Hundreds of plaques were **nailed to the wooden pillars of the Oba's palace** — a visual **record of court history, ceremonies, and hierarchy**. Brass-casting was controlled by a **royal guild (Igun Eronmwon)** — **only the Oba** could commission brass."],["Content","The Oba's divine kingship, military power, and court order."],["Context",`The brass came largely from **Portuguese trade** (manillas — brass bracelets used as currency), in exchange for ivory, pepper, and enslaved people. In **1897** a **British punitive expedition looted Benin City**, taking thousands of objects ("**Benin Bronzes**") now scattered in Western museums — central to today's **restitution** debates (some returned to Nigeria in recent years).`],["Exam hooks","lost-wax brass · hieratic scale · frontality/symmetry · Portuguese trade (brass + figures) · palace pillars = historical record · 1897 looting/restitution."],["One-sentence thesis","Benin's brass plaques used hieratic scale and royal material to record the Oba's divine authority and court, and their looting in 1897 makes them a focus of debates on restitution."],["Compare with","Veranda post (Yoruba royal art; king and wife); Yaxchilán lintels (royal history in relief); Feather headdress (repatriation)."]]},{n:170,title:"Sika dwa kofi (Golden Stool)",maker:"Ashanti peoples; south central Ghana",date:"c. 1700 C.E.",medium:"Gold over wood and cast-gold attachments",context:"Said to have descended from the sky into the lap of the first Asantehene, the stool holds the soul of the Asante nation. No one sits on it — not even the king, who is lowered beside it at installation — and it travels on its own chair under an umbrella. A British governor's demand to sit on it triggered the War of the Golden Stool in 1900.",unit:6,unitName:"Africa",year:1700,images:[{src:"cb/170-1.jpg",w:992,h:659,caption:"Sika dwa kofi",credit:"© Marc Deville/Gamma-Rapho via Getty Images"},{src:"cb/170-2.jpg",w:993,h:659,caption:"Contextual photograph: Sika dwa kofi",credit:"© Marc Deville/Gamma-Rapho via Getty Images"}],thumb:["thumbs/t2-u6.webp",3,0,6,3],notes:[["Form","A **stool** (curved seat on a central support and base) **covered in gold**, with **cast-gold bells and figures** attached — some are **effigies of defeated enemy rulers**."],["Function & meaning",'"Golden Stool born on a Friday." It is believed to contain the **soul (sunsum) of the entire Asante nation** — its unity, health, and survival. **No one sits on it**, not even the king; it **never touches the ground** (it rests on its own stool or on a blanket) and is **carried and displayed on its side** beside the **Asantehene (king)** at important ceremonies. It legitimizes each new king (who is "enstooled").'],["Origin story","Around 1700, the priest **Okomfo Anokye** called the stool down from the sky; it landed on the lap of **Osei Tutu**, the first Asantehene, **uniting the Asante confederacy**."],["Context","In **1900**, the British governor **Frederic Hodgson** demanded to **sit on the Golden Stool** — a grave insult. This sparked the **War of the Golden Stool**, led by the queen mother **Yaa Asantewaa**. The stool was **hidden** and never captured. Gold was plentiful in the region (the British called it the Gold Coast)."],["Exam hooks","soul of the nation · never sat on/never touches ground · Okomfo Anokye + Osei Tutu · gold · War of the Golden Stool (1900), Yaa Asantewaa."],["One-sentence thesis","The Golden Stool is not a seat but the embodied soul of the Asante nation, whose protection from British demands in 1900 shows how an object can hold a people's sovereignty."],["Compare with","ʻAhu ʻula (object carrying mana of rule); Maize cobs (gold as sacred); Fijian presentation (ceremony in colonial encounter)."]]},{n:171,title:"Ndop (portrait figure) of King Mishe miShyaang maMbul",maker:"Kuba peoples; Democratic Republic of the Congo",date:"c. 1760–1780 C.E.",medium:"Wood",context:"An idealised commemorative figure of a king, seated cross-legged on a platform with a ceremonial knife and a projecting royal headdress. It is not a likeness — rulers are shown ageless and serene — and is identified only by the ibol, a personal emblem carved in front (here a drum). Kept near the king in life and believed to hold his spirit at death.",unit:6,unitName:"Africa",year:1760,images:[{src:"cb/171-1.jpg",w:729,h:1030,caption:"Ndop",credit:"© Brooklyn Museum of Art, New York, USA/The Bridgeman Art Library"},{src:"cb/171-2.jpg",w:690,h:1033,caption:"Contextual photograph: Ndop",credit:"Kuba Nyim (ruler) Kot a Mbweeky III in state dress with royal drum in Mushenge, Democratic Republic of the Congo. Photograph by Eliot Elisofon,1971. EEPA EECL 2139/Eliot Elisofon Photographic Archives/ National Museum of African Art/Smithsonian Institution"}],thumb:["thumbs/t2-u6.webp",4,0,6,3],notes:[["Form","A **seated king, cross-legged** on a platform, **calm and symmetrical**, with a **large head** (wisdom), smooth idealized body, and royal regalia: a **visored royal cap (shody)**, **cowrie-shell belts**, armbands, and a **ceremonial knife** in his left hand. On the front of the base is his **ibol** — a **personal emblem** chosen at his coronation that identifies the specific king."],["Key idea","**Not a realistic likeness** — all ndop look similar; the individual is identified by the **ibol**, not facial features. The idealized body shows **ideal kingship**: composure, wisdom, and restraint."],["Function","The ndop was the king's **spiritual double**. During his life it was **kept near him**; when he traveled, it was placed with his **wives** (and was said to help with **childbirth**). After his death, it held his **spirit** and helped **transfer royal power to the next king**, and it commemorated him in the royal lineage. It was **rubbed with oil** (shiny surface)."],["Context","The **Kuba kingdom** (Bushoong ruling group) in central Africa; a tradition of commemorative royal figures (the first ndop are credited to a 17th-c. king, **Shyaam aMbul aNgoong**)."],["Exam hooks","ibol identifies the king · idealized, not naturalistic · seated cross-legged · spiritual double · power transfer."],["One-sentence thesis","The Ndop of Mishe miShyaang maMbul shows the king as an idealized, composed ruler identified by his ibol, serving as a spiritual double that carried royal power across generations."],["Compare with","Tamati Waka Nene (portrait as ancestral presence; very different realism); Anthropomorphic stele (identity by attributes); Mblo mask (idealized portrait)."]]},{n:172,title:"Power figure (Nkisi n'kondi)",maker:"Kongo peoples; Democratic Republic of the Congo",date:"c. late 19th century C.E.",medium:"Wood and metal",context:"A wooden figure activated by a ritual specialist (nganga), who packs medicines into a cavity in the belly or head and seals it with a mirror. Each nail or blade driven in records an oath sworn, a dispute settled, or a curse commissioned — the object is a running archive of community business. The aggressive stance and open mouth show it hunting wrongdoers.",unit:6,unitName:"Africa",year:1875,images:[{src:"cb/172-1.jpg",w:775,h:994,caption:"Nkisi n’kondi",credit:"© Detroit Institute of Arts, USA/Founders Society Purchase/Eleanor Clay Ford Fund for African Art/The Bridgeman Art Library"}],thumb:["thumbs/t2-u6.webp",5,0,6,3],notes:[["Form",'A standing wooden figure in an **aggressive stance** — often **hands on hips** ("pakalala," ready for action) or one arm raised with a weapon. Large eyes (sometimes **glass or mirror**), open mouth. The body is **bristling with hundreds of nails, blades, and metal pieces** driven into it. A **cavity in the belly (and/or head)** holds **bilongo** — **medicinal/magical substances** — often sealed with a **mirror** or resin.'],["Meaning",`*Nkisi* = a container for spiritual forces; *n'kondi* = "hunter" — it **hunts down wrongdoers**, witches, oath-breakers.`],["Function",'Activated by a **nganga (ritual specialist)**. People came to it to **seal oaths and agreements, settle disputes, heal, or punish** — each **nail or blade was driven in to "awaken" the spirit** and record the case. The figure grows over time: **each nail is a record of a transaction**. The mirror was used for **divination** (seeing into the spirit world) and to **reflect evil back**.'],["Context",'European missionaries and colonial officials saw these as "fetishes" and **confiscated or destroyed** many; in museums they are **deactivated** — their meaning comes from use, not display.'],["Exam hooks","nails = oaths/contracts · bilongo in belly cavity · mirror (divination) · nganga activates · hunter of wrongdoers · accumulates over time."],["One-sentence thesis","The Nkisi n'kondi is a legal and spiritual instrument whose nails record the oaths and conflicts of the community it served, activated by a ritual specialist and the medicine sealed inside it."],["Compare with","Staff god (sacred power sealed inside, seized by missionaries); Ikenga (personal shrine); Lukasa (object recording information)."]]},{n:173,title:"Female (Pwo) mask",maker:"Chokwe peoples; Democratic Republic of the Congo",date:"Late 19th to early 20th century C.E.",medium:"Wood, fiber, pigment, and metal",context:"An idealised female ancestor, danced by a man in a full body suit and breast forms at initiations and celebrations. Half-closed eyes, a serene expression, filed teeth, and cingelyengelye and other scarification marks incised on cheeks and forehead. The dance honours the female ancestors who bring fertility to the community.",unit:6,unitName:"Africa",year:1875,images:[{src:"cb/173-1.jpg",w:822,h:1027,caption:"Female (Pwo) mask",credit:"Photograph © by Franko Khoury/National Museum of African Art/ Smithsonian Institution"}],thumb:["thumbs/t2-u6.webp",0,1,6,3],notes:[["Form","A wooden face mask of an **idealized young woman**: **closed or narrow eyes**, delicate features, **filed teeth**, **scarification** patterns (including a **cruciform mark on the forehead**), **metal earrings**, and a **fiber coiffure** (hairstyle). Smooth, reddish surface."],["Meaning","Honors the **female ancestor** — the founding mother of the Chokwe lineage — and celebrates **women's role in fertility and continuity of the community**. The closed eyes suggest the **ancestor/spirit world** and modesty."],["Function","Worn by **male dancers** in performances, with a **costume including false breasts**, performing **graceful, feminine movements** — to **honor women and teach ideals of female behavior and beauty**. Performed at festivals and during celebrations connected with boys' initiation (mukanda). Carvers sometimes modeled masks on a real woman they admired."],["Exam hooks","idealized female ancestor · worn by men · scarification + filed teeth + coiffure = beauty ideals · closed eyes = ancestor · teaches female ideals."],["One-sentence thesis","The Pwo mask presents an idealized Chokwe woman — worn and danced by men — to honor female ancestors and model the community's ideals of beauty and conduct."],["Compare with","**Bundu mask** (#175 — ideal womanhood, but worn *by women*); Mblo (idealized portrait mask)."]]},{n:174,title:"Portrait mask (Mblo)",maker:"Baule peoples; Côte d'Ivoire",date:"Early 20th century C.E.",medium:"Wood and pigment",context:"A named portrait honouring a specific admired person, danced in their presence at the climax of the gbagba entertainment dances. The likeness is moral rather than physical: downcast eyes, a high smooth forehead, an elaborate coiffure and scarification stand for composure and dignity. The subject usually paid for the mask and kept it afterwards.",unit:6,unitName:"Africa",year:1910,images:[{src:"cb/174-1.jpg",w:655,h:831,caption:"Mblo",credit:"© Jerry L. Thompson"},{src:"cb/174-2.jpg",w:1200,h:748,caption:"Contextual photograph: Mblo",credit:"Used by Permission"}],thumb:["thumbs/t2-u6.webp",1,1,6,3],notes:[["Form","A small wooden face mask with an **elongated face, high forehead** (intelligence), **downcast half-closed eyes** (calm, respect, self-control), **small closed mouth**, **fine scarification marks**, and an **elaborate coiffure**. Smooth, polished surface; refined and idealized."],["Meaning",`A **portrait of a specific, respected living person** (often a woman noted for beauty or virtue) — but **idealized**, not realistic: it shows the person's **inner character and moral beauty**. The mask and the person are considered "doubles."`],["Function","Used in **Mblo** — a **secular entertainment masquerade** (dance, music, performance) honoring the individual. A skilled **male dancer** wears it; the **honored person might dance alongside** the masked performer."],["Exam hooks","portrait of a real individual · idealized features = virtue · entertainment (secular) masquerade · the person may dance with it."],["One-sentence thesis","The Baule Mblo mask honors a particular, admired individual through idealized features that express inner virtue, performed in a celebratory secular masquerade."],["Compare with","Pwo (idealized woman, ancestral); Ndop (idealized portrait); Tamati Waka Nene (realistic Western portrait)."]]},{n:175,title:"Bundu mask",maker:"Sande Society, Mende peoples; Sierra Leone and Liberia",date:"19th to 20th century C.E.",medium:"Wood, cloth, and fiber",context:"A glossy black helmet mask worn by senior women of Sande — one of very few African masking traditions performed by women — at the end of girls' initiation. Its features are an ideal: a high forehead for wisdom, small downcast eyes for modesty, an elaborate plaited coiffure, and neck rings read as health, prosperity, or ripples of water as the spirit surfaces.",unit:6,unitName:"Africa",year:1800,images:[{src:"cb/175-1.jpg",w:697,h:855,caption:"Sande Sowei mask",credit:"© Schomburg Center, NYPL/Art Resource, NY"},{src:"cb/175-2.jpg",w:1200,h:802,caption:"Contextual photograph: Sande Sowei mask",credit:"© William Siegmann Estate, Edward DeCarbo, Executor"}],thumb:["thumbs/t2-u6.webp",2,1,6,3],notes:[["Form","A **helmet mask** (worn over the whole head) carved in wood and **blackened and oiled** to a **glossy black** finish. **Rings/folds of flesh around the neck**, a **high broad forehead**, small **closed/downcast eyes**, small mouth and nose, and an **elaborate braided hairstyle**, sometimes topped with a small figure or bird. Worn with a **full raffia/cloth costume** covering the body completely."],["Meaning","Represents **Sowo (Sowei)**, the **water spirit** of the Sande society. Glossy black = the skin of a spirit **emerging from water**, and healthy oiled skin. **Neck rings** = **ripples of water** (the spirit rising) and **healthy, well-fed prosperity** — also female beauty. Hairstyle = beauty, order, social status. Closed eyes, small mouth = **modesty, composure, restraint**."],["Function","The **Sande Society is a women's society** that **initiates girls into adulthood** — teaching them skills, responsibilities, and values. The mask appears at **ceremonies**, especially when initiates **return to the community** as women."],["Key fact","One of the **only African masks worn by women**."],["Exam hooks","worn by women · Sande initiation · water spirit Sowo · glossy black + neck rings = water + beauty · helmet mask."],["One-sentence thesis","The Bundu mask, danced by women of the Sande Society, embodies the water spirit Sowo and the ideals of beauty and composure into which Mende girls are initiated."],["Compare with","**Pwo** (#173 — female ideal danced by men vs. by women); Malagan (performance); Aka mask."]]},{n:176,title:"Ikenga (shrine figure)",maker:"Igbo peoples; Nigeria",date:"c. 19th to 20th century C.E.",medium:"Wood",context:"A personal shrine figure owned by a man and kept in his compound, standing for the strength of his right hand — his ability to achieve. Ram's horns signal aggressive persistence; the figure usually holds a machete in one hand and a trophy head or tusk in the other. Fed and addressed at intervals, then destroyed or buried with its owner.",unit:6,unitName:"Africa",year:1800,images:[{src:"cb/176-1.jpg",w:822,h:1021,caption:"Ikenga",credit:"© Werner Forman/Art Resource, NY"}],thumb:["thumbs/t2-u6.webp",3,1,6,3],notes:[["Form","A carved wooden figure with **large ram's horns** on the head; often **seated**, holding a **knife in the right hand** and a **trophy head or tusk** in the left. Some are simplified (just horns on a base); others elaborate with scarification and headdresses."],["Meaning",`Ikenga is the **"strength of the right arm"** — the **personal achievement, will, and success** of a man. **Ram's horns** = **aggression, determination, perseverance** (a ram butts forward, never backing down). Knife and trophy = accomplishment through action.`],["Function","A **personal shrine** owned by an individual man (usually after he establishes himself). He **consulted it and made offerings** (e.g., kola nuts, blood) before undertakings, and **thanked it after successes**. At the owner's **death** it was **split or buried/destroyed** — it was tied to that one person."],["Exam hooks","ram's horns = determination · right hand = achievement · personal shrine · offerings · destroyed at death."],["One-sentence thesis","The Igbo Ikenga embodies a man's personal drive and achievement through ram's horns and the power of the right hand, serving as a shrine he consults and feeds throughout his life."],["Compare with","Nkisi n'kondi (personal vs. community shrine); Staff god (sacred figure)."]]},{n:177,title:"Lukasa (memory board)",maker:"Mbudye Society, Luba peoples; Democratic Republic of the Congo",date:"c. 19th to 20th century C.E.",medium:"Wood, beads, and metal",context:"A hand-held board studded with beads, shells and pegs that a trained Mbudye official reads with his fingertips while reciting Luba history, migrations, kinglists and the layout of sacred spaces. There is no fixed text: colour, size and arrangement prompt a performance, and different readers draw different narratives from the same board.",unit:6,unitName:"Africa",year:1800,images:[{src:"cb/177-1.jpg",w:776,h:1030,caption:"Lukasa",credit:"Photo © Heini Schneebeli/The Bridgeman Art Library"},{src:"cb/177-2.jpg",w:698,h:1023,caption:"Contextual photograph: Lukasa",credit:"Courtesy of Mary Nooter Roberts"}],thumb:["thumbs/t2-u6.webp",4,1,6,3],notes:[["Form","A **small, hand-held wooden board**, roughly **hourglass-shaped** (read as a **tortoise** or as the **royal compound**, and also associated with the female body), covered with **beads and shells of different sizes and colors** pinned into the wood and with **incised geometric patterns** (especially on the back)."],["Function",'A **memory device**. Members of the **Mbudye society** — "**men of memory**" — **touched and "read"** the beads while **reciting Luba history**: **king lists, genealogies, migrations, sacred sites, and the origin myth** of Luba kingship (e.g., the founding heroes Mbidi Kiluwe and Kalala Ilunga). Beads and patterns stand for **people, places, and events**, and their arrangement for relationships.'],["Key idea","Its reading **changes with each reader and occasion** — it is **not a fixed text**; memory is performed and politically shaped. **Knowledge = power** (the Mbudye validated and advised the king)."],["Exam hooks",'memory board read by touch · Mbudye "men of memory" · beads = people/places/events · Luba history and kingship · not a fixed text.'],["One-sentence thesis","The Luba lukasa encodes royal history in beads and patterns that Mbudye specialists read by touch, making memory a living, political performance."],["Compare with","**Navigation chart** (#221 — classic pair: specialized, memorized knowledge encoded in abstract objects); All-T'oqapu tunic (encoded symbols)."]]},{n:178,title:"Aka elephant mask",maker:"Bamileke; Cameroon, western grassfields region",date:"c. 19th to 20th century C.E.",medium:"Wood, woven raffia, cloth, and beads",context:"A beaded cloth hood with two long panels hanging front and back for the trunk and circular flaps for ears, worn with a leopard-skin cloak and a feather headdress. Elephant and leopard both stand for the king's power. Only the Kuosi society — royals and wealthy title-holders — may wear them; imported glass beads made the display expensive by design.",unit:6,unitName:"Africa",year:1800,images:[{src:"cb/178-1.jpg",w:494,h:1030,caption:"Aka elephant mask",credit:"Image copyright © The Metropolitan Museum of Art/Image Source © Art Resource, NY"},{src:"cb/178-2.jpg",w:1024,h:1033,caption:"Contextual photograph: Aka elephant mask",credit:"© George Holton/Photo Researchers/Getty Images"}],thumb:["thumbs/t2-u6.webp",5,1,6,3],notes:[["Form","A **cloth hood mask** covered with **colorful glass beads** (red, blue, white, black), with **large round ears** and a **long panel hanging down the front** like an **elephant's trunk**, often a humanlike face. Beaded **triangles** (like **leopard spots**) are common. Worn with a feathered headdress, a colorful cloth costume, and sometimes a leopard pelt."],["Meaning","The **elephant (and leopard)** symbolize the **king's power** — Bamileke rulers were believed able to **transform into these animals**. **Beads** (imported through trade) = **wealth and royal prerogative**."],["Function","Worn by members of the **Kuosi society** — an elite **warrior/regulatory society of wealthy nobles** linked to the king — in performances at **royal funerals and festivals** (e.g., the king's celebrations), displaying the power of the kingdom."],["Exam hooks","beads = wealth · elephant + leopard = king's power · Kuosi society · trunk panels and ears · funerals/festivals."],["One-sentence thesis","The Aka elephant mask displays royal power through the elephant and leopard, and wealth through imported glass beads, in performances by the elite Kuosi society."],["Compare with","Bandolier bag (imported glass beads made into status objects); Pwo, Bundu (masquerade); ʻAhu ʻula (costly materials = rank)."]]},{n:179,title:"Reliquary figure (byeri)",maker:"Fang peoples; southern Cameroon",date:"c. 19th to 20th century C.E.",medium:"Wood",context:"A guardian figure lashed to a bark box holding ancestors' skulls and bones, which the family carried when it moved. Enlarged head, long torso and short flexed limbs give an infant's proportions on an adult body — a balance of opposites. Rubbed with palm oil to a dark sheen. Its severe geometry strongly influenced Picasso and other European modernists.",unit:6,unitName:"Africa",year:1800,images:[{src:"cb/179-1.jpg",w:358,h:1106,caption:"Reliquary figure (byeri)",credit:"© Brooklyn Museum/Corbis"}],thumb:["thumbs/t2-u6.webp",0,2,6,3],notes:[["Form","A seated or standing figure with **infant-like proportions** — **large head, bulging forehead, short limbs** — combined with an adult, muscular body and a calm face. **Symmetrical**, compact, contained. Surface kept **dark and glossy** by rubbing with **palm oil** (seen as a sign of life/vitality)."],["Meaning","**Balance of opposites** — the Fang ideal of **bipolarity**: youth/age, birth/death, energy/calm. The childlike proportions link **new life and ancestors** (ancestors reborn in the young)."],["Function","Placed on top of **bark boxes containing the bones (skulls) of important ancestors**. The figure **guarded the relics** from women and the uninitiated, and **represented the ancestor**. Families consulted the ancestors through the byeri; taken with them when they moved."],["Context",'Fang reliquary figures were collected by Europeans and **admired by early 20th-century modernists (Picasso, Matisse, Derain)**, influencing **Cubism and "primitivism"** — a history of appreciation that removed the objects from their meaning.'],["Exam hooks","guards ancestral bones in bark box · infant proportions + adult body = balance of opposites · palm-oil sheen · influence on Modernism."],["One-sentence thesis","The Fang byeri guards ancestral relics with a body that balances youth and age, expressing continuity between the living and the dead — a form later reinterpreted by European modernists."],["Compare with","Moai (ancestor guardians); Malagan (art for the dead); Nukuoro deity (abstraction admired by modernists)."]]},{n:180,title:"Veranda post of enthroned king and senior wife (Opo Ogoga)",maker:"Olowe of Ise (Yoruba peoples); Nigeria",date:"c. 1910–1914 C.E.",medium:"Wood and pigment",context:"A palace veranda post carved from a single log for the Ogoga of Ikere. The king sits small beneath a towering crown, while his senior wife stands behind, much larger, hands on his throne — she crowned him and her support literally holds him up. Olowe is one of the few Yoruba carvers known by name, recognised for deep undercutting, open space and elongated figures.",unit:6,unitName:"Africa",year:1910,images:[{src:"cb/180-1.jpg",w:806,h:957,caption:"Veranda post of enthroned king and senior wife (Opo Ogoga)",credit:"Used by Permission of the Art Institute of Chicago"}],thumb:["thumbs/t2-u6.webp",1,2,6,3],notes:[["Form","A tall carved wooden **veranda post** (one of several supporting the roof of a courtyard in the palace of the **Ogoga (king) of Ikere**). The **king is seated** on a throne, wearing a tall **conical beaded crown** topped by a **bird**. **Behind him stands his senior wife**, **much taller** than the king, her **breasts and body framing and supporting** him — she literally holds up the composition (and the roof). Smaller figures (attendants, a female figure, sometimes a kneeling figure) surround the base. The king's **tiny feet and a small figure beneath** stress hierarchy. Painted with bright pigment."],["Olowe's innovations","Figures are **carved almost free of the post** with **open space between them**, **elongated proportions**, **dynamic angles**, and **dramatic light and shadow** — sculpture that reads in the round."],["Meaning",`**Kingship depends on women's power**. The **senior wife is the one who crowns the king** in Ikere; her height and position honor her role. The **bird on the crown** refers to the **powers of women** (often called "**our mothers**" — spiritual power connected with birds). Yoruba ideals of **ase** (life force / authority).`],["Context","**Olowe of Ise (c. 1873–1938)** was a famous **named Yoruba master carver** who worked for many royal courts; one of his palace doors from Ikere was exhibited in London (1924). A rare African artist known **by name** in Western art history — challenges the myth of anonymous African art."],["Exam hooks","named artist · senior wife taller = women's power supports kingship · bird on crown · figures carved free of post · architectural sculpture in palace."],["One-sentence thesis","Olowe of Ise's veranda post makes the senior wife literally the support of the enthroned king, using daring, open carving to show that Yoruba royal power rests on women's power."],["Compare with","Benin plaque (royal art, hierarchy, palace architecture); Yaxchilán Lintel 25 (royal women in ritual and rule); Black-on-black vessel (named Indigenous artist)."]]},{n:181,title:"Petra, Jordan: Treasury and Great Temple",maker:"Nabataean Ptolemaic and Roman",date:"c. 400 B.C.E.–100 C.E.",medium:"Cut rock",context:"A desert trading city that controlled the incense routes, with monuments carved straight into sandstone cliffs. The Treasury's two-storey façade — broken pediment, central tholos, Corinthian columns — is Hellenistic and Roman vocabulary cut subtractively out of rock rather than built up, and it is a tomb, not a treasury. The Nabataeans also engineered dams and channels to bank flash-flood water.",unit:7,unitName:"West and Central Asia",year:-400,images:[{src:"cb/181-1.jpg",w:1200,h:803,caption:"Petra",credit:"© De Agostini Picture Library/C. Sappa/The Bridgeman Art Library"},{src:"cb/181-2.jpg",w:698,h:839,caption:"Treasury",credit:"© Bernard Gagnon"},{src:"cb/181-3.jpg",w:1200,h:771,caption:"Great Temple",credit:"© Bernard Gagnon"}],thumb:["thumbs/t2-u7.webp",0,0,6,2],notes:[["Form","A city carved into **rose-red sandstone** cliffs. The **Treasury** (al-Khazneh) is a two-story rock-cut facade about 130 feet tall, with columns, pediments, a central **tholos** (round pavilion) and sculpture combining **Hellenistic** classical forms with local Nabataean taste. The **Great Temple** was a freestanding complex with courtyards and a small theater."],["Function","Petra was the capital of the **Nabataeans** and a wealthy **caravan trade** hub (incense, spices). The Treasury was probably a **royal tomb** or temple; legend said it held treasure, and bullet marks on the urn come from people trying to break it open."],["Context","The Nabataeans controlled trade routes between Arabia and the Mediterranean. They absorbed Greek and Roman influences; Rome annexed Petra in 106 CE. It has sophisticated water management (cisterns, channels). Approached through the narrow **Siq** gorge, the facade appears dramatically."],["Exam hooks","Nabataean · rock-cut · Hellenistic facade · caravan trade · Siq approach · tomb · water engineering"],["Compare with","Mortuary temple of Hatshepsut (#21): architecture cut into a cliff. Longmen caves (#195): rock-cut religious sites."]]},{n:182,title:"Buddha",maker:"Gandharan; Bamiyan, Afghanistan",date:"c. 400–800 C.E. (destroyed in 2001)",medium:"Cut rock with plaster and polychrome paint",context:"Two colossal standing Buddhas, roughly 115 and 175 feet tall, carved into a cliff on the Silk Road, their drapery built up in mud plaster over wooden pegs and painted; caves around them housed monks and murals. The style fuses Indian iconography with Greco-Roman drapery. The Taliban dynamited both in 2001, leaving the empty niches.",unit:7,unitName:"West and Central Asia",year:400,images:[{src:"cb/182-1.jpg",w:1119,h:885,caption:"Buddha",credit:"© Borromeo/Art Resource, NY"},{src:"cb/182-2.jpg",w:886,h:889,caption:"Buddha",credit:"© Paul Almasy/Corbis"}],thumb:["thumbs/t2-u7.webp",1,0,6,2],notes:[["Form","Two colossal standing **Buddhas** (about 125 and 180 feet) carved into niches in a cliff. The inner forms were carved from rock; robes were modeled in mud and straw plaster and painted. The **Gandharan** style (Greco-Roman-influenced) shows clinging, rippling drapery. The niches had painted walls."],["Function","Monastic and devotional sites along the **Silk Road**, where pilgrims circumambulated the figures. Monks lived in caves in the cliff."],["Context","Bamiyan was a stop for traders and pilgrims, and Buddhism spread along these routes. The figures were **destroyed by the Taliban in 2001** as idols, prompting international outrage over cultural heritage. The empty niches remain."],["Exam hooks","Bamiyan · colossal Buddhas · Gandharan style · Silk Road · rock-cut · destroyed by Taliban 2001 · cultural heritage"],["Compare with","Longmen caves (#195): rock-cut Buddhas. Todai-ji (#197): colossal Buddha."]]},{n:183,title:"The Kaaba",maker:"Islamic; Mecca, Saudi Arabia",date:"Pre-Islamic monument; rededicated 631–632 C.E.",medium:"Granite masonry, covered with silk curtain and calligraphy in gold and silver-wrapped thread",context:"A granite cube at the centre of the Masjid al-Haram: the qibla every Muslim faces in prayer and the focus of the hajj, where pilgrims circle it seven times counterclockwise. It stood as a shrine before Islam and was cleared of idols by Muhammad. The black kiswa, embroidered with Qur'anic verses in gold, is replaced every year.",unit:7,unitName:"West and Central Asia",year:631,images:[{src:"cb/183-1.jpg",w:962,h:699,caption:"The Kaaba",credit:"© ALI JAREKJI/Reuters/Corbis"},{src:"cb/183-2.jpg",w:1055,h:699,caption:"The Kaaba",credit:"© Kazuyoshi Nomachi/Corbis"},{src:"cb/183-3.jpg",w:1200,h:800,caption:"Gathering at the Kaaba",credit:"© ALI JAREKJI/Reuters/Corbis"}],thumb:["thumbs/t2-u7.webp",2,0,6,2],notes:[["Form","A cubic stone building (**Kaaba** means 'cube'), granite masonry about 50 feet high, covered with a black silk cloth, the **kiswa**, embroidered with gold **Qur'anic calligraphy** and replaced every year. The **Black Stone** is set in the eastern corner, and the building stands in the courtyard of the Masjid al-Haram."],["Function","The most sacred site of **Islam**, the 'House of God'. Muslims everywhere pray facing it (**qibla**), and pilgrims on the **Hajj** circle it seven times (**tawaf**) counterclockwise."],["Context","Believed to have been built by **Abraham** (Ibrahim) and Ishmael. Before Islam it held idols of many gods; **Muhammad** rededicated it to the one God in 631–632 CE after the conquest of Mecca and removed the idols. It is not an image of God, since Islam has no figurative religious imagery; it is a focal point."],["Exam hooks","Kaaba · qibla · Hajj · tawaf · kiswa · Black Stone · Abraham · rededicated by Muhammad · aniconic"],["Compare with","Great Stupa (#192): circumambulation. Dome of the Rock (#185): sacred Islamic site."]]},{n:184,title:"Jowo Rinpoche, enshrined in the Jokhang Temple",maker:"Yarlung Dynasty; Lhasa, Tibet",date:"Believed brought to Tibet in 641 C.E.",medium:"Gilt metals with semiprecious stones, pearls, and paint; various offerings",context:"Tibet's most venerated image, said to have arrived as dowry with the Chinese princess Wencheng. It shows Shakyamuni as a young prince, seated in the earth-touching gesture, but is buried under centuries of donated gold, crowns, jewels and silk — the object accretes devotion rather than staying fixed. Butter lamps and offerings surround it.",unit:7,unitName:"West and Central Asia",year:641,images:[{src:"cb/184-1.jpg",w:1200,h:794,caption:"Jowo Rinpoche",credit:"© Christophe Boisvieux/Corbis"}],thumb:["thumbs/t2-u7.webp",3,0,6,2],notes:[["Form","A gilt metal statue of the **Buddha Shakyamuni** at age 12, seated in meditation and draped with elaborate offerings and jewels: a crown, robes and precious stones added by devotees over centuries. Little of the original statue is visible."],["Function","The most sacred image in **Tibet**, enshrined in the **Jokhang Temple** in Lhasa. Pilgrims prostrate themselves, make offerings, and walk around the temple."],["Context","Tradition says it was brought to Tibet as the dowry of the Chinese princess **Wencheng**, who married King **Songtsen Gampo** in 641, and that it was blessed by the Buddha himself. Its arrival marks the spread of Buddhism in Tibet. It has been damaged and restored, including during the Cultural Revolution."],["Exam hooks","Jowo Rinpoche · Jokhang · Lhasa · Shakyamuni at 12 · offerings accumulated · Princess Wencheng · pilgrimage"],["Compare with","Reliquary of Sainte-Foy (#58): a pilgrimage object covered in gifts. Theotokos icon (#54): devotional image."]]},{n:185,title:"Dome of the Rock",maker:"Islamic/Umayyad; Jerusalem",date:"691–692 C.E., with multiple renovations",medium:"Stone masonry and wooden roof decorated with glazed ceramic tile, mosaics, and gilt aluminum and bronze dome",context:"An octagonal shrine — not a mosque — built over the rock from which Muhammad is said to have ascended on the Night Journey, a site sacred to Jews and Christians too. A double ambulatory lets pilgrims circle the rock. Mosaic, later tile, and a long Qur'anic inscription band that argues against Christian doctrine. Its site and scale stake Umayyad authority in a contested city.",unit:7,unitName:"West and Central Asia",year:691,images:[{src:"cb/185-1.jpg",w:1017,h:1021,caption:"Dome of the Rock",credit:"© SEF/Art Resource, NY"},{src:"cb/185-2.jpg",w:901,h:1021,caption:"Dome of the Rock",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u7.webp",4,0,6,2],notes:[["Form","A **central-plan** shrine: an **octagon** with a high **gilded dome** on a drum above the rock, and two concentric **ambulatories** around it for circumambulation. The interior has marble, **mosaics** (vegetal motifs and crowns, no figures) and Qur'anic **calligraphy** in a frieze. The exterior **tiles** were added by the Ottomans in the 16th century."],["Function","A shrine over the **sacred rock** (the Foundation Stone), associated with Abraham's sacrifice and with **Muhammad's Night Journey and Ascension** (Mi'raj) to heaven. It is not a mosque for congregational prayer."],["Context","Built by the **Umayyad** caliph **Abd al-Malik** on the Temple Mount (Haram al-Sharif) in Jerusalem, a city sacred to Jews, Christians and Muslims. It adopted the Byzantine central-plan martyrium type. Its inscriptions address Christians and assert Islamic theology about Jesus as a prophet. It is the oldest surviving major Islamic monument."],["Exam hooks","Dome of the Rock · Abd al-Malik · Umayyad · octagonal central plan · Night Journey · Foundation Stone · inscriptions · Jerusalem"],["Compare with","San Vitale (#51): central plan. Kaaba (#183). Great Mosque of Córdoba (#56)."]]},{n:186,title:"Great Mosque (Masjid-e Jameh)",maker:"Islamic/Persian (Seljuk, Il-Khanid, Timurid, Safavid); Isfahan, Iran",date:"c. 700 C.E.; additions and restorations 14th, 18th, 20th centuries",medium:"Stone, brick, wood, plaster, and glazed ceramic tile",context:"A thousand years of building on one site, and effectively a textbook of Persian mosque design: a four-iwan courtyard plan, two brick domed chambers of remarkable geometry, muqarnas vaulting, and a skin of blue glazed tile added under the Safavids. Each dynasty added rather than replaced, so the mosque reads as an archive of Iranian architecture.",unit:7,unitName:"West and Central Asia",year:700,images:[{src:"cb/186-1.jpg",w:1200,h:774,caption:"Masjid-e Jameh",credit:"© Bruno Morandi/Hemis/Corbis"},{src:"cb/186-2.jpg",w:605,h:907,caption:"Detail",credit:"© EmmePi Travel/Alamy"},{src:"cb/186-3.jpg",w:1085,h:724,caption:"Courtyard",credit:"© Paule Seux/Hemis/Corbis"},{src:"cb/186-4.jpg",w:930,h:729,caption:"Mihrab (prayer room)",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"}],thumb:["thumbs/t2-u7.webp",5,0,6,2],notes:[["Form","A **four-iwan** plan: a large open courtyard with four **iwans** (vaulted halls open on one side) facing each other, built up over centuries. The south iwan leads to the dome chamber with the mihrab. **Muqarnas** fill the iwans; **glazed tile** mosaics cover surfaces. The Il-Khanid stucco **mihrab of Oljeitu** (1310) has dense floral and calligraphic carving."],["Function","The congregational Friday **mosque** of Isfahan."],["Context","Begun about 700, it grew in stages. The **Seljuk** period (11th–12th century) introduced the influential four-iwan layout and two great domes. The Il-Khanids, Timurids and Safavids added more. It is a 'museum' of Persian Islamic architecture and a model for Iranian and Central Asian mosques."],["Exam hooks","Masjid-e Jameh · Isfahan · four-iwan plan · Seljuk · muqarnas · tile · Oljeitu mihrab · built over centuries"],["Compare with","Great Mosque of Córdoba (#56): hypostyle versus iwan plan. Alhambra (#65): muqarnas. Mosque of Selim II (#84)."]]},{n:187,title:"Folio from a Qur'an",maker:"Abbasid; Arab, North Africa, or Near East",date:"c. eighth to ninth century C.E.",medium:"Ink, color, and gold on parchment",context:"A horizontal parchment page in angular Kufic script, only a few lines per page, with red diacritical dots and a gold rosette closing each verse. The wide format and heavy letterforms make the text legible at a distance for recitation. Calligraphy is the highest Islamic art because the words are God's own; there is no figural imagery.",unit:7,unitName:"West and Central Asia",year:700,images:[{src:"cb/187-1.jpg",w:995,h:718,caption:"Folio from a Qur’an",credit:"© The Pierpont Morgan Library/Art Resource, NY"}],thumb:["thumbs/t2-u7.webp",0,1,6,2],notes:[["Form","A **parchment** page in horizontal (landscape) format, written in **Kufic** script: angular, with long horizontal strokes, about three to five lines per page. Gold and colored dots mark vowels and verse endings, with gold ornamental devices."],["Function","A page from a **Qur'an**, the holy book of Islam, read in worship and study. The text is the word of God, so beautiful **calligraphy** was the highest art form."],["Context","**Abbasid** period. **Aniconism**: Islamic religious art avoids figures, so writing and ornament carry sacred meaning. The horizontal format distinguished it from Christian and Jewish books. Expensive parchment and gold show the patron's piety and wealth."],["Exam hooks","Qur'an · Kufic script · calligraphy as highest art · horizontal format · Abbasid · aniconism"],["Compare with","Lindisfarne Gospels (#55): a sacred book. A Book from the Sky (#229): meaningless script. Dome of the Rock (#185): inscriptions."]]},{n:188,title:"Basin (Baptistère de St. Louis)",maker:"Muhammad ibn al-Zain",date:"c. 1320–1340 C.E.",medium:"Brass inlaid with gold and silver",context:"A large hammered brass basin covered in silver and gold inlay: hunting scenes, court officials and running animals, with the artist's signature repeated six times — unusually assertive for the period. Made in Mamluk Egypt or Syria for secular use, it later travelled to France and was used to baptise French royalty.",unit:7,unitName:"West and Central Asia",year:1320,images:[{src:"cb/188-1.jpg",w:895,h:714,caption:"Basin (Baptistère de St. Louis)",credit:"© Gianni Dagli Orti/The Archive at Art Resource, NY"}],thumb:["thumbs/t2-u7.webp",1,1,6,2],notes:[["Form","A large **brass** basin **inlaid with gold and silver**, decorated with friezes of figures: Mamluk emirs, hunters and servants, with animals and **medallions**. The craftsman **Muhammad ibn al-Zain** signed it six times."],["Function","Made for a Mamluk patron in **Egypt or Syria**, probably for ritual washing at court. Later in France it became part of the royal treasury and was used for baptizing French princes, including Louis XIII, which gave it its name."],["Content","Courtly scenes of a **Mamluk** court: emirs holding weapons, servants, hunting and fighting, with detailed costumes."],["Context","The name 'Baptistère de St. Louis' is a misnomer, since Saint Louis (Louis IX) died before it was made. It shows **cross-cultural** movement of luxury objects and that Islamic art includes **figural** imagery in secular contexts."],["Exam hooks","Mamluk · brass with gold and silver inlay · signed by maker · court figures · used for French royal baptisms · misnomer"],["Compare with","Pyxis of al-Mughira (#57): courtly Islamic object. Bahram Gur (#189)."]]},{n:189,title:"Bahram Gur Fights the Karg",maker:"Islamic/Persian/Il-Khanid",date:"c. 1330–1340 C.E.",medium:"Ink and opaque watercolor, gold, and silver on paper",context:"A page from the Great Il-Khanid Shahnama, Persia's national epic. The prince Bahram Gur kills a rhinoceros-like beast while witnesses lean in from the edges and the action spills past the text frame. Chinese-influenced rocks, clouds and trees reflect Mongol rule; illustrating the Shahnama let the Il-Khanids claim Persian kingship for themselves.",unit:7,unitName:"West and Central Asia",year:1330,images:[{src:"cb/189-1.jpg",w:848,h:1155,caption:"Bahram Gur Fights the Karg",credit:"Reproduction print used by permission of the Harvard Art Museums"}],thumb:["thumbs/t2-u7.webp",2,1,6,2],notes:[["Form","A page of **opaque watercolor, ink, gold and silver** on paper, from a manuscript of the **Shahnama** (Book of Kings). Text panels frame the image. The painting shows Chinese influence in its landscape (twisted trees, rocks) and Persian figures."],["Function","An illustration from the **Great Mongol Shahnama**, a luxury manuscript for the court."],["Content","The hero-king **Bahram Gur** (a Sasanian prince) kills a monstrous **karg** (a horned wolf or rhinoceros-like beast) with his bow and sword. The monster is split and bleeding."],["Context","**Il-Khanid** dynasty: the **Mongols** ruled Persia and adopted Persian culture. The Shahnama, an epic by the poet **Ferdowsi** (about 1010), legitimized the Mongol rulers as heirs to Persian kingship. Chinese elements came through Mongol connections with China."],["Exam hooks","Shahnama · Ferdowsi · Bahram Gur · Il-Khanid Mongols · Chinese landscape influence · legitimizing kingship"],["Compare with","Court of Gayumars (#190): another Shahnama. Night Attack (#203): narrative painting."]]},{n:190,title:"The Court of Gayumars",maker:"Sultan Muhammad, from Shah Tahmasp's Shahnama",date:"c. 1522–1525 C.E.",medium:"Ink, opaque watercolor, and gold on paper",context:"Persia's first king holds court from a mountaintop, his people dressed in leopard skins in an age before clothing or cooking. Painted in hair-fine brushstrokes with faces hidden in the rocks and a shimmering, jewel-like palette. Safavid manuscript painting at its height — a royal atelier object made to be pored over in the hand, not hung.",unit:7,unitName:"West and Central Asia",year:1522,images:[{src:"cb/190-1.jpg",w:840,h:1156,caption:"The Court of Gayumars",credit:"Courtesy of Wikimedia"}],thumb:["thumbs/t2-u7.webp",3,1,6,2],notes:[["Form","A page of **opaque watercolor, ink and gold** on paper, densely packed with hundreds of figures and animals in a jewel-like, colorful mountain landscape with tiny details. The text occupies only a small portion."],["Function","From the **Shahnama of Shah Tahmasp**, one of the most lavish manuscripts ever made (258 paintings)."],["Content","**Gayumars**, the legendary first king of Persia, sits on a mountain throne in leopard skins, surrounded by his court, who also wear animal skins in the age before civilization. His son and grandson appear near him. Faces are hidden in the rocks."],["Context","Painted by **Sultan Muhammad**, the leading painter at the **Safavid** court. It was made for the young prince **Tahmasp**. Later Shah Tahmasp lost interest in painting, and the manuscript was given to the Ottoman sultan Selim II. It was later broken up and sold, its pages scattered."],["Exam hooks","Sultan Muhammad · Safavid · Shah Tahmasp's Shahnama · Gayumars, first king · dense detail · faces in rocks"],["Compare with","Bahram Gur (#189): Il-Khanid Shahnama. Jahangir Preferring a Sufi Shaikh (#208): Persianate court painting."]]},{n:191,title:"The Ardabil Carpet",maker:"Maqsud of Kashan",date:"1539–1540 C.E.",medium:"Silk and wool",context:"One of a pair woven for the shrine of Shaykh Safi al-Din — about 34 by 17 feet, with roughly 26 million knots. A central sunburst medallion with sixteen pendants floats on a deep blue field, and two mosque lamps of deliberately unequal size correct for perspective when the carpet is seen from one end. Signed with a couplet and the maker's name, which is rare for a carpet.",unit:7,unitName:"West and Central Asia",year:1539,images:[{src:"cb/191-1.jpg",w:1200,h:624,caption:"The Ardabil Carpet",credit:"© Victoria & Albert Museum, London, UK/The Bridgeman Art Library"}],thumb:["thumbs/t2-u7.webp",4,1,6,2],notes:[["Form","A huge **carpet** (about 34 by 18 feet) of **wool pile** knotted on a **silk** foundation, with about 300 knots per square inch (around 26 million knots). A central **medallion** (like a sunburst) with 16 pendants and two **mosque lamps** of different sizes, against a dark blue field filled with flowers and vines. Corner quarter-medallions echo the center."],["Function","One of a pair, made for the **Safavid** shrine of Sheikh Safi al-Din (ancestor of the dynasty) at **Ardabil**."],["Content","An inscription in a cartouche cites a verse by Hafez, 'I have no refuge in the world other than thy threshold', and names the maker: '**the work of a servant of the court, Maqsud of Kashan**', 946 AH."],["Context","The mismatched lamp sizes may be deliberate, so that the design looks right from one end, the viewer's position. The design may reflect a mosque dome viewed from below. The carpet is in the Victoria and Albert Museum, London; its twin was used to repair it."],["Exam hooks","Ardabil · Maqsud of Kashan · Safavid shrine · central medallion · two unequal lamps · silk and wool · inscription"],["Compare with","Masjid-e Jameh (#186): dome patterns. Court of Gayumars (#190): Safavid court art."]]},{n:192,title:"Great Stupa at Sanchi",maker:"Buddhist/Maurya, late Sunga Dynasty; Madhya Pradesh, India",date:"c. 300 B.C.E.–100 C.E.",medium:"Stone masonry, sandstone on dome",context:"A solid hemispherical mound raised over relics, ringed by a railing with four carved toranas at the cardinal points. Pilgrims walk clockwise on the circumambulation path, symbolically retracing the Buddha's path. The dome stands for the world-egg or the heavens; the mast and stacked umbrellas mark the axis of the universe. Early reliefs show the Buddha only through symbols — a wheel, a tree, footprints.",unit:8,unitName:"South, East, and Southeast Asia",year:-300,images:[{src:"cb/192-1.jpg",w:992,h:673,caption:"Great Stupa at Sanchi",credit:"© Atlantide Phototravel/Corbis"},{src:"cb/192-2.jpg",w:1008,h:676,caption:"Detail",credit:"© Atlantide Phototravel/Corbis"},{src:"cb/192-3.jpg",w:1200,h:926,caption:"North Gate",credit:"© Raveesh Vyas Plan and elevation"},{src:"cb/192-4.jpg",w:621,h:979,caption:"North Gate",credit:"© Raveesh Vyas Plan and elevation"}],thumb:["thumbs/t2-u8.webp",0,0,8,3],notes:[["Form","A **stupa**: a solid hemispherical **dome** (anda) of earth and rubble faced with stone, built over relics of the Buddha. It is topped by a **harmika** (square railing) and a **chattra** (triple umbrella, symbolizing the Three Jewels of Buddhism). A stone **railing** (vedika) encloses a path. Four elaborately carved **toranas** (gateways) stand at the cardinal points."],["Function","A reliquary mound for veneration. Pilgrims walk around it **clockwise** (**circumambulation**, pradakshina) along the path, a ritual that follows the path of the sun and symbolizes the path to enlightenment."],["Content","The toranas are carved with the **Jataka tales** (past lives of the Buddha) and with **yakshis**, fertility spirits such as the tree-hugging figure on the east gate. The Buddha himself is shown only by **symbols** (empty throne, footprints, tree, wheel), not in human form; this is **aniconic** early Buddhism."],["Context","Begun under **Emperor Ashoka** (Maurya), who spread Buddhism after converting, and enlarged in the Sunga period. The dome symbolizes the cosmic mountain or the world."],["Exam hooks","stupa · relics · circumambulation · toranas · Jatakas · yakshi · aniconic Buddha · Ashoka · harmika/chattra"],["Compare with","Borobudur (#198): stupa as a mountain. Kaaba (#183): circumambulation."]]},{n:193,title:"Terra cotta warriors",maker:"Qin Dynasty; mausoleum of the first Qin emperor, China",date:"c. 221–209 B.C.E.",medium:"Painted terra cotta",context:"Roughly 8,000 life-size soldiers with horses and chariots, buried in pits to guard Qin Shi Huang's tomb. Bodies were mass-produced from moulds and assembled, then given individualised heads and painted — an assembly line manufacturing apparent individuality. They replaced the older practice of human sacrifice, and their armour and formations record real Qin military organisation.",unit:8,unitName:"South, East, and Southeast Asia",year:-221,images:[{src:"cb/193-1.jpg",w:992,h:660,caption:"Terra cotta warriors",credit:"© Imagemore Co., Ltd./Corbis"},{src:"cb/193-2.jpg",w:992,h:660,caption:"Terra cotta warriors",credit:"© Imagemore Co., Ltd./Corbis"}],thumb:["thumbs/t2-u8.webp",1,0,8,3],notes:[["Form","Over **7,000** life-size **terra cotta** soldiers, horses and chariots arranged in battle formation in pits. They were **mass-produced** from molds for standard body parts, then individualized with different faces, hairstyles and ranks. They were originally brightly **painted** and carried real bronze weapons."],["Function","To protect **Qin Shi Huangdi**, the first emperor of unified China, in the **afterlife**: part of a vast underground mausoleum complex."],["Context","Qin Shi Huangdi unified China in 221 BCE and standardized weights, writing, currency and roads. Labor was organized on a massive scale, as the figures' system of standard parts shows. They were found by farmers digging a well in **1974**. The emperor's tomb mound itself has not been excavated."],["Exam hooks","Qin Shi Huangdi · first emperor · terra cotta army · mass production with individualization · originally painted · found 1974"],["Compare with","Funeral banner of Lady Dai (#194): afterlife provisions. Tutankhamun's coffin (#23): royal burial goods. Kui Hua Zi (#250): mass production."]]},{n:194,title:"Funeral banner of Lady Dai (Xin Zhui)",maker:"Han Dynasty; China",date:"c. 180 B.C.E.",medium:"Painted silk",context:"A T-shaped silk banner laid over the innermost of four nested coffins at Mawangdui. Read bottom to top: the underworld, the funeral banquet, Lady Dai herself with attendants at the centre, and finally heaven, with intertwined dragons, a crow in the sun and a toad in the moon. It was meant to guide her soul upward and to identify her to the spirits.",unit:8,unitName:"South, East, and Southeast Asia",year:-180,images:[{src:"cb/194-1.jpg",w:497,h:1200,caption:"Funeral banner of Xin Zhui",credit:"© Bettman/Corbis"}],thumb:["thumbs/t2-u8.webp",2,0,8,3],notes:[["Form","A T-shaped **painted silk** banner about 6.5 feet long, divided into horizontal zones read from bottom to top."],["Function","Laid over the coffin of **Lady Dai (Xin Zhui)**, wife of a Han official. It may have been carried in the funeral procession and guided her soul to the afterlife."],["Content","**Bottom**: the **underworld**, with fish and serpents and a giant holding up the earth. **Lower middle**: her funeral, with ritual vessels. **Upper middle**: Lady Dai herself, with a cane, standing with attendants. **Top (heaven)**: a sun with a crow on the right and a moon with a toad on the left, dragons, and a deity at the center."],["Context","From her **Han dynasty** tomb at Mawangdui, found in 1972, with her remarkably preserved body. It shows the Han belief in the **cosmos** and the journey of the soul, and the importance of status."],["Exam hooks","Lady Dai · Han dynasty · Mawangdui · T-shaped silk · three realms (underworld, earth, heaven) · soul's journey · preserved body"],["Compare with","Last judgment of Hu-Nefer (#24): afterlife guide. Terra cotta warriors (#193)."]]},{n:195,title:"Longmen caves",maker:"Tang Dynasty; Luoyang, China",date:"493–1127 C.E.",medium:"Limestone",context:"Thousands of niches and some 100,000 images carved into limestone cliffs above the Yi River. The Fengxian Temple's colossal Vairocana Buddha, over 55 feet tall, is flanked by bodhisattvas and fierce guardians. Empress Wu Zetian funded it, and the Buddha's face is said to resemble hers — imperial patronage earning merit and making a political point at once.",unit:8,unitName:"South, East, and Southeast Asia",year:493,images:[{src:"cb/195-1.jpg",w:992,h:662,caption:"Longmen caves",credit:"© CLARO CORTES IV/Reuters/Corbis"},{src:"cb/195-2.jpg",w:992,h:659,caption:"Detail",credit:"© Christian Kober/Robert Harding World Imagery/Corbis"},{src:"cb/195-3.jpg",w:1200,h:900,caption:"Detail",credit:"Used by Permission"}],thumb:["thumbs/t2-u8.webp",3,0,8,3],notes:[["Form","Over 2,300 **caves and niches** carved into limestone cliffs along the Yi River, with about 100,000 statues. The largest is the **Fengxian Temple**, with a colossal seated **Vairocana Buddha** (about 55 feet) flanked by disciples, bodhisattvas and guardians. The figures have smooth, rounded, monumental forms with serene faces."],["Function","Buddhist devotion, pilgrimage and **merit-making**: donors sponsored carvings for blessings and to honor family members."],["Context","Begun under the Northern Wei (493) and continued for centuries; **Tang dynasty** carvings are the peak. **Empress Wu Zetian**, China's only female emperor, donated money for the Vairocana Buddha, and the face is traditionally said to resemble her. Vairocana is the cosmic Buddha, the source of all Buddhas."],["Exam hooks","Longmen · Tang · Vairocana · Empress Wu Zetian · rock-cut · merit-making · hierarchy of figures"],["Compare with","Bamiyan Buddhas (#182). Todai-ji (#197): another colossal Vairocana."]]},{n:196,title:"Gold and jade crown",maker:"Three Kingdoms Period/Silla Kingdom; Korea",date:"Fifth to sixth century C.E.",medium:"Metalwork",context:"A gold headband with upright tree- and antler-shaped projections, hung with comma-shaped jade gogok and gold spangles that catch light with every movement. Found in Silla tombs and probably too fragile for daily wear — funerary or ceremonial. The tree and antler forms link the wearer to shamanic traditions of the Eurasian steppe.",unit:8,unitName:"South, East, and Southeast Asia",year:400,images:[{src:"cb/196-1.jpg",w:931,h:1062,caption:"Gold and jade crown",credit:"© DeA Picture Library/Art Resource, NY"}],thumb:["thumbs/t2-u8.webp",4,0,8,3],notes:[["Form","A **gold** crown with upright branching forms like **trees** (shaped like the Chinese character for 'mountain', 出) and **antlers**, hung with comma-shaped **jade** pieces (gogok) and gold spangles that shimmered and moved. The thin gold sheet is cut and joined."],["Function","Found in a royal **tomb** in **Gyeongju**, the Silla capital, probably worn for ceremonies or made specifically for burial, since it is fragile."],["Context","**Silla Kingdom**, Korea's Three Kingdoms period. The trees and antlers may reflect **shamanistic** beliefs (connecting heaven and earth; Siberian links), and the jade possibly symbolizes fertility or life. It is a symbol of royal power and status. Gold was abundant in Silla tombs."],["Exam hooks","Silla · Korea · gold and jade · tree and antler forms · shamanism · royal tomb · Gyeongju"],["Compare with","Merovingian fibulae (#53): status metalwork. Ruler's feather headdress (#158): royal regalia."]]},{n:197,title:"Todai-ji",maker:"Various artists including sculptors Unkei and Keikei/Kei School; Nara, Japan",date:"743 C.E.; rebuilt c. 1700",medium:"Bronze and wood (sculpture); wood with ceramic-tile roofing (architecture)",context:"Built by Emperor Shomu as head of a national temple network, housing a 50-foot bronze Buddha that consumed much of Japan's available copper. The Great Buddha Hall is among the largest wooden buildings in the world, and today's version is smaller than the original. The Nio guardians at the Great South Gate were carved by Unkei and Kaikei's workshop in 1203 in about seventy days.",unit:8,unitName:"South, East, and Southeast Asia",year:743,images:[{src:"cb/197-1.jpg",w:1200,h:792,caption:"Todai-ji",credit:"© Vanni Archive/Art Resource, NY"},{src:"cb/197-2.jpg",w:698,h:1010,caption:"Great Buddha",credit:"© Vanni Archive/Art Resource, NY"},{src:"cb/197-3.jpg",w:798,h:1200,caption:"Nio guardian statue",credit:"© Keith Levit/Alamy"},{src:"cb/197-4.jpg",w:820,h:1200,caption:"Nio guardian statue",credit:"© Alex Ramsay/Alamy"},{src:"cb/197-5.jpg",w:1200,h:799,caption:"Gate",credit:"© Paulo Fridman/Corbis"}],thumb:["thumbs/t2-u8.webp",5,0,8,3],notes:[["Form","A huge Buddhist temple complex in **Nara**. The **Great Buddha Hall** (Daibutsuden) is one of the world's largest wooden buildings, rebuilt about 1700 at two-thirds of its original size. It houses a colossal bronze **Vairocana Buddha** (about 49 feet). The **Great South Gate** (Nandaimon) holds two huge wooden **Niō guardian** statues (about 28 feet), carved by **Unkei and Kaikei** of the Kei school in about 1203. The Niō were assembled from many wood blocks with expressive musculature and fierce faces."],["Function","The head temple of a state-sponsored network of temples, protecting the nation through Buddhism."],["Context","Commissioned by **Emperor Shōmu** in 743 at a time of epidemics and unrest. Its eye-opening (consecration) ceremony was in 752. Burned and rebuilt several times. The **Kamakura** period Niō show the **Kei school's naturalism**."],["Exam hooks","Todai-ji · Nara · Daibutsuden · colossal Vairocana · Niō guardians · Unkei and Kaikei · Emperor Shōmu · state Buddhism"],["Compare with","Longmen caves (#195): Vairocana. Lamassu (#25): gate guardians."]]},{n:198,title:"Borobudur Temple",maker:"Sailendra Dynasty; Central Java, Indonesia",date:"c. 750–842 C.E.",medium:"Volcanic-stone masonry",context:"A stepped mountain of stone with no interior: five square terraces of narrative relief, then three circular terraces carrying 72 perforated stupas around a central one. Pilgrims walk clockwise and upward through the levels — desire, form, formlessness — learning from the reliefs as they climb. Seen from above the plan reads as a mandala.",unit:8,unitName:"South, East, and Southeast Asia",year:750,images:[{src:"cb/198-1.jpg",w:992,h:659,caption:"Borobudur Temple",credit:"© Charles & Josette Lenars/Corbis"},{src:"cb/198-2.jpg",w:993,h:655,caption:"Detail",credit:"© Edifice/Corbis"},{src:"cb/198-3.jpg",w:1200,h:794,caption:"Buddha",credit:"© Dallas and John Heaton/Free Agents 1 Limited/Corbis"}],thumb:["thumbs/t2-u8.webp",6,0,8,3],notes:[["Form","A huge **stepped pyramid** on a hill, built of volcanic stone with no interior space. Its lower square terraces carry about 1,460 **relief panels** along galleries; its upper **circular terraces** carry 72 small perforated (lattice) **stupas**, each containing a Buddha, around a large central stupa. Overall it is a three-dimensional **mandala** and **cosmic mountain** (Mount Meru)."],["Function","A pilgrimage monument. Pilgrims walk **clockwise** around each level, ascending through the three Buddhist realms: the world of desire (base, with reliefs of karma, now hidden), the world of forms (galleries narrating the Buddha's life and Jataka tales) and the formless world (the open circular top). The ascent is a path toward **enlightenment**."],["Context","Built under the **Sailendra Dynasty** in Java. It was abandoned and covered by volcanic ash and jungle, rediscovered in 1814 and restored with UNESCO."],["Exam hooks","Borobudur · Sailendra · Java · mandala · cosmic mountain · circumambulation ascent · relief narratives · perforated stupas"],["Compare with","Great Stupa (#192): stupa form. Angkor Wat (#199): Mount Meru temple."]]},{n:199,title:"Angkor (temple of Angkor Wat and city of Angkor Thom)",maker:"Hindu/Angkor Dynasty; Cambodia",date:"c. 800–1400 C.E.",medium:"Stone masonry, sandstone",context:"Angkor Wat is a temple-mountain for Vishnu built by Suryavarman II, ringed by a moat standing for the cosmic ocean, its five towers evoking Mount Meru. Nearly 2,000 feet of bas-relief includes the Churning of the Sea of Milk. Unusually it faces west, which suggests a funerary purpose. Later Angkor Thom, under Jayavarman VII, is Buddhist, with giant face towers at the Bayon.",unit:8,unitName:"South, East, and Southeast Asia",year:800,images:[{src:"cb/199-1.jpg",w:962,h:642,caption:"Angkor Wat",credit:"© Michele Falzone/JAI/Corbis"},{src:"cb/199-2.jpg",w:1008,h:642,caption:"South Gate of Angkor Thom",credit:"© Christophe Boisvieux/Corbis"},{src:"cb/199-3.jpg",w:915,h:909,caption:"Churning of the Ocean of Milk",credit:"© Kevin R. Morris/Corbis"},{src:"cb/199-4.jpg",w:1101,h:737,caption:"Jayavarman VII as Buddha",credit:"© HansStieglitz@t-online.de"},{src:"cb/199-5.jpg",w:1008,h:807,caption:"Angkor Wat plan",credit:""},{src:"cb/199-6.jpg",w:930,h:730,caption:"Angkor site plan",credit:""}],thumb:["thumbs/t2-u8.webp",7,0,8,3],notes:[["Form","**Angkor Wat**: a Hindu temple complex surrounded by a huge **moat**, with concentric galleries and five **towers** (quincunx) representing the peaks of **Mount Meru**, the center of the universe. It faces **west**. **Angkor Thom** is a walled city whose gates have huge faces; at its center is the Bayon temple, with many towers carved with serene **faces**."],["Function","Angkor Wat was a temple to **Vishnu** and probably the funerary temple of **Suryavarman II**. Angkor Thom was the royal capital of **Jayavarman VII**."],["Content","Reliefs at Angkor Wat include the **Churning of the Ocean of Milk** (gods and demons pull a serpent to churn out the elixir of immortality, with Vishnu at the center). At Angkor Thom, the **South Gate** is lined with gods and demons pulling a naga. **Jayavarman VII as Buddha** is a serene portrait sculpture."],["Context","**Khmer Empire**. Angkor shifted from **Hinduism** (Angkor Wat, 12th century) to **Mahayana Buddhism** under Jayavarman VII (late 12th century). The west orientation (the direction of death) suggests funerary use. The site had huge water management systems."],["Exam hooks","Khmer · Angkor Wat · Mount Meru · Vishnu · Suryavarman II · faces west · Churning of the Ocean of Milk · Jayavarman VII · Hindu → Buddhist"],["Compare with","Borobudur (#198): cosmic mountain. Lakshmana Temple (#200): Hindu temple."]]},{n:200,title:"Lakshmana Temple",maker:"Hindu/Chandella Dynasty; Khajuraho, India",date:"c. 930–950 C.E.",medium:"Sandstone",context:"A Nagara-style temple on a high plinth whose ascending shikharas mimic a mountain range, leading the eye up to the tallest tower over the small, dark garbhagriha. Bands of sculpture cover the exterior — deities, couples, and the famously erotic figures, read variously as auspicious, as symbols of divine union, or as worldly life left behind at the threshold.",unit:8,unitName:"South, East, and Southeast Asia",year:930,images:[{src:"cb/200-1.jpg",w:992,h:662,caption:"Lakshmana Temple",credit:"© Jose Fuste Raga/Corbis"},{src:"cb/200-2.jpg",w:992,h:665,caption:"Detail",credit:"© Atlantide Phototravel/Corbis"},{src:"cb/200-3.jpg",w:993,h:665,caption:"Detail",credit:"© Michele Burgess/Alamy Lakshmana Temple plan"},{src:"cb/200-4.jpg",w:884,h:596,caption:"Detail",credit:"© Michele Burgess/Alamy Lakshmana Temple plan"}],thumb:["thumbs/t2-u8.webp",0,1,8,3],notes:[["Form","A Hindu temple of sandstone on a high platform, in the **Nagara** (north Indian) style. Its towers (**shikharas**) rise like a mountain range (Mount Meru) to the tallest over the **garbhagriha** ('womb chamber', the innermost sanctuary). The exterior is covered in **relief sculpture**: gods, celestial beings (apsaras) and **mithuna** (embracing couples, some erotic)."],["Function","A temple to **Vishnu**. Worshippers move from the outer porch toward the dark inner sanctum, which holds the main image, and circumambulate."],["Context","Built by the **Chandella** dynasty at **Khajuraho**. Erotic sculptures may symbolize the union of the divine and the human, or auspiciousness and fertility. The plan follows a mandala, a cosmic diagram."],["Exam hooks","Lakshmana Temple · Khajuraho · Chandella · Vishnu · shikhara · garbhagriha · mithuna · Nagara style · mountain symbolism"],["Compare with","Angkor (#199): Hindu temple. Borobudur (#198): cosmic mountain. Chartres (#60): sculpture covering a sacred building."]]},{n:201,title:"Travelers among Mountains and Streams",maker:"Fan Kuan",date:"c. 1000 C.E.",medium:"Ink and colors on silk",context:"A hanging scroll built in three depths: foreground boulders, a middle ground with a temple and a mule train, then a monumental cliff rising behind a band of mist. The travellers are nearly invisible — Northern Song landscape shows people as small within a moral, ordered nature. 'Raindrop' texture strokes build the rock face, and Fan Kuan's signature hides in the foliage.",unit:8,unitName:"South, East, and Southeast Asia",year:1e3,images:[{src:"cb/201-1.jpg",w:481,h:1052,caption:"Travelers among Mountains and Streams",credit:"© Fan Kuan/Corbis"}],thumb:["thumbs/t2-u8.webp",1,1,8,3],notes:[["Form","A tall **hanging scroll** in ink and light color on silk, divided into three planes: **foreground** rocks; a **middle ground** with tiny **travelers** and mules on a path and a temple in the trees; and a huge **central mountain** with a thin waterfall. Mist separates the planes. It uses **shifting perspective** (multiple viewpoints) and texture strokes (**cun**) like 'raindrop' marks."],["Function","A **monumental landscape** painting for contemplation."],["Content","The vastness of nature dwarfs humans. **Fan Kuan**'s signature is hidden in the leaves near the travelers."],["Context","**Northern Song** dynasty. Landscape (shan
