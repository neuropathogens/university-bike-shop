shui, 'mountain-water') painting expresses **Daoist and Neo-Confucian** ideas: humans are part of an ordered natural cosmos. Fan Kuan lived as a hermit, learning directly from nature."],["Exam hooks","Fan Kuan · Northern Song · monumental landscape · hanging scroll · tiny travelers · shifting perspective · Daoism · hidden signature"],["Compare with","The Oxbow (#109): Western landscape and sublime. Summer Trees (#227): ink tradition. Hunters in the Snow (#83)."]]},{n:202,title:"Shiva as Lord of Dance (Nataraja)",maker:"Hindu/Chola Dynasty; India (Tamil Nadu)",date:"c. 11th century C.E.",medium:"Cast bronze",context:"Shiva dances the cycle of creation and destruction inside a ring of fire: a drum in the upper right hand for creation, flame in the upper left for destruction, the lower right raised in 'do not fear,' the lower left pointing to his raised foot — release. He crushes the dwarf of ignorance underfoot. Cast by lost-wax for temple processions, with lugs for carrying poles.",unit:8,unitName:"South, East, and Southeast Asia",year:1e3,images:[{src:"cb/202-1.jpg",w:760,h:1017,caption:"Shiva as Nataraja",credit:"© The Metropolitan Museum of Art/Image Source © Art Resource, NY"}],thumb:["thumbs/t2-u8.webp",2,1,8,3],notes:[["Form","A **cast bronze** statue made by the **lost-wax** process, about 3 feet tall. **Shiva** dances inside a **ring of fire**, with four arms in dynamic, balanced movement and hair flying out."],["Function","Made to be carried in **procession** during festivals (it has holes at the base for poles) and dressed and adorned in temple worship."],["Content","Shiva is creator and destroyer of the universe. His upper right hand holds a **drum** (creation); his upper left holds **fire** (destruction). His lower right hand makes the **abhaya mudra**, 'do not fear' (protection), and his lower left points to his raised foot (release, liberation). He dances on **Apasmara**, the dwarf of ignorance. The ring of fire is the cosmos."],["Context","**Chola Dynasty**, south India. It captures the **cosmic dance** that creates, maintains and destroys the universe."],["Exam hooks","Shiva Nataraja · Chola · bronze lost-wax · ring of fire · four arms (drum, fire, abhaya mudra) · Apasmara · procession"],["Compare with","Lakshmana Temple (#200): Hindu art. Seated boxer (#41): bronze."]]},{n:203,title:"Night Attack on the Sanjô Palace",maker:"Kamakura Period; Japan",date:"c. 1250–1300 C.E.",medium:"Handscroll (ink and color on paper)",context:"A handscroll unrolled right to left about an arm's length at a time, so the viewer moves through the raid as a sequence — arriving carts, the burning gate, beheadings, the emperor's abduction. Flame is drawn in dense reds and blacks and figures swarm and repeat. It depicts the Heiji Rebellion of 1159, painted about a century after the event.",unit:8,unitName:"South, East, and Southeast Asia",year:1250,images:[{src:"cb/203-1.jpg",w:1200,h:73,caption:"Night Attack on the Sanjô Palace",credit:"Photograph © 2013 Museum of Fine Arts, Boston"},{src:"cb/203-2.jpg",w:993,h:560,caption:"Detail",credit:"Photograph © 2013 Museum of Fine Arts, Boston"}],thumb:["thumbs/t2-u8.webp",3,1,8,3],notes:[["Form","A **handscroll** about 23 feet long in ink and color on paper. It is read **right to left**, unrolled a section at a time. It uses a high, bird's-eye view, **diagonal** movement, the 'blown-off roof' convention, crowded action, red flames and black smoke."],["Function","Illustrates the **Heiji Monogatari** (Tale of Heiji), a historical war story."],["Content","The 1159 **Heiji rebellion**: soldiers of the Minamoto clan attack the Sanjô Palace in Kyoto and capture the retired emperor. The palace burns; samurai behead guards, and courtiers are slaughtered. The emperor's carriage is the center of the chaos."],["Context","**Kamakura period**, about 100 years after the event, when **samurai** took power. It shows the end of the aristocratic Heian period and the rise of the warrior class. This is your essay comparison with the Alexander Mosaic (#40)."],["Exam hooks","handscroll · read right to left · Heiji rebellion 1159 · Minamoto attack · burning palace · Kamakura · samurai · continuous narrative"],["Compare with","Alexander Mosaic (#40): your essay pair. Bayeux Tapestry (#59): narrative of war."]]},{n:204,title:"The David Vases",maker:"Yuan Dynasty; China",date:"1351 C.E.",medium:"White porcelain with cobalt-blue underglaze",context:"A pair of temple vases with elephant-head handles, painted in imported Persian cobalt with dragons, phoenixes and floral bands. Their dedicatory inscriptions give an exact date and donor, which makes them the benchmark for dating all early blue-and-white. Made at Jingdezhen for a Daoist temple; the porcelain technology and the cobalt met through Mongol-era trade.",unit:8,unitName:"South, East, and Southeast Asia",year:1351,images:[{src:"cb/204-1.jpg",w:775,h:1027,caption:"The David Vases",credit:"© The Trustees of the British Museum/Art Resource, NY"}],thumb:["thumbs/t2-u8.webp",4,1,8,3],notes:[["Form","A pair of tall **porcelain** temple vases with **cobalt-blue underglaze** decoration: dragons and phoenixes among clouds, with elephant-head handles. The porcelain is white, translucent and fired at a high temperature."],["Function","Votive offerings to a **Daoist** temple, made as an altar set."],["Content","**Inscriptions** on the necks record the donor (Zhang Wenjin), the date (**1351**) and the purpose: an offering for his family's protection and prosperity."],["Context","**Yuan Dynasty** (Mongol rule) at **Jingdezhen**, the porcelain capital. These are among the earliest dated **blue-and-white** porcelain. The cobalt was imported from **Persia**, showing global trade. They are named for Sir Percival David, who collected them."],["Exam hooks","David Vases · blue-and-white porcelain · cobalt from Persia · dated 1351 · Yuan · Jingdezhen · Daoist offering · inscription"],["Compare with","Kui Hua Zi (#250): Jingdezhen porcelain. Basin (Baptistère de St. Louis) (#188): cross-cultural trade."]]},{n:205,title:"Portrait of Sin Sukju (1417–1475)",maker:"Imperial Bureau of Painting; Korea",date:"c. 15th century C.E.",medium:"Hanging scroll (ink and color on silk)",context:"A meritorious-subject portrait of a Joseon scholar-official, seated in three-quarter view in official robes with a rank badge and belt. Line is fine and restrained and colour is flat, but the face is observed closely — moles included — because Confucian portraiture held that any inaccuracy misrepresents the person. Used in ancestral rites.",unit:8,unitName:"South, East, and Southeast Asia",year:1400,images:[{src:"cb/205-1.jpg",w:489,h:752,caption:"Portrait of Sin Sukju",credit:"Used by Permission"}],thumb:["thumbs/t2-u8.webp",5,1,8,3],notes:[["Form","A **hanging scroll** in ink and color on silk: a full-length **seated** figure in official dress, with a **rank badge** (a **peacock** on a square embroidered panel on the chest), a black gauze hat and a red robe. He is formal and frontal, with naturalistic details of the face."],["Function","An official **portrait** honoring a meritorious official, used in **ancestor veneration** rituals by the family."],["Content","**Sin Sukju** (1417–1475), a scholar-official who helped create the Korean alphabet, **hangul**, under King Sejong."],["Context","**Joseon Dynasty** Korea. Painted by the Imperial Bureau of Painting. **Neo-Confucian** values: loyalty, scholarship and family lineage. Portraits honoring loyal officials were commissioned by the court."],["Exam hooks","Sin Sukju · Joseon · Neo-Confucianism · rank badge · ancestor veneration · hangul · official portrait"],["Compare with","Jahangir (#208): portraits of rulers and power. Ndop (#171): portraits identified by attributes. Head of a Roman patrician (#42)."]]},{n:206,title:"Forbidden City",maker:"Ming Dynasty; Beijing, China",date:"15th century C.E. and later",medium:"Stone masonry, marble, brick, wood, and ceramic tile",context:"A walled and moated palace city of roughly 980 buildings on a strict north-south axis, arranged so that rank governs how far in you may go. Yellow-glazed roof tiles were reserved for the emperor, and the Hall of Supreme Harmony sits on three marble terraces. Symmetry and sequence make bureaucracy and cosmology visible in plan.",unit:8,unitName:"South, East, and Southeast Asia",year:1400,images:[{src:"cb/206-1.jpg",w:993,h:661,caption:"Forbidden City",credit:"© Atlantide Phototravel/Corbis"},{src:"cb/206-2.jpg",w:992,h:662,caption:"Hall of Supreme Harmony",credit:"© Steven Vidler/Eurasia Press/Corbis"},{src:"cb/206-3.jpg",w:992,h:662,caption:"The Palace of Tranquility and Longevity",credit:"© As seen in Art and Antiques"},{src:"cb/206-4.jpg",w:993,h:662,caption:"Front Gate",credit:"© John Lander Photography"},{src:"cb/206-5.jpg",w:791,h:1028,caption:"Forbidden City plan",credit:""}],thumb:["thumbs/t2-u8.webp",6,1,8,3],notes:[["Form","A walled palace city in Beijing on a north-south **axis**, with symmetrical courtyards and buildings in **hierarchical** sequence. Halls have yellow-glazed roof tiles (yellow being the imperial color), red walls and white marble terraces. The main hall is the **Hall of Supreme Harmony**, where the emperor's throne stood. The emperor's private quarters lay to the north."],["Function","The imperial **palace** and government center of the **Ming** and **Qing** emperors for about 500 years, closed to ordinary people (hence 'forbidden')."],["Content","Further additions include the **Palace of Tranquility and Longevity**, built in the Qing dynasty for the retired Qianlong emperor."],["Context","Built under the **Yongle Emperor** (Ming), early 15th century. The plan follows **feng shui** and cosmology: the emperor is the 'Son of Heaven' at the center of the world, facing south. It is now the **Palace Museum**."],["Exam hooks","Forbidden City · Ming/Qing · axial symmetry · Hall of Supreme Harmony · yellow roofs = emperor · Son of Heaven · faces south"],["Compare with","Versailles (#93): royal palace and power. Apadana (#30): audience hall."]]},{n:207,title:"Ryoan-ji",maker:"Muromachi Period; Kyoto, Japan",date:"c. 1480 C.E.; current design most likely 18th century",medium:"Rock garden",context:"Fifteen rocks set in raked white gravel inside a low wall, with moss and no planting. From any point on the veranda one rock is always hidden, so the whole is never seen at once. A karesansui dry garden made for Zen contemplation: gravel reads as water, stones as islands or peaks, and the raking is itself part of the practice.",unit:8,unitName:"South, East, and Southeast Asia",year:1480,images:[{src:"cb/207-1.jpg",w:992,h:662,caption:"Ryoan-ji, wet garden",credit:"© John Lander Photography"},{src:"cb/207-2.jpg",w:1031,h:662,caption:"Ryoan-ji, dry garden",credit:"© Vanni Archive/Art Resource, NY"},{src:"cb/207-3.jpg",w:1200,h:685,caption:"Ryoan-ji plan",credit:""}],thumb:["thumbs/t2-u8.webp",7,1,8,3],notes:[["Form","A **dry garden** (karesansui) of white **raked gravel** with 15 **rocks** in five groups on moss, enclosed by an earthen wall on two sides. From any viewpoint at least one rock is hidden. Next to it is a **wet garden** with a pond and plants."],["Function","A **Zen Buddhist** garden at a temple, for **meditation**; it is viewed from the veranda of the abbot's quarters, not walked in."],["Content","Its meaning is open: islands in the sea, mountain peaks above clouds, a tiger carrying cubs across water. Monks rake the gravel daily as a meditative practice."],["Context","**Muromachi period**; the current design probably dates to the 18th century. Zen values simplicity, emptiness and contemplation, and the garden encourages concentrated perception. **Wabi-sabi** beauty: imperfection and impermanence."],["Exam hooks","Ryoan-ji · Zen · dry rock garden (karesansui) · raked gravel · 15 rocks · meditation · Muromachi · viewed not entered"],["Compare with","Fallingwater (#139): harmony with nature. Alhambra (#65): garden as paradise. Spiral Jetty (#151)."]]},{n:208,title:"Jahangir Preferring a Sufi Shaikh to Kings",maker:"Bichitr",date:"c. 1620 C.E.",medium:"Watercolor, gold, and ink on paper",context:"The Mughal emperor sits on an hourglass throne, haloed by sun and moon, handing a book to a Sufi shaikh while an Ottoman sultan, King James I of England (copied from an English painting) and the artist himself wait below. Putti borrowed from European prints hover overhead. The message: spiritual authority outranks worldly kingship — and Jahangir outranks everyone.",unit:8,unitName:"South, East, and Southeast Asia",year:1620,images:[{src:"cb/208-1.jpg",w:825,h:1200,caption:"Jahangir Preferring a Sufi Shaikh to Kings",credit:"© Freer Gallery of Art, Smithsonian Institution, Washington, D.C."}],thumb:["thumbs/t2-u8.webp",0,2,8,3],notes:[["Form","An **album page** painted in watercolor, gold and ink on paper. The emperor sits on an **hourglass throne** with a huge **halo** of sun and moon. **Cherubs** (European-derived) write on the hourglass, and the Mughal portraits are realistic."],["Function","A political **allegory** for the album of the Mughal emperor **Jahangir**."],["Content","Jahangir hands a book to a **Sufi sheikh**, preferring spiritual leaders to kings. Below him wait the **Ottoman sultan**, **King James I of England** (copied from a European portrait) and the painter **Bichitr** himself holding a painting. An inscription on the hourglass wishes Jahangir a life of a thousand years."],["Context","**Mughal** India. It shows Jahangir's piety and superiority to worldly rulers. It blends Persian, Indian and **European** influences (cherubs and the portrait of James I came from gifts brought by English ambassadors). The hourglass suggests time running out."],["Exam hooks","Bichitr · Jahangir · Mughal · allegory · Sufi sheikh · hourglass throne · James I · European influence · halo"],["Compare with","Court of Gayumars (#190): Persianate painting. Portrait of Sin Sukju (#205). Henri IV (#86): allegorical portrait."]]},{n:209,title:"Taj Mahal",maker:"Supervising architect Ustad Ahmad Lahori; Agra, Uttar Pradesh, India",date:"1632–1653 C.E.",medium:"Stone masonry and marble with inlay of precious and semiprecious stones; gardens",context:"Shah Jahan's tomb for Mumtaz Mahal, placed at the end rather than the centre of a charbagh garden divided by water channels into four — an image of paradise. White marble inlaid with semiprecious stone flowers and Qur'anic inscriptions whose letters widen as they rise so they read evenly from below. The four detached minarets tilt slightly outward.",unit:8,unitName:"South, East, and Southeast Asia",year:1632,images:[{src:"cb/209-1.jpg",w:830,h:809,caption:"Taj Mahal",credit:"© David Pearson/Alamy"},{src:"cb/209-2.jpg",w:1178,h:811,caption:"Taj Mahal",credit:"© Ocean/Corbis"}],thumb:["thumbs/t2-u8.webp",1,2,8,3],notes:[["Form","A white **marble** mausoleum on a raised platform with four **minarets**, a huge bulbous **onion dome** and an **iwan** on each side. It is **symmetrical**, with **pietra dura** (inlaid semiprecious stones) and Qur'anic calligraphy that grows larger toward the top, so it looks uniform from below. It sits at the end of a **charbagh** (four-part paradise garden) with water channels, flanked by a mosque and a guest house."],["Function","A **tomb** for **Mumtaz Mahal**, beloved wife of the Mughal emperor **Shah Jahan**, who died in childbirth. Shah Jahan was later buried beside her."],["Context","**Mughal**: Persian, Indian and Islamic architecture. The garden evokes **paradise**, and the tomb may represent God's throne on the Day of Judgment. Supervising architect **Ustad Ahmad Lahori**. The marble changes color in different light."],["Exam hooks","Taj Mahal · Shah Jahan and Mumtaz Mahal · Mughal · mausoleum · pietra dura · charbagh paradise garden · symmetry · calligraphy scaled"],["Compare with","Great Pyramids (#17): royal tomb. Alhambra (#65): paradise garden. Mosque of Selim II (#84)."]]},{n:210,title:"White and Red Plum Blossoms",maker:"Ogata Korin",date:"c. 1710–1716 C.E.",medium:"Ink, watercolor, and gold leaf on paper",context:"A two-panel folding screen: a stylised silver-and-black stream swells up the centre with a white plum on one side and a red on the other, all against flat gold. Rinpa style — bold asymmetry, decorative pattern, and tarashikomi, the technique of dropping ink into still-wet pigment to mottle the trunks. Plum blossoms mark the end of winter.",unit:8,unitName:"South, East, and Southeast Asia",year:1710,images:[{src:"cb/210-1.jpg",w:993,h:896,caption:"White and Red Plum Blossoms",credit:"© MOA Museum of Art"},{src:"cb/210-2.jpg",w:999,h:895,caption:"White and Red Plum Blossoms",credit:"© MOA Museum of Art"}],thumb:["thumbs/t2-u8.webp",2,2,8,3],notes:[["Form","A pair of two-panel folding **screens** (byobu) in ink, color and **gold leaf** on paper. Two **plum trees**, white on the left and red on the right, flank a stylized **stream** with swirling patterns. A mix of naturalism and **flat, decorative design**; the trunks use **tarashikomi** (pooling wet ink on wet paint for a mottled effect)."],["Function","A luxury decoration for a home, used to divide space."],["Content","Early **spring**: plum blossoms are among the first flowers."],["Context","**Ogata Kōrin**, **Rinpa school**, Edo period. The movement emphasized decorative and bold design, revived classical Japanese themes, and catered to wealthy merchants. Kōrin's family were textile merchants, and the stream patterns resemble fabric designs."],["Exam hooks","Ogata Kōrin · Rinpa · folding screens · gold leaf · tarashikomi · stylized stream · Edo · spring"],["Compare with","Screen with the Siege of Belgrade (#94): the biombo derived from byobu. Great Wave (#211): Edo design."]]},{n:211,title:"Under the Wave off Kanagawa (Great Wave)",maker:"Katsushika Hokusai, from Thirty-six Views of Mount Fuji",date:"1830–1833 C.E.",medium:"Polychrome woodblock print; ink and color on paper",context:"A clawed wave towers over three fishing boats while Mount Fuji sits small and still on the horizon — a joke about scale as much as a threat. Newly imported Prussian blue made the deep colour possible. Ukiyo-e prints were cheap, mass-produced popular art; the cropping and flatness of prints like this one later shaped European Japonisme.",unit:8,unitName:"South, East, and Southeast Asia",year:1830,images:[{src:"cb/211-1.jpg",w:1200,h:805,caption:"Kanagawa oki nami uraImage",credit:"© The Metropolitan Museum of Art/Image Source © Art Resource, NY"}],thumb:["thumbs/t2-u8.webp",3,2,8,3],notes:[["Form","A **polychrome woodblock print** (ukiyo-e) using imported **Prussian blue**. A giant wave with claw-like foam towers over three boats of rowers. Tiny **Mount Fuji** sits in the background, echoed in shape by a smaller wave. Strong diagonal and a dramatic, cropped composition."],["Function","The first print in the series **Thirty-six Views of Mount Fuji**, sold cheaply to a broad public."],["Content","Nature's power against human fragility, with Mount Fuji, sacred and eternal, at the still center."],["Context","**Katsushika Hokusai**, Edo period Japan. **Ukiyo-e** ('pictures of the floating world'). It shows Western influence in its perspective and in Prussian blue pigment, and in turn deeply influenced Western artists (**Japonisme**: Monet, van Gogh, Cassatt, #121). Woodblocks were cut by carvers and printed by printers in a publisher's system."],["Exam hooks","Hokusai · ukiyo-e · woodblock · Thirty-six Views of Mount Fuji · Prussian blue · Japonisme · mass-produced"],["Compare with","The Coiffure (#121): Japonisme. White and Red Plum Blossoms (#210). Slave Ship (#111): sea and sublime."]]},{n:212,title:"Chairman Mao en Route to Anyuan",maker:"Based on painting by Liu Chunhua",date:"c. 1969 C.E.",medium:"Color lithograph",context:"Mao walks toward the viewer on his way to organise the Anyuan miners' strike. The Cultural Revolution formula is all here: the leader central, lit, elevated above the horizon, gazing into the future. Printed in the hundreds of millions, it may be the most reproduced image of the twentieth century. Painted by a student collective, and its authorship was later disputed in court.",unit:8,unitName:"South, East, and Southeast Asia",year:1969,images:[{src:"cb/212-1.jpg",w:856,h:1200,caption:"Chairman Mao en Route to Anyuan",credit:"© The Chambers Gallery, London/The Bridgeman Art Library"}],thumb:["thumbs/t2-u8.webp",4,2,8,3],notes:[["Form","A color **lithograph** based on an oil painting by **Liu Chunhua**, in a **Socialist Realist** style: realistic and heroic, with idealized lighting and figure."],["Function","**Propaganda** during the **Cultural Revolution**: printed an estimated **900 million** times and displayed in homes, workplaces and public spaces."],["Content","Young **Mao Zedong** in a scholar's robe, carrying an umbrella and walking toward Anyuan in 1921 to organize the coal miners' strike. Mao is shown large, alone and determined, against a dramatic sky with clouds parting behind him like a halo."],["Context","During the **Cultural Revolution** (1966–1976), Mao's image was worshipped and individual artistic expression was suppressed. The painting rewrote history: Liu Shaoqi, who also led the strike and had been purged, was left out."],["Exam hooks","Mao · Cultural Revolution · propaganda · lithograph (mass reproduction) · Socialist Realism · Anyuan strike · rewriting history"],["Compare with","Illustration from the Five-Year Plan (#137): Soviet propaganda. Kui Hua Zi (#250): Ai Weiwei's response to Mao era."]]},{n:213,title:"Nan Madol",maker:"Saudeleur Dynasty; Pohnpei, Micronesia",date:"c. 700–1600 C.E.",medium:"Basalt boulders and prismatic columns",context:"About one hundred artificial islets built out on a coral reef and separated by canals — a 'Venice of the Pacific.' Walls up to 25 feet high are stacked from naturally hexagonal basalt logs in an alternating header-and-stretcher pattern. A ceremonial and mortuary center where Saudeleur rulers housed and controlled the island's chiefs.",unit:9,unitName:"The Pacific",year:700,images:[{src:"cb/213-1.jpg",w:760,h:505,caption:"Nan Madol",credit:"© Jack Fields/Corbis"},{src:"cb/213-2.jpg",w:1200,h:499,caption:"Nan Madol",credit:"© Jack Fields/Corbis"}],thumb:["thumbs/t2-u9.webp",0,0,6,2],notes:[["Form",'Around **92 artificial islets** built on a coral reef off Pohnpei, separated by **canals** ("Venice of the Pacific"). Walls built of **naturally formed hexagonal basalt columns** stacked in alternating **header-and-stretcher** layers (like a log cabin), filled with coral rubble. The **Nandauwas** mortuary complex has walls up to about **7.5 m (25 ft)** high, with slight upward-curving corners.'],["Function","Political and ceremonial center of the **Saudeleur** rulers: **royal residence, tombs for rulers (Nandauwas), priests' quarters, and ritual sites**. Rulers required **lesser chiefs to live there**, where they could be watched — the architecture **concentrated and controlled power**."],["Content","Architecture only; meaning comes from scale, isolation, water, and hierarchy of spaces."],["Context","The basalt had to be quarried elsewhere on the island and **floated by raft** — immense organized labor showing centralized authority. The Saudeleur dynasty was overthrown (tradition credits the hero **Isokelekel**, early 1600s), after which Nan Madol was abandoned. UNESCO World Heritage site."],["Exam hooks","artificial islets · basalt columns in log-cabin pattern · royal mortuary · political control/surveillance · megalithic."],["One-sentence thesis","Nan Madol's monumental basalt islets turned the Saudeleur rulers' power into architecture, isolating and elevating the elite while housing the royal dead."],["Compare with","Great Zimbabwe (dry-stone royal center tied to trade and power); Stonehenge (megalithic labor); Machu Picchu (royal estate)."]]},{n:214,title:"Moai on platform (ahu)",maker:"Rapa Nui (Easter Island)",date:"c. 1100–1600 C.E.",medium:"Volcanic tuff figures on basalt base",context:"Nearly 900 monolithic ancestor figures were carved at the Rano Raraku quarry: heavy brows, long noses, elongated ears, small legs, oversized heads. Roughly a third stand on ahu platforms facing inland to watch over the village. Some had coral-and-obsidian eyes and red scoria topknots. Carving and transport were tied to lineage prestige — and to the island's deforestation.",unit:9,unitName:"The Pacific",year:1100,images:[{src:"cb/214-1.jpg",w:1008,h:672,caption:"Moai",credit:"© Peter Langer/Design Pics/Corbis"}],thumb:["thumbs/t2-u9.webp",1,0,6,2],notes:[["Form",'Monumental figures (average about 4 m; some much larger) carved from **volcanic tuff** at the **Rano Raraku** quarry. **Long rectangular heads, heavy brows, long noses, elongated ears, pursed lips, arms along the torso**, hands meeting at the belly. Some wore **pukao** (red scoria topknots). Eyes of **white coral and obsidian/red scoria** were inserted for ceremonies — "activating" the figure. Set in rows on **ahu** (stone platforms), mostly **facing inland** toward villages.'],["Function","Represent **deified ancestors (chiefs)**; they held **mana** and protected the community. Their placement looking over the villages channeled ancestral protection toward the living. Ahu also held burials."],["Content","Idealized, not individual portraits — stylized ancestor type."],["Context",'Rapa Nui was settled by Polynesian voyagers around 1200 CE. About **900 moai** exist; many were never moved from the quarry. Transport may have involved "walking" the upright statues with ropes. Later, moai were **toppled** during social conflict, and religion shifted to the **Birdman cult** at Orongo. European contact (1722 onward) brought slave raids and disease.'],["Exam hooks","tuff from Rano Raraku · ahu platform · face inland · ancestors + mana · inlaid eyes activate · pukao."],["One-sentence thesis","The moai's monumental, stylized ancestor figures, set on ahu facing the villages, channeled ancestral mana to protect the living Rapa Nui community."],["Compare with","Stonehenge (monumental stones and communal labor); Byeri reliquary (ancestor guardian); Staff god (ancestral deity with mana)."]]},{n:215,title:"'Ahu 'ula (feather cape)",maker:"Hawaiian",date:"Late 18th century C.E.",medium:"Feathers and fiber (olona netting)",context:"Worn only by high-ranking chiefs; the crescent shape and blocks of color signal rank. Thousands of tiny yellow 'o'o and red 'i'iwi feathers were knotted onto a netted olona base — birds were snared, plucked, and released, and feathers came in as tribute. The cape was believed to carry mana and to serve as spiritual armor.",unit:9,unitName:"The Pacific",year:1775,images:[{src:"cb/215-1.jpg",w:977,h:720,caption:"‘Ahu ‘ula",credit:"© The Trustees of the British Museum/Art Resource, NY"}],thumb:["thumbs/t2-u9.webp",2,0,6,2],notes:[["Form","A cape made of **tens of thousands of tiny red and yellow feathers** tied in bundles onto a **netting of olonā fiber**. Bold **crescent and geometric designs** in red and yellow (sometimes black). Semicircular/trapezoidal shape."],["Function","Worn only by **aliʻi (chiefs)** and high-ranking men in **battle and ceremony**. It displayed and **protected their mana**; the netting was made with **prayers**, so the cape was spiritually charged. Also used as **diplomatic gifts** — Hawaiian chiefs gave feather capes to Captain **James Cook** (1778–79) and others."],["Content","Color and pattern, not figures. **Red** feathers (from the ʻiʻiwi bird) were associated with **the gods**; **yellow** feathers (from the ʻōʻō and mamo) were **rarer and most prestigious**. Birds were caught, and some released after plucking."],["Context","The labor and rare feathers made these the **most valuable objects in Hawaiʻi** — wearable wealth and genealogy. Made by men, with the feather supply controlled as tribute to chiefs. Many are now in Western museums from contact-period gifts."],["Exam hooks","red = gods, yellow = rare · aliʻi only · mana and protection · battle + ceremony · diplomatic gifts to Cook."],["One-sentence thesis","The ʻahu ʻula wrapped Hawaiian chiefs in visible mana, turning rare feathers and sacred labor into a statement of divine rank and protection."],["Compare with","**Motecuhzoma's feather headdress** (#158 — feathers as elite, sacred material; classic cross-cultural pair); Golden Stool (object embodying rulership)."]]},{n:216,title:"Staff god",maker:"Rarotonga, Cook Islands, central Polynesia",date:"Late 18th to early 19th century C.E.",medium:"Wood, tapa, fiber, and feathers",context:"A carved wooden shaft with a large head at the top and a descending row of small figures alternating between profile and frontal views, wrapped in many yards of barkcloth that concealed a sacred core of feathers and pearl shell. After missionaries arrived in the 1820s most were unwrapped, cut apart, or burned, so few survive intact.",unit:9,unitName:"The Pacific",year:1775,images:[{src:"cb/216-1.jpg",w:1200,h:365,caption:"Staff god",credit:"© The Trustees of the British Museum"},{src:"cb/216-2.jpg",w:466,h:812,caption:"",credit:""},{src:"cb/216-3.jpg",w:992,h:818,caption:"Contextual image: staff god",credit:"© The Trustees of the British Museum"}],thumb:["thumbs/t2-u9.webp",3,0,6,2],notes:[["Form",'A wooden staff (some up to 4 m) with a **carved head of a god** at the top and a **row of smaller figures** below (alternating frontal and profile, some with phalluses) — often read as the god and his **descendants (generations)**. The central shaft was **wrapped in a huge roll of tapa (barkcloth)**; inside, sacred **red feathers and pearl shell** were placed — the hidden "soul" of the god.'],["Function","Represented a creator/ancestral deity (possibly **Tangaroa**) and was **carried in procession** or displayed in ritual. The **tapa wrapping protected and concealed** the concentrated mana (tapu) inside — the power was in what was hidden."],["Content","Deity + genealogy; fertility (phallic figures)."],["Context","**London Missionary Society** (e.g., John Williams) arrived in the 1820s. Converted islanders **surrendered their gods**; missionaries **stripped off the tapa, cut off the phalluses, burned many staffs**, and **sent some to London as trophies of conversion**. The surviving staffs are **evidence of that encounter** — their current state reflects colonial history."],["Exam hooks","tapa wrapping = concealed mana · genealogy of figures · missionary destruction · trophies of conversion."],["One-sentence thesis","The Rarotongan staff god hid sacred power inside layers of barkcloth, and its survival as a missionary trophy records the collision between Polynesian religion and Christian conversion."],["Compare with",`Nkisi n'kondi (sacred power contained inside; seized by missionaries as "fetishes"); Nukuoro deity.`]]},{n:217,title:"Female deity",maker:"Nukuoro, Micronesia",date:"c. 18th to 19th century C.E.",medium:"Wood",context:"A radically simplified figure: a smooth ovoid head with no facial features, a cylindrical torso, tapering limbs, and a slight forward lean. Kept in a communal cult house and associated with a particular deity, clan, or place; dressed and given offerings at harvest festivals. Its abstraction was later admired by European modernists.",unit:9,unitName:"The Pacific",year:1700,images:[{src:"cb/217-1.jpg",w:652,h:782,caption:"Female deity",credit:"© Werner Forman Archive/The Bridgeman Art Library"}],thumb:["thumbs/t2-u9.webp",4,0,6,2],notes:[["Form","Highly **simplified, abstract female figure**: an **egg-shaped head with no facial features**, sloping shoulders, arms merging with the body, slight suggestions of breasts and navel, bent legs. Smooth, symmetrical, geometric. Sizes range from small to over 2 m."],["Function","Kept in the **community temple** (amalau); each figure represented a **specific deity** (often named). During ceremonies they were **dressed, decorated with garlands and flowers**, and received offerings. Some were tied to particular families."],["Content","A goddess/ancestral deity — shown through abstraction, not naturalism. Lack of a face emphasizes the divine rather than individual."],["Context","Nukuoro is a **Polynesian outlier** — an atoll in Micronesia where people speak a Polynesian language and share Polynesian religious ideas. Only a few dozen figures survive. Their pure abstraction was **admired by 20th-century modernists**."],["Exam hooks","featureless ovoid head · abstraction = divinity · dressed in ceremony · Polynesian outlier in Micronesia."],["One-sentence thesis","The Nukuoro deity's radical simplification presents the divine as pure, faceless form, completed through dressing and ritual in the community temple."],["Compare with","Tlatilco figurine (female form, very different proportions); Byeri reliquary (influence on modernism); Lukasa (abstract form with coded meaning)."]]},{n:218,title:"Buk (mask)",maker:"Torres Strait",date:"Mid- to late 19th century C.E.",medium:"Turtle shell, wood, fiber, feathers, and shell",context:"A composite human face crowned by a frigate bird, built from turtle-shell plates that were heated, cut, and lashed together — a construction technique unique to the Torres Strait. Worn with full costume, drumming, and dance in funerary and increase ceremonies. Missionaries suppressed those ceremonies in the 1870s.",unit:9,unitName:"The Pacific",year:1875,images:[{src:"cb/218-1.jpg",w:613,h:766,caption:"Buk",credit:"Image © The Metropolitan Museum of Art/Image source © Art Resource, NY"}],thumb:["thumbs/t2-u9.webp",5,0,6,2],notes:[["Form","A **composite mask** made of plates of **turtle shell**, heated, bent, and stitched together, often combining a **human face with animals** — e.g., a bird figure (frigate bird) crowning the face, crocodile or fish forms. Decorated with **feathers, shells, fiber (grass) fringes**, and incised/painted details. Turtle shell was used because the small islands **lacked large trees** for wood carving."],["Function","Worn in **ceremonies with dance and music** — **funerary rites, initiation, and increase (fertility/abundance) rituals**. The masks linked the wearer to **clan totems** and to spirits/ancestors. The performer's whole body was covered with a grass costume, so the mask transformed the dancer into the spirit."],["Content","Human–animal fusion; totems (animals associated with clans)."],["Context",'The **London Missionary Society** arrived in **1871** ("The Coming of the Light," still commemorated), after which these ceremonies declined and many masks were collected by Europeans.'],["Exam hooks","turtle shell (material adapted to environment) · human + animal totems · performance with costume and music · funerary/initiation."],["One-sentence thesis","The Buk mask fused human and totemic animal forms in turtle shell, transforming its wearer in ceremonies that linked Torres Strait clans to their ancestors."],["Compare with","Transformation mask (human/animal transformation in performance); Malagan mask (funerary performance)."]]},{n:219,title:"Hiapo (tapa)",maker:"Niue",date:"c. 1850–1900 C.E.",medium:"Tapa or bark cloth, freehand painting",context:"Barkcloth beaten from paper mulberry and then painted freehand rather than stamped. Niuean hiapo use fine concentric grids, spirals, and plant forms whose motifs shrink toward the center. Made by women and used for clothing, gifts, and ceremonial exchange; some late examples carry missionary-era additions, including written names.",unit:9,unitName:"The Pacific",year:1850,images:[{src:"cb/219-1.jpg",w:992,h:768,caption:"Hiapo",credit:"© Auckland War Memorial Museum/Pacific Collection 1948.34"}],thumb:["thumbs/t2-u9.webp",0,1,6,2],notes:[["Form","**Barkcloth** made by **beating the inner bark of the paper mulberry tree** into thin sheets. Niuean hiapo is distinctive for **freehand painting** (not stenciled or rubbed as in other islands) with **extremely fine, intricate geometric patterns** — grids, circles, radiating lines — in brown pigment, sometimes with small **naturalistic plants and human figures**."],["Function","Used as **clothing**, **gifts**, and **exchange wealth** at important events. Tapa is a form of women's wealth in Polynesia."],["Content","Geometric pattern (inherited from ancestors, like Lapita) plus new naturalistic motifs."],["Context","Made by **women**. The late-19th-century style shows **missionary influence** — **Samoan missionaries/teachers** (London Missionary Society) brought Samoan tapa techniques to Niue, and Christianity encouraged covering the body with cloth. Hiapo production **died out** in the early 20th century as imported cotton replaced it."],["Exam hooks","freehand painting · paper mulberry bark · women's art · missionary/Samoan influence · fine geometric detail."],["One-sentence thesis","Niuean hiapo combined ancestral geometric design with new freehand, naturalistic motifs under missionary influence, making barkcloth a record of cultural exchange."],["Compare with","Lapita fragment (geometric Pacific design); Fijian mats and tapa (#223 — barkcloth in exchange); All-T'oqapu tunic (textile as high-value art)."]]},{n:220,title:"Tamati Waka Nene",maker:"Gottfried Lindauer",date:"1890 C.E.",medium:"Oil on canvas",context:"A posthumous portrait of a Ngati Hao chief, painted from a photograph by a Bohemian-born immigrant to New Zealand. Nene wears a kiwi-feather cloak and holds a hei-tiki and a chief's staff (tewhatewha); his moko is rendered precisely as a record of identity and rank. Nene was a Christian convert who backed the 1840 Treaty of Waitangi.",unit:9,unitName:"The Pacific",year:1890,images:[{src:"cb/220-1.jpg",w:559,h:707,caption:"Tamati Waka Nene",credit:"© Corbis"}],thumb:["thumbs/t2-u9.webp",1,1,6,2],notes:[["Form","Western-style **oil portrait**, **realistic**, three-quarter view, dark background, highly detailed. Tāmati Wāka Nene is shown with **tā moko (facial tattoo)**, a **kahu kiwi (kiwi-feather cloak)**, a carved staff, and greenstone (pounamu) ornament — **Māori status regalia**."],["Function","Commemorative portrait of an important **rangatira (chief)** — painted **after his death (he died 1871) from a photograph**. Commissioned by Henry Partridge, who later gave his Lindauer collection to the Auckland Art Gallery."],["Content","Tāmati Wāka Nene, a **Ngāpuhi chief** who **supported the British**, encouraged other chiefs to sign the **Treaty of Waitangi (1840)**, and fought on the British side against Hōne Heke in the Flagstaff War (1845–46)."],["Context",'Lindauer was a **Bohemian (Czech)-born** painter who emigrated to New Zealand in 1874 and painted many Māori subjects. For **Māori, portraits are taonga (treasures)** that carry the **presence of the ancestor** — descendants greet and speak to them, so a Western object took on Māori meaning. **Tā moko** records genealogy and rank; it is unique to the individual — so the moko itself works as a "signature."'],["Exam hooks","European artist + Māori subject · oil = Western medium · moko = identity/genealogy · Treaty of Waitangi · portraits as living ancestors (taonga)."],["One-sentence thesis","Lindauer's portrait uses Western oil-painting realism to record the Māori insignia of a British-allied chief, and for Māori it became a living embodiment of an ancestor."],["Compare with","Ndop of Mishe miShyaang maMbul (portrait identified by attributes; spirit of the ruler); Mblo portrait mask (portraiture of a specific person)."]]},{n:221,title:"Navigation chart",maker:"Marshall Islands, Micronesia",date:"19th to early 20th century C.E.",medium:"Wood and fiber",context:"A lattice of palm ribs lashed with coconut fiber that charts not islands but ocean swells — how waves bend, refract, and cross around land. Shells or knots mark islands. Charts were studied and memorized on shore and left behind at sea; the knowledge was restricted to trained navigators and passed down within families.",unit:9,unitName:"The Pacific",year:1800,images:[{src:"cb/221-1.jpg",w:993,h:713,caption:"Navigation chart",credit:"© The Trustees of the British Museum"}],thumb:["thumbs/t2-u9.webp",2,1,6,2],notes:[["Form","A grid-like framework of **sticks (coconut palm midribs) tied with fiber**; **curved sticks** show **ocean swells** and how they bend (refract) and intersect around islands; **shells (cowries)** mark island positions."],["Function","**Teaching and memory tool** for navigators — **not carried on voyages**. Navigators memorized the charts and then **felt the swells through the hull of the canoe** (sometimes lying down to sense them with their body). Types: **mattang** (teaching general swell principles), **meddo** (a section of islands), **rebbelib** (whole island chains)."],["Content","An abstract map of **wave patterns, not coastlines** — maps of *process*, not land."],["Context","Knowledge was **restricted, passed within families and chiefs**, a source of power. Shows the sophisticated **Pacific wayfinding** that allowed settlement of remote islands."],["Exam hooks","maps swells not land · memorized, not taken on the canoe · mattang/meddo/rebbelib · specialized knowledge = power."],["One-sentence thesis","Marshall Islands stick charts abstract the ocean's swells into a memorized system of knowledge that made Pacific navigation — and island life — possible."],["Compare with","**Lukasa** (#177 — memory device read by specialists; classic pair); Lapita (migration by sea)."]]},{n:222,title:"Malagan display and mask",maker:"New Ireland Province, Papua New Guinea",date:"c. 20th century C.E.",medium:"Wood, pigment, fiber, and shell",context:"Openwork carvings and tatanua masks made for malagan funerary ceremonies held months or years after a death, to honor the dead and settle social obligations. Commissioned from specialists, displayed once, then destroyed, sold, or left to rot — the ceremony, not the object, is the work. Bright pigments, sea-snail-shell eyes, crested fiber hair.",unit:9,unitName:"The Pacific",year:1900,images:[{src:"cb/222-1.jpg",w:760,h:912,caption:"Malagan mask",credit:"University Museum, Pennsylvania, PA, USA/Photo © AISA/ The Bridgeman Art Library"},{src:"cb/222-2.jpg",w:1200,h:884,caption:"Malagan display",credit:"© Peter Horner, 1978 © Museum der Kulturen Basel, Switzerland"}],thumb:["thumbs/t2-u9.webp",3,1,6,2],notes:[["Form","**Intricately carved, openwork** wooden sculptures, brightly painted in red, black, white and yellow, with figures of **fish, birds, snakes, pigs, and humans** interlocking (e.g., a bird biting a snake). The **tatanua mask** has a tall crested hairstyle (one side often shaved-looking, a mourning style), **fiber, and shell (snail operculum) eyes**."],["Function","Made for **malagan**, a series of **funerary/memorial ceremonies** held months or years after a death. Carvings are displayed in a **temporary display house**, then **destroyed, left to rot, or sold** — they are **ephemeral**; their job ends when the ceremony ends. Men wear masks (tatanua) in dances. The ceremony **honors the dead, frees their spirit, and transfers land rights and obligations** to the living."],["Content","Clan images and ancestral/totemic creatures; complex, layered imagery tied to specific clans who **own the rights to particular malagan designs**."],["Context","Europeans collected many malagan carvings (they were meant to be discarded, so many were sold). Tradition still practiced. Shows art as **process and event**, not permanent object."],["Exam hooks","funerary · ephemeral (destroyed after use) · openwork carving · clan ownership of designs · tatanua mask in dance."],["One-sentence thesis","Malagan carvings are intense but temporary: their openwork forms honor the dead during memorial ceremonies and are then discarded once the spirit and social obligations have been released."],["Compare with","Buk mask (performance/funeral); Byeri (ancestors and the dead); Great Mosque of Djenné (communal ritual maintenance)."]]},{n:223,title:"Presentation of Fijian mats and tapa cloths to Queen Elizabeth II",maker:"Fiji, Polynesia",date:"1953 C.E.",medium:"Multimedia performance (costume; cosmetics, including scent; chant; movement; and pandanus fiber/hibiscus fiber mats), photographic documentation",context:"During the 1953 royal tour, Fijian women presented finely woven pandanus mats and masi (barkcloth) to the Queen. The work of art is the whole event — textiles, oiled and scented bodies, chant, and choreography together. Ceremonial exchange of mats and tapa binds rank and relationship; here it also negotiated Fiji's place in the British Empire.",unit:9,unitName:"The Pacific",year:1953,images:[{src:"cb/223-1.jpg",w:1200,h:863,caption:"Presentation of Fijian mats and tapa cloths to Queen Elizabeth II during the 1953-4 royal tour",credit:"Courtesy of Alexander Turnbull Library, Wellington, New Zealand"}],thumb:["thumbs/t2-u9.webp",4,1,6,2],notes:[["Form","A **performance**: a long procession of Fijian **women carrying and wearing enormous lengths of masi (tapa/barkcloth) and finely woven pandanus mats (ibe)**, presented to the Queen. The art is the **whole event** — the cloth, the costumes, the movement, the ceremony."],["Function","A formal **gift-giving ceremony** welcoming **Queen Elizabeth II and Prince Philip** during their **1953–54 Commonwealth tour** after her coronation. Gift-giving in Fiji creates **reciprocal relationships and obligations** — the presentation both **honored** her and **asserted Fijian identity, rank, and wealth** (and implied obligations in return)."],["Content","Barkcloth and mats — **women's wealth**, made by women, displayed by women."],["Context","Fiji was a **British Crown colony (from 1874 to independence in 1970)**. Photographed and filmed, so the ephemeral event survives through documentation. Shows how Pacific people used their own **ceremonial forms to shape colonial encounters**."],["Exam hooks","performance art (ephemeral) · women's textiles as wealth · reciprocity/exchange · colonial context · documented by photo/film."],["One-sentence thesis","The 1953 presentation turned Fijian women's barkcloth and mats into a performance of wealth, identity, and reciprocal obligation directed at the British monarch."],["Compare with","Hiapo (tapa); Golden Stool (object central to power and resistance to British demands); ʻAhu ʻula (Pacific gifts to European visitors)."]]},{n:224,title:"The Gates",maker:"Christo and Jeanne-Claude",date:"1979–2005 C.E.",medium:"Mixed-media installation",context:"7,503 saffron fabric panels hung from vinyl gates along 23 miles of Central Park paths for sixteen days in February. Twenty-six years of negotiation with the city, and entirely self-funded by selling preparatory drawings, so there were no sponsors and no admission. Temporary by design — the work includes its own disappearance.",unit:10,unitName:"Global Contemporary",year:1979,images:[{src:"cb/224-1.jpg",w:698,h:484,caption:"The Gates",credit:"© Chip East/Reuters/Corbis"},{src:"cb/224-2.jpg",w:1200,h:449,caption:"The Gates",credit:"© Panoramic Images/Getty Images"}],thumb:["thumbs/t2-u10.webp",0,0,8,4],notes:[["Form","An installation of **7,503 gates** along 23 miles of paths in **Central Park**, New York. Each gate was 16 feet tall, with a frame of **saffron**-colored vinyl hung with **saffron nylon fabric** panels that moved in the wind."],["Function","A **temporary** public artwork, on view for only **16 days** in February 2005, then removed and recycled."],["Content","The fabric made a ribbon of color through the bare winter trees, drawing attention to the park's paths and the way people move through them."],["Context","**Christo and Jeanne-Claude** paid for the project entirely themselves by selling preparatory drawings and collages, accepting no sponsorship. It took **26 years** to get permission (proposed in 1979). Its impermanence was essential to its meaning: 'the joy of seeing something that will not last'."],["Exam hooks","Christo and Jeanne-Claude · Central Park · temporary (16 days) · saffron fabric · self-funded · 26 years of approvals · public art"],["Compare with","Spiral Jetty (#151): art in the landscape. Malagan (#222): ephemeral art."]]},{n:225,title:"Vietnam Veterans Memorial",maker:"Maya Lin",date:"1982 C.E.",medium:"Granite",context:"Two polished black granite walls cut into the earth, meeting at an angle that points to the Washington Monument and the Lincoln Memorial. Some 58,000 names run in chronological order of death rather than by rank. Visitors descend as the wall rises over them and see themselves reflected among the names. Lin was a 21-year-old undergraduate, and the design was attacked before it was built.",unit:10,unitName:"Global Contemporary",year:1982,images:[{src:"cb/225-1.jpg",w:992,h:666,caption:"Vietnam Veterans Memorial",credit:"© James P. Blair/Corbis"},{src:"cb/225-2.jpg",w:992,h:661,caption:"Detail",credit:"© Ian Dagnall/Alamy"}],thumb:["thumbs/t2-u10.webp",1,0,8,4],notes:[["Form","A **V-shaped** wall of polished black **granite** sunk into the earth, its two arms about 246 feet long, pointing toward the **Washington Monument** and the **Lincoln Memorial**. The reflective surface shows the viewer's face among the names."],["Function","A memorial to American service members who died or went missing in the **Vietnam War**."],["Content","About **58,000 names** are inscribed in **chronological** order of death, beginning and ending at the apex, where the war's start (1959) and end (1975) meet. Visitors leave objects and make rubbings of names."],["Context","**Maya Lin**, then a 21-year-old Yale architecture student, won the open competition. Her **minimalist** design was **controversial**: critics called it a 'black gash of shame', with no flags or heroic figures. As a compromise, a traditional statue of three soldiers and a flag were added nearby. It is now one of the most visited memorials, and it changed how memorials are designed, toward reflection rather than heroism."],["Exam hooks","Maya Lin · minimalism · black granite · names chronological · reflective surface · V-shape · controversy · anti-heroic memorial"],["Compare with","Burghers of Calais (#119): non-heroic memorial at ground level. Lipstick (Ascending) (#150): Vietnam War protest. Shibboleth (#248)."]]},{n:226,title:"Horn Players",maker:"Jean-Michel Basquiat",date:"1983 C.E.",medium:"Acrylic and oil paintstick on three canvas panels",context:"A triptych of Charlie Parker and Dizzy Gillespie against black, crowded with crossed-out words, repeated fragments, anatomy-book scraps and a copyright symbol. Basquiat said he crossed words out so you would look at them harder. Graffiti-derived mark-making claiming gallery space, with Black genius as the subject.",unit:10,unitName:"Global Contemporary",year:1983,images:[{src:"cb/226-1.jpg",w:520,h:663,caption:"Horn Players",credit:"Photography © Douglas M. Parker Studio, Los Angeles © The Estate of the Artist/ADAGP, Paris/ARS New York 2013"}],thumb:["thumbs/t2-u10.webp",2,0,8,4],notes:[["Form","**Acrylic and oil paintstick** on three wooden panels (a **triptych**). Graffiti-like, crowded imagery with crossed-out words, scrawled text, cartoonish figures and a black background."],["Function","A painting for the gallery art world."],["Content","A tribute to **bebop** jazz musicians **Charlie Parker** (saxophone) and **Dizzy Gillespie** (trumpet). Their names, song titles ('Ornithology'), words such as 'Pree', 'Dizzy' and phrases appear, along with fragments of their biography. A central figure shows a disembodied ear and mouth."],["Context","**Jean-Michel Basquiat** started as a graffiti artist (SAMO) in New York and became a star of 1980s **Neo-Expressionism**. He celebrated Black heroes and history, and confronted racism and commercialization. The triptych format echoes religious altarpieces, making the musicians into saints. He died of an overdose at 27."],["Exam hooks","Basquiat · graffiti/Neo-Expressionism · triptych · Charlie Parker and Dizzy Gillespie · bebop · text and crossed-out words · Black heroes"],["Compare with","Marilyn Diptych (#147): icon format. Dancing at the Louvre (#232): Black artists and history."]]},{n:227,title:"Summer Trees",maker:"Song Su-nam",date:"1983 C.E.",medium:"Ink on paper",context:"Vertical bands of grey and black ink wash, dense at the centre and dissolving at the edges. Song led the Sumukhwa (ink) movement in South Korea, which used the traditional literati medium to make abstraction that was not simply imported from New York — an argument that modern painting could have Korean roots.",unit:10,unitName:"Global Contemporary",year:1983,images:[{src:"cb/227-1.jpg",w:992,h:663,caption:"Summer Trees",credit:"© The Trustees of the British Museum"}],thumb:["thumbs/t2-u10.webp",3,0,8,4],notes:[["Form","**Ink on paper**: layered, soft, wet vertical strokes of ink bleeding into the paper. It is nearly abstract, with gradations from dark to light."],["Function","A painting for contemplation."],["Content","Summer **trees**, reduced to vertical blurred strokes suggesting tree trunks and leaves."],["Context","**Song Su-nam**, Korean, a leader of the **Sumukhwa** (ink painting) movement of the 1980s. It reasserted **traditional East Asian ink painting** against Western influence, while connecting to Western Abstract Expressionism and Color Field painting (compare Frankenthaler, #149). It aims for a meditative, essential quality."],["Exam hooks","Song Su-nam · Korea · ink on paper · Sumukhwa movement · tradition and abstraction · bleeding ink"],["Compare with","Travelers among Mountains and Streams (#201): ink tradition. The Bay (#149): soak-stain."]]},{n:228,title:"Androgyn III",maker:"Magdalena Abakanowicz",date:"1985 C.E.",medium:"Burlap, resin, wood, nails, string",context:"A hollow, headless, armless torso of stiffened burlap seated on a rack of wooden poles. Cast from a mould, but each one comes out unique, and the interior is visible and empty. Abakanowicz grew up under Nazi occupation and then Soviet-bloc rule; her figures are about the anonymous crowd and the body as a shell.",unit:10,unitName:"Global Contemporary",year:1985,images:[{src:"cb/228-1.jpg",w:960,h:1200,caption:"Androgyne III",credit:"© Magdalena Abakanowicz, Courtesy Marlborough Gallery, New York/Image © The Metropolitan Museum of Art/Image Source © Art Resource, NY"}],thumb:["thumbs/t2-u10.webp",4,0,8,4],notes:[["Form","A series of **headless**, hollow seated figures made of **burlap** stiffened with **resin**, sitting on wooden stretcher frames (like benches). The figures are seen from the front as solid torsos and from behind as hollow shells. The texture is rough, like skin or bark."],["Function","An installation of repeated figures."],["Content","Anonymous, vulnerable human bodies without heads or individual identity, both empty and present. 'Androgyn' means neither clearly male nor female."],["Context","**Magdalena Abakanowicz**, Polish, who lived through **World War II** and **communist** rule. The figures suggest **mass society**, loss of individuality and suffering under totalitarianism. She came from textile art (**fiber art**)."],["Exam hooks","Abakanowicz · burlap and resin · headless hollow figures · anonymity · Polish history · WWII and communism · fiber art"],["Compare with","Burghers of Calais (#119): human vulnerability. Kui Hua Zi (#250): masses."]]},{n:229,title:"A Book from the Sky",maker:"Xu Bing",date:"1987–1991 C.E.",medium:"Mixed-media installation",context:"Scrolls and bound volumes filling a room, printed from four thousand hand-cut wooden characters Xu invented — every one looks like a real Chinese character and none means anything. Four years of labour producing pure illegibility. Read as a comment on the exhaustion of language, on Cultural Revolution slogans, and on literacy itself.",unit:10,unitName:"Global Contemporary",year:1987,images:[{src:"cb/229-1.jpg",w:946,h:1200,caption:"A Book from the Sky",credit:"Used by Permission"}],thumb:["thumbs/t2-u10.webp",5,0,8,4],notes:[["Form","An immersive **installation** of hand-printed books, scrolls hanging from the ceiling and panels on the walls, all printed with about **4,000 invented characters** that look like Chinese but are **meaningless**. The characters were carved by Xu Bing into movable wooden type over about three years and printed using traditional methods."],["Function","An installation in which viewers are surrounded by **unreadable** text."],["Content","Everyone, including readers of Chinese, is equally unable to read it. The work questions language, knowledge, authority and communication."],["Context","**Xu Bing**, Chinese. Made after the **Cultural Revolution**, when language was used for propaganda, and around the time of the **Tiananmen** protests (1989). The authorities criticized it. It plays with Chinese reverence for the written word and the book."],["Exam hooks","Xu Bing · invented characters · meaningless text · traditional printing · Cultural Revolution and Tiananmen · language and power"],["Compare with","Folio from a Qur'an (#187): sacred script. Chairman Mao en Route to Anyuan (#212): propaganda."]]},{n:230,title:"Pink Panther",maker:"Jeff Koons",date:"1988 C.E.",medium:"Glazed porcelain",context:"A blonde in the pose of a Baroque nude embraces a limp cartoon panther, finished like a giftshop figurine and made by Italian ceramic artisans to Koons's specification. From the Banality series. Kitsch elevated deliberately, to test where taste comes from and whether it survives money.",unit:10,unitName:"Global Contemporary",year:1988,images:[{src:"cb/230-1.jpg",w:791,h:1032,caption:"Pink Panther",credit:"Permission of the Artist © The Museum of Modern Art/Licensed by SCALA/ Art Resource, NY"}],thumb:["thumbs/t2-u10.webp",6,0,8,4],notes:[["Form","A large **glazed porcelain** sculpture produced by skilled craftsmen in a factory: shiny, colorful and kitschy."],["Function","Part of Koons's **Banality** series."],["Content","A blonde, topless woman (resembling the actress **Jayne Mansfield**) embraces the cartoon **Pink Panther**, who looks out at the viewer. It merges pin-up sexuality and pop culture."],["Context","**Jeff Koons**: kitsch, consumer culture and celebrity. He hires fabricators and does not make the work himself, building on Warhol and Duchamp. It raises questions about taste, the art market and the boundary between high and low art. His work sells for enormous prices."],["Exam hooks","Koons · kitsch · Banality series · porcelain · pop culture · fabricators · high vs. low art"],["Compare with","Fountain (#144): readymade. Marilyn Diptych (#147): celebrity. Venus of Urbino (#80): eroticism."]]},{n:231,title:"Untitled (#228), from the History Portraits series",maker:"Cindy Sherman",date:"1990 C.E.",medium:"Photograph",context:"Sherman as Judith holding the head of Holofernes, in prosthetics, wig and an obviously fake breastplate against a painted backdrop. She is photographer, model, stylist and subject at once. The series impersonates Old Master painting badly on purpose, exposing how femininity gets constructed and posed.",unit:10,unitName:"Global Contemporary",year:1990,images:[{src:"cb/231-1.jpg",w:620,h:1034,caption:"Untitled #228",credit:"Courtesy of the Artist and Metro Pictures"}],thumb:["thumbs/t2-u10.webp",7,0,8,4],notes:[["Form","A large color **photograph** in which **Cindy Sherman** herself poses in costume, makeup and **prosthetics** to look like a figure from an old master painting."],["Function","Part of the **History Portraits** series, made while she lived in Rome."],["Content","She poses as **Judith** holding the severed head of **Holofernes**, the biblical heroine who killed an Assyrian general. Artificial body parts and an obvious mask make the fakery visible."],["Context","Sherman uses her own body to examine **identity**, gender and the representation of women in art history and media. It parodies 'old master' painting and the male gaze, showing that historical images were constructed. She is a **postmodern** artist."],["Exam hooks","Cindy Sherman · photograph · self as subject · History Portraits · Judith and Holofernes · prosthetics · gender and art history"],["Compare with","Rebellious Silence (#235): identity in photography. Self-Portrait (#105): a woman artist."]]},{n:232,title:"Dancing at the Louvre",maker:"Faith Ringgold",date:"1991 C.E.",medium:"Acrylic on canvas, tie-dyed, pieced fabric border",context:"A story quilt: Willia Marie Simone and a friend's three daughters dance in front of the Mona Lisa. Ringgold's fictional narrator is a Black American woman artist in 1920s Paris, and the text sewn into the border tells her story. The quilt form ties the work to African American women's craft and to oral storytelling.",unit:10,unitName:"Global Contemporary",year:1991,images:[{src:"cb/232-1.jpg",w:993,h:906,caption:"Dancing at the Louvre, from the series The French Collection, Part I; #1",credit:"Faith Ringgold © 1991"}],thumb:["thumbs/t2-u10.webp",0,1,8,4],notes:[["Form","A **story quilt**: acrylic painting on canvas with a **tie-dyed, pieced fabric border**, and **handwritten text** panels above and below the image telling a story."],["Function","Part of the series **The French Collection**, which tells the fictional story of **Willia Marie Simone**, a young African American woman artist in Paris in the 1920s."],["Content","A mother and her three daughters **dance** joyfully in front of the **Mona Lisa** at the Louvre, rather than looking at the art. They are African Americans claiming space in a European art museum and an art history that excluded them."],["Context","**Faith Ringgold**. Quilting was a women's craft and an African American tradition, here elevated to fine art. The work combines narrative, feminism and Black history."],["Exam hooks","Ringgold · story quilt · French Collection · Mona Lisa · Black women in art history · craft as art · narrative text"],["Compare with","The Migration Series (#141): narrative of Black life. Dream of a Sunday Afternoon (#143): historical narrative."]]},{n:233,title:"Trade (Gifts for Trading Land with White People)",maker:"Jaune Quick-to-See Smith",date:"1992 C.E.",medium:"Oil and mixed media on canvas",context:"A canoe hangs above a triptych smeared with drips and collaged with newspaper from tribal papers, trading-post ads and cigar labels; from a line above dangle sports-team souvenirs — caps, pennants, toy tomahawks. Made for the Columbus quincentenary: she offers to trade the junk back for the continent.",unit:10,unitName:"Global Contemporary",year:1992,images:[{src:"cb/233-1.jpg",w:992,h:520,caption:"Trade (Gifts for Trading Land with White People)",credit:"Courtesy of Jaune Quick-to-See Smith (Member of the Salish Kootenai Nation, Montana) and the Accola Griefen Gallery, NY"}],thumb:["thumbs/t2-u10.webp",1,1,8,4],notes:[["Form","A large painting combining oil and **collage** of newspaper clippings with expressive drips. Above it, a **canoe** hangs from a chain line, and on the line are objects: sports team souvenirs with Native American mascots (Washington Redskins, Atlanta Braves and so on), toy tomahawks, plastic beads and Indian dolls."],["Function","Exhibited around the **1992 quincentennial** of Columbus's arrival in America."],["Content","The title proposes a deal: trade these cheap, stereotypical souvenirs to buy back the land taken from Native peoples. It is ironic and satirical."],["Context","**Jaune Quick-to-See Smith**, an enrolled member of the Confederated Salish and Kootenai Nation. She critiques the **colonization** of North America, the appropriation and commercialization of Native imagery, and the history of land theft through unfair trades."],["Exam hooks","Quick-to-See Smith · 1992 Columbus quincentennial · canoe and souvenirs · mascots · land theft · irony · Native identity"],["Compare with","Bandolier bag (#163): trade goods. Painted elk hide (#165): made for an outside market."]]},{n:234,title:"Earth's Creation",maker:"Emily Kame Kngwarreye",date:"1994 C.E.",medium:"Synthetic polymer paint on canvas",context:"Four panels, over twenty feet wide, in dense dry-brush dabs of green, red and yellow — the desert after rain. Kngwarreye was an Anmatyerre elder who began painting on canvas in her late seventies after decades of ceremonial body painting and batik. Her work maps her ancestral country, Alhalkere, rather than picturing a view of it.",unit:10,unitName:"Global Contemporary",year:1994,images:[{src:"cb/234-1.jpg",w:1003,h:435,caption:"Earth’s Creation",credit:"© VISCOPY, Australia/Image © National Museum of Australia/© 2013 Artists Rights Society (ARS), New York"}],thumb:["thumbs/t2-u10.webp",2,1,8,4],notes:[["Form","A huge **acrylic on canvas** painting (about 9 by 21 feet) with layered **dots** and overlapping color in an abstract, exuberant composition."],["Function","A painting that expresses connection to the land and Dreaming."],["Content","The **Dreaming** (the creation stories and ancestral law of Aboriginal people) and the land of **Alhalkere**, her country, during the wet season, when plants bloom."],["Context","**Emily Kame Kngwarreye**, an Aboriginal Australian (Anmatyerre) artist. She started painting on canvas in her late 70s, after a batik career, and produced over 3,000 works in about eight years. It resembles Abstract Expressionism but comes from **Indigenous** traditions of body painting and ceremony. It sold for over a million dollars, a record for a woman Aboriginal artist."],["Exam hooks","Kngwarreye · Aboriginal Australian · Dreaming · Alhalkere country · dots · late career · Indigenous and abstraction"],["Compare with","The Bay (#149): Western abstraction. Old Man's Cloth (#245): global Indigenous contemporary art."]]},{n:235,title:"Rebellious Silence, from the Women of Allah series",maker:"Shirin Neshat",date:"1994 C.E.",medium:"Ink on photograph",context:"A black-and-white photograph of a veiled woman whose face is split vertically by the barrel of a rifle, with Farsi poetry inked over her exposed skin. Neshat, an Iranian living in the US, gives the woman both the gun and the words — but the viewer cannot read them, which is a deliberate refusal of easy access.",unit:10,unitName:"Global Contemporary",year:1994,images:[{src:"cb/235-1.jpg",w:652,h:985,caption:"Rebellious Silence",credit:"Courtesy Gladstone Gallery, New York and Brussels"}],thumb:["thumbs/t2-u10.webp",3,1,8,4],notes:[["Form","A black-and-white **photograph** with hand-written **Farsi calligraphy** in ink on the subject's face."],["Function","Part of the **Women of Allah** series."],["Content","**Shirin Neshat** herself, wearing a **chador** (black veil), holds a **rifle** vertically, dividing her face. The calligraphy is **poetry by Iranian women** (Tahereh Saffarzadeh), about martyrdom and faith."],["Context","Neshat returned to Iran in 1990 after the **Islamic Revolution** (1979) and was struck by the changes. The series explores women's identity, religion, violence and **martyrdom** in post-revolutionary Iran, resisting simple Western stereotypes of veiled women. The text cannot be read by most Western viewers."],["Exam hooks","Neshat · Women of Allah · chador and rifle · Farsi poetry on face · Islamic Revolution · women and martyrdom · photography"],["Compare with","La Grande Odalisque (#107): Orientalism. Untitled #228 (#231): women's identity. A Book from the Sky (#229): text."]]},{n:236,title:"En la Barberia no se Llora (No Crying Allowed in the Barbershop)",maker:"Pepon Osorio",date:"1994 C.E.",medium:"Mixed-media installation",context:"A working barbershop set stuffed to the ceiling: barber chairs, plastic palm trees, video monitors playing circumcisions and boxing, photographs of men, toy soldiers, and images of babies set into the seats. Made for a Puerto Rican neighbourhood in Hartford, examining machismo in the room where boys learn it.",unit:10,unitName:"Global Contemporary",year:1994,images:[{src:"cb/236-1.jpg",w:504,h:768,caption:"En la Barberia no se Llora",credit:"Courtesy Ronald Feldman Fine Arts, New York/www.feldmangallery.com"}],thumb:["thumbs/t2-u10.webp",4,1,8,4],notes:[["Form","An immersive, cluttered **installation** recreating a **barbershop** with barber chairs, mirrors, photos, toys, mementos and **video monitors** in the headrests showing men crying."],["Function","Installed in an empty storefront in **Hartford, Connecticut**, a Puerto Rican neighborhood, and later in galleries."],["Content","The barbershop is a place of male bonding and **masculinity**, where boys learn to be men. Videos show men expressing emotion, yet the title says 'No crying allowed in the barbershop'. A boy's first haircut is a rite of passage."],["Context","**Pepón Osorio**, Puerto Rican. He critiques **machismo** and gender expectations in Latino culture, and creates installations with communities."],["Exam hooks","Osorio · installation · barbershop · masculinity/machismo · Puerto Rican community · videos of crying men · site-specific"],["Compare with","Electronic Superhighway (#238): video. Pisupo Lua Afe (#237): culture and identity."]]},{n:237,title:"Pisupo Lua Afe (Corned Beef 2000)",maker:"Michel Tuffery",date:"1994 C.E.",medium:"Mixed media",context:"A life-size bull built from flattened corned-beef tins riveted together. Pisupo — 'pea soup' — became the Samoan word for all imported canned food. The bull is both the cattle the tin displaced and a satire of an imported diet that has damaged Pacific health; some versions are wheeled and made to charge each other.",unit:10,unitName:"Global Contemporary",year:1994,images:[{src:"cb/237-1.jpg",w:992,h:824,caption:"Pisupo Lua Afe",credit:"© Michel Tuffery MNZM/Museum of New Zealand Te Papa Tongarewa #FE010516"}],thumb:["thumbs/t2-u10.webp",5,1,8,4],notes:[["Form","A life-size **bull** sculpture made of flattened **corned beef cans**, riveted together."],["Function","A sculpture for exhibition; Tuffery also used his can bulls in public performances."],["Content","Corned beef (**pisupo**) is imported canned food that became central to **Samoan** ceremonies and gift exchange, replacing traditional foods such as fish and taro."],["Context","**Michel Tuffery**, a New Zealand artist of Samoan, Rarotongan and Tahitian heritage. He critiques **globalization** and colonial trade: imported processed food brought health problems (obesity, diabetes) and dependency. The bull also refers to the cattle introduced by colonizers."],["Exam hooks","Tuffery · corned beef cans · bull · Samoa/Pacific · globalization · imported food · health · gift exchange"],["Compare with","Presentation of Fijian mats and tapa (#223): Pacific gift exchange. Old Man's Cloth (#245): recycled materials."]]},{n:238,title:"Electronic Superhighway: Continental U.S., Alaska, Hawaii",maker:"Nam June Paik",date:"1995 C.E.",medium:"Mixed-media installation (49-channel closed-circuit video)",context:"A neon map of the United States, each state outlined in colour and filled with television monitors playing footage particular to that state, with a live camera feed for the viewer's own state. Paik coined the phrase 'electronic superhighway' in 1974. The work is about a country experienced through screens rather than travel.",unit:10,unitName:"Global Contemporary",year:1995,images:[{src:"cb/238-1.jpg",w:1008,h:763,caption:"Electronic Superhighway",credit:"Photo © Smithsonian American Art Museum, Washington, DC/Art Resource, NY"}],thumb:["thumbs/t2-u10.webp",6,1,8,4],notes:[["Form","A huge **video installation**: over 300 TV monitors (with 49-channel video) arranged to form a **map of the United States**, outlined in colored **neon** that marks each state. Each state shows video related to it, such as The Wizard of Oz for Kansas."],["Function","An installation at the Smithsonian American Art Museum."],["Content","America seen through **media**, television and pop culture; the 'electronic superhighway' was a term Paik coined in the 1970s, anticipating the Internet. A closed-circuit camera in Washington, D.C., shows viewers themselves."],["Context","**Nam June Paik**, Korean-American, the 'father of **video art**', and part of the Fluxus movement. It is about mobility, communication and the information overload of American culture."],["Exam hooks","Nam June Paik · video art · map of U.S. in monitors · neon · media saturation · 'electronic superhighway' · Fluxus"],["Compare with","The Crossing (#239): video. Horse in Motion (#117): moving images."]]},{n:239,title:"The Crossing",maker:"Bill Viola",date:"1996 C.E.",medium:"Video/sound installation",context:"Two large projections on opposite faces of one screen. On one, a man is slowly consumed by fire; on the other, drowned by a rising column of water. Both run about ten minutes in extreme slow motion with roaring sound, and both end in silence and disappearance. Viola draws on religious mysticism and on nearly drowning as a child.",unit:10,unitName:"Global Contemporary",year:1996,images:[{src:"cb/239-1.jpg",w:684,h:878,caption:"The Crossing",credit:"Photo © Kira Perov"}],thumb:["thumbs/t2-u10.webp",7,1,8,4],notes:[["Form","A **video and sound installation**: two large videos projected back to back on a screen in a dark room, with loud sound. Each shows a man walking slowly toward the viewer; then on one side **fire** engulfs him and on the other **water** pours down over him until he disappears. It is in slow motion."],["Function","An immersive, spiritual experience for the viewer."],["Content","Fire and water: **destruction and purification**, death and rebirth, transcendence, drawing on Christian, Buddhist and Sufi ideas."],["Context","**Bill Viola**, an American video artist, influenced by religious and mystical traditions and by Renaissance painting (the diptych format). The extreme slowness makes time itself the medium."],["Exam hooks","Bill Viola · video installation · fire and water · slow motion · transcendence · spiritual · diptych"],["Compare with","Electronic Superhighway (#238): video. Isenheim (#77): religious transformation."]]},{n:240,title:"Guggenheim Museum Bilbao",maker:"Frank Gehry",date:"1997 C.E.",medium:"Titanium, glass, and limestone",context:"Curving titanium volumes on a former industrial riverfront, designed with aerospace software that made the shapes buildable and costable. The titanium skin is half a millimetre thick and changes colour with the weather. It worked so well as urban regeneration that 'the Bilbao effect' became a planning term.",unit:10,unitName:"Global Contemporary",year:1997,images:[{src:"cb/240-1.jpg",w:1016,h:762,caption:"Guggenheim Museum Bilbao",credit:"© Rolf Haid/dpa/Corbis"},{src:"cb/240-2.jpg",w:512,h:768,caption:"Guggenheim Museum Bilbao",credit:"© Jacques Pavlovsky/Sygma/CORBIS"},{src:"cb/240-3.jpg",w:1016,h:789,caption:"Guggenheim Museum Bilbao site plan",credit:"© FMGB Guggenheim Bilbao Museoa"}],thumb:["thumbs/t2-u10.webp",0,2,8,4],notes:[["Form","A museum with swooping, curving forms clad in shimmering **titanium** panels, glass and limestone. The design was made with **CATIA**, a computer design program from aerospace engineering. A huge atrium sits inside; the building sits on the **Nervión River** in Bilbao, Spain."],["Function","A branch of the **Guggenheim** museum, designed to show large contemporary art."],["Content","From the river, it can look like a **ship** or a fish, referring to Bilbao's industrial port."],["Context","**Frank Gehry**, **Deconstructivism**. It revived the declining industrial city, and the economic and tourism boost from a signature building became known as the '**Bilbao effect**'. It was an engineering feat. Critics argue the architecture competes with the art."],["Exam hooks","Gehry · titanium curves · CATIA software · Deconstructivism · Bilbao effect · urban renewal · ship form"],["Compare with","MAXXI (#249): contemporary museum architecture. San Carlo (#88): curving walls."]]},{n:241,title:"Pure Land",maker:"Mariko Mori",date:"1998 C.E.",medium:"Color photograph on glass",context:"Mori as a many-armed deity floating on a lotus above the Dead Sea, surrounded by cartoonish alien musicians, in pastel digital light. The title refers to the western paradise of Japanese Pure Land Buddhism. Buddhist iconography merged with anime, club culture and digital compositing — sincere and camp at the same time.",unit:10,unitName:"Global Contemporary",year:1998,images:[{src:"cb/241-1.jpg",w:993,h:487,caption:"Pure Land",credit:"© 2013 Mariko Mori, Member Artists Rights Society (ARS), New York/Digital Image © 2013 Museum Associates/LACMA/Licensed by Art Resource, NY"}],thumb:["thumbs/t2-u10.webp",1,2,8,4],notes:[["Form","A large **digital photograph** on glass with digital manipulation and bright, otherworldly color."],["Function","An artwork exploring spirituality and technology."],["Content","**Mariko Mori** herself, dressed as a Buddhist goddess (Kichijoten, goddess of prosperity), floats above the **Dead Sea** on a lotus. Around her, small alien-like beings play instruments in the sky, and a rainbow appears."],["Context","Japanese artist. It blends **Buddhist** iconography with **pop culture**, anime and science fiction, mixing spiritual traditions with technology and a vision of a future where spirituality and technology meet. 'Pure Land' is a paradise in Buddhism."],["Exam hooks","Mariko Mori · digital photograph · Buddhist goddess · Pure Land paradise · Dead Sea · pop/anime · spirituality and technology"],["Compare with","Todai-ji (#197): Buddhism. Untitled #228 (#231): artist as costumed subject."]]},{n:242,title:"Lying with the Wolf",maker:"Kiki Smith",date:"2001 C.E.",medium:"Ink and pencil on paper",context:"A life-size nude woman lies calmly against a wolf, one arm around its neck, drawn in thin ink line on unstretched paper. Smith reworks fairy tales and saints' lives — Red Riding Hood, Saint Genevieve — so that the woman and the predator are companions rather than victim and threat.",unit:10,unitName:"Global Contemporary",year:2001,images:[{src:"cb/242-1.jpg",w:1e3,h:836,caption:"Lying with the Wolf",credit:"© The Artist/Courtesy of the Pace Gallery"}],thumb:["thumbs/t2-u10.webp",2,2,8,4],notes:[["Form","A large drawing in **ink and pencil on paper** with delicate, sketch-like lines. Some areas are erased and the edges are uneven."],["Function","An artwork exhibited in galleries."],["Content","A nude **woman** lies peacefully beside and embraces a **wolf**, which looks out. It inverts **Little Red Riding Hood**, where the wolf is the predator; it may also refer to **St. Genevieve**, who tamed a wolf."],["Context","**Kiki Smith**, American. She explores the female body, myth, fairy tale and the relation between humans and animals. The work rewrites fairy tales from a feminist perspective, suggesting harmony and kinship rather than danger."],["Exam hooks","Kiki Smith · ink and pencil · woman and wolf · fairy tale inverted · St. Genevieve · feminism · human-animal bond"],["Compare with","Preying Mantra (#247): women and myth. Rebellious Silence (#235): women's bodies."]]},{n:243,title:"Darkytown Rebellion",maker:"Kara Walker",date:"2001 C.E.",medium:"Cut paper and projection on wall",context:"Black cut-paper silhouettes of antebellum figures in scenes of violence and sex wrap around the gallery, with coloured light projected so the viewer's own shadow falls among them. The silhouette was a genteel nineteenth-century parlour craft; Walker uses its politeness to deliver what it was never used for.",unit:10,unitName:"Global Contemporary",year:2001,images:[{src:"cb/243-1.jpg",w:1004,h:668,caption:"Darkytown Rebellion",credit:"Used by Permission"}],thumb:["thumbs/t2-u10.webp",3,2,8,4],notes:[["Form","An installation of black **cut-paper silhouettes** applied to the walls, combined with colored light **projections**. Viewers' own **shadows** are cast onto the walls and become part of the scene."],["Function","A room-sized install
