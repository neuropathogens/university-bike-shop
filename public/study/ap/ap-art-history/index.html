t2-u4.webp",1,3,8,7],notes:[["Form","A **department store** with a **steel frame** structure, allowing wide horizontal **'Chicago windows'** (a large fixed central pane flanked by smaller opening windows). The upper floors are white terra cotta; the ground floors at the corner entrance have lavish **cast-iron ornament** in organic Art Nouveau style, its plant forms designed to draw shoppers in."],["Function","A department store (originally Schlesinger and Mayer)."],["Context","**Louis Sullivan**, father of the skyscraper: 'form ever follows function'. Chicago was rebuilt after the fire of 1871. The steel skeleton and fireproof terra cotta show the building's grid structure. The building has three parts: base, shaft and capital (the cornice)."],["Exam hooks","Sullivan · Chicago School · steel frame · Chicago windows · cast-iron ornament · form follows function · department store"],["Compare with","Seagram Building (#146): steel frame with glass curtain wall. Saint-Lazare Station (#116): iron."]]},{n:125,title:"Mont Sainte-Victoire",maker:"Paul Cézanne",date:"1902–1904 C.E.",medium:"Oil on canvas",context:"One of dozens of versions. Cézanne builds the landscape from patches of colour laid like tiles, so plain and mountain sit on the same picture plane and near and far are the same paint. Structure over atmosphere — and precisely what Braque and Picasso took from him.",unit:4,unitName:"Later Europe and Americas",year:1902,images:[{src:"cb/125-1.jpg",w:992,h:803,caption:"Mont Sainte-Victoire",credit:"© The Philadelphia Museum of Art/Art Resource, NY"}],thumb:["thumbs/t2-u4.webp",2,3,8,7],notes:[["Form","An **oil on canvas** painting built from **patches** of color in blocky, geometric brushstrokes with flattened space. Warm colors (oranges) and cool colors (greens, blues) are used to create depth. Forms are reduced to geometric structures."],["Function","One of many paintings (over 60) Cézanne made of this mountain near his home in Aix-en-Provence."],["Content","The mountain **Mont Sainte-Victoire**, with fields and houses in the foreground."],["Context","**Paul Cézanne**, Post-Impressionism. He sought to 'treat nature by the cylinder, the sphere and the cone' and to make something solid and lasting like museum art. His work was a bridge to **Cubism** (Picasso and Braque)."],["Exam hooks","Cézanne · color patches · geometric structure · flattened space · series · precursor to Cubism · Aix"],["Compare with","Les Demoiselles (#126). The Portuguese (#130): Cubism. Hunters in the Snow (#83): landscape."]]},{n:126,title:"Les Demoiselles d'Avignon",maker:"Pablo Picasso",date:"1907 C.E.",medium:"Oil on canvas",context:"Five prostitutes in a Barcelona brothel, bodies shattered into planes, space collapsed, the two at the right wearing masks derived from African and Iberian sculpture. No single viewpoint. Picasso kept it in the studio for years. The starting point of Cubism, and a painting about looking, desire and fear at once.",unit:4,unitName:"Later Europe and Americas",year:1907,images:[{src:"cb/126-1.jpg",w:993,h:1035,caption:"Les Demoiselles d’Avignon",credit:"Digital Image © Bridgeman Art Library © Estate of Pablo Picasso/2013 Artists Rights Society (ARS), New York"}],thumb:["thumbs/t2-u4.webp",3,3,8,7],notes:[["Form","A large **oil on canvas** painting of five nude women with angular, **fragmented** bodies and multiple viewpoints at once. The faces of the two women on the right resemble **African masks**, and one on the left resembles **Iberian** sculpture. The space is shallow and shattered, like broken glass. A still life of fruit sits at the bottom."],["Function","Picasso's ambitious statement; it was kept in his studio, shown to friends who were shocked, and not exhibited publicly until 1916."],["Content","Women in a **brothel** on Avignon Street in Barcelona, staring confrontationally at the viewer."],["Context","**Pablo Picasso**. It is the beginning of **Cubism** (proto-Cubism) and shows Cézanne's influence. Picasso drew on African masks he saw at the ethnographic museum, the Trocadéro: **primitivism** that appropriated African art without understanding its meaning."],["Exam hooks","Picasso · proto-Cubism · African masks/primitivism · fragmentation · brothel · confrontational gaze"],["Compare with","Olympia (#115): a confrontational nude. Byeri (#179) and Pwo (#173): African art and Modernism. The Portuguese (#130)."]]},{n:127,title:"The Steerage",maker:"Alfred Stieglitz",date:"1907 C.E.",medium:"Photogravure",context:"Passengers on the lower deck of a transatlantic liner, split by a gangway into two levels of pure shape — a straw hat, a funnel, the diagonal stairs. Stieglitz said he saw it as form, not as social subject. His argument that photography was an art in its own right rather than an imitation of painting.",unit:4,unitName:"Later Europe and Americas",year:1907,images:[{src:"cb/127-1.jpg",w:807,h:993,caption:"The Steerage",credit:"© RMN-Grand Palais/Art Resource, NY © Georgia O’Keefe Museum/Artists Rights Society (ARS), New York"}],thumb:["thumbs/t2-u4.webp",4,3,8,7],notes:[["Form","A **photogravure** (a photographic print in fine ink) with a strong composition divided by a gangway (the steerage deck at upper left and the lower deck), diagonals, and a straw hat as a focal point."],["Function","Published in Stieglitz's magazine **Camera Work** (1911) to show photography as a fine art."],["Content","Passengers in **steerage** (the cheapest class) on an ocean liner traveling from America to Europe; many were probably returning immigrants. A crowd of people and their rough clothing."],["Context","**Alfred Stieglitz** pushed **straight photography** (sharp, unmanipulated) as a modern art form and ran the 291 gallery. He saw the image as shapes as much as social document, and it reflects modernism and class divisions."],["Exam hooks","Stieglitz · straight photography · Camera Work · class and immigration · composition of shapes · modernism"],["Compare with","Horse in Motion (#117): photography. The Migration Series (#141): migration."]]},{n:128,title:"The Kiss",maker:"Gustav Klimt",date:"1907–1908 C.E.",medium:"Oil and gold leaf on canvas",context:"Two figures fused inside one gold cloak on a flowering ledge; his robe is black-and-white rectangles, hers coloured circles. Only faces, hands and feet are painted naturalistically. The gold leaf borrows from Byzantine mosaic — the Vienna Secession wanted decoration itself to carry meaning.",unit:4,unitName:"Later Europe and Americas",year:1907,images:[{src:"cb/128-1.jpg",w:993,h:994,caption:"The Kiss",credit:"© The Gallery Collection/Corbis"}],thumb:["thumbs/t2-u4.webp",5,3,8,7],notes:[["Form","An **oil and gold leaf** painting on a square canvas with a flat, decorative surface. The couple's robes merge into a single shape covered with patterns: **geometric rectangles** on him (masculine) and **circles and flowers** on her (feminine). A field of gold surrounds them, recalling **Byzantine mosaics**, with realistic faces and hands."],["Function","Bought by the Austrian state while still being painted."],["Content","A couple embraces on a flowery meadow at the edge of a cliff; he kisses her cheek, and her eyes are closed."],["Context","**Gustav Klimt**, a founder of the **Vienna Secession**, a break from the academic establishment. He was influenced by the mosaics of **Ravenna** (#51). The painting has an Art Nouveau style and an erotic theme."],["Exam hooks","Klimt · gold leaf · Vienna Secession · Byzantine mosaic influence · pattern (male/female) · Art Nouveau"],["Compare with","Brancusi's The Kiss (#129): same subject, same date. San Vitale (#51): gold mosaics."]]},{n:129,title:"The Kiss",maker:"Constantin Brancusi",date:"1907–1908 C.E.",medium:"Limestone",context:"A single block carved just enough to read as two figures locked together — one continuous mass, the eyes sharing a line, arms wrapped around. Direct carving, no model, no bronze cast. The anti-Rodin: where Rodin's Kiss is smooth and naturalistic, Brancusi keeps the block.",unit:4,unitName:"Later Europe and Americas",year:1907,images:[{src:"cb/129-1.jpg",w:698,h:1031,caption:"The Kiss (1916 version)",credit:"© Album/Art Resource, NY © 2013 Artists Rights Society (ARS), New York/ ADAGP, Paris"}],thumb:["thumbs/t2-u4.webp",6,3,8,7],notes:[["Form","A small, compact limestone block carved with **direct carving** (no models or pointing machines). It is barely altered from the block: two figures embrace, eye to eye, their arms wrapped and lips joined, simplified to geometric forms. It is symmetrical."],["Function","Several versions exist; one serves as a gravestone in Montparnasse Cemetery in Paris."],["Content","A couple united in love: they almost **merge into one** form."],["Context","**Constantin Brancusi**, a Romanian sculptor in Paris who rejected Rodin's modeling in favor of **simplified, essential** forms. It was influenced by 'primitive' and folk carving. It is a forerunner of abstract sculpture."],["Exam hooks","Brancusi · direct carving · simplified form · block shape · love as unity · abstraction"],["Compare with","Klimt's The Kiss (#128): same subject. Burghers of Calais (#119): Rodin's modeling."]]},{n:130,title:"The Portuguese",maker:"Georges Braque",date:"1911 C.E.",medium:"Oil on canvas",context:"Analytic Cubism at its most austere: a musician dissolved into a shallow scaffold of tan and grey facets. Stencilled letters and numbers sit flat on the surface, insisting the canvas is a canvas. Braque and Picasso were working so closely at this point that their pictures are hard to tell apart.",unit:4,unitName:"Later Europe and Americas",year:1911,images:[{src:"cb/130-1.jpg",w:729,h:1035,caption:"The Portuguese",credit:"Photo © Bridgeman-Giraudon/Art Resource, NY © 2013 Artists Rights Society (ARS), New York/ADAGP, Paris"}],thumb:["thumbs/t2-u4.webp",7,3,8,7],notes:[["Form","An **oil on canvas** painting in **Analytic Cubism**: the subject is broken into small, fragmented planes in a muted palette (browns and grays). It is very hard to read, with **stenciled letters and numbers** ('D BAL', '10,40') on the surface."],["Function","A painting exploring the limits of representation."],["Content","A **Portuguese** musician playing a guitar in a bar in Marseilles. Hints of fragments can be seen: a guitar's sound hole, strings and a rope."],["Context","**Georges Braque** worked closely with Picasso. The stenciled letters affirm the **flat** picture surface, foreshadow collage (Synthetic Cubism) and refer to posters and advertising in a bar."],["Exam hooks","Braque · Analytic Cubism · fragmented planes · monochrome · stenciled letters · flatness"],["Compare with","Les Demoiselles (#126). Mont Sainte-Victoire (#125): source. Goldfish (#131): Fauvism."]]},{n:131,title:"Goldfish",maker:"Henri Matisse",date:"1912 C.E.",medium:"Oil on canvas",context:"A tabletop bowl seen from two angles at once, the orange fish blazing against green foliage and pink. Colour, not modelling, does all the work. Matisse associated goldfish with the contemplative calm he had admired in Morocco — the painting is about a state of mind as much as a still life.",unit:4,unitName:"Later Europe and Americas",year:1912,images:[{src:"cb/131-1.jpg",w:667,h:1036,caption:"Goldfish",credit:"© Alexander Burkatovski/Corbis"}],thumb:["thumbs/t2-u4.webp",0,4,8,7],notes:[["Form","An **oil on canvas** painting with **bright, saturated, complementary colors**: orange fish against greens, pinks and blues. Flat, decorative patterning. The perspective is mixed: the tabletop is tilted up while the fishbowl is seen from the side."],["Function","A painting of a decorative, calming subject."],["Content","Four **goldfish** in a cylindrical glass bowl on a round table, surrounded by plants and flowers. Their reflections appear at the water's surface."],["Context","**Henri Matisse**, leader of **Fauvism** ('wild beasts': expressive color). He was inspired by a trip to **Morocco**, where people would gaze at goldfish in a state of contemplation. Matisse wanted art to be 'like a good armchair', restful."],["Exam hooks","Matisse · Fauvism · bold complementary color · flat pattern · tilted perspective · Morocco · contemplation"],["Compare with","The Portuguese (#130): Cubism (form) versus Fauvism (color). Improvisation 28 (#132)."]]},{n:132,title:"Improvisation 28 (second version)",maker:"Vassily Kandinsky",date:"1912 C.E.",medium:"Oil on canvas",context:"Colour, line and mass loosened almost entirely from things. Buried inside are apocalyptic motifs — a boat, a cannon and waves on the left; a couple, a sun and a walled city on the right — destruction giving way to paradise. Kandinsky believed colour worked like music, directly on the soul.",unit:4,unitName:"Later Europe and Americas",year:1912,images:[{src:"cb/132-1.jpg",w:992,h:681,caption:"Improvisation 28 (second version)",credit:"Digital Image © The Bridgeman Art Library © 2013 Artists Rights Society (ARS), New York/ADAGP, Paris"}],thumb:["thumbs/t2-u4.webp",1,4,8,7],notes:[["Form","An **oil on canvas** painting with nearly **non-representational** abstraction: bursts of color, black lines and shapes. Some recognizable forms may be hidden: a cannon, boats, flowers. It feels spontaneous yet deliberate."],["Function","One of a series of 'Improvisations', paintings expressing inner emotion."],["Content","Kandinsky linked color and form to **music**: he believed colors had spiritual and emotional qualities and that painting could be like a symphony. Scholars read **apocalyptic** imagery (battle and destruction, with renewal and paradise) in it."],["Context","**Vassily Kandinsky**, a Russian in Munich and a founder of **Der Blaue Reiter** (The Blue Rider). He wrote 'Concerning the Spiritual in Art' (1911). He is one of the first **abstract** painters; 'improvisation' means unconscious, spontaneous expression."],["Exam hooks","Kandinsky · abstraction · color = music · spirituality · Der Blaue Reiter · improvisation · apocalypse and rebirth"],["Compare with","Composition with Red, Blue and Yellow (#136): geometric abstraction. Woman, I (#145): Abstract Expressionism."]]},{n:133,title:"Self-Portrait as a Soldier",maker:"Ernst Ludwig Kirchner",date:"1915 C.E.",medium:"Oil on canvas",context:"The artist in uniform with a bloody stump where his painting hand should be — an injury he never actually suffered. Behind him, a nude model and his own canvases. Acid colour, hacked brushwork, a mask-like face: German Expressionism recording a breakdown he did have after being discharged.",unit:4,unitName:"Later Europe and Americas",year:1915,images:[{src:"cb/133-1.jpg",w:605,h:701,caption:"Self-Portrait as a Soldier",credit:"© Allen Memorial Art Museum, Oberlin College, Ohio, USA/Charles F. Olney Fund/The Bridgeman Art Library"}],thumb:["thumbs/t2-u4.webp",2,4,8,7],notes:[["Form","An **oil on canvas** painting with **Expressionist** harsh color (acid yellows, greens and reds), jagged forms, angular figures and a distorted perspective."],["Function","A self-portrait recording a psychological crisis."],["Content","**Kirchner** shows himself in military uniform with a cigarette, holding up a **bloody stump** for his right hand (his painting hand), although in reality he was not injured. A nude model behind him stands for his art and his lost life. The amputation symbolizes fear of losing his ability to paint, war's destruction of creativity, and impotence."],["Context","Kirchner volunteered for World War I but suffered a **mental breakdown** and was discharged. **German Expressionism**, he was a founder of **Die Brücke** (The Bridge). The Nazis later labeled his work 'degenerate art'."],["Exam hooks","Kirchner · German Expressionism · Die Brücke · WWI trauma · amputated painting hand · psychological self-portrait"],["Compare with","The Scream (#122): anxiety. Memorial Sheet for Karl Liebknecht (#134): German response to war."]]},{n:134,title:"Memorial Sheet for Karl Liebknecht",maker:"Käthe Kollwitz",date:"1919–1920 C.E.",medium:"Woodcut",context:"Mourners crowd forward to view the body of the murdered Spartacist leader, composed like a lamentation. Kollwitz did not share his politics but was asked by his family. She reworked the image as etching and lithograph before settling on woodcut for its gouged, harsh black and white.",unit:4,unitName:"Later Europe and Americas",year:1919,images:[{src:"cb/134-1.jpg",w:992,h:707,caption:"Memorial Sheet for Karl Liebknecht",credit:"Photo © Snark/Licensed by SCALA/Art Resource, NY © 2013 Artists Rights Society (ARS), New York/ProLitteris, Zurich"}],thumb:["thumbs/t2-u4.webp",3,4,8,7],notes:[["Form","A **woodcut** in stark **black and white**, carved with bold, rough cuts. The figures are simplified and expressive in a horizontal composition."],["Function","A memorial to **Karl Liebknecht**, a leader of the **Spartacist** (communist) uprising, who was **murdered in 1919** in Berlin, made after Kollwitz visited his body."],["Content","Mourners (workers and a mother with child) grieve over Liebknecht's body laid out. The inscription at the bottom reads 'The living to the dead, in memory of 15 January 1919'. The composition recalls the **Lamentation** over Christ (compare Giotto, #63)."],["Context","**Käthe Kollwitz**, whose son died in World War I. She chose woodcut, a medium with German folk associations that could be reproduced cheaply for the people. She did not share Liebknecht's politics but honored him as a hero of the working class."],["Exam hooks","Kollwitz · woodcut · Liebknecht · Spartacist uprising · Lamentation composition · working class · grief"],["Compare with","Lamentation, Arena Chapel (#63). Y no hai remedio (#106): print as protest."]]},{n:135,title:"Villa Savoye",maker:"Le Corbusier; Poissy, France",date:"1929 C.E.",medium:"Steel and reinforced concrete",context:"A white box lifted on pilotis so the ground runs beneath it, with ribbon windows, an open plan, a ramp instead of a staircase, and a roof garden giving back the site it covers — his five points, built. 'A machine for living in,' laid out around the turning circle of a car.",unit:4,unitName:"Later Europe and Americas",year:1929,images:[{src:"cb/135-1.jpg",w:1200,h:825,caption:"Villa Savoye",credit:"Digital Image © Bridgeman Art Library © Artists Rights Society (ARS), New York/ADAGP, Paris/F.L.C"},{src:"cb/135-2.jpg",w:605,h:904,caption:"Villa Savoye",credit:"© Anthony Scibilia/Art Resource, NY © Artists Rights Society (ARS), New York/ADAGP, Paris/F.L.C"}],thumb:["thumbs/t2-u4.webp",4,4,8,7],notes:[["Form","A **reinforced concrete** house raised on thin columns (**pilotis**), white and box-like, with a **flat roof garden**, **ribbon windows** across the facade, a **free plan** (walls not load-bearing) and a **free facade**, ramps between floors and an open plan."],["Function","A weekend country house for the Savoye family, near Paris. The ground floor's curve is shaped by the turning radius of a car."],["Context","**Le Corbusier** called a house 'a **machine for living in**'. It embodies his **Five Points of a New Architecture**: pilotis, free plan, free facade, horizontal ribbon windows and roof garden. **International Style** modernism. It leaked badly and the family complained."],["Exam hooks","Le Corbusier · Five Points · pilotis · ribbon windows · roof garden · free plan · machine for living · International Style"],["Compare with","Fallingwater (#139): organic modernism. Seagram Building (#146): International Style. House in New Castle County (#152): Postmodern response."]]},{n:136,title:"Composition with Red, Blue and Yellow",maker:"Piet Mondrian",date:"1930 C.E.",medium:"Oil on canvas",context:"Black lines, white ground, three primaries, no diagonals and no curves — asymmetry balanced by weight rather than mirroring. De Stijl aimed at a universal harmony underneath appearances. The lines run right to the edge, so the design reads as a fragment of something that continues.",unit:4,unitName:"Later Europe and Americas",year:1930,images:[{src:"cb/136-1.jpg",w:760,h:771,caption:"Composition with Red, Blue and Yellow",credit:"Piet Mondrian (1872–1944) Composition with Red, Blue and Yellow, 1930 © 2013 Mondrian/Holtzman Trust c/o HCR International USA/Photo © 2013 Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u4.webp",5,4,8,7],notes:[["Form","An **oil on canvas** painting of pure **geometric abstraction**: a grid of **black lines** with rectangles filled with **primary colors** (red, blue, yellow) and white. It is an **asymmetrical** but balanced composition, with a large red square at the upper right and small blue and yellow areas. Paint is applied flat, with no brushwork."],["Function","A pure abstract painting seeking **universal harmony**."],["Context","**Piet Mondrian**, Dutch, part of **De Stijl** (The Style). **Neoplasticism**: reduce art to the essentials (horizontal and vertical lines, primary colors and non-colors) to express a spiritual order (influenced by **Theosophy**). It influenced design, architecture and fashion."],["Exam hooks","Mondrian · De Stijl · Neoplasticism · grid · primary colors · asymmetrical balance · Theosophy · universal harmony"],["Compare with","Improvisation 28 (#132): expressive abstraction versus geometric. Seagram Building (#146): grid."]]},{n:137,title:"Illustration from The Results of the First Five-Year Plan",maker:"Varvara Stepanova",date:"1932 C.E.",medium:"Photomontage",context:"A Constructivist propaganda spread: cut photographs of workers, machinery and Lenin overlaid with bold type and diagonal bands. Photomontage was treated as factual, modern and mass-producible — fit for a socialist state, and art as production rather than easel painting. Made with her husband Rodchenko.",unit:4,unitName:"Later Europe and Americas",year:1932,images:[{src:"cb/137-1.jpg",w:992,h:710,caption:"Illustration from The Results of the First Five-Year Plan",credit:"© The Gallery Collection/Corbis"}],thumb:["thumbs/t2-u4.webp",6,4,8,7],notes:[["Form","A **photomontage**: cut photographs combined and arranged with graphic design. Repeated portraits of **Lenin and Stalin** appear above crowds of workers raising hands. The spatial relationships are dynamic."],["Function","A page in a propaganda **book** celebrating the Soviet Union's first **Five-Year Plan** (1928–1932), its rapid industrialization and collectivization."],["Content","Masses of people appear to vote or celebrate, with images of Lenin and Stalin above them."],["Context","**Varvara Stepanova**, a **Constructivist** artist and designer. Constructivists made art for social and political purposes, with mass production and design. The plan actually caused famine and great suffering, though the image shows enthusiasm."],["Exam hooks","Stepanova · photomontage · Constructivism · Soviet propaganda · Five-Year Plan · Lenin and Stalin · woman designer"],["Compare with","Chairman Mao en Route to Anyuan (#212): communist propaganda. Liberty (#108): political image."]]},{n:138,title:"Object (Le Déjeuner en fourrure)",maker:"Meret Oppenheim",date:"1936 C.E.",medium:"Fur-covered cup, saucer, and spoon",context:"A Chinese gazelle pelt glued over a teacup with its saucer and spoon. The idea came out of a joke with Picasso about fur-trimming anything. Surrealism colliding the domestic with the visceral: it looks soft and is revolting to imagine using. MoMA bought it the year it was made.",unit:4,unitName:"Later Europe and Americas",year:1936,images:[{src:"cb/138-1.jpg",w:992,h:666,caption:"Object (Le Déjeuner en fourrure)",credit:"Digital Image © 2013 The Museum of Modern Art/Licensed by SCALA/Art Resource, NY © 2013 Artists Rights Society (ARS), New York/ProLitteris, Zurich"}],thumb:["thumbs/t2-u4.webp",7,4,8,7],notes:[["Form","An ordinary **teacup, saucer and spoon** covered in **gazelle fur**: a **Surrealist** object."],["Function","Exhibited at the Museum of Modern Art in 1936; it became an icon of **Surrealism**."],["Content","A tactile contradiction: fur turns a functional object into something **unusable** and disturbing. The idea of drinking from a fur cup is unpleasant, and sensual or sexual connotations are present."],["Context","**Meret Oppenheim**, a Swiss artist. The idea came from a café conversation with Picasso about her fur bracelet; Picasso said 'you could cover anything with fur', and she replied 'even this cup and saucer'. André Breton gave it the title, which echoes Manet's 'Le Déjeuner sur l'herbe' (and Sacher-Masoch's 'Venus in Furs')."],["Exam hooks","Oppenheim · Surrealism · fur-covered cup · readymade transformed · uncanny · tactile · sexuality"],["Compare with","Fountain (#144): readymade. Pink Panther (#230): kitsch object."]]},{n:139,title:"Fallingwater",maker:"Frank Lloyd Wright; Mill Run, Pennsylvania",date:"1936–1939 C.E.",medium:"Reinforced concrete, sandstone, steel, and glass",context:"A weekend house cantilevered over a waterfall rather than placed facing it, its horizontal concrete trays anchored to a vertical stone core quarried on site. You hear the water everywhere and see it almost nowhere. Wright's organic architecture: building and landscape as one system.",unit:4,unitName:"Later Europe and Americas",year:1936,images:[{src:"cb/139-1.jpg",w:946,h:766,caption:"Fallingwater",credit:"© Art Resource, NY © 2013 Frank Lloyd Wright Foundation, Scottsdale, AZ/ Artists Rights Society (ARS), New York"},{src:"cb/139-2.jpg",w:992,h:762,caption:"Fallingwater",credit:"© Robert P. Ruschak/Courtesy of Western Pennsylvania Conservancy"},{src:"cb/139-3.jpg",w:760,h:1124,caption:"Fallingwater site plan",credit:"© Astorino"}],thumb:["thumbs/t2-u4.webp",0,5,8,7],notes:[["Form","A house built over a **waterfall**, with **cantilevered** reinforced concrete terraces projecting out over the stream, stacked horizontally. Native sandstone walls rise vertically, and a boulder from the site emerges through the living room floor as the hearth. Windows run around corners."],["Function","A weekend house for the **Kaufmann** family, Pittsburgh department store owners, at Bear Run, Pennsylvania."],["Context","**Frank Lloyd Wright**, **organic architecture**: buildings should harmonize with nature. The Kaufmanns expected a house with a view of the falls; Wright put it **on top of the falls**. The cantilevers sagged and required repairs. It was influenced by Japanese architecture."],["Exam hooks","Frank Lloyd Wright · organic architecture · cantilevers · waterfall · native stone · harmony with nature · Kaufmann"],["Compare with","Villa Savoye (#135): a machine versus organic. Ryoan-ji (#207): Japanese harmony with nature."]]},{n:140,title:"The Two Fridas",maker:"Frida Kahlo",date:"1939 C.E.",medium:"Oil on canvas",context:"Two selves hold hands on a bench under a storm: one in a European lace dress with a cut artery and a surgical clamp, one in Tehuana dress holding a small portrait of Diego Rivera. Painted around their divorce. Both hearts are exposed and joined by a vein — heritage, love and injury made anatomical.",unit:4,unitName:"Later Europe and Americas",year:1939,images:[{src:"cb/140-1.jpg",w:993,h:991,caption:"The Two Fridas",credit:"© Schalkwijk/Art Resource, NY © 2013 Banco de México Diego Rivera Frida Kahlo Museums Trust, Mexico, D.F./Artists Rights Society (ARS), New York"}],thumb:["thumbs/t2-u4.webp",1,5,8,7],notes:[["Form","A large **oil on canvas** double self-portrait: **two Fridas** sit side by side holding hands, with a stormy sky."],["Function","Painted around Kahlo's **divorce from Diego Rivera** (1939); it was exhibited at the International Exhibition of Surrealism in Mexico City."],["Content","On the **left**, a European Frida in a white Victorian lace dress; on the **right**, a Mexican Frida in **Tehuana** dress, whom Diego loved. Their **hearts are exposed**, linked by a vein. The Mexican Frida holds a portrait of Diego as a child; the European Frida cuts the vein with surgical scissors, and blood drips onto her dress."],["Context","**Frida Kahlo** had a German father and a Mexican mother. The painting is about **dual identity** (European and Mexican heritage) and emotional pain. Influenced by Mexican folk art; the Surrealists embraced her, but she said she painted her own reality."],["Exam hooks","Kahlo · double self-portrait · dual identity · exposed hearts · divorce from Rivera · Tehuana dress · Mexican identity"],["Compare with","Dream of a Sunday Afternoon (#143): Rivera. Rebellious Silence (#235): identity."]]},{n:141,title:"The Migration of the Negro, Panel no. 49",maker:"Jacob Lawrence",date:"1940–1941 C.E.",medium:"Casein tempera on hardboard",context:"One of sixty small panels on the Great Migration, all painted at once — colour by colour across the whole series — so they hold together as a set. Panel 49 shows a segregated dining room split by a bar. Flat shapes, hard edges, a restrained palette, and a written caption for each panel. Lawrence was 23.",unit:4,unitName:"Later Europe and Americas",year:1940,images:[{src:"cb/141-1.jpg",w:628,h:941,caption:"The Migration Series, Panel 49",credit:"© The Phillips Collection, Washington, DC © 2013 The Jacob and Gwendolyn Lawrence Foundation, Seattle/Artists Rights Society (ARS), New York"}],thumb:["thumbs/t2-u4.webp",2,5,8,7],notes:[["Form","A panel in **casein tempera on hardboard** with flat areas of color, simplified figures and a limited, repeated palette. One of 60 panels, painted together to keep the color consistent."],["Function","A series telling the history of the **Great Migration**, in which over a million African Americans moved from the rural South to the industrial North from about 1910 to 1930."],["Content","Panel 49: a **dining room** in a Northern restaurant divided by a rope: white diners on one side and Black diners on the other. The caption says the migrants found discrimination in the North as well."],["Context","**Jacob Lawrence**, of the **Harlem Renaissance** generation; his own family migrated. It was based on research and shown in 1941. The series was bought jointly by MoMA and the Phillips Collection, each taking half."],["Exam hooks","Jacob Lawrence · Great Migration · series of 60 · segregation in the North · flat color · Harlem"],["Compare with","The Steerage (#127): migration. Dancing at the Louvre (#232): African American artist and narrative."]]},{n:142,title:"The Jungle",maker:"Wifredo Lam",date:"1943 C.E.",medium:"Gouache on paper mounted on canvas",context:"Four figures with crescent-moon faces among sugarcane stalks, limbs and cane indistinguishable from one another. Lam was Cuban of African, Chinese and Spanish descent and had worked with Picasso and the Surrealists; here he turns modernist fragmentation toward Afro-Cuban Santería and the brutality of the sugar economy.",unit:4,unitName:"Later Europe and Americas",year:1943,images:[{src:"cb/142-1.jpg",w:961,h:1004,caption:"The Jungle",credit:"Photo © 2013 The Museum of Modern Art/Licensed by SCALA/Art Resource, NY © 2013 Artists Rights Society (ARS), New York/ADAGP, Paris"}],thumb:["thumbs/t2-u4.webp",3,5,8,7],notes:[["Form","A large painting in **gouache on paper** mounted on canvas: elongated, masklike figures, sugar cane stalks and leaves in dense, jungle-like patterns. Figures merge with plants."],["Function","A painting exhibited in New York; MoMA bought it."],["Content","Hybrid figures with masklike faces, large feet and hands, crescent moon shapes, among **sugar cane**, referencing slavery on sugar plantations. Hidden scissors may cut ties to colonial exploitation."],["Context","**Wifredo Lam**, Cuban of African, Chinese and Spanish descent. He knew Picasso and the Surrealists. He returned to Cuba and drew on **Afro-Cuban** religion (Santería) and the history of slavery. It critiques the use of Africa as a source for European modernism (primitivism), reclaiming those forms."],["Exam hooks","Lam · Afro-Cuban · Santería · sugar cane/slavery · Cubism and Surrealism · reclaiming 'primitivism'"],["Compare with","Les Demoiselles (#126): appropriation versus reclaiming. Trade (#233)."]]},{n:143,title:"Dream of a Sunday Afternoon in the Alameda Park",maker:"Diego Rivera",date:"1947–1948 C.E.",medium:"Fresco",context:"A fifty-foot mural crowding four centuries of Mexican history into one park promenade: Rivera as a boy holding the hand of a skeletal Catrina in a feathered boa, Frida behind him, and Cortés, Juárez and Díaz in the crowd. Painted for a hotel and moved to its own museum after the 1985 earthquake.",unit:4,unitName:"Later Europe and Americas",year:1947,images:[{src:"cb/143-1.jpg",w:1200,h:327,caption:"Dream of a Sunday Afternoon in the Alameda Park",credit:"© Alfredo Dagli Orti/Art Resource, NY © 2013 Banco de México Diego Rivera Frida Kahlo Museums Trust, Mexico, D.F./ Artists Rights Society (ARS), New York"}],thumb:["thumbs/t2-u4.webp",4,5,8,7],notes:[["Form","A large **fresco** (about 50 feet long) with dozens of figures in a crowded frieze and bright colors."],["Function","Painted for the dining room of the **Hotel del Prado** in Mexico City. It was moved after the 1985 earthquake."],["Content","An imagined Sunday stroll in the **Alameda Park** bringing together figures from **Mexican history**, from the conquest (Cortés) through Independence and the Revolution: Juárez, Maximilian, Porfirio Díaz, Zapata. At the center, a skeleton, **La Calavera Catrina** (by the printmaker Posada), elegantly dressed, holds hands with **young Diego Rivera** (as a boy) and **José Guadalupe Posada**; **Frida Kahlo** stands behind the boy with a hand on his shoulder."],["Context","**Diego Rivera**, a leader of **Mexican Muralism**: public art telling national history for the people. The original inscription 'God does not exist' caused controversy and was removed."],["Exam hooks","Rivera · Mexican Muralism · fresco · Mexican history · Catrina · Posada · Frida · Alameda"],["Compare with","Two Fridas (#140): Kahlo. Dancing at the Louvre (#232): narrative. Arena Chapel (#63): fresco."]]},{n:144,title:"Fountain (second version)",maker:"Marcel Duchamp",date:"1950 C.E.",medium:"Readymade glazed sanitary china with black paint",context:"A urinal turned ninety degrees and signed 'R. Mutt 1917,' submitted to an unjuried exhibition that rejected it anyway. The original is lost; this is one of several later replicas. The argument — that the artist's choice, not the artist's hand, makes the art — underwrites everything conceptual that followed.",unit:4,unitName:"Later Europe and Americas",year:1950,images:[{src:"cb/144-1.jpg",w:853,h:973,caption:"Fountain (second version)",credit:"Photo © The Philadelphia Museum of Art/Art Resource, NY © Succession Marcel Duchamp/ADAGP, Paris/Artists Rights Society (ARS), New York 2013"}],thumb:["thumbs/t2-u4.webp",5,5,8,7],notes:[["Form","A standard porcelain **urinal**, laid on its back and signed '**R. Mutt 1917**'. The second version (1950) is a replica, since the original was lost. It is a **readymade**: a manufactured object chosen by the artist."],["Function","Originally submitted in **1917** to the exhibition of the Society of Independent Artists in New York, where anyone could exhibit; it was rejected."],["Content","Its meaning rests on the **artist's choice**: Duchamp claimed that the idea and the act of selection make something art, not skill or craftsmanship."],["Context","**Marcel Duchamp**, **Dada**, an anti-art movement reacting to the absurdity of World War I. It challenged the definition of art and the role of institutions, and influenced Conceptual art and Pop. Stieglitz photographed the original."],["Exam hooks","Duchamp · readymade · Dada · R. Mutt · rejected 1917 · idea over craft · what is art?"],["Compare with","Object (Le Déjeuner en fourrure) (#138): transformed object. Pink Panther (#230): kitsch. Kui Hua Zi (#250)."]]},{n:145,title:"Woman, I",maker:"Willem de Kooning",date:"1950–1952 C.E.",medium:"Oil on canvas",context:"Two years of painting, scraping and repainting; de Kooning abandoned it and a critic rescued it from the studio. A grinning, wide-eyed, toothy figure, part pin-up and part fertility idol, built from slashing strokes. Abstract Expressionists were supposed to have left the figure behind — this one refused.",unit:4,unitName:"Later Europe and Americas",year:1950,images:[{src:"cb/145-1.jpg",w:791,h:1032,caption:"Woman, I",credit:"Photo © 2013 The Museum of Modern Art/Licensed by SCALA/Art Resource, NY © 2013 The Willem de Kooning Foundation/Artists Rights Society (ARS), New York"}],thumb:["thumbs/t2-u4.webp",6,5,8,7],notes:[["Form","A large **oil on canvas** painting with violent, slashing **gestural** brushstrokes, layers of paint scraped and repainted (it took about two years), and a mix of figuration and abstraction. Wide staring eyes, a toothy grin and huge breasts."],["Function","The first of de Kooning's **Woman** series."],["Content","A frightening, aggressive female figure. He said he was influenced by Mesopotamian votive figures (compare #14) and fertility goddesses, and by advertisements. The figure has been read as **misogynistic**, or as satire of pin-up images."],["Context","**Willem de Kooning**, **Abstract Expressionism** (New York School), action painting. Returning to the figure was controversial among abstract artists."],["Exam hooks","de Kooning · Abstract Expressionism · gestural · Woman series · aggressive figure · Mesopotamian idols · misogyny debate"],["Compare with","Votive figures (#14): the staring eyes. The Bay (#149): another Abstract Expressionist approach."]]},{n:146,title:"Seagram Building",maker:"Ludwig Mies van der Rohe and Philip Johnson; New York",date:"1954–1958 C.E.",medium:"Steel frame with glass curtain wall and bronze",context:"A bronze-and-glass tower set back from Park Avenue behind its own plaza — an expensive gift of empty space that went on to change New York zoning. The I-beams on the façade are not structural; they are welded on to express a frame that fire code required to be encased. 'Less is more,' at enormous cost.",unit:4,unitName:"Later Europe and Americas",year:1954,images:[{src:"cb/146-1.jpg",w:729,h:913,caption:"Seagram Building",credit:"© Angelo Hornak/Corbis"}],thumb:["thumbs/t2-u4.webp",7,5,8,7],notes:[["Form","A 38-story **skyscraper** with a steel frame clad in a **glass curtain wall** with bronze **I-beams** (non-structural, decorative mullions emphasizing verticality), set back from Park Avenue behind a large open **plaza**. The design is minimal."],["Function","The headquarters of the **Seagram** liquor company in Manhattan."],["Context","**Ludwig Mies van der Rohe** (with Philip Johnson). **International Style**: 'less is more'. The plaza was rare, sacrificing valuable space and showing corporate prestige. The bronze cost was huge. It became a model for corporate towers."],["Exam hooks","Mies van der Rohe · International Style · glass curtain wall · bronze I-beams · plaza · less is more · corporate modernism"],["Compare with","Carson Pirie Scott (#124): early steel frame. House in New Castle County (#152): Postmodern 'less is a bore'. Villa Savoye (#135)."]]},{n:147,title:"Marilyn Diptych",maker:"Andy Warhol",date:"1962 C.E.",medium:"Oil, acrylic, and silkscreen enamel on canvas",context:"Fifty repetitions of a publicity still from Niagara, made weeks after Monroe's death: garish colour on the left, black and white fading toward nothing on the right. Silkscreen removes the artist's hand and makes celebrity look like packaging. The diptych format is borrowed from religious painting.",unit:4,unitName:"Later Europe and Americas",year:1962,images:[{src:"cb/147-1.jpg",w:992,h:720,caption:"Marilyn Diptych",credit:"© Tate, London/Art Resource, NY © 2013 The Andy Warhol Foundation for the Visual Arts, Inc./Artists Rights Society (ARS), New York"}],thumb:["thumbs/t2-u4.webp",0,6,8,7],notes:[["Form","A two-panel painting of 50 **silkscreened** images of **Marilyn Monroe**: the left panel is bright and colorful, the right panel black and white, increasingly faded and smeared. It uses a publicity photo from the film Niagara."],["Function","Made shortly after **Monroe's death** in August 1962."],["Content","Repetition reflects **mass media**: her image reproduced endlessly. The fading right side suggests death and mortality, and the two sides suggest celebrity versus the real person. The diptych format recalls religious altarpieces (Marilyn as an icon)."],["Context","**Andy Warhol**, **Pop Art**: mechanical reproduction, consumer culture and celebrity. His studio was called 'The Factory'."],["Exam hooks","Warhol · Pop Art · silkscreen · repetition · celebrity · death · diptych as icon · mass media"],["Compare with","Lipstick (Ascending) (#150): Pop. Theotokos icon (#54): the icon idea. Pink Panther (#230)."]]},{n:148,title:"Narcissus Garden",maker:"Yayoi Kusama",date:"Original installation and performance 1966",medium:"Mirror balls",context:"Fifteen hundred mirrored plastic spheres spread on the lawn outside the Venice Biennale, uninvited, which Kusama sold to passers-by for about two dollars each beside a sign reading 'Your Narcissism for Sale' until organisers stopped her. A critique of the art market's vanity, staged as its own marketplace.",unit:4,unitName:"Later Europe and Americas",year:1966,images:[{src:"cb/148-1.jpg",w:993,h:662,caption:"Narcissus Garden (Paris, 2010 installation)",credit:"Courtesy Yayoi Kusama Studio Inc., Ota Fine Arts, Tokyo and Victoria Miro, London © Yayoi Kusama"}],thumb:["thumbs/t2-u4.webp",1,6,8,7],notes:[["Form","An installation of hundreds of **mirrored stainless steel balls** placed on the ground or floating on water. The original 1966 version had about 1,500 plastic balls."],["Function","First shown, uninvited, at the **1966 Venice Biennale** on a lawn outside the Italian pavilion. **Kusama** stood among them in a gold kimono, selling each ball for 2 dollars (1,200 lire) until officials stopped her."],["Content","Visitors see themselves **reflected** many times, a commentary on **narcissism** (Narcissus, who fell in love with his own reflection) and on the art market's commercialism."],["Context","**Yayoi Kusama**, a Japanese artist in New York. The performance critiqued the art world as a business. Infinity, repetition and reflection run through her work."],["Exam hooks","Kusama · Venice Biennale 1966 · mirror balls · selling art · narcissism · performance · infinity"],["Compare with","Fountain (#144): critique of the art world. Kui Hua Zi (#250): many identical objects."]]},{n:149,title:"The Bay",maker:"Helen Frankenthaler",date:"1963 C.E.",medium:"Acrylic on canvas",context:"Thinned paint poured onto unprimed canvas and left to soak in, so the colour is in the fabric rather than on it — the soak-stain technique that Morris Louis and Kenneth Noland took up. Blue pools over green and ochre with no gesture, no drawing and no illusion of depth.",unit:4,unitName:"Later Europe and Americas",year:1963,images:[{src:"cb/149-1.jpg",w:682,h:665,caption:"The Bay",credit:"© Estate of the Artist/2013 Artists Rights Society (ARS), Bridgeman Art Library, New York"}],thumb:["thumbs/t2-u4.webp",2,6,8,7],notes:[["Form","**Acrylic on unprimed canvas**: thinned paint soaked into the fabric (**soak-stain** technique), leaving no brushstrokes and fusing color with canvas. Large, fluid, organic areas of blue and other colors."],["Function","A large abstract painting."],["Content","The title suggests a **bay** of water, though the painting is abstract."],["Context","**Helen Frankenthaler**, a second-generation **Abstract Expressionist**. She pioneered **Color Field** painting and soak-staining (with oil earlier; acrylic here). She influenced Morris Louis and Kenneth Noland. She was a woman in a male-dominated movement."],["Exam hooks","Frankenthaler · soak-stain · Color Field · acrylic on unprimed canvas · no brushwork · woman in Abstract Expressionism"],["Compare with","Woman, I (#145): gestural versus color field. Improvisation 28 (#132)."]]},{n:150,title:"Lipstick (Ascending) on Caterpillar Tracks",maker:"Claes Oldenburg",date:"1969–1974 C.E.",medium:"Cor-Ten steel, steel, aluminum, and cast resin; painted with polyurethane enamel",context:"Installed by students in a Yale plaza without permission, originally with an inflatable vinyl tip that had to be pumped up before anyone could make a speech from it. Part Pop joke, part Vietnam-era protest monument: cosmetics and a tank, lipstick as missile. Later remade in harder materials.",unit:4,unitName:"Later Europe and Americas",year:1969,images:[{src:"cb/150-1.jpg",w:698,h:909,caption:"Lipstick (Ascending) on Caterpillar Tracks",credit:"© Used by Permission of the Artist"}],thumb:["thumbs/t2-u4.webp",3,6,8,7],notes:[["Form","A monumental sculpture: a giant **lipstick** tube rising from a base like a **tank's caterpillar treads**. The original lipstick was soft, inflatable vinyl (it drooped and needed reinflating), later replaced in Cor-Ten steel, aluminum and cast resin."],["Function","Installed (uninvited) at **Yale University**, Beinecke Plaza, in **1969**, commissioned by architecture students as a **speaker's platform** for protests against the **Vietnam War**."],["Content","It combines a **feminine/consumer** object (lipstick) with a **military** machine (tank): 'make love, not war'. The lipstick also looks phallic, like a missile."],["Context","**Claes Oldenburg**, **Pop Art**: giant everyday objects. Yale was against it at first, then reinstalled it in another courtyard in 1974."],["Exam hooks","Oldenburg · Pop · lipstick on tank treads · anti-Vietnam War · Yale · speaker's platform · soft sculpture"],["Compare with","Marilyn Diptych (#147): Pop. Vietnam Veterans Memorial (#225): the Vietnam War."]]},{n:151,title:"Spiral Jetty",maker:"Robert Smithson",date:"1970 C.E.",medium:"Earthwork: mud, precipitated salt crystals, rocks, and water coil",context:"A 1,500-foot basalt coil built into the Great Salt Lake, sited where algae turn the water red and salt crusts the rock. It has been submerged for decades at a stretch and re-emerged whitened. Land art's point is that the work is out at the site, entropic and changing — the film and photographs are not the same thing.",unit:4,unitName:"Later Europe and Americas",year:1970,images:[{src:"cb/151-1.jpg",w:1008,h:670,caption:"Spiral Jetty",credit:"© The Artist/Licensed by VAGA, New York, NY/Courtesy James Cohan Gallery, New York & Shanghai"}],thumb:["thumbs/t2-u4.webp",4,6,8,7],notes:[["Form","A huge coil of **basalt rocks, earth and salt crystals** spiraling 1,500 feet into the **Great Salt Lake**, Utah. It is visible only when water levels are low; it has been submerged and reappeared over time. The water is reddish from algae and bacteria."],["Function","An **earthwork** (Land art), outside the gallery, meant to change with nature (**entropy**)."],["Content","The **spiral** relates to the site's salt crystal structure and a local myth of a whirlpool."],["Context","**Robert Smithson**. It critiqued the museum system and art market. Smithson also made a film of it. He died in a plane crash while surveying another earthwork in 1973."],["Exam hooks","Smithson · Land art/earthwork · spiral · Great Salt Lake · entropy · outside gallery · submerged/reappears"],["Compare with","Great Serpent Mound (#156): ancient earthwork. The Gates (#224): art in the landscape."]]},{n:152,title:"House in New Castle County",maker:"Robert Venturi, John Rauch, and Denise Scott Brown",date:"1978–1983 C.E.",medium:"Wood frame and stucco",context:"A house whose front reads like a child's drawing of a house — big gable, oversized lunette window, applied decoration — while the plan behind it is complex and asymmetrical. Postmodernism answering Mies with 'less is a bore': historical quotation used with a straight face and a smirk at the same time.",unit:4,unitName:"Later Europe and Americas",year:1978,images:[{src:"cb/152-1.jpg",w:1194,h:812,caption:"House in New Castle County",credit:"© Venturi, Scott Brown Collection/The Architectural Archives, University of Pennsylvania/Photo by Matt Wargo"},{src:"cb/152-2.jpg",w:621,h:814,caption:"House in New Castle County",credit:"© Venturi, Scott Brown Collection/The Architectural Archives, University of Pennsylvania/Photo by Matt Wargo"}],thumb:["thumbs/t2-u4.webp",5,6,8,7],notes:[["Form","A house in Delaware with a stucco and wood frame and a playful facade: a front with flat **cut-out arches** like stage scenery, a broken pediment and colorful patterns. Classical forms are flattened, exaggerated and witty."],["Function","A private country house for a family, built around a large music room."],["Context","**Robert Venturi, John Rauch and Denise Scott Brown**, pioneers of **Postmodernism**. Venturi answered Mies's 'less is more' with **'less is a bore'**. It brings back historical references, ornament, symbolism, irony and humor, mixing classical with popular (Learning from Las Vegas)."],["Exam hooks","Venturi, Rauch, Scott Brown · Postmodernism · 'less is a bore' · flat cut-out classical forms · irony · ornament returns"],["Compare with","Seagram Building (#146): the modernism it answers. Monticello (#102): classical revival."]]},{n:153,title:"Chavín de Huántar",maker:"Chavín; northern highlands, Peru",date:"900–200 B.C.E.",medium:"Stone (architectural complex); granite (Lanzón and sculpture); hammered gold alloy (jewelry)",context:"A pilgrimage centre built where two rivers meet, with a sunken circular plaza and a warren of unlit stone galleries. At the heart stands the Lanzón, a 15-foot granite shaft carved with a fanged, snake-haired deity, wedged into a cramped cruciform chamber. Contour rivalry — lines that read as two things at once — plus darkness, roaring water channels and hallucinogens made the encounter overwhelming.",unit:5,unitName:"Indigenous Americas",year:-900,images:[{src:"cb/153-1.jpg",w:632,h:927,caption:"Lanzón Stela",credit:"© Richard List/Corbis"},{src:"cb/153-2.jpg",w:992,h:683,caption:"Relief sculpture",credit:"© Charles & Josette Lenars/Corbis"},{src:"cb/153-3.jpg",w:993,h:684,caption:"Nose ornament",credit:"Photograph © The Cleveland Museum of Art"},{src:"cb/153-4.jpg",w:992,h:874,caption:"Chavín de Huántar plan",credit:"© Richard List/Corbis"}],thumb:["thumbs/t2-u5.webp",0,0,6,3],notes:[["Form — architecture","A temple complex at about 3,150 m, where two rivers meet. The **Old Temple** is **U-shaped** (arms open to the east, toward sunrise) around a **sunken circular plaza**. Inside the platforms are **dark, narrow, maze-like galleries** with stone channels. Water rushing through **stone drains** and the sound of **pututus (conch-shell trumpets)**, found at the site, produced disorienting roaring sounds. The later New Temple has the **Black and White Portal** — columns in **black limestone and white granite** (possibly duality: male/female) carved with **bird-of-prey figures (harpy eagle/hawk)**."],["Gold jewelry","thin **hammered gold** ornaments (e.g., nose ornaments) with feline/serpent imagery — **repoussé** technique; wearable status and supernatural identity."],["Function","**Pilgrimage center and oracle**; priests used light, darkness, sound, and drugs to create a transformative religious experience."],["Content","**Jaguars, caimans, harpy eagles, snakes** — animals from the **Amazon rainforest**, far to the east — showing long-distance contact and cosmic power."],["Context",'The Chavín style spread widely across Peru — a religious "horizon." Precedes the Inka by more than 1,500 years.'],["Exam hooks","Lanzón in cruciform chamber · U-shaped temple · dark galleries + sound · jaguar transformation (tenon heads) · Amazonian animals · pilgrimage/oracle."],["One-sentence thesis","Chavín de Huántar orchestrated darkness, sound, hallucinogens, and composite animal-deity imagery to transform pilgrims and priests, centering its sacred power on the hidden Lanzón."],["Compare with","Templo Mayor (sacred architecture as cosmic mountain); Transformation mask (transformation); Machu Picchu (architecture and sacred landscape)."]]},{n:154,title:"Mesa Verde cliff dwellings",maker:"Ancestral Puebloan (Anasazi); Montezuma County, Colorado",date:"450–1300 C.E.",medium:"Sandstone",context:"Villages of coursed sandstone and mortar built into south-facing alcoves in the canyon walls, reached by hand-and-toe holds. The overhang gave winter sun, summer shade and defence. Round sunken kivas with a sipapu hole served as ceremonial rooms; crops grew on the mesa top above. Abandoned around 1300, probably during a prolonged drought.",unit:5,unitName:"Indigenous Americas",year:450,images:[{src:"cb/154-1.jpg",w:1200,h:795,caption:"Mesa Verde cliff dwellings",credit:"© Kerrick James/Corbis"}],thumb:["thumbs/t2-u5.webp",1,0,6,3],notes:[["Form","Multi-story dwellings built **inside natural alcoves of canyon cliffs**. **Cliff Palace**, the largest, has about **150 rooms and 23 kivas**. Walls of **shaped sandstone blocks** set in **adobe (mud) mortar**, with wooden beams; some plastered and painted. Square and round towers."],["Kivas","**circular, semi-subterranean ceremonial rooms**, entered by ladder through the roof, with a **sipapu** — a small hole in the floor symbolizing the **place of emergence** of the ancestors from the underworld. Kivas were used for ritual and community gatherings."],["Function","Housing, storage, and ceremony. The alcoves **faced south**: the low winter sun warmed them while the overhang **shaded them in summer**; the cliffs also offered **defense** and protection from weather. Farming was done on the mesa tops."],["Context",'People lived on Mesa Verde from about 550 CE in **pit houses** on the mesa tops; the cliff dwellings were built mostly in the **late 1100s–1200s**. Abandoned by about **1300** — likely due to **drought, resource depletion, and conflict**. Descendants include the **Hopi, Zuni, and Rio Grande Pueblos**. "Anasazi" is a Navajo word; "Ancestral Puebloan" is preferred today.'],["Exam hooks","alcoves + south-facing (climate) · kivas + sipapu (emergence) · abandoned c. 1300 · sandstone and adobe · defense."],["One-sentence thesis","Mesa Verde's cliff dwellings adapted architecture to the canyon environment for climate and defense while kivas anchored community ritual in the story of ancestral emergence."],["Compare with","Machu Picchu (architecture integrated into dramatic terrain); Great Zimbabwe (dry-stone settlement); Black-on-black vessel (Puebloan descendants)."]]},{n:155,title:"Yaxchilán",maker:"Maya; Chiapas, Mexico",date:"725 C.E.",medium:"Limestone (architectural complex)",context:"A Maya city on a bend of the Usumacinta with temples on stepped platforms and elaborate roof combs. Structure 23's carved lintels show Lady Xook drawing a thorned rope through her tongue and then witnessing a vision serpent — royal bloodletting as a way of contacting ancestors. The reliefs name their patrons and dates, making rulership and ritual legible to visitors.",unit:5,unitName:"Indigenous Americas",year:725,images:[{src:"cb/155-1.jpg",w:1200,h:791,caption:"Structure 40",credit:"© vario images GmbH & Co. KG/Alamy"},{src:"cb/155-2.jpg",w:605,h:918,caption:"Lintel 25, Structure 23",credit:"© Werner Forman/Art Resource, NY"},{src:"cb/155-3.jpg",w:1200,h:799,caption:"Structure 33",credit:"© Christian Kober/Robert Harding World Imagery/Corbis"}],thumb:["thumbs/t2-u5.webp",2,0,6,3],notes:[["Form & parts",`A Maya city on the **Usumacinta River**. Know three parts:
• **Structure 33** — a temple built by **Bird Jaguar IV** on a hill overlooking the river; **three doorways with carved lintels**, a **roof comb** (openwork stone crest) on top, and a **hieroglyphic stairway** showing him playing the ballgame. Built to **legitimize his rule** (his claim to the throne was disputed).
• **Lintel 25** (from Structure 23) — commissioned by **Shield Jaguar II** for his wife **Lady Xok**. Carved in relief: Lady Xok, after **bloodletting** (drawing a thorn-studded rope through her tongue — shown on Lintel 24), kneels before an enormous **Vision Serpent**, from whose mouth emerges a **warrior ancestor** (dynastic founder, often identified as Yat Balam, or Shield Jaguar himself) in armor. Bowls hold **blood-soaked paper**, burned to produce the smoke from which the serpent appears. **Glyphs** record dates and names. (Lintel 25 is now in the British Museum.)
• **Structure 40** — another temple of Bird Jaguar IV with stelae showing him and his parents, reinforcing his lineage.`],["Function","**Political propaganda and ritual**: rulers and royal women performed **bloodletting** to contact **ancestors and gods** and prove their right to rule. The images and texts publicly **record dynastic history**."],["Content","Royal ritual, ancestors, warfare, dynastic dates."],["Context","Late Classic Maya; writing system, Long Count calendar, and powerful city-states. Unusual prominence of **royal women** (Lady Xok's lintels)."],["Exam hooks","Lintel 25 + Vision Serpent + Lady Xok · bloodletting = contact with ancestors · Bird Jaguar IV legitimacy · roof comb · glyphs = history."],["One-sentence thesis","Yaxchilán's temples and carved lintels used images of bloodletting, vision serpents, and inscriptions to make royal lineage — and royal women's ritual role — visible and permanent."],["Compare with","Templo Mayor (ritual blood and rulership); Benin plaque (art recording royal court); Ndop (legitimacy of a ruler)."]]},{n:156,title:"Great Serpent Mound",maker:"Mississippian (Eastern Woodlands); Adams County, southern Ohio",date:"c. 1070 C.E.",medium:"Earthwork/effigy mound",context:"A quarter-mile earthen serpent winding along a ridge, its coiled tail at one end and open jaws around an oval at the other. It contains no burials, so it was made to be seen and used rather than to hold the dead. The head aligns with the summer solstice sunset; the oval has been read as an egg, a sun, or an eclipse. Fully legible only from above.",unit:5,unitName:"Indigenous Americas",year:1070,images:[{src:"cb/156-1.jpg",w:1200,h:805,caption:"Great Serpent Mound",credit:"© Richard A. Cooke/Corbis"}],thumb:["thumbs/t2-u5.webp",3,0,6,3],notes:[["Form","An **effigy mound** (earth sculpture in the shape of an animal): a **snake about 411 m (1,348 ft) long** and about 1 m high, with **seven curves** and a **coiled tail**. At the head, the **open mouth** seems to hold or swallow an **oval** (read as an egg, the sun, or an eye). Built on a **plateau above a creek**, following the ridge's natural curve. Best seen from above."],["Function","Ceremonial — **no burials inside it** (burial mounds are nearby, from other periods). The **head aligns with the summer-solstice sunset**; some argue the coils align with other solar/lunar events. Serpents were associated with the **underworld, water, and fertility** in Eastern Woodlands cosmology."],["Context","**Dating is debated** — some evidence points to the Adena culture (c. 300 BCE), other evidence to c. 1070 CE (Fort Ancient/Mississippian period), a date sometimes linked to **Halley's Comet (1066)** and a nearby supernova. The College Board uses **c. 1070 CE**. It sits near a rare **geological crater** (impact or cryptoexplosion structure), which may have made the place sacred. Restored in the **1880s** by archaeologist **Frederic Ward Putnam** (Harvard's Peabody Museum) — an early preservation effort."],["Exam hooks","effigy mound · solstice alignment · no burials · debated dating · built on landscape; best seen from above."],["One-sentence thesis","Great Serpent Mound shaped the land itself into a monumental serpent aligned with the solstice sun, turning landscape into a sacred cosmic image."],["Compare with","Stonehenge (solstice alignment, earthwork/henge); Nan Madol; Templo Mayor (serpent imagery)."]]},{n:157,title:"Templo Mayor (Main Temple)",maker:"Mexica (Aztec); Tenochtitlan (modern Mexico City)",date:"1375–1520 C.E.",medium:"Stone (temple); volcanic stone (Coyolxauhqui Stone); jadeite (Olmec-style mask); basalt (Calendar Stone)",context:"A twin-stair pyramid at the centre of the Aztec capital, rebuilt in ever larger shells, with shrines to Huitzilopochtli (war, sun) and Tlaloc (rain) side by side. The Coyolxauhqui Stone, showing his dismembered sister, lay at the foot of his stair so sacrificial bodies landed on her. Buried offerings from across the empire made the temple a map of Aztec reach.",unit:5,unitName:"Indigenous Americas",year:1375,images:[{src:"cb/157-1.jpg",w:993,h:762,caption:"The Coyolxauhqui Stone",credit:"© Gianni Dagli Orti/Corbis"},{src:"cb/157-2.jpg",w:993,h:786,caption:"Calendar Stone",credit:"© AZA/Archive Zabé/Art Resource, NY"},{src:"cb/157-3.jpg",w:625,h:787,caption:"Olmec-style mask",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"},{src:"cb/157-4.jpg",w:1001,h:762,caption:"Templo Mayor (reconstruction drawing)",credit:"© Archives Larousse, Paris, France/Giraudon/The Bridgeman Art Library"}],thumb:["thumbs/t2-u5.webp",4,0,6,3],notes:[["Form — temple","A **twin-temple pyramid** at the sacred center of Tenochtitlan (an island city in Lake Texcoco), with **two staircases and two shrines** on top: the **south shrine to Huitzilopochtli** (god of **sun and war**, painted red) and the **north shrine to Tlaloc** (god of **rain and agriculture**, painted blue/white). Rebuilt/enlarged **seven times**, each layer encasing the last."],["Meaning","The temple is a **man-made sacred mountain**: the Huitzilopochtli side = **Coatepec (Serpent Mountain)**, where he was born; the Tlaloc side = **Tonacatepetl (Mountain of Sustenance)**. Together: **war/tribute + agriculture** — the two bases of the Mexica economy. Serpent heads at the base."],["Function","Religious and political center — site of **human sacrifice** to sustain the sun and rain; display of empire."],["Context","The Spanish under **Cortés destroyed** the Templo Mayor after conquering Tenochtitlan in **1521** and built Mexico City (and its cathedral) over it."],["Exam hooks","twin temples (Huitzilopochtli/Tlaloc) · sacred mountains · Coyolxauhqui at base of stairs = myth re-enacted · 1978 discovery · Olmec heirloom · Sun Stone = 5 suns."],["One-sentence thesis","The Templo Mayor staged Mexica cosmology in stone: twin sacred mountains, a dismembered goddess at the stair's foot, and buried ancient heirlooms fused sacrifice, myth, and imperial legitimacy."],["Compare with","Chavín (sacred architecture, hidden ritual objects); Yaxchilán (blood ritual and rule); Cusco/Qorikancha (sacred center later built over by the Spanish)."]]},{n:158,title:"Ruler's feather headdress (probably of Motecuhzoma II)",maker:"Mexica (Aztec)",date:"1428–1520 C.E.",medium:"Feathers (quetzal and cotinga) and gold",context:"A fan of some 400 iridescent green quetzal tail feathers over bands of blue cotinga and pink flamingo, studded with gold plaques. Featherwork was a specialist craft (amanteca) and tropical feathers arrived as tribute from the empire's edges. Wearing it made a ruler shimmer and move like a living bird — wealth, reach and divine association in one object.",unit:5,unitName:"Indigenous Americas",year:1428,images:[{src:"cb/158-1.jpg",w:1200,h:929,caption:"Ruler’s feather headdress",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"}],thumb:["thumbs/t2-u5.webp",5,0,6,3],notes:[["Form","A huge fan-shaped headdress (about 116 cm high, 175 cm wide) of more than 400 **long iridescent green quetzal tail feathers**, with bands of **blue cotinga**, pink/brown feathers, and small **gold disks** and plaques. Mounted on a netting backing."],["Function","Ceremonial regalia for a ruler or high priest — displays **divine status**. **Quetzal feathers were more valuable than gold** to the Mexica; the quetzal was associated with **Quetzalcoatl** (feathered serpent) and with preciousness, fertility, and the divine."],["Makers","**Amanteca** — specialist feather-workers (a guild) in Tenochtitlan. Feathers came through **tribute and long-distance trade** (quetzals live in the Guatemalan/Chiapas cloud forests)."],["Context","Probably sent to Europe after the conquest; first recorded in a **Habsburg collection** in 1596; now in the **Weltmuseum, Vienna**. That it belonged to Motecuhzoma II is **not certain**. **Mexico has requested its return**; Austria says it is **too fragile to travel** — a key **repatriation** debate."],["Exam hooks",'quetzal feathers > gold · amanteca · tribute/trade · Vienna + repatriation debate · "probably" Motecuhzoma.'],["One-sentence thesis","The feather headdress shows how the Mexica valued rare, tribute-gathered quetzal feathers above gold to express a ruler's sacred status, and its location in Vienna raises continuing questions of repatriation."],["Compare with","**ʻAhu ʻula** (#215 — classic pair: feathers, rank, divine associations); All-T'oqapu tunic (textile/regalia of a ruler); Golden Stool."]]},{n:159,title:"City of Cusco",maker:"Inka; central highlands, Peru",date:"c. 1440 C.E.; convent added 1550–1650 C.E.",medium:"Andesite",context:"The Inka capital, laid out — by tradition — in the shape of a puma, with the Qorikancha sun temple at its heart. Walls are ashlar masonry so precisely cut that blocks lock without mortar and survive earthquakes; trapezoidal doors and niches taper for stability. The Spanish built the church of Santo Domingo directly on the Qorikancha's foundations, which outlasted it.",unit:5,unitName:"Indigenous Americas",year:1440,images:[{src:"cb/159-1.jpg",w:1200,h:804,caption:"Curved Inka wall of Qorikancha with Santo Domingo convent",credit:"© Michael Freeman/Corbis"},{src:"cb/159-2.jpg",w:992,h:782,caption:"Walls at Saqsa Waman (Sacsayhuaman)",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"},{src:"cb/159-3.jpg",w:621,h:771,caption:"City of Cusco plan",credit:"© Michael Freeman/Corbis"}],thumb:["thumbs/t2-u5.webp",0,1,6,3],notes:[["Form — Inka masonry","**Ashlar masonry**: stones cut and ground to fit so tightly **without mortar** that a blade cannot slip between them. Walls are **battered** (slope inward as they rise), with **trapezoidal doors and niches** — all of which make them **earthquake-resistant**."],["City plan",'The emperor **Pachacuti** rebuilt Cusco (c. 1440) as the capital — the "**navel of the world**," center of the four quarters of the empire (Tawantinsuyu). Tradition says the city was laid out in the **shape of a puma**, with **Saqsa Waman as the head**.'],['Qorikancha ("Golden Enclosure")',"the **main Inka temple**, dedicated to **Inti (the sun)** and other deities (moon, stars, thunder). Walls were **covered with sheets of gold**; a **garden of life-size gold and silver plants and animals** (including maize — see #160) filled its courtyard. It was the hub of the **ceque system** — lines radiating out to **huacas** (sacred places) across the landscape."],["Santo Domingo","After the conquest (1533), the Spanish stripped the gold and **Dominican friars built a church and convent directly on top of the Qorikancha**, using its walls as foundations — a statement of **Christian triumph over Inka religion**. But when **earthquakes (1650, 1950)** struck, the **colonial parts collapsed while the Inka walls survived** — often read as a symbolic reversal."],["Saqsa Waman","A fortress/ceremonial complex above Cusco with **three tiers of zigzag walls** built of **enormous polygonal stones** (some over 100 tons) fitted perfectly. Site of battle during **Manco Inca's rebellion (1536)**."],["Exam hooks","mortarless ashlar · battered walls, trapezoidal openings · Qorikancha = sun temple with gold · Santo Domingo built on top · Inka walls survive earthquakes · puma plan."],["One-sentence thesis","Cusco's Inka masonry embodied imperial order and sacred geography, and the Spanish convent built atop the Qorikancha records conquest — while the surviving Inka walls record endurance."],["Compare with","Templo Mayor (sacred center destroyed/built over by Spanish); Great Zimbabwe (mortarless stone); Machu Picchu."]]},{n:160,title:"Maize cobs",maker:"Inka",date:"c. 1440–1533 C.E.",medium:"Sheet metal/repoussé, metal alloys",context:"Life-size maize plants worked in hammered sheet gold and silver, made for the Qorikancha's ceremonial garden alongside metal llamas and shepherds. Maize was the staple crop and the base of chicha beer used in state feasts. For the Inka, gold was the sweat of the sun and silver the tears of the moon; most such work was melted down by the Spanish.",unit:5,unitName:"Indigenous Americas",year:1440,images:[{src:"cb/160-1.jpg",w:667,h:1033,caption:"Maize cobs",credit:"© bpk, Berlin/Ethnologisches Museum, Staatliche Museen/Claudia Obrocki/ Art Resource, NY"}],thumb:["thumbs/t2-u5.webp",1,1,6,3],notes:[["Form","**Life-size ears of corn** made from thin sheets of **gold and silver alloys**, shaped by **repoussé** (hammered from the back) and joined — kernels, husks, and silk rendered naturalistically."],["Function","Probably part of the **golden garden of the Qorikancha**, described by Spanish chroniclers — a sacred display of **agricultural abundance** offered to the sun. May also have been used in **planting/harvest rituals** in which the Inka ruler ceremonially began the planting."],["Content & meaning",'**Maize** was central to Inka life — food, **chicha (maize beer)** used in ritual and feasting, and state storage. **Gold = "sweat of the sun," silver = "tears of the moon"** — metals were sacred, not currency.'],["Context","The Spanish **melted down almost all Inka gold and silver** into ingots (including Atahualpa's ransom, 1532–33), so **very few pieces survive** — survivors are rare witnesses to lost Inka metalwork."],["Exam hooks","repoussé · gold = sweat of the sun · Qorikancha garden · maize = economy + ritual · most Inka metalwork melted."],["One-sentence thesis","The Inka maize cobs translated the staple crop into sacred metal for the sun temple, and their rare survival testifies to the Spanish destruction of Inka goldwork."],["Compare with","Golden Stool (gold as sacred, embodied power); Chavín gold (hammered gold); feather headdress (what Europeans valued vs. what Indigenous Americans valued)."]]},{n:161,title:"City of Machu Picchu",maker:"Inka; central highlands, Peru",date:"c. 1450–1540 C.E.",medium:"Granite (architectural complex)",context:"A royal estate on a ridge between two peaks, probably built for Pachacuti, with agricultural terraces, fountains fed by a channelled spring, and quarters sorted by rank. The Intihuatana, a carved granite outcrop, tracks the sun at the solstices. Buildings follow and echo the rock rather than levelling it — the site is designed around sightlines to sacred peaks.",unit:5,unitName:"Indigenous Americas",year:1450,images:[{src:"cb/161-1.jpg",w:1023,h:1023,caption:"City of Machu Picchu",credit:"© Hugh Sitton/Corbis"},{src:"cb/161-2.jpg",w:683,h:1020,caption:"Observatory",credit:"© Nick Saunders/Barbara Heller Photo Library, London/Art Resource, NY"},{src:"cb/161-3.jpg",w:1200,h:939,caption:"Intihuatana Stone",credit:"© DEA/G. DAGLI ORTI/De Agostini Picture Library/Getty Images"}],thumb:["thumbs/t2-u5.webp",2,1,6,3],notes:[["Form",`A royal estate on a **ridge between two peaks (Machu Picchu and Huayna Picchu)** high above the Urubamba River. About 200 structures: temples, houses, plazas, and **agricultural terraces** carved into the slopes. Finest buildings in **ashlar masonry**; others in fieldstone. The architecture **echoes and frames the surrounding mountains**. Know three parts:
• **Observatory (Torreón / Temple of the Sun)** — a **curved ashlar wall** built around a sacred rock; a window aligns with the **June solstice sunrise** (and certain stars), lighting a cut in the rock.
• **Intiwatana** ("hitching post of the sun") — a **carved granite outcrop** with angles and a projecting post; probably used for **astronomical observation and ritual** tied to the sun.
• **Sacred Rock** — a large flat stone whose **outline mirrors the mountain peak** behind it — the architecture imitates the landscape, honoring the mountains (apus) as sacred.`],["Function","Built c. 1450 as a **royal retreat/estate for the emperor Pachacuti**; a religious and astronomical site. Residents grew crops on the terraces."],["Context","Abandoned around the time of the Spanish conquest; **never found by the Spanish** (so not destroyed). Brought to **international attention by Hiram Bingham in 1911** (local farmers knew it). UNESCO site; now threatened by **tourism**."],["Exam hooks","Torreón + June solstice · Intiwatana · Sacred Rock mirrors mountain · royal estate of Pachacuti · terraces · never found by the Spanish."],["One-sentence thesis","Machu Picchu integrates Inka architecture into a sacred mountain landscape, aligning shrines with the sun and shaping stones to echo the peaks around them."],["Compare with","Cusco (Inka masonry); Mesa Verde (architecture built into terrain); Stonehenge (solstice alignment)."]]},{n:162,title:"All-T'oqapu tunic",maker:"Inka",date:"1450–1540 C.E.",medium:"Camelid fiber and cotton",context:"A man's sleeveless tunic covered edge to edge in t'oqapu — small squares of abstract pattern. Individual t'oqapu marked rank, region, or office, so a garment carrying all of them signals authority over the whole empire, probably the Sapa Inka himself. Woven in tapestry with an extremely fine thread count by specialist weavers; cloth outranked gold as Inka wealth.",unit:5,unitName:"Indigenous Americas",year:1450,images:[{src:"cb/162-1.jpg",w:884,h:1033,caption:"All-T’oqapu tunic",credit:"© Dumbarton Oaks, Washington, D.C."}],thumb:["thumbs/t2-u5.webp",3,1,6,3],notes:[["Form","A **T-shaped tunic** (unku) made of **interlocking tapestry** weave with an **extremely high thread count**, entirely covered in a grid of **t'oqapu** — small squares each holding a different **geometric design**. A **V/diamond-shaped yoke** at the neck. Bright red, yellow, blue, and black camelid fiber (alpaca/vicuña) on a cotton warp."],["Function",`Probably worn by the **Sapa Inka (emperor)** — it is unique; most Inka tunics use a single standard pattern. Because it contains **"all" t'oqapu**, it may represent the ruler's authority over **all the peoples, places, and institutions of the empire**. One t'oqapu (a checkerboard) is associated with the Inka military; another (the key motif) with Inka officials.`],["Content","Abstract geometric symbols that may function like **heraldry** or a **form of writing/record** (like the **khipu**, knotted-cord records)."],["Context",'**Textiles were the most valued goods in the Inka empire** — more than gold. Fine cloth (**qompi**) was woven by **aqllakuna ("chosen women")** and male specialists (qompikamayuq), stored in state warehouses, **given as gifts** to bind loyalty, and even **burned as offerings**. Now at **Dumbarton Oaks**, Washington, D.C.'],["Exam hooks","t'oqapu = geometric symbols · emperor's garment · textile > gold · aqllakuna · interlocking tapestry · empire in miniature."],["One-sentence thesis","The All-T'oqapu tunic concentrates the Inka empire's symbolic codes into one garment, displaying the Sapa Inka's authority through the most valued art form of the Andes: cloth."],["Compare with","Hiapo and Fijian mats (textiles as wealth); feather headdress (royal regalia); Lukasa (encoded information)."]]},{n:163,title:"Bandolier bag",maker:"Lenape (Delaware tribe, Eastern Woodlands)",date:"c. 1850 C.E.",medium:"Beadwork on leather",context:"A large beaded pouch worn across the chest on a wide strap — the pocket is often sealed, so it is regalia rather than storage. Curving floral motifs reflect European contact and mission-school embroidery, reworked into a distinctly Native idiom. Glass beads came through trade; the form itself echoes soldiers' cartridge bags. Made by women, worn by men on formal occasions.",unit:5,unitName:"Indigenous Americas",year:1850,images:[{src:"cb/163-1.jpg",w:776,h:1033,caption:"Bandolier bag",credit:"Used by permission"}],thumb:["thumbs/t2-u5.webp",4,1,6,3],notes:[["Form","A bag with a **wide shoulder strap**, worn **diagonally across the body**, covered in **glass beadwork** in bold colors and **curvilinear floral** and geometric patterns. Materials combine **European trade goods (glass beads, wool, cotton cloth)** with leather and Indigenous design."],["Function","**Prestige and ceremonial dress** — the pouch is often **too small or even non-functional**, so it was mainly **a status display**. Worn at gatherings; often several at once. Given as **gifts** and traded (sometimes valued like a horse)."],["Makers","**Women** made the beadwork; beadwork replaced earlier **porcupine-quill** embroidery."],["Context","Floral patterns show **exchange with Europeans** (e.g., influence of European embroidery taught at mission schools), adapted into a distinct Indigenous style. The Lenape were **forced westward from their homeland** (Delaware River valley) by colonial expansion and U.S. **Indian Removal** policy — bags like this assert **identity and continuity** through displacement."],["Exam hooks","European glass beads + Native design · women's art · status display · shoulder bag worn across the body · removal/displacement context."],["One-sentence thesis","The Lenape bandolier bag transformed European trade materials into an Indigenous symbol of status and identity during a period of forced displacement."],["Compare with","Painted elk hide (Native art under U.S. pressure); Black-on-black vessel (Native women's art and the market)."]]},{n:164,title:"Transformation mask",maker:"Kwakwaka'wakw; Northwest coast of Canada",date:"Late 19th century C.E.",medium:"Wood, paint, and string",context:"A hinged mask that the dancer snaps open with strings to reveal a second face inside — an animal or ancestor becoming human. Used in winter potlatch ceremonies by firelight, with song and choreography, to dramatise a clan's origin story and confirm its rights. Formline design: ovoids, U-forms and split representation in black, red and blue-green.",unit:5,unitName:"Indigenous Americas",year:1875,images:[{src:"cb/164-1.jpg",w:1023,h:789,caption:"Transformation mask, closed",credit:"© Musée du Qual Branly/Scala/Art Resource, NY"},{src:"cb/164-2.jpg",w:992,h:792,caption:"Transformation mask, open",credit:"© Musée du Qual Branly/Scala/Art Resource, NY"}],thumb:["thumbs/t2-u5.webp",5,1,6,3],notes:[["Form","A **hinged mask** with an outer face of an **animal or bird** (e.g., an eagle/raven or sea creature) that **opens with strings** to reveal an **inner human face**. Painted in **formline style** — bold red, black, white, and blue-green with **ovoids and U-forms**."],["Function","Performed in **potlatch** ceremonies and winter dances. In the **dim firelight**, the dancer pulls the strings at a dramatic moment, **transforming** from animal to human — representing the **ancestor's transformation** and the **family's origin story**. The right to use a mask and tell its story is a **hereditary privilege owned by the family**."],["Potlatch","a feast where hosts **give away wealth** to validate status, names, rights, and events (births, marriages, deaths)."],["Context","The **Canadian government banned the potlatch from 1884 to 1951**; masks and regalia were **confiscated** (notably after a 1921 potlatch). Many have since been **repatriated** (e.g., to the U'mista Cultural Centre) — central to Indigenous cultural revival."],["Exam hooks","mask opens = transformation · potlatch · performance in firelight · family crest/privilege · potlatch ban 1884–1951 · repatriation."],["One-sentence thesis","The Kwakwaka'wakw transformation mask performs the link between human and animal ancestors, and its history under the potlatch ban shows art at the center of colonial suppression and Indigenous survival."],["Compare with","Buk mask (human/animal fusion in performance); Chavín tenon heads (transformation); Pwo/Mb
