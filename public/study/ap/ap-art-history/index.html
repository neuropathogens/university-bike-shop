y · Classical restraint · drapery · domestic ideal"],["Compare with","Peplos Kore (#28): an earlier female figure. Anavysos Kouros (#27): another grave marker."]]},{n:37,title:"Winged Victory of Samothrace",maker:"Hellenistic Greek",date:"c. 190 B.C.E.",medium:"Marble",context:"Nike alighting on the prow of a warship, originally set in an open-air sanctuary above a pool so she seemed to descend out of the sky. Wind presses the drapery to her body and streams it behind her — Hellenistic theatricality and torsion, composed to be seen from the front left. Almost certainly a naval victory monument.",unit:2,unitName:"Ancient Mediterranean",year:-190,images:[{src:"cb/37-1.jpg",w:737,h:1037,caption:"Winged Victory of Samothrace",credit:"© RMN-Grand Palais/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",1,3,8,5],notes:[["Form","A colossal marble **Nike** (Victory) landing on the **prow of a warship**, wings spread back. Deeply carved, **wind-blown drapery** clings to and swirls around her body. Strong **diagonal movement** and dramatic light and shadow."],["Function","A **victory monument**, probably commemorating a **naval victory**. It was set in a sanctuary on Samothrace above a pool that suggested the sea."],["Context","**Hellenistic**: theatrical, dynamic and emotional, interacting with the viewer's space. Excavated in 1863, it now stands at the top of the Daru staircase in the Louvre."],["Exam hooks","Hellenistic · Nike on ship's prow · wind-swept drapery · theatrical · naval victory · Louvre"],["Compare with","Victory adjusting her sandal (#35): Classical calm versus Hellenistic drama. Great Altar (#38): Hellenistic drama."]]},{n:38,title:"Great Altar of Zeus and Athena at Pergamon",maker:"Hellenistic Greek; Asia Minor (present-day Turkey)",date:"c. 175 B.C.E.",medium:"Marble (architecture and sculpture)",context:"A U-shaped altar on a high podium reached by a broad stair that cuts straight into the frieze. The gigantomachy — gods against giants — writhes in deep undercut relief, with figures clambering out onto the steps. Read as an allegory of Pergamene victory over the Gauls: extreme emotion, straining muscle, drapery in violent motion.",unit:2,unitName:"Ancient Mediterranean",year:-175,images:[{src:"cb/38-1.jpg",w:961,h:778,caption:"Great Altar of Zeus and Athena",credit:"© bpk, Berlin/Antikensammlung, Staatliche Museen/Photo © Juergen Liepe/ Art Resource, NY"},{src:"cb/38-2.jpg",w:1039,h:778,caption:"Athena",credit:"© Erich Lessing/Art Resource, NY"},{src:"cb/38-3.jpg",w:667,h:1040,caption:"Great Altar of Zeus and Athena plan",credit:""}],thumb:["thumbs/t2-u2.webp",2,3,8,5],notes:[["Form","A monumental **altar** on a high platform with a huge flight of stairs cut into it. Around the base runs a **high-relief frieze** (over 300 feet) of the **Gigantomachy**: gods battling giants. Its figures twist and overlap, burst out of the frame and even crawl onto the stairs."],["Function","An altar to **Zeus and Athena** at **Pergamon**."],["Content","Athena grabs the giant **Alkyoneus** by the hair as Gaia, his mother, rises from the ground pleading. Zeus fights several giants. The battle stands for order against chaos."],["Context","Built by the Attalid kings to celebrate victory over the **Gauls**, framing Pergamon as a new Athens of civilization against barbarism. **Hellenistic**: extreme emotion, theatricality and dramatic movement. It was reconstructed in the **Pergamon Museum, Berlin**."],["Exam hooks","Gigantomachy · high relief · Hellenistic drama · Athena and Alkyoneus · victory over Gauls · Berlin"],["Compare with","Parthenon (#35): the Classical model it echoes. Winged Victory (#37): Hellenistic. Ludovisi sarcophagus (#47): a crowded battle."]]},{n:39,title:"House of the Vettii",maker:"Imperial Roman; Pompeii, Italy",date:"c. second century B.C.E.; rebuilt c. 62–79 C.E.",medium:"Cut stone and fresco",context:"A wealthy house organised on an axis: entrance, atrium with impluvium, then peristyle garden. Fourth Style wall painting mixes framed mythological panels with illusionistic architecture that opens the wall. The owners were freedmen who made money in trade, so the decoration is a status claim as much as a taste.",unit:2,unitName:"Ancient Mediterranean",year:-200,images:[{src:"cb/39-1.jpg",w:1e3,h:736,caption:"Frescoes",credit:"© Scala/Art Resource, NY"},{src:"cb/39-2.jpg",w:838,h:1049,caption:"House of the Vettii plan",credit:"Atrium Photo © Henri Stierlin, Genève"},{src:"cb/39-3.jpg",w:714,h:1060,caption:"House of the Vettii plan",credit:"Atrium Photo © Henri Stierlin, Genève"}],thumb:["thumbs/t2-u2.webp",3,3,8,5],notes:[["Form","A wealthy Roman **domus** with an **atrium** (central hall open to the sky, with an impluvium basin catching rain) leading to a **peristyle garden**. Walls are painted in the **Fourth Style** of Roman painting: architectural fantasies with framed mythological scenes, as in the Ixion Room and the Pentheus Room."],["Function","The home of the **Vettii brothers**, wealthy **freedmen** (former slaves) and merchants. The house displayed their success to clients and guests."],["Content","Frescoes show myths (Pentheus torn apart, Ixion's punishment) and cupids at work. A Priapus figure at the entrance symbolized fertility and prosperity."],["Context","It was buried by **Vesuvius in 79 CE**, preserving it. It shows social mobility in Roman society and the axial plan of the Roman house."],["Exam hooks","domus · atrium/impluvium · peristyle · Fourth Style fresco · freedmen · Vesuvius 79 CE"],["Compare with","Alexander Mosaic (#40): another Pompeii house. Tomb of the Triclinium (#32): painted walls."]]},{n:40,title:"Alexander Mosaic, from the House of the Faun, Pompeii",maker:"Republican Roman",date:"c. 100 B.C.E.",medium:"Mosaic",context:"A floor mosaic of roughly a million tesserae, probably copying a lost Hellenistic painting of Alexander charging Darius III at Issus. Foreshortening, cast shadows and a horse seen from behind build real depth; Darius registers panic as his charioteer wheels away. A thicket of spears organises the chaos.",unit:2,unitName:"Ancient Mediterranean",year:-100,images:[{src:"cb/40-1.jpg",w:1e3,h:561,caption:"Alexander Mosaic",credit:"© Araldo de Luca/Corbis"}],thumb:["thumbs/t2-u2.webp",4,3,8,5],notes:[["Form","A floor **mosaic** of millions of small **tesserae**, the opus vermiculatum technique, with a limited palette of reds, yellows, browns, black and white. It uses **foreshortening** (a horse seen from behind), **modeling** with light and shadow, cast shadows and a crowded, chaotic composition. A bare tree suggests the setting."],["Function","Floor decoration in the **House of the Faun** in Pompeii, displaying the owner's wealth and Greek culture."],["Content","**Alexander the Great** (left, bareheaded, charging) faces the Persian king **Darius III** (right, in his chariot, turning back in fear) at the Battle of Issus or Gaugamela. Darius's charioteer whips the horses to flee, and spears are silhouetted against the sky."],["Context","A Roman copy of a lost **Greek painting** (perhaps by Philoxenos of Eretria), so it is evidence of Greek painting. It captures the climactic moment of victory."],["Exam hooks","tesserae · copy of Greek painting · Alexander vs. Darius · foreshortening · House of the Faun · Pompeii"],["Compare with","Night Attack on the Sanjô Palace (#203): your comparison essay. Niobides Krater (#33): Greek painting. Apadana (#30): Persia."]]},{n:41,title:"Seated boxer",maker:"Hellenistic Greek",date:"c. 100 B.C.E.",medium:"Bronze",context:"A hollow-cast bronze athlete resting after a fight, head turned as though someone called him. Copper inlay marks blood on his face and shoulders; his ears are cauliflowered, his nose broken, his hands still wrapped in leather. Hellenistic realism turned to the beaten and the ageing, not only to heroes.",unit:2,unitName:"Ancient Mediterranean",year:-100,images:[{src:"cb/41-1.jpg",w:745,h:1053,caption:"Seated boxer",credit:"© Vanni Archive/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",5,3,8,5],notes:[["Form","A seated **bronze** boxer, life-size, made by the **lost-wax** method in pieces. He is muscular but exhausted, turning his head up to look at someone. The realism is brutal: a broken nose, cauliflower ears, scars, swollen lips and blood (inlaid copper) dripping onto his arm and leg. He still wears his leather boxing gloves."],["Function","A display piece. It may represent a specific champion, or a type: the aging athlete after the fight."],["Context","**Hellenistic** interest in **pathos**, realism and everyday or non-heroic subjects, unlike Classical idealization. Rare surviving original Greek bronze; it was buried in Rome and found in 1885."],["Exam hooks","Hellenistic realism · bronze lost-wax · wounds · pathos · non-ideal subject · original bronze"],["Compare with","Doryphoros (#34): Classical ideal versus Hellenistic realism. Head of a Roman patrician (#42): Roman verism."]]},{n:42,title:"Head of a Roman patrician",maker:"Republican Roman",date:"c. 75–50 B.C.E.",medium:"Marble",context:"Veristic portraiture: jowls, deep creases and thinning hair recorded without flattery. Age signalled experience and gravitas, the qualities that fitted a man for public office. Related to the patrician custom of keeping wax ancestor masks and parading them at family funerals.",unit:2,unitName:"Ancient Mediterranean",year:-75,images:[{src:"cb/42-1.jpg",w:806,h:1036,caption:"Head of a Roman patrician",credit:"© Alinari/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",6,3,8,5],notes:[["Form","A marble portrait head of an elderly man with **verism**: wrinkles, sagging jowls, a toothless mouth and a furrowed brow. An exaggerated, 'warts-and-all' realism."],["Function","A portrait of a Roman **patrician** (aristocrat), possibly part of an ancestral or funerary display."],["Context","Republican Rome valued **age, experience, gravitas and civic virtue** (virtus) over youthful beauty. Patrician families kept **wax death masks** of ancestors (imagines) and paraded them at funerals; marble busts may derive from this custom. Possibly made by Greek sculptors."],["Exam hooks","verism · Republican Rome · age = wisdom · ancestor masks · gravitas · patrician"],["Compare with","Augustus of Prima Porta (#43): imperial idealization replaces verism. Seated boxer (#41): Greek realism."]]},{n:43,title:"Augustus of Prima Porta",maker:"Imperial Roman",date:"Early first century C.E.",medium:"Marble",context:"Augustus addresses troops in the contrapposto of Polykleitos's Doryphoros, but his breastplate shows the Parthians returning Rome's lost standards. Cupid on a dolphin at his feet claims descent from Venus. He is barefoot — a divine attribute — and permanently young. Propaganda written in the language of Greek Classicism.",unit:2,unitName:"Ancient Mediterranean",year:10,images:[{src:"cb/43-1.jpg",w:690,h:1035,caption:"Augustus of Prima Porta",credit:"© Erin Babnik/Alamy"}],thumb:["thumbs/t2-u2.webp",7,3,8,5],notes:[["Form","A marble statue of **Augustus** in **contrapposto** (borrowed from the Doryphoros, #34), raising his arm in **adlocutio** (address to troops). He is shown barefoot with an idealized, ageless face, and was originally painted."],["Function","Political **propaganda**: it presented Augustus as general, peacemaker and divinely favored ruler. It was found at the villa of his wife **Livia** at Prima Porta."],["Content","His **cuirass** (breastplate) shows a Parthian returning Roman military standards lost earlier, a diplomatic victory, surrounded by gods and personifications that announce the Pax Romana. **Cupid on a dolphin** at his leg refers to his claimed descent from **Venus** through Aeneas. Bare feet suggest divinity or heroic status."],["Context","It began the **Pax Romana** (Roman peace). Augustus used Greek Classical style to associate his rule with Athens's golden age."],["Exam hooks","contrapposto from Doryphoros · adlocutio · cuirass with returned standards · Cupid/Venus lineage · bare feet = divine · propaganda · Pax Romana"],["Compare with","Doryphoros (#34): source of the pose. Head of a Roman patrician (#42): verism versus idealism. George Washington (#104): a ruler's image."]]},{n:44,title:"Colosseum (Flavian Amphitheater)",maker:"Imperial Roman; Rome, Italy",date:"70–80 C.E.",medium:"Stone and concrete",context:"An amphitheatre for perhaps 50,000, built on the drained lake of Nero's palace as a populist gift back to the city. Concrete barrel and groin vaults carry the ramps and stairs that emptied it quickly. The exterior stacks Tuscan, Ionic and Corinthian engaged columns over arches — the Roman arch-and-order screen.",unit:2,unitName:"Ancient Mediterranean",year:70,images:[{src:"cb/44-1.jpg",w:1005,h:672,caption:"Colosseum",credit:"© Patrick Durand/Sygma/Corbis"},{src:"cb/44-2.jpg",w:977,h:671,caption:"Colosseum",credit:"© Scala/Ministero per i Beni e le Attività culturali/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",0,4,8,5],notes:[["Form","A huge oval **amphitheater** for about 50,000 spectators, built of **concrete**, travertine and brick, with barrel and groin **vaults** supporting tiered seating. The exterior has four levels: three tiers of **arches framed by engaged columns** in the order **Tuscan (Doric), Ionic, Corinthian**, then an attic with Corinthian pilasters. Below the arena floor, the **hypogeum** held passages and cages."],["Function","**Public entertainment**: gladiator fights, animal hunts and executions, offered free to the people."],["Context","Built by the **Flavian** emperors (Vespasian, Titus) on the site of Nero's private palace lake, which returned land to the people as political goodwill. Numbered entrances and corridors (vomitoria) let crowds flow efficiently. Much of its stone was later quarried for other buildings."],["Exam hooks","Flavian · concrete and vaults · Tuscan-Ionic-Corinthian · engaged columns · bread and circuses · hypogeum · crowd flow"],["Compare with","Pantheon (#46): Roman concrete. Palazzo Rucellai (#70): Renaissance facades reuse the stacked orders."]]},{n:45,title:"Forum of Trajan",maker:"Apollodorus of Damascus; Rome, Italy",date:"Forum and markets 106–112 C.E.; column completed 113 C.E.",medium:"Brick and concrete (architecture); marble (column)",context:"A colonnaded forum with the vast Basilica Ulpia, two libraries and terraced markets cut into the hillside, paid for with Dacian war spoils. Trajan's Column spirals 625 feet of continuous narrative relief up a 128-foot shaft that also records how much earth was removed. His ashes were placed in its base.",unit:2,unitName:"Ancient Mediterranean",year:106,images:[{src:"cb/45-1.jpg",w:1055,h:708,caption:"Trajan markets",credit:"© Franz-Marc Frei/Corbis"},{src:"cb/45-2.jpg",w:476,h:709,caption:"Column of Trajan",credit:"© Vittoriano Rastelli/Corbis"},{src:"cb/45-3.jpg",w:1054,h:659,caption:"Forum of Trajan (reconstruction drawing)",credit:"© John Burge and James Packer"},{src:"cb/45-4.jpg",w:930,h:660,caption:"Basilica Ulpia (reconstruction drawing)",credit:"© Gilbert Gorski and James Packer"}],thumb:["thumbs/t2-u2.webp",1,4,8,5],notes:[["Form","The largest imperial forum in Rome, designed by **Apollodorus of Damascus**. Its parts: a large open plaza with an equestrian statue of Trajan; the **Basilica Ulpia**, a huge hall with apses, a model for later churches; two libraries (Greek and Latin); the 100-foot **Column of Trajan**; and the **Trajan markets** in curved, multi-level brick and concrete."],["Function","A civic, commercial and commemorative center. The basilica hosted law courts and business. The column's base holds **Trajan's ashes**."],["Content","The column's **spiral relief frieze** (about 625 feet) narrates Trajan's victory in the **Dacian Wars** (modern Romania), with Trajan appearing about 60 times. It focuses on the army's engineering and order more than combat."],["Context","It was paid for by the spoils of the Dacian conquest. The **basilica plan** influenced early Christian churches such as Santa Sabina (#49)."],["Exam hooks","Apollodorus of Damascus · Basilica Ulpia · Column of Trajan spiral narrative · Dacian Wars · markets · funded by conquest"],["Compare with","Santa Sabina (#49): basilica plan reused. Bayeux Tapestry (#59): narrative of conquest. Athenian agora (#26): civic center."]]},{n:46,title:"Pantheon",maker:"Imperial Roman; Rome, Italy",date:"118–125 C.E.",medium:"Concrete with stone facing",context:"A traditional temple porch grafted onto a domed rotunda whose interior is a perfect sphere — 142 feet across and 142 high. The concrete grows lighter as it rises, from travertine to pumice, and coffers cut weight further. The 27-foot oculus is the only light source, and its beam sweeps the floor like a sundial.",unit:2,unitName:"Ancient Mediterranean",year:118,images:[{src:"cb/46-1.jpg",w:1200,h:960,caption:"Pantheon",credit:"© Scala/Art Resource, NY"},{src:"cb/46-2.jpg",w:717,h:1016,caption:"Pantheon",credit:"© Vanni Archive/Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",2,4,8,5],notes:[["Form","A **portico** with Corinthian columns and a triangular pediment, joined to a huge **rotunda** covered by a concrete **dome** 142 feet in diameter, equal to its height, so a **perfect sphere** fits inside. A 30-foot **oculus** at the top is the only light source. **Coffers** lighten the dome, which also uses lighter concrete aggregate (pumice) higher up and thins toward the top."],["Function","A temple to **all the gods**, and an imperial symbol: the dome evoked the heavens. Since 609 CE it has been a Christian church (Santa Maria ad Martyres), which is why it survived."],["Context","Built under **Hadrian**; the inscription credits Agrippa, the builder of the earlier temple. The circle of light moves across the interior through the day. It was the largest dome in the world for over 1,300 years and influenced Brunelleschi, Michelangelo and Jefferson (#102)."],["Exam hooks","concrete dome · oculus · coffers · sphere geometry · Hadrian · Agrippa inscription · became a church"],["Compare with","Hagia Sophia (#52): a dome on pendentives. Monticello (#102): Neoclassical dome. Pazzi Chapel (#67): Renaissance centralized dome."]]},{n:47,title:"Ludovisi Battle Sarcophagus",maker:"Late Imperial Roman",date:"c. 250 C.E.",medium:"Marble",context:"A pile-up of Romans and Goths carved so deeply that figures nearly detach from the block. There is no ground line, no space and no sky — bodies fill everything. The bareheaded Roman at the centre, marked with a cross on his forehead, rides serenely above the tangle. Carved during the third-century crisis.",unit:2,unitName:"Ancient Mediterranean",year:250,images:[{src:"cb/47-1.jpg",w:992,h:775,caption:"Ludovisi Battle Sarcophagus",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"}],thumb:["thumbs/t2-u2.webp",3,4,8,5],notes:[["Form","A marble **sarcophagus** with deep **high relief** packed with figures and **no open space** (horror vacui), with no clear ground line. The figures are anti-classical: stacked vertically and in chaotic struggle. The Romans at the top are orderly and victorious; the **Goths** below are defeated and agonized."],["Function","A coffin for a high-ranking Roman, possibly Hostilian, son of Emperor Decius, whose face appears at the center top on horseback, bareheaded and calm."],["Content","A battle between **Romans and Goths**, in which the general rides forward triumphantly. The **X on his forehead** may mark initiation in the cult of Mithras."],["Context","Made during the **Crisis of the Third Century**, when Rome was unstable with frequent emperors, invasions and plague. Its anxiety and crowding mark a shift away from Classical balance. Wealthy Romans now buried rather than cremated their dead."],["Exam hooks","horror vacui · high relief · Romans vs. Goths · crisis of the third century · burial replaces cremation · central calm general"],["Compare with","Great Altar of Pergamon (#38): a chaotic battle. Alexander Mosaic (#40): battle composition."]]},{n:48,title:"Catacomb of Priscilla",maker:"Late Antique Europe; Rome, Italy",date:"c. 200–400 C.E.",medium:"Excavated tufa and fresco",context:"Miles of underground burial galleries with loculi cut into soft tufa and painted family chambers. The Greek Chapel holds a Good Shepherd, an orant figure and one of the earliest images of the Virgin and Child. The style is quick and sketchy, borrowing Roman pagan formulas and giving them Christian meaning.",unit:3,unitName:"Early Europe and Colonial Americas",year:200,images:[{src:"cb/48-1.jpg",w:729,h:1034,caption:"Greek Chapel",credit:"© Scala/Art Resource, NY"},{src:"cb/48-2.jpg",w:1200,h:970,caption:"Orant fresco",credit:"© Araldo de Luca/Corbis"},{src:"cb/48-3.jpg",w:729,h:1028,caption:"Good Shepherd fresco",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",0,0,8,7],notes:[["Form","Underground burial galleries excavated in soft **tufa** stone, with niches (**loculi**) and small rooms (**cubicula**) painted in **fresco**. The paintings include the **Greek Chapel**, with a Greek inscription and banquet scenes, the **Orant fresco**, a woman praying with arms raised in three life stages, and the **Good Shepherd** fresco."],["Function","**Burial places** for early Christians (and others) outside Rome's walls, also used for funerary rites and commemorations. They were not hiding places for worship."],["Content","Early Christian imagery adapts Roman conventions: the **Good Shepherd** (Christ) carrying a lamb comes from Greco-Roman shepherd imagery, and the **Orans** figure prays for salvation. Scenes of resurrection, such as Jonah and Lazarus, express hope in the afterlife."],["Context","Made before Christianity was legalized in 313 (the Edict of Milan), so the art is small and symbolic. Christians believed in bodily resurrection and therefore buried rather than cremated."],["Exam hooks","catacomb · tufa · loculi, cubicula · Good Shepherd · orant · Early Christian · burial, not hiding"],["Compare with","Santa Sabina (#49): after legalization. Tomb of the Triclinium (#32): painted tombs."]]},{n:49,title:"Santa Sabina",maker:"Late Antique Europe; Rome, Italy",date:"c. 422–432 C.E.",medium:"Brick and stone, wooden roof",context:"An early Christian basilica: plain brick outside, a long colonnaded nave inside driving toward the apse, lit by clerestory windows. Spolia Corinthian columns from a pagan building carry the arcade. The plan comes from the Roman civic basilica, not the temple — Christian worship needed interior space for a congregation.",unit:3,unitName:"Early Europe and Colonial Americas",year:422,images:[{src:"cb/49-1.jpg",w:993,h:643,caption:"Santa Sabina",credit:"© Holly Hayes/Art History Images"},{src:"cb/49-2.jpg",w:992,h:641,caption:"Santa Sabina",credit:"© Scala/Art Resource, NY"},{src:"cb/49-3.jpg",w:817,h:1200,caption:"Santa Sabina plan",credit:""}],thumb:["thumbs/t2-u3.webp",1,0,8,7],notes:[["Form","An Early Christian **basilica**: a long nave with a **clerestory**, side aisles separated by Corinthian columns (reused **spolia** from Roman buildings), and an **apse** at the end. The exterior is plain brick; the interior has marble veneer and bright light. The doors are of carved cypress wood."],["Function","A church for Christian congregational worship, its axis leading worshippers toward the altar and the apse."],["Context","After Constantine legalized Christianity (313), Christians adapted the Roman **civic basilica** (compare #45) rather than the pagan temple: a large hall for many people, with no association with pagan worship. The plain exterior and glowing interior suggest spiritual richness hidden within."],["Exam hooks","basilica plan · nave, aisles, apse, clerestory · spolia columns · plain outside, rich inside · Early Christian"],["Compare with","Basilica Ulpia (#45): the model. Chartres (#60): later development of the plan. Catacomb (#48): before legalization."]]},{n:50,title:"Rebecca and Eliezer at the Well and Jacob Wrestling the Angel, from the Vienna Genesis",maker:"Early Byzantine Europe",date:"Early sixth century C.E.",medium:"Illuminated manuscript (tempera, gold, and silver on purple vellum)",context:"A luxury Greek Genesis on parchment dyed imperial purple, written in silver ink with a painted strip along the bottom of each page. Scenes run continuously, the same figure reappearing several times in one frame. Purple and precious metal mark it as an imperial or very wealthy commission.",unit:3,unitName:"Early Europe and Colonial Americas",year:510,images:[{src:"cb/50-1.jpg",w:822,h:1027,caption:"Rebecca and Eliezer at the Well",credit:"© Österreichische Nationalbibliothek, Gr. 31, fol. 7r"},{src:"cb/50-2.jpg",w:822,h:1025,caption:"Jacob Wrestling the Angel",credit:"© Österreichische Nationalbibliothek, Gr. 31, fol. 12r"}],thumb:["thumbs/t2-u3.webp",2,0,8,7],notes:[["Form","Pages from a luxury manuscript on **purple-dyed vellum** (an imperial color), written in **silver** ink with tempera and gold. It uses **continuous narrative**: the same figures appear several times in one scene. Figures stand on a single ground line with minimal settings."],["Function","An illustrated **Book of Genesis** for an elite, probably imperial, patron."],["Content","**Rebecca and Eliezer at the Well**: Rebecca walks to the well, a personified water nymph (a Roman convention), and gives water to Eliezer and his camels, proving she should marry Isaac. **Jacob Wrestling the Angel**: Jacob crosses a bridge, wrestles the angel and receives a blessing."],["Context","Early Byzantine; among the oldest surviving illustrated biblical manuscripts. It mixes classical motifs (the nymph) with Christian narrative. The **codex** (book) form was replacing the scroll."],["Exam hooks","purple vellum · silver ink · continuous narrative · Genesis · codex · classical nymph"],["Compare with","Lindisfarne Gospels (#55): another manuscript. Golden Haggadah (#64): Jewish manuscript of Exodus."]]},{n:51,title:"San Vitale",maker:"Early Byzantine Europe; Ravenna, Italy",date:"c. 526–547 C.E.",medium:"Brick, marble, and stone veneer; mosaic",context:"A central-plan octagon with ambulatory and galleries, its interior dissolved into gold mosaic. Flanking the apse, Justinian and Theodora process with their attendants — frontal, weightless, feet pointing downward, haloed. The emperor is shown as both political and religious head, though neither he nor Theodora ever visited Ravenna.",unit:3,unitName:"Early Europe and Colonial Americas",year:526,images:[{src:"cb/51-1.jpg",w:1008,h:665,caption:"San Vitale",credit:"© Gérard Degeorge/The Bridgeman Art Library"},{src:"cb/51-2.jpg",w:934,h:663,caption:"San Vitale",credit:"© Canali Photobank, Milan, Italy"},{src:"cb/51-3.jpg",w:962,h:738,caption:"Justinian panel",credit:"© Cameraphoto Arte, Venice/Art Resource, NY"},{src:"cb/51-4.jpg",w:1039,h:738,caption:"Theodora panel",credit:"© Giraudon/The Bridgeman Art Library"},{src:"cb/51-5.jpg",w:915,h:1135,caption:"San Vitale plan",credit:""}],thumb:["thumbs/t2-u3.webp",3,0,8,7],notes:[["Form","A **centrally planned octagonal** church in Ravenna with an inner octagon of piers and **exedrae** (semicircular niches) under a dome. The exterior is plain brick, the interior dazzling with marble and **gold mosaics** that dissolve walls into light. The capitals are carved like lace (basket capitals) with impost blocks."],["Function","A church. Its centralized plan suited martyrium and imperial associations."],["Content","Apse mosaics show the **Justinian panel** (the emperor holds the Eucharist bread, flanked by clergy including Bishop Maximianus and by soldiers) and the **Theodora panel** (the empress holds the chalice; the Magi are embroidered on her robe). Figures are **frontal**, weightless and floating, with feet overlapping and halos marking imperial sanctity."],["Context","Justinian and Theodora never visited Ravenna. The mosaics assert their **church and state authority** (caesaropapism) in recently reconquered Italy. Byzantine style is flat, gold-grounded and otherworldly."],["Exam hooks","central plan · octagon · gold mosaic · Justinian and Theodora panels · church + state · weightless frontal figures"],["Compare with","Hagia Sophia (#52): Justinian's dome. Santa Sabina (#49): basilica versus central plan. Dome of the Rock (#185): central plan."]]},{n:52,title:"Hagia Sophia",maker:"Anthemius of Tralles and Isidorus of Miletus; Constantinople (Istanbul)",date:"532–537 C.E.",medium:"Brick and ceramic elements with stone and mosaic veneer",context:"A 100-foot dome on pendentives over a square, buttressed by half-domes so the space flows east-west. Forty windows at the dome's base make it appear to float on light. Built in under six years for Justinian after riots destroyed the earlier church; later a mosque, gaining minarets and calligraphic medallions.",unit:3,unitName:"Early Europe and Colonial Americas",year:532,images:[{src:"cb/52-1.jpg",w:1200,h:796,caption:"Hagia Sophia",credit:"© Yann Arthus-Bertrand/Corbis"},{src:"cb/52-2.jpg",w:682,h:878,caption:"Hagia Sophia",credit:"© De Agostini Picture Library/G. Dagli Orti/ The Bridgeman Art Library"},{src:"cb/52-3.jpg",w:916,h:1200,caption:"Hagia Sophia plan",credit:""}],thumb:["thumbs/t2-u3.webp",4,0,8,7],notes:[["Form","A huge church combining a **basilica** (longitudinal) with a **central dome**. The dome (about 108 feet across) sits on **pendentives**, curved triangles that make the transition from a square base to a round dome. A ring of **40 windows** at its base makes it seem to **float on light**. Half-domes and buttresses spread the load."],["Function","The cathedral of Constantinople, built for **Justinian**. It was later a **mosque** after the Ottoman conquest of 1453, when **minarets** were added along with calligraphic roundels, then a museum, and since 2020 a mosque again."],["Context","Designed by **Anthemius of Tralles and Isidorus of Miletus**, mathematicians, and built in only five years. The dome collapsed in 558 and was rebuilt higher. It was the model for Ottoman mosques such as Selim II (#84)."],["Exam hooks","pendentives · dome on light · basilica + central plan · Justinian · church → mosque · minarets added"],["Compare with","Pantheon (#46): dome on a drum versus pendentives. Mosque of Selim II (#84): Sinan's response. San Vitale (#51): Justinian."]]},{n:53,title:"Merovingian looped fibulae",maker:"Early medieval Europe",date:"Mid-sixth century C.E.",medium:"Silver gilt worked in filigree, with inlays of garnets and other stones",context:"Paired cloak clasps from a woman's grave: semicircular head, arched bow, diamond-shaped foot, worked in filigree and cloisonné garnet with eagle and fish heads. Portable, personal and made of precious material — art for a mobile society, and a status marker buried with its owner.",unit:3,unitName:"Early Europe and Colonial Americas",year:550,images:[{src:"cb/53-1.jpg",w:858,h:970,caption:"Merovingian looped fibulae",credit:"© RMN-Grand Palais/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",5,0,8,7],notes:[["Form","A pair of **brooches** (fibulae) of silver gilt with **filigree** and **cloisonné** inlays of **garnets** and other stones. Each is shaped like an animal: an eagle-headed or fish-like form with loops, and is symmetrical, with intricate **interlace** patterns."],["Function","Used to fasten clothing at the shoulder; they also showed **status and wealth**. Buried with their owner, probably a woman."],["Context","**Merovingian** Franks, a 'migration period' people. Portable, precious metalwork was the main art form of mobile societies. Its animal style and interlace influenced manuscripts such as the Lindisfarne Gospels."],["Exam hooks","fibula · cloisonné garnets · filigree · animal style · portable status art · migration period"],["Compare with","Lindisfarne Gospels (#55): interlace on the page. Gold and jade crown (#196): status metalwork in burial."]]},{n:54,title:"Virgin (Theotokos) and Child between Saints Theodore and George",maker:"Early Byzantine Europe",date:"Sixth or early seventh century C.E.",medium:"Encaustic on wood",context:"A panel icon from St Catherine's, Sinai, which survived iconoclasm because the monastery lay outside imperial control. Mary sits enthroned between two stiff, frontal soldier-saints while angels behind gaze up at a descending hand of God. Encaustic — pigment in hot wax — gives the faces the soft realism of Roman portraiture.",unit:3,unitName:"Early Europe and Colonial Americas",year:500,images:[{src:"cb/54-1.jpg",w:682,h:968,caption:"Virgin (Theotokos) and Child between Saints Theodore and George",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",6,0,8,7],notes:[["Form","A small panel icon painted in **encaustic** (pigment in hot wax). It mixes styles: the Virgin and Child are formal and still, the saints rigid and frontal, while the angels behind look naturalistically upward and the hand of God reaches down. The figures are flat and hieratic, with a symmetrical composition and gold background."],["Function","An **icon**: a devotional image believed to channel prayer to the holy figures it depicts."],["Content","The Virgin Mary as **Theotokos** (God-bearer) holds Christ, flanked by the soldier saints **Theodore and George**, with two angels behind."],["Context","Made at **Saint Catherine's Monastery, Mount Sinai**, one of few icons to survive **Iconoclasm** (726–843), when images were destroyed. Its remote location saved it. The encaustic technique continues the tradition of Roman painted portraits."],["Exam hooks","icon · encaustic · Theotokos · Sinai · survived Iconoclasm · varying degrees of naturalism"],["Compare with","Jowo Rinpoche (#184): a devotional image. Virgin of Guadalupe (#95): Marian devotion. Madonna and Child (#71): Renaissance treatment."]]},{n:55,title:"Lindisfarne Gospels: St. Matthew, cross-carpet page; St. Luke portrait page; St. Luke incipit page",maker:"Early medieval (Hiberno-Saxon) Europe",date:"c. 700 C.E.",medium:"Illuminated manuscript (ink, pigments, and gold on vellum)",context:"Made at an island monastery, probably by Eadfrith. Cross-carpet pages fill the surface with interlace and animal knots around a hidden cross; the evangelist portraits borrow Mediterranean models; incipit pages swell the opening letters into ornament. Insular art fusing Celtic metalwork pattern with a Christian text.",unit:3,unitName:"Early Europe and Colonial Americas",year:700,images:[{src:"cb/55-1.jpg",w:737,h:1035,caption:"St. Matthew, cross-carpet page",credit:"© British Library Board/Robana/Art Resource, NY"},{src:"cb/55-2.jpg",w:752,h:1034,caption:"St. Luke portrait page",credit:"© British Library Board/Robana/Art Resource, NY"},{src:"cb/55-3.jpg",w:729,h:1029,caption:"St. Luke incipit page",credit:"© Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",7,0,8,7],notes:[["Form","A manuscript of **ink, pigments and gold on vellum**. Its pages: the **Saint Matthew portrait** (an evangelist with his symbol, the angel, from a Mediterranean model); the **cross-carpet page**, a cross filled with dense **interlace** of animals and knots like a carpet; the **St. Luke portrait**; and the **St. Luke incipit page**, a decorated opening word 'Quoniam' with red dots outlining letters."],["Function","A **Gospel book** used in the liturgy and as a sacred object honoring God's word."],["Context","Made at **Lindisfarne** by the monk **Eadfrith** around 700. **Hiberno-Saxon** (Insular) art merges Celtic and Anglo-Saxon **interlace and animal style** with Mediterranean figure painting. Interlace aided meditation, and the decoration was itself prayer."],["Exam hooks","Hiberno-Saxon · carpet page · interlace · incipit · Eadfrith · Insular · Gospel"],["Compare with","Merovingian fibulae (#53): interlace metalwork. Folio from a Qur'an (#187): sacred text as art. Vienna Genesis (#50)."]]},{n:56,title:"Great Mosque",maker:"Umayyad; Córdoba, Spain",date:"c. 785–786 C.E.",medium:"Stone masonry",context:"A hypostyle hall of hundreds of columns, many of them spolia, carrying stacked double arches in alternating red brick and white stone — an engineering trick to win height from short reused columns. The mihrab is faced in gold mosaic sent by the Byzantine emperor. A cathedral was later built into the middle of it.",unit:3,unitName:"Early Europe and Colonial Americas",year:785,images:[{src:"cb/56-1.jpg",w:1086,h:721,caption:"Great Mosque",credit:"© Toni Castillo/Getty Images"},{src:"cb/56-2.jpg",w:915,h:730,caption:"Great Mosque",credit:"© Ken Welsh/The Bridgeman Art Library"},{src:"cb/56-3.jpg",w:1008,h:962,caption:"Detail",credit:"© Werner Forman/Art Resource, NY"},{src:"cb/56-4.jpg",w:969,h:959,caption:"Great Mosque arches",credit:"© The Bridgeman Art Library"},{src:"cb/56-5.jpg",w:661,h:1027,caption:"Great Mosque plan",credit:""}],thumb:["thumbs/t2-u3.webp",0,1,8,7],notes:[["Form","A **hypostyle** prayer hall with a 'forest' of columns, many reused (**spolia**) from Roman and Visigothic buildings. **Double-tiered horseshoe arches** in alternating red brick and white stone **voussoirs** (stripes). An ornate **mihrab** has a dome of crisscrossing ribs, gold mosaics and calligraphy."],["Function","A congregational **mosque** for Friday prayer; the mihrab marks the **qibla**, the direction of Mecca."],["Context","Begun by **Abd al-Rahman I**, the Umayyad prince who fled Damascus and founded an emirate in **al-Andalus**, and expanded several times. After the Christian reconquest (1236), a **cathedral was built in its center** in the 16th century."],["Exam hooks","hypostyle · horseshoe arches · red-white voussoirs · spolia · mihrab · Umayyad al-Andalus · cathedral inside"],["Compare with","Hypostyle Hall at Karnak (#20). Great Mosque of Djenné (#168): another congregational mosque. Santo Domingo (#159): conquest built into a sacred site."]]},{n:57,title:"Pyxis of al-Mughira",maker:"Umayyad",date:"c. 968 C.E.",medium:"Ivory",context:"A small lidded cylinder carved from a single elephant tusk for a teenage Umayyad prince. Eight-lobed medallions hold princely scenes — lion and bull in combat, men robbing a falcon's nest — usually read as veiled arguments about legitimacy and succession. Al-Mughira was murdered a few years later.",unit:3,unitName:"Early Europe and Colonial Americas",year:968,images:[{src:"cb/57-1.jpg",w:729,h:1014,caption:"Pyxis of al-Mughira",credit:"© RMN-Grand Palais/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",1,1,8,7],notes:[["Form","A cylindrical **ivory** box with a domed lid, deeply **carved** with figures, animals and vines in medallions. An inscription runs around the lid."],["Function","A luxury container for perfumes or cosmetics, given to **al-Mughira**, the 18-year-old son of the caliph, possibly as a coming-of-age gift."],["Content","Princely life: a **court scene** with an enthroned figure, a lute player and an attendant with a fan; lions attacking bulls; falconry; boys gathering eggs from eagles' nests. Some scholars read these as a political warning: al-Mughira was a potential rival to the heir."],["Context","**Umayyad Córdoba**, a center of luxury crafts. The inscription blesses al-Mughira. Ivory was a precious trade material from Africa. It shows that Islamic art includes **figural** imagery in **secular** contexts."],["Exam hooks","ivory pyxis · Umayyad Córdoba · courtly figural scenes · secular Islamic art · political message"],["Compare with","Basin (Baptistère de St. Louis) (#188): courtly Islamic object. Great Mosque of Córdoba (#56): same city."]]},{n:58,title:"Church of Sainte-Foy",maker:"Romanesque Europe; Conques, France",date:"Church c. 1050–1130 C.E.; reliquary ninth century C.E. with later additions",medium:"Stone (architecture and tympanum); gold, silver, gemstones, and enamel over wood (reliquary)",context:"A pilgrimage church on the road to Santiago: a barrel-vaulted nave and an ambulatory with radiating chapels so crowds could file past relics without interrupting mass. The tympanum packs in a Last Judgment. The reliquary statue of the child martyr Foy is gold over wood, crusted with donated gems and reusing a Roman head.",unit:3,unitName:"Early Europe and Colonial Americas",year:1050,images:[{src:"cb/58-1.jpg",w:737,h:1007,caption:"Church of Sainte-Foy",credit:"© Scala/Art Resource, NY"},{src:"cb/58-2.jpg",w:1200,h:961,caption:"The Last Judgment",credit:"© Peter Willi/The Bridgeman Art Library"},{src:"cb/58-3.jpg",w:737,h:1047,caption:"Church of Sainte-Foy",credit:"© The Bridgeman Art Library"},{src:"cb/58-4.jpg",w:783,h:1046,caption:"Reliquary of Sainte-Foy",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",2,1,8,7],notes:[["Form","A **Romanesque pilgrimage church** at Conques: a basilica plan with an **ambulatory** and radiating chapels so pilgrims could circulate, a stone **barrel vault**, thick walls and small windows. The west **tympanum** shows the **Last Judgment** in relief: Christ in the center in a mandorla, the saved at his right, the damned in hell at his left."],["Function","A stop on the **pilgrimage route to Santiago de Compostela**, housing relics of **Sainte-Foy** (Saint Faith), a young martyr."],["Content","The **reliquary of Sainte-Foy** is a gold, jewel-covered seated statue containing her skull; its head may be reused from a Roman figure. In the tympanum, Sainte-Foy appears bowing before the hand of God."],["Context","Pilgrimage brought money, and relics gave churches power. The tympanum warned pilgrims about judgment as they entered."],["Exam hooks","Romanesque · pilgrimage church · ambulatory · barrel vault · Last Judgment tympanum · reliquary of Sainte-Foy · Santiago route"],["Compare with","Last judgment of Hu-Nefer (#24). Chartres (#60): Gothic. Jowo Rinpoche (#184): pilgrimage object."]]},{n:59,title:"Bayeux Tapestry",maker:"Romanesque Europe (English or Norman)",date:"c. 1066–1080 C.E.",medium:"Embroidery on linen",context:"Two hundred and thirty feet of wool embroidery — not a tapestry — narrating the Norman conquest from William's claim to Harold's death at Hastings, with Latin captions and borders of fables and corpses. It is Norman propaganda, probably commissioned by Bishop Odo but almost certainly stitched by English women.",unit:3,unitName:"Early Europe and Colonial Americas",year:1066,images:[{src:"cb/59-1.jpg",w:915,h:570,caption:"Cavalry attack",credit:"© Erich Lessing/Art Resource, NY"},{src:"cb/59-2.jpg",w:1085,h:561,caption:"First meal",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",3,1,8,7],notes:[["Form","A 230-foot-long linen strip **embroidered** in colored wool (it is not a tapestry, which would be woven) as a **continuous narrative** with Latin captions. Upper and lower borders hold animals, fables and the dead."],["Function","Probably commissioned by **Bishop Odo of Bayeux**, William's half-brother, for **Bayeux Cathedral**, to commemorate and justify the **Norman Conquest of England (1066)**."],["Content","The story of **Harold** swearing an oath to **William of Normandy**, Harold breaking it by taking the throne, and the Normans invading and winning the **Battle of Hastings**. It shows ship-building, feasting ('first meal'), a **cavalry attack** and Halley's comet as an omen."],["Context","Probably made by English embroiderers. It is Norman **propaganda**: Harold is the oath-breaker. It is also a valuable record of armor, ships and daily life."],["Exam hooks","embroidery (not tapestry) · Norman Conquest 1066 · Hastings · Harold's oath · Odo · continuous narrative · propaganda"],["Compare with","Column of Trajan (#45): narrative of conquest. Night Attack (#203): narrative scroll of war. Standard of Ur (#16)."]]},{n:60,title:"Chartres Cathedral",maker:"Gothic Europe; Chartres, France",date:"Original construction c. 1145–1155 C.E.; reconstructed c. 1194–1220 C.E.",medium:"Limestone, stained glass",context:"Rebuilt after a fire spared the Virgin's tunic, which kept the pilgrims and the money coming. Rib vaults, pointed arches and flying buttresses push the load outward so the walls can become glass — over 150 windows, including the deep-blue west lancets. Royal Portal jamb statues stand as rigid columns; later ones turn and move.",unit:3,unitName:"Early Europe and Colonial Americas",year:1145,images:[{src:"cb/60-1.jpg",w:1200,h:925,caption:"Chartres Cathedral",credit:"© Alinari Archives/Corbis"},{src:"cb/60-2.jpg",w:636,h:1002,caption:"Chartres Cathedral",credit:"© Vanni Archive/Art Resource, NY"},{src:"cb/60-3.jpg",w:1200,h:956,caption:"Great Portal of the West Facade",credit:"© Scala/White Images/Art Resource, NY"},{src:"cb/60-4.jpg",w:768,h:977,caption:"Chartres Cathedral",credit:"© Paul Maeyaert/The Bridgeman Art Library"},{src:"cb/60-5.jpg",w:683,h:1025,caption:"Notre Dame de la Belle Verriere window",credit:"© Anthony Scibilia/Art Resource, NY"},{src:"cb/60-6.jpg",w:1200,h:683,caption:"Chartres Cathedral plan",credit:""}],thumb:["thumbs/t2-u3.webp",4,1,8,7],notes:[["Form","A **Gothic cathedral** with **pointed arches**, **rib vaults** and **flying buttresses** that move weight outward, allowing tall walls of **stained glass**. It has three portals; the **Royal Portal** on the west facade survived a fire of 1194, with **jamb statues** of Old Testament kings and queens attached to columns. The rebuilt church has a three-part elevation: arcade, triforium and clerestory."],["Function","The cathedral of the Virgin Mary, which houses a famous relic, the **Sancta Camisa** (said to be Mary's tunic), and a major pilgrimage center."],["Content","The **Notre Dame de la Belle Verrière** window shows the Virgin and Child enthroned in deep blue. Rose windows and lancets depict saints, kings and trade guilds (the donors)."],["Context","The light from stained glass was understood as **divine light** (lux nova), following Abbot Suger. Rebuilt after a fire in 1194, it is a classic High Gothic building."],["Exam hooks","Gothic · pointed arches, rib vaults, flying buttresses · stained glass · Royal Portal jamb figures · Belle Verrière · Sancta Camisa · divine light"],["Compare with","Sainte-Foy (#58): Romanesque. Palace of Westminster (#112): Gothic Revival. Hypostyle Hall (#20): clerestory."]]},{n:61,title:"Dedication Page with Blanche of Castile and King Louis IX of France, Scenes from the Apocalypse from Bibles moralisées",maker:"Gothic Europe",date:"c. 1225–1245 C.E.",medium:"Illuminated manuscript (ink, tempera, and gold leaf on vellum)",context:"Four figures under trilobed arches on burnished gold: the queen mother instructs the young king above, a monk dictates to a scribe below — and the scribe is making the very book you are holding. Bibles moralisées pair biblical scenes with moralising commentary in roundels; this one was a royal luxury object.",unit:3,unitName:"Early Europe and Colonial Americas",year:1225,images:[{src:"cb/61-1.jpg",w:760,h:1021,caption:"Scenes from the Apocalypse",credit:"© British Library/Robana/Hulton Fine Art Collection/Getty Images"},{src:"cb/61-2.jpg",w:775,h:1022,caption:"Dedication Page with Blanche of Castile and King Louis IX of France",credit:"© The Pierpont Morgan Library/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",5,1,8,7],notes:[["Form","**Gothic** illuminated manuscript pages on vellum. The **dedication page** shows four figures under architectural arches. The **moralized Bible** pages have stacked **medallions** (like stained glass) in pairs with text, set against gold backgrounds."],["Function","A **Bible moralisée** (moralized Bible) pairs Old Testament scenes with New Testament or moral lessons, to teach the young King **Louis IX**."],["Content","The **dedication page**: **Blanche of Castile** (Louis's mother and regent) and the young **Louis IX** enthroned above, a cleric and a **scribe-illuminator** below working on the manuscript. The **Apocalypse** pages show scenes from Revelation with interpretation."],["Context","Blanche ruled as regent and educated Louis, later Saint Louis. The page in the top-left of the scribe's sheet resembles the layout of the moralized Bible itself. The **Gothic** style uses elegant, swaying figures and an architectural frame. It links to Chartres-style roundel windows."],["Exam hooks","Bible moralisée · Blanche of Castile regent · Louis IX · medallions like stained glass · teaching a king · scribe shown at work"],["Compare with","Chartres (#60): roundel windows. Golden Haggadah (#64): Gothic manuscript."]]},{n:62,title:"Röttgen Pietà",maker:"Late medieval Europe",date:"c. 1300–1325 C.E.",medium:"Painted wood",context:"A German Andachtsbild — a devotional image for private, emotional meditation. Christ is shrunken, stiff and doll-like, his wounds spouting grape-like clots; Mary's face is contorted with grief. The anatomy is deliberately wrong so that the viewer feels the pain instead of admiring the body.",unit:3,unitName:"Early Europe and Colonial Americas",year:1300,images:[{src:"cb/62-1.jpg",w:605,h:1024,caption:"Röttgen Pietà",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",6,1,8,7],notes:[["Form","A painted **wood** **Pietà**: Mary holds the dead Christ across her lap. Exaggerated, **expressive** distortions: Christ's emaciated, stick-like body, ribs protruding and gaping, blood-encrusted wounds; Mary's anguished face."],["Function","A **devotional image** (Andachtsbild) for private meditation on Christ's suffering and Mary's grief, to provoke empathy and penitence."],["Context","Late medieval Germany, the time of **plague**, famine and mystical devotion. Emphasizing **pain** made emotional identification with Christ's suffering possible. Contrast Michelangelo's idealized marble Pietà."],["Exam hooks","Pietà · Andachtsbild · expressive distortion · wounds · emotional devotion · late medieval Germany"],["Compare with","Isenheim altarpiece (#77): suffering Christ. Lamentation, Arena Chapel (#63): grief. Entombment (#78)."]]},{n:63,title:"Arena (Scrovegni) Chapel, including Lamentation",maker:"Giotto di Bondone (artist); unknown architect; Padua, Italy",date:"Chapel c. 1303 C.E.; fresco c. 1305",medium:"Brick (architecture) and fresco",context:"Enrico Scrovegni built it, by tradition, to atone for his father's usury. Giotto covered the walls with the lives of Mary and Christ in three registers beneath a blue barrel vault, with grisaille virtues and vices below. In the Lamentation, weight, bulk and a diagonal rock drive the eye down to Christ's face, and mourners turn their backs to us — which was new.",unit:3,unitName:"Early Europe and Colonial Americas",year:1303,images:[{src:"cb/63-1.jpg",w:1200,h:953,caption:"Arena (Scrovegni) Chapel",credit:"© Alfredo Dagli Orti/The Art Archive at Art Resource, NY"},{src:"cb/63-2.jpg",w:768,h:976,caption:"Arena (Scrovegni) Chapel",credit:"© Scala/Art Resource, NY"},{src:"cb/63-3.jpg",w:1200,h:944,caption:"Lamentation",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",7,1,8,7],notes:[["Form","A simple **barrel-vaulted** brick chapel in Padua, painted entirely in **fresco** by **Giotto**. The walls hold registers of scenes from the lives of the Virgin, her parents and Christ. The ceiling is a starry blue sky, and a **Last Judgment** fills the entrance wall. Giotto gives figures **weight and volume**, with a shallow, stage-like space and real emotion."],["Function","A private chapel commissioned by **Enrico Scrovegni**, perhaps to atone for his father's sin of **usury** (moneylending), which Dante condemned."],["Content","The **Lamentation**: mourners grieve over Christ's body. Its strong **diagonal** rock leads the eye to Christ's head; figures are seen from behind, which is unusual; angels shriek in the sky; and a dead tree alludes to the Tree of Knowledge."],["Context","Giotto is a pioneer of **naturalism** who looked toward the Renaissance. **Fresco** technique: pigment on wet plaster, painted in a section each day (giornata)."],["Exam hooks","Giotto · fresco · Lamentation · naturalism and emotion · diagonal · Scrovegni and usury · proto-Renaissance"],["Compare with","Röttgen Pietà (#62): the same theme. Sistine Chapel (#75): fresco cycle. Entombment (#78)."]]},{n:64,title:"Golden Haggadah (The Plagues of Egypt, Scenes of Liberation, and Preparation for Passover)",maker:"Late medieval Spain",date:"c. 1320 C.E.",medium:"Illuminated manuscript (pigments and gold leaf on vellum)",context:"A Passover haggadah for a wealthy Catalan Jewish family, with full-page miniatures in four panels on tooled gold grounds, read right to left. The style is French Gothic; the dress is contemporary Spanish. Made not long before the pogroms and expulsions that scattered Sephardi Jewry.",unit:3,unitName:"Early Europe and Colonial Americas",year:1320,images:[{src:"cb/64-1.jpg",w:791,h:1043,caption:"Preparation for Passover",credit:"© The British Library Board, Add. 27210, f.14v"},{src:"cb/64-2.jpg",w:763,h:1042,caption:"Scenes of Liberation",credit:"© The British Library Board, Add. 27210, f.14v"},{src:"cb/64-3.jpg",w:762,h:1044,caption:"The Plagues of Egypt",credit:"© British Library/Robana/Hulton Fine Art Collection/Getty Images"}],thumb:["thumbs/t2-u3.webp",0,2,8,7],notes:[["Form","A **Haggadah** manuscript on vellum with **gold leaf** backgrounds, painted in Gothic style with figures in small framed scenes, four to a page, reading right to left like Hebrew."],["Function","A **Haggadah** is the text read at the **Passover Seder**, telling the story of the Exodus. It was a luxury object, probably a wedding gift."],["Content","**The Plagues of Egypt**, **Scenes of Liberation** (the Exodus) and **Preparation for Passover**: women and men cleaning, making matzah and distributing it."],["Context","Made in **Catalonia** (Barcelona) during a period of coexistence of Jews, Christians and Muslims. It shows the influence of **Gothic** Christian manuscripts on Jewish art. Jewish families were later expelled from Spain (1492) and took it with them."],["Exam hooks","Haggadah · Passover Seder · Exodus · gold leaf · Gothic style · Jewish Spain · right-to-left"],["Compare with","Bible moralisée (#61): Gothic manuscripts. Vienna Genesis (#50): narrative manuscript."]]},{n:65,title:"Alhambra",maker:"Nasrid Dynasty; Granada, Spain",date:"1354–1391 C.E.",medium:"Whitewashed adobe stucco, wood, tile, paint, and gilding",context:"A fortified palace-city of courts and gardens. The Court of the Lions rings a fountain on twelve stone lions with 124 slender columns; muqarnas vaults in the Hall of the Abencerrajes dissolve the ceiling into a honeycomb of light. Water, calligraphy and geometry make a paradise garden — and poems on the walls describe the building itself.",unit:3,unitName:"Early Europe and Colonial Americas",year:1354,images:[{src:"cb/65-1.jpg",w:1200,h:800,caption:"Alhambra",credit:"© Visions Of Our Land/The Image Bank/Getty Images"},{src:"cb/65-2.jpg",w:675,h:875,caption:"Court of the Lions",credit:"© Gianni Dagli Orti/The Art Archive at Art Resource, NY"},{src:"cb/65-3.jpg",w:845,h:1169,caption:"Hall of the Sisters",credit:"© Raffaello Bencini/The Bridgeman Art Library Alhambra plan"},{src:"cb/65-4.jpg",w:1116,h:1111,caption:"Hall of the Sisters",credit:"© Raffaello Bencini/The Bridgeman Art Library Alhambra plan"}],thumb:["thumbs/t2-u3.webp",1,2,8,7],notes:[["Form","A palace-fortress complex on a hill above Granada. Courtyards with pools and fountains: the **Court of the Lions**, with twelve lions supporting a fountain in a cross-axial garden, and the **Hall of the Sisters**, with a dome of thousands of **muqarnas** (honeycomb cells) that seem to dissolve the ceiling into light. Walls are carved in **stucco**, covered in tile, with **calligraphy** including poems."],["Function","The residence and court of the **Nasrid** sultans, the last Muslim dynasty in Spain."],["Context","Inscriptions include poems by **Ibn Zamrak** praising the ruler and the palace, comparing the dome to the heavens. Water and gardens evoke **paradise**. Granada fell to Ferdinand and Isabella in **1492**."],["Exam hooks","Nasrid · muqarnas · Court of the Lions · Hall of the Sisters · calligraphy and poetry · paradise garden · 1492"],["Compare with","Great Mosque of Córdoba (#56). Taj Mahal (#209): paradise garden. Masjid-e Jameh (#186): muqarnas."]]},{n:66,title:"Annunciation Triptych (Merode Altarpiece)",maker:"Workshop of Robert Campin",date:"1427–1432 C.E.",medium:"Oil on wood",context:"A small portable altarpiece that stages the Annunciation in a contemporary Flemish parlour. The donors kneel in the left wing; Joseph builds mousetraps in the right — Augustine's image of the cross as a trap for the devil. Everything doubles as symbol: the lily, the just-snuffed candle, the tiny Christ child sliding in on a beam of light.",unit:3,unitName:"Early Europe and Colonial Americas",year:1427,images:[{src:"cb/66-1.jpg",w:1200,h:615,caption:"Annunciation Triptych",credit:"Image © The Metropolitan Museum of Art/Image Source © Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",2,2,8,7],notes:[["Form","A small **oil on wood** triptych. Northern Renaissance oil paint allows **minute detail**, rich color and textures. The perspective is steep and imperfect, with a tilted floor and table."],["Function","A private **devotional** altarpiece for a home: the donors brought religious devotion into domestic space."],["Content","Center: the **Annunciation** in a middle-class Flemish room; a tiny Christ child with a cross glides toward Mary on rays of light. Left: the kneeling donors, the **Ingelbrecht** couple, look in through a door. Right: **Joseph** in his carpentry shop making **mousetraps**, a symbol of Christ trapping the devil."],["Context","Full of **disguised symbolism**: the lilies (Mary's purity), the snuffed candle (divine presence), the basin and towel (purity). Workshop of **Robert Campin**."],["Exam hooks","Northern Renaissance · oil paint · disguised symbolism · domestic Annunciation · donors · mousetraps · triptych"],["Compare with","Arnolfini Portrait (#68): domestic symbolism. Annunciation imagery. Woman Holding a Balance (#92): Dutch interior."]]},{n:67,title:"Pazzi Chapel",maker:"Filippo Brunelleschi (architect); Santa Croce, Florence, Italy",date:"c. 1429–1461 C.E.",medium:"Masonry",context:"A chapter house governed by simple ratios, its geometry drawn in grey pietra serena lines against white plaster so you can read the system at a glance. A central dome on pendentives with barrel-vaulted flanks. Renaissance humanism built: clarity, proportion, and a revived classical vocabulary.",unit:3,unitName:"Early Europe and Colonial Americas",year:1429,images:[{src:"cb/67-1.jpg",w:905,h:1200,caption:"Pazzi Chapel",credit:"© Erich Lessing/Art Resource, NY"},{src:"cb/67-2.jpg",w:841,h:1200,caption:"Pazzi Chapel",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",3,2,8,7],notes:[["Form","A small chapter house added to Santa Croce, Florence, by **Brunelleschi**. It is a **centrally organized** rectangular space with a **dome on pendentives** over the center and a smaller dome over the altar. Walls use **pietra serena** (gray stone) pilasters and moldings against white plaster, so the geometry is clear. Round **terra cotta** medallions by Luca della Robbia show the apostles and evangelists."],["Function","A **chapter house** for monks' meetings and a family chapel for the **Pazzi** family."],["Context","Early Renaissance revival of **classical** forms (Corinthian pilasters, arches) and of **mathematical proportion and harmony**. The Pazzi later plotted against the Medici (the Pazzi Conspiracy, 1478)."],["Exam hooks","Brunelleschi · pietra serena · geometry and proportion · dome on pendentives · classical revival · della Robbia roundels"],["Compare with","Pantheon (#46): ancient model. Palazzo Rucellai (#70): Alberti. Hagia Sophia (#52): pendentives."]]},{n:68,title:"The Arnolfini Portrait",maker:"Jan van Eyck",date:"c. 1434 C.E.",medium:"Oil on wood",context:"Oil glazes let fur, brass and window light each behave differently. The convex mirror reflects the whole room and two more figures, and above it van Eyck wrote 'Jan van Eyck was here 1434.' Whether it records a marriage, a betrothal or a memorial is still argued. The dog, the single lit candle and the discarded shoes all carry meaning.",unit:3,unitName:"Early Europe and Colonial Americas",year:1434,images:[{src:"cb/68-1.jpg",w:744,h:1040,caption:"The Arnolfini Portrait",credit:"© National Gallery, London, UK/The Bridgeman Art Library"}],thumb:["thumbs/t2-u3.webp",4,2,8,7],notes:[["Form","A small **oil on wood** panel with astonishing detail and texture: fur, brass chandelier and a dog's coat. A **convex mirror** on the back wall reflects the room, including two figures in the doorway, one possibly van Eyck. Light falls from the window."],["Function","Probably commemorates a marriage, a betrothal, or a memorial to a deceased wife. Interpretations vary. It shows the couple's wealth and status."],["Content","**Giovanni Arnolfini** (an Italian merchant in Bruges) and his wife. Symbols: a **single lit candle** (God's presence or memory), the **dog** (fidelity), **oranges** (wealth), **shoes removed** (sacred ground), the green dress (fertility, though she is probably not pregnant; it is the fashion), and the mirror frame with scenes of the Passion. Above the mirror: 'Johannes de eyck fuit hic 1434' ('Jan van Eyck was here')."],["Context","**Jan van Eyck** perfected **oil painting**. The signature may record him as **witness**. It is a key work of the **Northern Renaissance**."],["Exam hooks","van Eyck · oil glazes · convex mirror · 'was here' signature · symbols (dog, candle, shoes) · Northern Renaissance · merchant patron"],["Compare with","Merode Altarpiece (#66): symbolism. Las Meninas (#91): a mirror and the painter present. Woman Holding a Balance (#92)."]]},{n:69,title:"David",maker:"Donatello",date:"c. 1440–1460 C.E.",medium:"Bronze",context:"The first freestanding nude male since antiquity, and a startling one: an adolescent in a shepherd's hat and boots, in relaxed contrapposto, standing on Goliath's severed head. Made for the Medici courtyard. Its ambiguous, eroticised body has been argued over ever since, while David himself served Florence as the underdog republic's emblem.",unit:3,unitName:"Early Europe and Colonial Americas",year:1440,images:[{src:"cb/69-1.jpg",w:611,h:1041,caption:"David",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",5,2,8,7],notes:[["Form","A **bronze** David, the first free-standing **nude** male statue since antiquity, in **contrapposto**. He is adolescent, soft and androgynous, wearing a laurel-trimmed hat and boots, and stands on **Goliath's head**."],["Function","Made for the courtyard of the **Medici palace** in Florence."],["Context","David, the small hero who defeats the giant, symbolized **Florence** standing against stronger enemies (such as Milan). The nudity and pose revive classical art; it has also been read as sensual. **Donatello** led early Renaissance sculpture."],["Exam hooks","Donatello · bronze · first free-standing nude since antiquity · contrapposto · Medici · David = Florence"],["Compare with","Doryphoros (#34): classical contrapposto. Augustus (#43). Michelangelo's David (not on the list)."]]},{n:70,title:"Palazzo Rucellai",maker:"Leon Battista Alberti (architect); Florence, Italy",date:"c. 1450 C.E.",medium:"Stone, masonry",context:"A merchant's town house whose façade Alberti gridded with three tiers of flat pilasters, borrowing the Colosseum's stacked orders for domestic use; the rustication smooths as it rises. The order is applied like a skin — the house behind it is a conventional Florentine palazzo.",unit:3,unitName:"Early Europe and Colonial Americas",year:1450,images:[{src:"cb/70-1.jpg",w:744,h:1025,caption:"Palazzo Rucellai",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",6,2,8,7],notes:[["Form","A three-story palace facade in Florence with **superimposed orders** of flat **pilasters**: Tuscan (Doric) on the ground floor, then Ionic (simplified), then Corinthian, like the Colosseum. **Rusticated** stone grows smoother with height; there are paired arched windows and a strong cornice."],["Function","A city residence (palazzo) of the wealthy merchant **Giovanni Rucellai**."],["Context","Designed by **Leon Battista Alberti**, a humanist theorist (On the Art of Building) who applied **Roman classical** principles (Colosseum, #44) to a private home. A frieze bears the emblems of the Rucellai and the Medici, celebrating a family marriage alliance."],["Exam hooks","Alberti · stacked orders (from Colosseum) · pilasters · rustication · humanism · merchant palace"],["Compare with","Colosseum (#44): source of the orders. Pazzi Chapel (#67): Brunelleschi."]]},{n:71,title:"Madonna and Child with Two Angels",maker:"Fra Filippo Lippi",date:"c. 1465 C.E.",medium:"Tempera on wood",context:"A Madonna seated before a window onto a rocky landscape, framed like a domestic portrait. One angel grins straight out at the viewer. Lippi was a friar who ran off with a nun, and his models were reportedly her and their son — a sacred subject given thoroughly human treatment.",unit:3,unitName:"Early Europe and Colonial Americas",year:1465,images:[{src:"cb/71-1.jpg",w:698,h:1024,caption:"Madonna and Child with Two Angels",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",7,2,8,7],notes:[["Form","A **tempera on wood** painting. Mary sits in profile-three-quarter view at a window overlooking a landscape; two angels, one grinning at the viewer, lift the Christ child toward her. It has delicate line, transparent veils and pearls, and **atmospheric perspective** in the landscape."],["Function","A devotional image, probably for a private patron, in a domestic setting."],["Content","The **Madonna** is a beautiful, fashionably dressed Florentine woman. The scene seems intimate and human, yet her halo and the angels mark divinity. The landscape suggests the world redeemed."],["Context","**Fra Filippo Lippi** was a friar who famously ran off with a nun (Lucrezia Buti), possibly the model. He taught **Botticelli**. Early Renaissance humanizes religious subjects."],["Exam hooks","Filippo Lippi · tempera · humanized Madonna · window landscape · teacher of Botticelli · Florentine beauty"],["Compare with","Virgin (Theotokos) icon (#54): Byzantine Mary versus a Renaissance woman. Birth of Venus (#72)."]]},{n:72,title:"Birth of Venus",maker:"Sandro Botticelli",date:"c. 1484–1486 C.E.",medium:"Tempera on canvas",context:"Venus arrives on a shell, blown ashore by Zephyrs while a Hora waits with a cloak. Line dominates over volume, the body is elongated and weightless, and the sea is flat pattern. Painted for a Medici circle steeped in Neoplatonism, where physical beauty was a step toward divine love — and a monumental nude Venus was itself something new.",unit:3,unitName:"Early Europe and Colonial Americas",year:1484,images:[{src:"cb/72-1.jpg",w:992,h:625,caption:"Birth of Venus",credit:"© Erich Lessing/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",0,3,8,7],notes:[["Form","A large **tempera on canvas** (unusual at the time) painting with **linear**, graceful contours, pale skin, floating forms and little modeling or depth."],["Function","Probably commissioned by a member of the **Medici** circle for a villa: a secular, mythological subject."],["Content","**Venus** rises from the sea on a scallop shell in a **'modest Venus' (Venus pudica)** pose borrowed from classical sculpture. **Zephyr** (west wind) and a nymph blow her ashore; a **Hora** (season) waits with a flowered cloak."],["Context","The **Neoplatonism** of the Medici circle read Venus as divine love and beauty leading the soul to God. It is one of the first large-scale **nude** female mythological paintings since antiquity. **Botticelli** was later influenced by Savonarola's preaching and burned some of his work."],["Exam hooks","Botticelli · Neoplatonism · Venus pudica · mythological · tempera on canvas · Medici"],["Compare with","Venus of Urbino (#80): reclining Venus. Grande Odalisque (#107) and Olympia (#115): the nude female tradition."]]},{n:73,title:"Last Supper",maker:"Leonardo da Vinci",date:"c. 1494–1498 C.E.",medium:"Oil and tempera",context:"Painted on a refectory wall in an experimental oil-and-tempera mix that began flaking within Leonardo's lifetime. One-point perspective puts the vanishing point in Christ's head; the apostles fall into four groups of three, reacting to 'one of you will betray me.' Judas recoils into shadow clutching a purse — on the same side of the table as everyone else.",unit:3,unitName:"Early Europe and Colonial Americas",year:1494,images:[{src:"cb/73-1.jpg",w:993,h:687,caption:"Last Supper",credit:"© The Bridgeman Art Library"}],thumb:["thumbs/t2-u3.webp",1,3,8,7],notes:[["Form","A wall painting in the **refectory** (dining hall) of Santa Maria delle Grazie, Milan, in **one-point linear perspective**: all lines converge at **Christ's head**, framed by a window like a halo. The apostles sit in four groups of three. Leonardo used **experimental oil and tempera on dry plaster**, which deteriorated quickly."],["Function","Decoration for the monks' dining hall: as they ate, they 'shared' the meal with Christ."],["Content","The moment Christ says 'one of you will betray me'. The apostles react with varied **emotions** (the 'motions of the mind'). **Judas** leans back in shadow, clutching the money bag. It also implies the Eucharist."],["Context","High Renaissance. **Leonardo da Vinci**'s geometric harmony and psychological drama. It was damaged by humidity and war, and has been restored several times."],["Exam hooks","Leonardo · one-point perspective to Christ · refectory · betrayal moment · Judas · experimental technique · deterioration"],["Compare with","School of Athens (#76): perspective. Calling of St. Matthew (#85): a dramatic gesture."]]},{n:74,title:"Adam and Eve",maker:"Albrecht Dürer",date:"1504 C.E.",medium:"Engraving",context:"Dürer proving that a northern printmaker could handle Italian idealised anatomy and classical proportion. The bodies are built from Vitruvian ratios; the animals stand for the four humours, in balance until the Fall. A cartellino hangs from the branch with his signature — an artist advertising himself across Europe through cheap multiples.",unit:3,unitName:"Early Europe and Colonial Americas",year:1504,images:[{src:"cb/74-1.jpg",w:806,h:1020,caption:"Adam and Eve",credit:"© Bridgeman-Giraudon/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",2,3,8,7],notes:[["Form","An **engraving**: lines incised into a copper plate, inked and printed, allowing many copies. Fine cross-hatching models the bodies. **Adam and Eve** stand in classical **contrapposto**, with ideal proportions based on Vitruvius, before a dark forest."],["Function","A print for collectors, displaying Dürer's skill and his mastery of Italian ideal proportion."],["Content","The **Fall**: Eve takes the fruit from the serpent. Animals represent the **four humors** (temperaments): cat (choleric), rabbit (sanguine), elk (melancholic), ox (phlegmatic). These are balanced before the Fall. The mouse about to be caught by the cat foreshadows sin. A **plaque** on a branch bears Dürer's Latin signature and the date."],["Context","**Albrecht Dürer** traveled to Italy and brought Renaissance ideals north. The printing press and prints spread images and helped make Dürer famous, and he marked his prints with his monogram."],["Exam hooks","Dürer · engraving · ideal proportions · four humors · signed tablet · Northern + Italian Renaissance"],["Compare with","Allegory of Law and Grace (#79): Reformation print. Self-Portrait with Saskia (#87): etching."]]},{n:75,title:"Sistine Chapel ceiling and altar wall frescoes",maker:"Michelangelo",date:"Ceiling c. 1508–1512 C.E.; altar c. 1536–1541 C.E.",medium:"Fresco",context:"Nine Genesis scenes run down the spine, framed by painted architecture, ignudi, prophets and sibyls — sculpture translated into paint. The Creation of Adam sets God's rushing energy against Adam's languor across a famous gap. The later Last Judgment is darker and churning, and its nudes were partly painted over after the artist's death.",unit:3,unitName:"Early Europe and Colonial Americas",year:1508,images:[{src:"cb/75-1.jpg",w:714,h:1022,caption:"Sistine Chapel",credit:"© The Bridgeman Art Library"},{src:"cb/75-2.jpg",w:683,h:1021,caption:"The Delphic Sibyl",credit:"© Erich Lessing/Art Resource, NY"},{src:"cb/75-3.jpg",w:993,h:660,caption:"The Flood",credit:"© Erich Lessing/Art Resource, NY"},{src:"cb/75-4.jpg",w:1023,h:660,caption:"Sistine Chapel",credit:"© Reinhard Dirscherl/Alamy"}],thumb:["thumbs/t2-u3.webp",3,3,8,7],notes:[["Form","**Fresco**. The **ceiling** (1508–12): nine scenes from **Genesis** (Creation to Noah), framed by painted architecture, with **prophets and sibyls** and ignudi (nude youths), all with sculptural, muscular figures. The **altar wall** (1536–41): **The Last Judgment**, a swirling mass of nude bodies around Christ; the saved rise, the damned fall. Michelangelo's self-portrait appears on the flayed skin held by **St. Bartholomew**."],["Function","The papal chapel, where conclaves elect popes."],["Content","Ceiling highlights: Creation of Adam, The Flood and the **Delphic Sibyl**."],["Context","Commissioned by **Pope Julius II** (ceiling) and Paul III (altar). Michelangelo was a sculptor and resisted painting. The Last Judgment was made after the **Sack of Rome** (1527) and during the Reformation, and is darker. Its nudity was later partly covered by order of the Counter-Reformation (Council of Trent). Restored 1980–1994."],["Exam hooks","Michelangelo · fresco · Genesis ceiling · Last Judgment · Julius II · sculptural bodies · Counter-Reformation censorship"],["Compare with","School of Athens (#76): Raphael at the same time. Arena Chapel (#63): fresco cycle. Last judgment of Hu-Nefer (#24)."]]},{n:76,title:"School of Athens",maker:"Raphael",date:"1509–1511 C.E.",medium:"Fresco",context:"In the pope's library, a barrel-vaulted hall gathers the ancient philosophers, Plato pointing up and Aristotle out, with the perspective lines converging between them. Contemporary faces stand in — Leonardo as Plato, Michelangelo brooding as Heraclitus, Raphael at the right edge. It faces a theology fresco: reason and faith given equal walls.",unit:3,unitName:"Early Europe and Colonial Americas",year:1509,images:[{src:"cb/76-1.jpg",w:1e3,h:696,caption:"School of Athens",credit:"© The Bridgeman Art Library Ltd./Alamy"}],thumb:["thumbs/t2-u3.webp",4,3,8,7],notes:[["Form","A **fresco** in the **Stanza della Segnatura**, the Vatican, with a grand classical architecture in **one-point perspective** (barrel vaults, inspired by Bramante's design for St. Peter's). It has balance, harmony and symmetry, with groups of figures arranged across a wide stage."],["Function","Decoration for a room probably used as Pope **Julius II**'s library. Its four walls represent philosophy, theology, poetry and law."],["Content","**Plato** (pointing up to the ideal world of forms, with the face of Leonardo) and **Aristotle** (gesturing down to the earthly) at the center. Around them: Socrates, Pythagoras, Euclid (Bramante), Heraclitus brooding (Michelangelo), Ptolemy, and **Raphael** himself looking out."],["Context","**High Renaissance** humanism: reconciles classical philosophy with Christian theology (the Disputà on the opposite wall). Raphael paints great thinkers as contemporary artists."],["Exam hooks","Raphael · Plato (up) and Aristotle (down) · one-point perspective · humanism · Stanza della Segnatura · self-portrait"],["Compare with","Last Supper (#73): perspective. Sistine Chapel (#75): Vatican fresco."]]},{n:77,title:"Isenheim altarpiece",maker:"Matthias Grünewald",date:"c. 1512–1516 C.E.",medium:"Oil on wood",context:"A hinged polyptych for a hospital treating ergotism and plague. Closed, it shows a Crucifixion with Christ's skin pocked and green and his fingers twisting — a body that looked like the patients'. Opened, it turns to Annunciation, angel concert and a blazing Resurrection. The wings were opened on feast days; the image was meant to be therapeutic.",unit:3,unitName:"Early Europe and Colonial Americas",year:1512,images:[{src:"cb/77-1.jpg",w:900,h:645,caption:"Isenheim altarpiece, closed",credit:"© Erich Lessing/Art Resource, NY"},{src:"cb/77-2.jpg",w:1116,h:648,caption:"Isenheim altarpiece, open",credit:"© Scala/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",5,3,8,7],notes:[["Form","A large **folding polyptych**, oil on wood, with multiple views. **Closed**: a horrifying **Crucifixion**: Christ's body is gray-green, covered in sores, his hands contorted; John the Baptist points to him. **Open**: Annunciation, angel concert, Nativity and a radiant **Resurrection**. The innermost view has carved figures (by Niclaus of Haguenau) with St. Anthony."],["Function","The high altar of the **Antonite** monastery hospital at Isenheim, which treated patients with **ergotism** (St. Anthony's Fire), a disease that produced skin sores and gangrene."],["Context","Patients were brought before the altarpiece and saw Christ suffering as they did, offering comfort and hope of healing or resurrection. **Matthias Grünewald**: expressive Northern Renaissance."],["Exam hooks","Grünewald · hospital altarpiece · ergotism/St. Anthony's Fire · suffering Christ's sores · closed/open views · Antonites"],["Compare with","Röttgen Pietà (#62): suffering. Entombment (#78)."]]},{n:78,title:"Entombment of Christ",maker:"Jacopo da Pontormo",date:"1525–1528 C.E.",medium:"Oil on wood",context:"Mannerism at full strength: acid pinks, blues and oranges, boneless elongated bodies stacked in a spiral, no ground, no cross and no visible tomb. Everyone appears to float, and the faces are alike and glassy. Painted for a small chapel, it abandons High Renaissance balance on purpose.",unit:3,unitName:"Early Europe and Colonial Americas",year:1525,images:[{src:"cb/78-1.jpg",w:667,h:1029,caption:"Entombment of Christ",credit:"© De Agostini Picture Library/The Bridgeman Art Library"}],thumb:["thumbs/t2-u3.webp",6,3,8,7],notes:[["Form","A tall **oil on wood** painting in **Mannerist** style: elongated figures, unnatural, acidic colors (pinks, blues), an ambiguous and compressed space with no ground and no cross or tomb, and a swirling composition around an empty center. The figures seem weightless."],["Function","An altarpiece for the **Capponi Chapel** in Santa Felicita, Florence, above the altar where the Eucharist was celebrated, so Christ's body was presented to the viewer."],["Content","Mourners lower or carry the dead **Christ**; Mary faints. Pontormo includes himself at the upper right edge, looking out."],["Context","Made after the High Renaissance, around the time of the **Sack of Rome** (1527), a time of crisis. **Mannerism** rejects classical balance for elegance, artifice and emotional ambiguity."],["Exam hooks","Pontormo · Mannerism · elongated · acidic colors · ambiguous space · Capponi Chapel · Eucharist link"],["Compare with","Lamentation, Arena Chapel (#63). Isenheim (#77). School of Athens (#76): balance versus Mannerist instability."]]},{n:79,title:"Allegory of Law and Grace",maker:"Lucas Cranach the Elder",date:"c. 1530 C.E.",medium:"Woodcut and letterpress",context:"A print split by a tree. On the left, Law: Moses, the commandments, and death and the devil driving a man toward hell. On the right, Grace: the crucified Christ, the Lamb, and John the Baptist pointing the same man to salvation. Cheap, reproducible and captioned with scripture — Lutheran doctrine designed for distribution.",unit:3,unitName:"Early Europe and Colonial Americas",year:1530,images:[{src:"cb/79-1.jpg",w:993,h:818,caption:"Allegory of Law and Grace",credit:"© The Trustees of the British Museum/Art Resource, NY"}],thumb:["thumbs/t2-u3.webp",7,3,8,7],notes:[["Form","A
