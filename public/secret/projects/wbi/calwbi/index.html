<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <!-- Instant redirect via meta refresh (fires even if JS is disabled) -->
  <meta http-equiv="refresh" content="0; url=https://docs.google.com/forms/d/e/1FAIpQLSe-OuT0Wu3hWlYstgh-I7WqK1m5jCnD_aa-By96PzWr06Tq_A/viewform">
  <link rel="canonical" href="https://docs.google.com/forms/d/e/1FAIpQLSe-OuT0Wu3hWlYstgh-I7WqK1m5jCnD_aa-By96PzWr06Tq_A/viewform">
  <script>
    // JS redirect as a faster fallback; replace() avoids a back-button trap
    window.location.replace("https://docs.google.com/forms/d/e/1FAIpQLSe-OuT0Wu3hWlYstgh-I7WqK1m5jCnD_aa-By96PzWr06Tq_A/viewform");
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #444;
    }
  </style>
</head>
<body>
  <!-- Shown only briefly, or if both redirects fail -->
  <p>Redirecting to the form… <a href="https://docs.google.com/forms/d/e/1FAIpQLSe-OuT0Wu3hWlYstgh-I7WqK1m5jCnD_aa-By96PzWr06Tq_A/viewform">Click here if you're not redirected.</a></p>
</body>
</html>
