<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub Bid Leveler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#051C2C; --cobalt:#2251FF; --cyan:#00A9F4;
    --g1:#E6E6E6; --g2:#C4C4C4; --g3:#6E6E6E;
    --ink:#1A2A33; --bg:#ffffff; --panel:#F4F6F8;
    --serif:'Noto Serif Display', Georgia, 'Times New Roman', serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:13.5px; line-height:1.55;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .wrap{ max-width:1200px; margin:0 auto; padding:26px 30px 96px; }

  /* masthead */
  h1{ font-family:var(--serif); font-weight:600; font-size:28px; line-height:1.08; letter-spacing:-.015em; color:var(--navy); margin:0; }
  .kicker{ font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--cobalt); margin-bottom:9px; }
  .eyebrow{ font-family:var(--sans); font-size:12px; letter-spacing:.01em; color:var(--g3); margin-top:8px; max-width:52ch; }
  .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap; border-bottom:1px solid var(--g1); padding-bottom:18px; margin-bottom:22px; }
  .deals{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }

  /* controls */
  button,select,input,textarea{ font-family:var(--sans); color:var(--navy); background:#fff; border:1px solid var(--g2); border-radius:2px; }
  button{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:500; padding:6px 12px; cursor:pointer; white-space:nowrap; transition:background .12s,color .12s,border-color .12s; }
  button:hover{ background:var(--navy); color:#fff; border-color:var(--navy); }
  select,input,textarea{ font-size:13px; padding:6px 8px; }
  select{ cursor:pointer; }
  select:hover{ border-color:var(--g3); }
  input::placeholder,textarea::placeholder{ color:var(--g3); }
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{ outline:2px solid var(--cobalt); outline-offset:1px; }
  textarea{ width:100%; min-height:80px; resize:vertical; line-height:1.5; }

  /* tabs */
  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--g1); margin-bottom:22px; flex-wrap:wrap; }
  .tabs button{ border:none; border-bottom:2px solid transparent; background:none; color:var(--g3); padding:10px 15px; margin:0; border-radius:0; letter-spacing:.09em; }
  .tabs button:hover{ background:none; color:var(--navy); }
  .tabs button.on{ color:var(--navy); border-bottom-color:var(--cobalt); font-weight:600; }

  /* layout utils */
  .row{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .between{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  .mut{ color:var(--g3); }
  .small{ font-size:11px; }
  .mb{ margin-bottom:14px; }
  .mt{ margin-top:14px; }
  hr.div{ border:none; border-top:1px solid var(--g1); margin:14px 0; }
  .hide{ display:none; }

  /* cards = exhibits */
  .card{ border:1px solid var(--g1); border-radius:4px; padding:18px 20px; margin-bottom:16px; background:#fff; }
  .card>h3{ font-family:var(--serif); font-weight:600; font-size:16.5px; color:var(--navy); margin:0 0 13px; line-height:1.25; letter-spacing:-.005em; text-transform:none; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .card>h3 .small,.card>h3 .mut{ font-family:var(--sans); font-weight:400; font-size:11px; letter-spacing:.02em; color:var(--g3); text-transform:none; }
  .card>h3 button{ font-family:var(--sans); }

  /* tables */
  table{ border-collapse:collapse; width:100%; font-family:var(--sans); }
  th,td{ text-align:left; padding:8px 10px; font-size:12.5px; border:none; vertical-align:middle; }
  th{ font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--g3); font-weight:600; border-bottom:1.5px solid var(--navy); white-space:nowrap; }
  td{ color:var(--ink); border-bottom:1px solid var(--g1); }
  .num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .lines th,.lines td{ padding:5px 7px; }
  tr.totrow td{ font-weight:700; color:var(--navy); border-top:1.5px solid var(--navy); border-bottom:none; }

  /* inputs sizing */
  input.amt{ width:108px; text-align:right; font-variant-numeric:tabular-nums; }
  input.pct{ width:64px; text-align:right; font-variant-numeric:tabular-nums; }
  input.stated{ width:120px; text-align:right; font-variant-numeric:tabular-nums; }
  input.qty{ width:60px; text-align:right; font-variant-numeric:tabular-nums; }
  input.uom{ width:52px; text-transform:uppercase; }
  input.desc{ width:100%; min-width:160px; }
  input.label{ width:100%; min-width:150px; }
  select.kindsel{ width:78px; padding:5px 5px; }
  input.amt:disabled{ color:var(--g3); background:var(--panel); }

  /* small icon / toggle buttons */
  .x{ font-family:var(--sans); border:1px solid var(--g2); background:#fff; color:var(--navy); cursor:pointer; padding:2px 7px; font-size:12px; line-height:1.2; border-radius:2px; }
  .x:hover{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .altbtn{ font-size:9px; padding:3px 8px; margin-left:5px; }
  .altbtn.on{ background:var(--navy); color:#fff; border-color:var(--navy); }

  /* tags */
  .tag{ display:inline-block; font-family:var(--sans); font-size:9px; line-height:1.7; letter-spacing:.1em; text-transform:uppercase; color:var(--g3); border:1px solid var(--g2); border-radius:2px; padding:0 5px; vertical-align:middle; }
  .tag.bad{ background:var(--navy); color:#fff; border-color:var(--navy); }

  /* segmented control */
  .seg{ display:inline-flex; border:1px solid var(--g2); border-radius:2px; overflow:hidden; }
  .seg button{ border:none; border-right:1px solid var(--g2); margin:0; border-radius:0; background:#fff; color:var(--navy); }
  .seg button:last-child{ border-right:none; }
  .seg button:hover{ background:var(--navy); color:#fff; }
  .seg button.on{ background:var(--navy); color:#fff; }

  /* legend */
  .legend{ font-family:var(--sans); font-size:10.5px; letter-spacing:.01em; display:flex; gap:18px; flex-wrap:wrap; align-items:center; border:1px solid var(--g1); border-radius:4px; padding:9px 13px; margin-bottom:14px; color:var(--ink); background:var(--panel); }
  .legend b{ font-weight:600; color:var(--navy); }
  .sw{ display:inline-block; width:12px; height:12px; border:1px solid var(--g2); vertical-align:middle; margin-right:5px; border-radius:1px; }
  .sw.gap{ background:var(--navy); border-color:var(--navy); }
  .sw.excl{ background:var(--panel); border-style:dashed; }

  /* matrix */
  .matrix{ overflow-x:auto; border:1px solid var(--g1); border-radius:4px; }
  .matrix table{ min-width:560px; }
  .matrix th, .matrix td{ border-right:1px solid var(--g1); }
  .matrix th:last-child, .matrix td:last-child{ border-right:none; }
  .matrix th.rowhead, .matrix td.rowhead{ text-align:left; position:sticky; left:0; background:#fff; z-index:1; min-width:184px; }
  td.cell{ text-align:right; font-variant-numeric:tabular-nums; min-width:96px; color:var(--navy); }
  td.cell.excl{ color:var(--g3); background:var(--panel); font-size:10px; letter-spacing:.08em; cursor:pointer; }
  td.cell.gap{ background:var(--navy); color:#fff; text-align:center; font-weight:600; font-size:10px; letter-spacing:.12em; cursor:pointer; }
  td.cell.out{ box-shadow:inset 0 0 0 2px var(--cobalt); }
  td.cell.gap.out{ box-shadow:inset 0 0 0 2px var(--cyan); }
  .ann{ display:block; font-size:10px; font-weight:600; color:var(--cobalt); letter-spacing:.02em; margin-top:2px; }
  .ann.mut{ color:var(--g3); font-weight:400; }
  td.med{ text-align:right; font-variant-numeric:tabular-nums; color:var(--g3); background:var(--panel); }

  /* scorecell / low-confidence */
  .scorecell{ font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink); }
  .q{ font-weight:700; color:var(--cobalt); }

  /* banner = hero conclusion, navy reversed out */
  .banner{ background:var(--navy); color:#fff; border:none; border-radius:4px; padding:20px 22px; margin-bottom:16px; }
  .big{ font-family:var(--serif); font-weight:600; font-size:21px; line-height:1.2; letter-spacing:-.01em; }
  .banner .big{ color:#fff; }
  .banner .note{ margin-top:8px; color:rgba(255,255,255,.82); font-size:12.5px; }
  .banner .mut{ color:rgba(255,255,255,.7); }
  .banner .tag{ border-color:rgba(255,255,255,.35); color:#fff; }
  .banner .tag.bad{ background:var(--cobalt); border-color:var(--cobalt); color:#fff; }
  .warn{ border:1px solid rgba(255,255,255,.26); border-left:3px solid var(--cyan); border-radius:2px; padding:8px 11px; margin-top:10px; font-size:11.5px; color:rgba(255,255,255,.92); }

  /* misc panels */
  .empty{ border:1px dashed var(--g2); border-radius:4px; padding:26px; text-align:center; color:var(--g3); font-size:13px; background:var(--panel); }
  .strip{ border:1px solid var(--g1); border-radius:4px; padding:10px 13px; margin-bottom:14px; background:var(--panel); }
  .strip .item{ display:flex; gap:8px; align-items:center; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--g1); font-size:12px; }
  .strip .item:last-child{ border-bottom:none; }
  .splitbox{ border-left:3px solid var(--cobalt); padding-left:10px; }
  .drop{ border:1px dashed var(--g2); border-radius:4px; padding:12px 14px; text-align:center; cursor:pointer; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--g3); background:var(--panel); }
  .drop:hover{ background:#fff; border-color:var(--cobalt); color:var(--navy); }
  .drop.over{ background:var(--navy); color:#fff; border-color:var(--navy); border-style:solid; }

  /* footer */
  .foot{ margin-top:34px; padding-top:13px; border-top:1px solid var(--g1); color:var(--g3); font-size:10.5px; letter-spacing:.04em; }

  /* print report */
  .printview{ display:none; }
  .pv-kicker{ font-family:var(--sans); font-size:9px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--cobalt); margin-bottom:6px; }
  .pv-title{ font-family:var(--serif); font-size:25px; font-weight:600; color:var(--navy); line-height:1.12; letter-spacing:-.01em; }
  .pv-sub{ font-family:var(--sans); font-size:10px; color:var(--g3); margin-top:4px; letter-spacing:.03em; }
  .pv-ex{ font-family:var(--sans); font-size:8.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--cobalt); }
  .pv-extitle{ font-family:var(--serif); font-size:13.5px; font-weight:600; color:var(--navy); margin:2px 0 6px; line-height:1.25; }
  .pv-source{ font-family:var(--sans); font-size:7.5px; color:var(--g3); margin-top:4px; font-style:italic; }
  .pv-banner{ border:none; background:var(--navy); color:#fff; padding:14px 16px; border-radius:4px; }
  .pv-banner div{ color:#fff; }
  .pv-award{ font-family:var(--serif); font-size:17px; font-weight:600; color:#fff; line-height:1.2; }
  .pv-tbl{ width:100%; border-collapse:collapse; font-family:var(--sans); font-size:10px; }
  .pv-tbl th,.pv-tbl td{ text-align:left; padding:3px 6px; border:none; }
  .pv-tbl th{ font-size:8px; text-transform:uppercase; letter-spacing:.08em; color:var(--g3); font-weight:700; border-bottom:1.25px solid var(--navy); }
  .pv-tbl td{ color:var(--navy); border-bottom:1px solid var(--g1); }
  .pv-tbl .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .pv-tbl .cell.gap{ background:var(--navy); color:#fff; text-align:center; font-weight:600; }
  .pv-tbl .cell.excl{ color:var(--g3); }
  .pv-tbl .totrow td{ font-weight:700; color:var(--navy); border-top:1.25px solid var(--navy); border-bottom:none; }
  .pv-clar-name{ font-weight:700; margin-top:8px; text-transform:uppercase; font-size:9px; letter-spacing:.08em; color:var(--navy); }
  .pv-section{ margin-bottom:13px; }
  @media print {
    @page{ margin:16mm; }
    body{ background:#fff; }
    .top,.tabs,#panel,.foot,#importer{ display:none !important; }
    button{ display:none !important; }
    .printview{ display:block !important; }
    .pv-section{ page-break-inside:avoid; }
  }

</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="masthead">
      <div class="kicker">Wang Brothers Construction &middot; Preconstruction</div>
      <h1>Subcontractor Bid Leveling</h1>
      <div class="eyebrow">Apples-to-apples scope normalization, gap-adjusted award, and award-risk analysis. Client-side &mdash; nothing leaves the page.</div>
    </div>
    <div class="deals" id="deals"></div>
  </div>
  <input type="file" id="importer" accept="application/json,.json" class="hide">
  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>
  <div class="foot" id="foot"></div>
  <div id="printview" class="printview"></div>
</div>

<script>
"use strict";

/* ---------- persistence (localStorage on deploy; in-memory fallback in sandbox) ---------- */
const mem = {};
const LS = {
  get(k){ try { const v = localStorage.getItem(k); return v != null ? v : (k in mem ? mem[k] : null); } catch { return k in mem ? mem[k] : null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} mem[k]=v; }
};
let DB = { deals:{}, active:null, templates:{} };
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>LS.set('sbl_db', JSON.stringify(DB)), 250); }
function loadDB(){
  try { const raw = LS.get('sbl_db'); if(raw) DB = JSON.parse(raw); } catch {}
  if(!DB || typeof DB!=='object') DB = {};
  if(!DB.deals) DB.deals = {};
  if(!DB.templates) DB.templates = {};
  if(DB.useMemory===undefined) DB.useMemory = true;
  ensureMemory();
  ensureBenchmarks();
}

/* ---------- utils ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function money(n){
  if(n==null || !isFinite(n)) return '\u2014';
  const neg = n<0; n = Math.abs(n);
  return (neg?'-$':'$') + Math.round(n).toLocaleString('en-US');
}
function pmoney(s){
  if(typeof s==='number') return s;
  if(s==null) return NaN;
  const t = String(s).replace(/[^0-9.\-]/g,'');
  if(t==='' || t==='-' || t==='.') return NaN;
  const v = parseFloat(t); return isFinite(v) ? v : NaN;
}
function copyText(txt, btn){
  const ok = () => { if(btn){ const o=btn.textContent; btn.textContent='Copied'; setTimeout(()=>btn.textContent=o, 1200); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, ()=>fallbackCopy(txt,ok));
  } else fallbackCopy(txt, ok);
}
function fallbackCopy(txt, ok){
  const ta = document.createElement('textarea'); ta.value = txt;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); if(ok) ok(); } catch {}
  ta.remove();
}
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    const v = attrs[k];
    if(v==null || v===false) continue;
    if(k==='class') e.className = v;
    else if(k==='style') e.style.cssText = v;
    else if(k==='html') e.innerHTML = v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c=>{
    if(c==null || c===false) return;
    e.appendChild(typeof c==='object' ? c : document.createTextNode(String(c)));
  });
  return e;
}

/* ---------- line classification: base / alternate / allowance ---------- */
function counts(line){ const k = line.kind || 'base'; return k==='base' || (k==='alt' && !!line.altIn); }
function lineKind(desc){
  if(/\ballow(ance)?\b/i.test(desc)) return 'allow';
  if(/\balt(ernate)?\b|^\s*add\b|\bdeduct\b|\badd\s+alt/i.test(desc)) return 'alt';
  return 'base';
}
function basePricedSum(b){ return b.raw.filter(r=>(r.kind||'base')==='base' && isFinite(r.amount)).reduce((s,r)=>s+r.amount,0); }
function tieOut(b){
  const sum = basePricedSum(b);
  if(!isFinite(b.statedTotal)) return { sum, stated:null, ok:true, delta:0, none:true };
  const delta = sum - b.statedTotal;
  const tol = Math.max(1, Math.abs(b.statedTotal)*0.005);
  return { sum, stated:b.statedTotal, ok: Math.abs(delta)<=tol, delta, none:false };
}
function allowLines(b){ return b.raw.filter(r=>(r.kind||'base')==='allow'); }
function allowTotal(b){ return allowLines(b).reduce((s,r)=>s+(isFinite(r.amount)?r.amount:0),0); }
function altLines(d){ const out=[]; d.bidders.forEach(b=>b.raw.forEach(r=>{ if((r.kind||'base')==='alt') out.push({b,r}); })); return out; }

/* ---------- fuzzy matching ---------- */
const SYN = {
  'u/g':'underground','ug':'underground','undergrnd':'underground','undgrd':'underground',
  'swgr':'switchgear','sw':'switch','gear':'switchgear',
  'fa':'firealarm','f/a':'firealarm',
  'rough-in':'rough','roughin':'rough','ri':'rough','r/i':'rough',
  'demo':'demolition','temp':'temporary','svc':'service',
  'panelbd':'panelboard','pnl':'panel','xfmr':'transformer','transf':'transformer','xfr':'transformer',
  'lts':'light','lights':'light','lighting':'light','luminaire':'light','luminaires':'light','fixture':'light','fixtures':'light',
  'recep':'receptacle','recept':'receptacle','recepts':'receptacle','device':'device','devices':'device',
  'condt':'conduit','cdt':'conduit','wire':'wire','wiring':'wire',
  'lv':'lowvoltage','low-voltage':'lowvoltage','lowvolt':'lowvoltage','data':'data',
  'gnd':'ground','grnd':'ground','grounding':'ground','bonding':'bond',
  'commissioning':'commission','testing':'test','startup':'commission',
  'permit':'permit','permits':'permit','fee':'fee','fees':'fee',
  'mob':'mobilization','genl':'general','gc':'general','oh&p':'overhead','o&p':'overhead'
};
const STOP = new Set(['and','the','of','for','to','a','an','in','incl','include','including','per','plan','plans','spec','specs','work','works','labor','material','materials','all','system','systems','complete','assembly','allowance','as','by','with','provide','install','installation','furnish']);
function norm(s){
  s = String(s||'').toLowerCase().replace(/[^a-z0-9\/\-\s&]/g,' ');
  const out = [];
  s.split(/\s+/).filter(Boolean).forEach(tok=>{
    const mapped = SYN[tok];
    if(mapped){ mapped.split(/\s+/).forEach(p=>out.push(p)); return; }                 // whole-token synonym (u/g, rough-in, oh&p, multiword)
    if(/[\/\-]/.test(tok)){ tok.split(/[\/\-]+/).forEach(p=>{ const m=SYN[p]; (m?m.split(/\s+/):[p]).forEach(x=>out.push(x)); }); return; }  // split residual compounds, re-map pieces
    out.push(tok);
  });
  return out.filter(t => t.length>1 && !STOP.has(t));
}
function jaccard(a,b){
  const A=new Set(a), B=new Set(b);
  if(!A.size && !B.size) return 0;
  let inter=0; A.forEach(x=>{ if(B.has(x)) inter++; });
  return inter / (A.size + B.size - inter);
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,i)=>i);
  for(let i=1;i<=m;i++){
    let cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev = cur;
  }
  return prev[n];
}
function levNorm(a,b){ const M=Math.max(a.length,b.length); return M ? levenshtein(a,b)/M : 0; }
function score(rawDesc, scopeLabel){
  const ra = norm(rawDesc), sa = norm(scopeLabel);
  if(!ra.length || !sa.length) return 0;
  const j = jaccard(ra, sa);
  const l = 1 - levNorm(ra.join(' '), sa.join(' '));
  return 0.7*j + 0.3*l;
}
function bestMatch(desc, scope){
  let best=null, bs=-1;
  scope.forEach(s=>{ const sc = score(desc, s.label); if(sc>bs){ bs=sc; best=s; } });
  return best ? { id:best.id, score:bs } : null;
}
function clusterUnion(deal, thresh){
  thresh = thresh==null ? 0.5 : thresh;
  const clusters = [];
  deal.bidders.forEach(b => b.raw.forEach(r => {
    const t = norm(r.desc);
    let bi=-1, bs=-1;
    clusters.forEach((c,i)=>{ const s=jaccard(t,c.tokens); if(s>bs){ bs=s; bi=i; } });
    if(bs>=thresh && bi>=0) clusters[bi].members.push(r.desc);
    else clusters.push({ tokens:t, members:[r.desc] });
  }));
  return clusters
    .filter(c => c.members.some(m => m.trim()))
    .map(c => ({ id:uid(), label: c.members.slice().sort((a,b)=>a.length-b.length)[0].trim() || 'Unnamed' }));
}

/* ---------- robust stats ---------- */
function median(arr){
  if(!arr.length) return null;
  const s=[...arr].sort((x,y)=>x-y), n=s.length, mid=n>>1;
  return n%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
function mad(arr,m){
  if(!arr.length) return null;
  return median(arr.map(x=>Math.abs(x-m)));
}
function rowStats(prices){
  const n = prices.length;
  if(n<3) return { n, m: median(prices), insufficient:true, flags:null };
  const m = median(prices), M = mad(prices,m);
  const flags = prices.map(p=>{
    const pct = m!==0 ? (p-m)/m : 0;
    const modZ = M>0 ? 0.6745*(p-m)/M : null;
    let flagged;
    if(M===0) flagged = Math.abs(pct) >= 0.20;
    else flagged = Math.abs(modZ) >= 3.5 && Math.abs(pct) >= 0.20;
    return { p, pct, modZ, flagged, dir: p<m ? 'low' : 'high' };
  });
  return { n, m, M, flags, insufficient:false };
}

/* ---------- derivation (base comparison) ---------- */
function cellFor(bidder, rowId){
  let inc=0, hasPrice=false, mappedNoPrice=false;
  bidder.raw.forEach(r=>{
    if(!counts(r)) return;                 // alternates-out and allowances excluded from base
    const sp = bidder.split && bidder.split[r.id];
    if(sp && sp.length){                   // split line: contribute each allocation to its row
      sp.forEach(a=>{ if(a.rowId===rowId && isFinite(a.amount)){ inc += a.amount; hasPrice=true; } });
      return;
    }
    if(bidder.map[r.id]===rowId){
      if(isFinite(r.amount)){ inc += r.amount; hasPrice=true; }
      else mappedNoPrice=true;
    }
  });
  if(hasPrice) return { status:'INC', amount:inc };
  const ov = bidder.rowStatus && bidder.rowStatus[rowId];
  if(ov==='EXCL') return { status:'EXCL', amount:null };
  if(ov==='GAP')  return { status:'GAP',  amount:null };
  if(mappedNoPrice) return { status:'EXCL', amount:null };
  return { status:'GAP', amount:null };
}
function rowPrices(deal,rowId){
  return deal.bidders.map(b=>cellFor(b,rowId)).filter(c=>c.status==='INC').map(c=>c.amount);
}
function rowMedian(deal,rowId){ return median(rowPrices(deal,rowId)); }
function rowAnalysis(deal,row){
  const cells = deal.bidders.map(b => Object.assign({ bidderId:b.id }, cellFor(b,row.id)));
  const inc = cells.filter(c=>c.status==='INC');
  const st = rowStats(inc.map(c=>c.amount));
  if(st.flags) st.flags.forEach((f,i)=>{ inc[i].pct=f.pct; inc[i].flagged=f.flagged; inc[i].dir=f.dir; });
  const byId = {}; cells.forEach(c=>byId[c.bidderId]=c);
  return { cells, byId, median:st.m, n: inc.length, insufficient:st.insufficient };
}
function rowFillBasis(deal, row, method){
  method = method || deal.fillMethod || 'median-ex';
  const a = rowAnalysis(deal, row);
  const inc = [];
  a.cells.forEach(c=>{ if(c.status==='INC') inc.push({ amount:c.amount, flagged:!!c.flagged }); });
  const all = inc.map(x=>x.amount);
  if(!all.length) return { value:null, basis:method, n:0, excluded:0 };
  if(method==='median') return { value: median(all), basis:'median', n:all.length, excluded:0 };
  if(method==='trimmed'){
    if(all.length>=3){
      const s=[...all].sort((x,y)=>x-y), trimmed=s.slice(1,-1);
      const v = trimmed.length ? trimmed.reduce((p,q)=>p+q,0)/trimmed.length : median(all);
      return { value:v, basis:'trimmed', n:all.length, excluded: all.length - trimmed.length };
    }
    return { value: median(all), basis:'trimmed', n:all.length, excluded:0 };
  }
  // median-ex: median of non-outlier prices (falls back to full median if removal empties)
  const kept = inc.filter(x=>!x.flagged).map(x=>x.amount);
  if(kept.length>=1 && kept.length<all.length) return { value: median(kept), basis:'median-ex', n:all.length, excluded: all.length - kept.length };
  return { value: median(all), basis:'median', n:all.length, excluded:0 };
}
function fillMethodCaption(d){
  const m = d.fillMethod || 'median-ex';
  if(m==='median') return 'gaps & carve-outs priced at full peer median';
  if(m==='trimmed') return 'gaps priced at trimmed mean \u2014 high & low dropped (median when n<3)';
  return 'gaps priced at peer median, flagged outliers excluded';
}
function rowQtyAnalysis(deal,row){
  const entries=[];
  deal.bidders.forEach(b=>{
    let qty=null, uom=null, has=false;
    b.raw.forEach(r=>{
      if(!counts(r)) return;
      const isSplit = b.split && b.split[r.id] && b.split[r.id].length;
      if(isSplit) return;
      if(b.map[r.id]===row.id && isFinite(r.qty)){ qty=(qty||0)+r.qty; uom=uom||(r.uom||''); has=true; }
    });
    if(has && isFinite(qty)) entries.push({ bidderId:b.id, qty, uom:(uom||'').toUpperCase() });
  });
  const byId={}; entries.forEach(e=>byId[e.bidderId]=e);
  if(entries.length<2){ entries.forEach(e=>{ e.pct=0; e.flag=false; }); return { entries, byId, medianQty: entries.length?entries[0].qty:null, unitMismatch:false }; }
  const uoms = new Set(entries.map(e=>e.uom).filter(Boolean));
  const unitMismatch = uoms.size>1;
  const mq = median(entries.map(e=>e.qty));
  entries.forEach(e=>{ e.pct = mq?(e.qty-mq)/mq:0; e.flag = (!unitMismatch && !!mq && Math.abs(e.pct)>=0.15); });
  return { entries, byId, medianQty:mq, unitMismatch };
}
function bidderTotals(deal,bidder){
  let priced=0, gapFill=0, exclFill=0;
  deal.scope.forEach(row=>{
    const c = cellFor(bidder,row.id);
    if(c.status==='INC') priced += c.amount;
    else {
      const pm = (rowFillBasis(deal,row).value) || 0;
      if(c.status==='GAP') gapFill += pm; else exclFill += pm;
    }
  });
  const adjusted = priced + gapFill + exclFill;
  return { priced, gapFill, exclFill, adjusted, complete: adjusted>0 ? priced/adjusted : 1 };
}
/* ---------- benchmark library: catches whole-field misses peer median can't ---------- */
function benchFor(label){ ensureBenchmarks(); return DB.benchmarks.find(b=>b.label && b.label===label) || null; }
function benchFmt(basis, v){ if(v==null || !isFinite(v)) return '\u2014'; if(basis==='sf') return '$'+v.toFixed(2)+'/SF'; if(basis==='unit') return '$'+v.toFixed(2)+'/u'; return money(v); }
function bidderComparable(deal, bidder, row, basis){
  const c = cellFor(bidder, row.id);
  if(c.status!=='INC') return null;
  if(basis==='lump') return c.amount;
  if(basis==='sf') return (isFinite(deal.areaSF) && deal.areaSF>0) ? c.amount/deal.areaSF : null;
  if(basis==='unit'){
    let qty=null, unit=null;
    bidder.raw.forEach(r=>{
      if(!counts(r)) return;
      const sp = bidder.split && bidder.split[r.id]; if(sp && sp.length) return;
      if(bidder.map[r.id]===row.id){ if(isFinite(r.unitPrice)) unit=r.unitPrice; if(isFinite(r.qty)) qty=(qty||0)+r.qty; }
    });
    if(isFinite(unit)) return unit;
    if(isFinite(qty) && qty>0) return c.amount/qty;
    return null;
  }
  return null;
}
function rowBenchmark(deal,row){
  const entry = benchFor(row.label); if(!entry) return null;
  const byId={}, vals=[];
  deal.bidders.forEach(b=>{
    const v = bidderComparable(deal,b,row,entry.basis);
    if(v!=null){ const status = (isFinite(entry.low)&&v<entry.low)?'under':((isFinite(entry.high)&&v>entry.high)?'over':'ok'); byId[b.id]={ value:v, status }; vals.push(v); }
  });
  const med = vals.length ? median(vals) : null;
  const medianStatus = med==null ? null : ((isFinite(entry.low)&&med<entry.low)?'under':((isFinite(entry.high)&&med>entry.high)?'over':'ok'));
  return { entry, basis:entry.basis, byId, median:med, medianStatus, low:entry.low, target:entry.target, high:entry.high };
}
/* ---------- Monte Carlo: award robustness under gap-fill uncertainty ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rowSpread(deal,row){
  const center = rowFillBasis(deal,row).value;
  if(center==null) return null;
  const prices = rowPrices(deal,row.id);
  let sigma = 0;
  if(prices.length>=2){ const m=median(prices), M=mad(prices,m); sigma = M>0 ? M*1.4826 : 0; }
  return { center, sigma: Math.max(sigma, Math.abs(center)*0.10) };   // floor: 10% irreducible uncertainty on an unpriced line
}
function monteCarlo(deal, N){
  N = N || 10000;
  if(!deal.bidders.length) return null;
  const plans = deal.bidders.map(b=>{
    const t = bidderTotals(deal,b);
    const draws = [];
    deal.scope.forEach(row=>{ const c=cellFor(b,row.id); if(c.status==='GAP'||c.status==='EXCL'){ const sp=rowSpread(deal,row); if(sp) draws.push(sp); } });
    return { b, priced:t.priced, detAdjusted:t.adjusted, draws };
  });
  const wins = deal.bidders.map(()=>0);
  const totalFill = plans.reduce((s,p)=>s+p.draws.length,0);
  if(totalFill===0){
    let mi=0; for(let i=1;i<plans.length;i++) if(plans[i].priced<plans[mi].priced) mi=i;
    wins[mi]=N; return { plans, wins, N, deterministic:true };
  }
  const rng = mulberry32(0x9e3779b9);   // fixed seed -> reproducible across renders/exports
  const normal = ()=>{ let u=0,v=0; while(u===0)u=rng(); while(v===0)v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  for(let trial=0; trial<N; trial++){
    let mi=-1, mv=Infinity;
    for(let i=0;i<plans.length;i++){
      let tot = plans[i].priced; const dr = plans[i].draws;
      for(let j=0;j<dr.length;j++) tot += Math.max(0, dr[j].center + dr[j].sigma*normal());
      if(tot<mv){ mv=tot; mi=i; }
    }
    wins[mi]++;
  }
  return { plans, wins, N, deterministic:false };
}
function mcVerdict(res){
  const ranked = res.plans.map((p,i)=>({ name:p.b.name, id:p.b.id, p:res.wins[i]/res.N, det:p.detAdjusted })).sort((a,b)=>b.p-a.p);
  const top = ranked[0];
  let verdict;
  if(res.deterministic) verdict = 'Determined by priced totals \u2014 no gap-fill uncertainty to simulate.';
  else if(top.p>=0.85) verdict = 'Robust \u2014 the recommended award holds across fill uncertainty ('+Math.round(top.p*100)+'% of trials).';
  else if(top.p>=0.60) verdict = 'Likely, but verify \u2014 '+top.name+' wins '+Math.round(top.p*100)+'% of trials; a close runner-up.';
  else verdict = 'Too close to call \u2014 fill uncertainty swamps the margin ('+top.name+' wins only '+Math.round(top.p*100)+'%); clarify scope before awarding.';
  return { ranked, top, verdict };
}
function awardCalc(deal){
  if(!deal.bidders.length) return null;
  const rows = deal.bidders.map(b=>({ b, t: bidderTotals(deal,b) }));
  const byAdj = [...rows].sort((a,b)=>a.t.adjusted-b.t.adjusted);
  const mostComplete = [...rows].sort((a,b)=>b.t.complete-a.t.complete)[0];
  const warns = [];
  deal.scope.forEach(row=>{
    const a = rowAnalysis(deal,row);
    a.cells.forEach(c=>{
      if(c.status==='INC' && c.flagged && c.dir==='low'){
        const b = deal.bidders.find(x=>x.id===c.bidderId);
        warns.push(`${b.name}: "${row.label}" is ${Math.round(c.pct*100)}% below median \u2014 likely scope gap, confirm before considering.`);
      }
    });
  });
  return { rows, rec: byAdj[0], mostComplete, warns };
}
function buyoutAnalysis(deal, opts){
  const excl = !opts || opts.excludeLowOutliers!==false;   // a flagged-low price is likely a scope gap, not a real low
  const lines = deal.scope.map(row=>{
    const a = rowAnalysis(deal,row);
    const cands = a.cells.filter(c=>c.status==='INC').map(c=>({ bidderId:c.bidderId, amount:c.amount, flaggedLow: !!(c.flagged && c.dir==='low') }));
    let pool = cands;
    if(excl){ const credible = cands.filter(c=>!c.flaggedLow); if(credible.length) pool = credible; }   // unless excluding empties the line
    let winner=null; pool.forEach(c=>{ if(!winner || c.amount<winner.amount) winner=c; });
    let naive=null; cands.forEach(c=>{ if(!naive || c.amount<naive.amount) naive=c; });
    return { row, winner, naive, count:cands.length, fillBasis: rowFillBasis(deal,row).value };
  });
  let credibleTotal=0, naiveTotal=0; const subsUsed=new Set(); const unpriced=[];
  lines.forEach(L=>{
    if(L.winner){ credibleTotal += L.winner.amount; subsUsed.add(L.winner.bidderId); }
    else if(L.fillBasis!=null){ credibleTotal += L.fillBasis; unpriced.push(L.row); }
    else unpriced.push(L.row);
    if(L.naive) naiveTotal += L.naive.amount; else if(L.fillBasis!=null) naiveTotal += L.fillBasis;
  });
  return { lines, credibleTotal, naiveTotal, subsUsed:[...subsUsed], unpriced };
}

/* ---------- clarifications / RFIs ---------- */
function clarifications(deal){
  const analyses = deal.scope.map(row=>({ row, a: rowAnalysis(deal,row), q: rowQtyAnalysis(deal,row) }));
  return deal.bidders.map(b=>{
    const items = [];
    const to = tieOut(b);
    if(!to.none && !to.ok)
      items.push(`Reconcile: base line sum ${money(to.sum)} vs stated base bid ${money(to.stated)} (\u0394 ${money(to.delta)}).`);
    analyses.forEach(({row,a,q})=>{
      const c = a.byId[b.id];
      if(c.status==='GAP')
        items.push(`Confirm scope: "${row.label}" \u2014 absent from bid${a.median!=null?` (peer median ${money(a.median)})`:''}. Price it or confirm the exclusion in writing.`);
      else if(c.status==='INC' && c.flagged){
        if(c.dir==='low') items.push(`Clarify: "${row.label}" at ${money(c.amount)} is ${Math.round(c.pct*100)}% below median \u2014 verify the full line is priced.`);
        else items.push(`Review: "${row.label}" at ${money(c.amount)} is +${Math.round(c.pct*100)}% above median \u2014 verify scope / confirm not loaded.`);
      }
      const qf = q.byId[b.id];
      if(q.unitMismatch && qf)
        items.push(`Unit mismatch: "${row.label}" priced in ${qf.uom||'?'} while peers differ \u2014 confirm the basis of measure.`);
      else if(qf && qf.flag)
        items.push(`Verify takeoff: "${row.label}" quantity ${qf.qty}${qf.uom?(' '+qf.uom):''} vs peer median ${q.medianQty} (${qf.pct>0?'+':''}${Math.round(qf.pct*100)}%).`);
    });
    return { b, items };
  });
}
function clarText(dealName, groups){
  let s = 'BID CLARIFICATIONS \u2014 ' + dealName + '\n';
  groups.forEach(g=>{
    s += '\n' + g.b.name + '\n';
    if(!g.items.length) s += '  (no flags)\n';
    else g.items.forEach((it,i)=> s += '  ' + (i+1) + '. ' + it + '\n');
  });
  return s;
}

/* ---------- re-bid diff: snapshot a bid, compare the revision ---------- */
function snapshotBid(b){
  b.snapshot = {
    ts: Date.now(),
    raw: JSON.parse(JSON.stringify(b.raw)),
    map: Object.assign({}, b.map),
    split: JSON.parse(JSON.stringify(b.split||{})),
    rowStatus: Object.assign({}, b.rowStatus||{}),
    statedTotal: b.statedTotal
  };
  save();
}
function clearSnapshot(b){ delete b.snapshot; save(); }
function pricedOf(deal, bidderLike){ let s=0; deal.scope.forEach(row=>{ const c=cellFor(bidderLike,row.id); if(c.status==='INC') s+=c.amount; }); return s; }
function bidDiff(deal, b){
  if(!b.snapshot) return null;
  const snap = b.snapshot, rows = [];
  deal.scope.forEach(row=>{
    const prev = cellFor(snap, row.id);
    const cur = cellFor(b, row.id);
    const pv = prev.status==='INC' ? prev.amount : null;
    const cv = cur.status==='INC' ? cur.amount : null;
    let kind=null, delta=null;
    if(prev.status!=='INC' && cur.status==='INC') kind='priced';          // a gap/carve-out is now priced
    else if(prev.status==='INC' && cur.status!=='INC') kind='removed';    // a priced line went away
    else if(prev.status==='INC' && cur.status==='INC' && Math.abs(cv-pv)>=1){ kind='changed'; delta=cv-pv; }
    else if(prev.status!==cur.status) kind='statuschg';                   // gap <-> excl
    if(kind) rows.push({ row, prev, cur, pv, cv, kind, delta });
  });
  return { rows, prevPriced:pricedOf(deal,snap), curPriced:pricedOf(deal,b), prevStated:snap.statedTotal, curStated:b.statedTotal, ts:snap.ts };
}
function bidDiffSummary(diff){
  return {
    closed: diff.rows.filter(r=>r.kind==='priced').length,
    removed: diff.rows.filter(r=>r.kind==='removed').length,
    changed: diff.rows.filter(r=>r.kind==='changed').length
  };
}

/* ---------- exports: print / CSV / XLSX ---------- */
function slug(s){ return ((s||'untitled').replace(/[^a-z0-9]+/gi,'-').toLowerCase().replace(/^-+|-+$/g,'')) || 'untitled'; }
function downloadBlob(content, filename, type){
  const blob = new Blob([content], { type });
  const a = h('a',{ href:URL.createObjectURL(blob), download:filename });
  document.body.appendChild(a); a.click(); a.remove();
}
function matrixAOA(d){
  const header = ['Scope line', ...d.bidders.map(b=>b.name), 'Median'];
  const rows = d.scope.map(row=>{
    const a = rowAnalysis(d,row);
    const cells = d.bidders.map(b=>{ const c=a.byId[b.id]; return c.status==='INC' ? Math.round(c.amount) : c.status; });
    return [row.label, ...cells, a.median!=null ? Math.round(a.median) : ''];
  });
  rows.push(['Priced (base + incl. alt)', ...d.bidders.map(b=>Math.round(bidderTotals(d,b).priced)), '']);
  return [header, ...rows];
}
function adjustedAOA(d){
  const aw = awardCalc(d);
  const header = ['Bidder','Headline','Gap fill','Carve-out fill','Adjusted','Delta vs headline','Scope complete %','Recommended'];
  const rows = [...aw.rows].sort((x,y)=>x.t.adjusted-y.t.adjusted).map(({b,t})=>[
    b.name, Math.round(t.priced), Math.round(t.gapFill), Math.round(t.exclFill), Math.round(t.adjusted),
    Math.round(t.adjusted-t.priced), Math.round(t.complete*100), b.id===aw.rec.b.id ? 'YES' : ''
  ]);
  return [header, ...rows];
}
function loadsAOA(d){
  const header = ['Load', ...d.bidders.map(b=>b.name), 'Median %'];
  const rows = d.loads.map(load=>{
    const med = median(d.bidders.map(b=>b.loadPct[load.id]).filter(v=>isFinite(v)));
    return [load.label, ...d.bidders.map(b=>{ const v=b.loadPct[load.id]; return isFinite(v)?v:''; }), med!=null?med:''];
  });
  return [header, ...rows];
}
function clarAOA(d){
  const out = [['Bidder','#','Clarification']];
  clarifications(d).forEach(g=>{ if(!g.items.length) out.push([g.b.name,'','(no flags)']); else g.items.forEach((it,i)=>out.push([g.b.name, i+1, it])); });
  return out;
}
function qtyAOA(d){
  const withUnit = d.scope.filter(row=>rowQtyAnalysis(d,row).entries.length>=1);
  if(!withUnit.length) return [['(no unit-priced lines)']];
  const header = ['Scope line', ...d.bidders.map(b=>b.name+' qty'), 'Median qty', 'Flag'];
  const rows = withUnit.map(row=>{
    const q = rowQtyAnalysis(d,row);
    const cells = d.bidders.map(b=>{ const qf=q.byId[b.id]; return qf ? qf.qty : ''; });
    const flag = q.unitMismatch ? 'UNIT MISMATCH' : (Object.values(q.byId).some(e=>e.flag) ? 'QTY DIVERGENCE' : '');
    return [row.label, ...cells, q.medianQty!=null?q.medianQty:'', flag];
  });
  return [header, ...rows];
}
function benchmarkAOA(d){
  const matched = d.scope.map(row=>({ row, bm:rowBenchmark(d,row) })).filter(x=>x.bm);
  if(!matched.length) return [['(no benchmarks matched this scope)']];
  const header = ['Scope line','Basis','Low','Target','High', ...d.bidders.map(b=>b.name), 'Median','Field'];
  const rows = matched.map(({row,bm})=>{
    const cells = d.bidders.map(b=>{ const v=bm.byId[b.id]; return v ? Number(v.value.toFixed(2)) : ''; });
    return [row.label, bm.basis, isFinite(bm.low)?bm.low:'', isFinite(bm.target)?bm.target:'', isFinite(bm.high)?bm.high:'', ...cells, bm.median!=null?Number(bm.median.toFixed(2)):'', bm.medianStatus||''];
  });
  return [header, ...rows];
}
function buyoutAOA(d){
  if(!d.bidders.length) return [['(no bidders)']];
  const ba = buyoutAnalysis(d,{ excludeLowOutliers:d.buyoutExclLows!==false });
  const nameById = {}; d.bidders.forEach(b=>nameById[b.id]=b.name);
  const header = ['Scope line','Buyout winner','Winning price','# bidders','Note'];
  const rows = ba.lines.map(L=>{
    const w = L.winner;
    const note = !w ? (L.fillBasis!=null?'no bidder priced \u2014 filled at peer basis':'no bidder priced \u2014 must solicit')
                    : (L.naive && L.naive.bidderId!==w.bidderId ? 'naive low '+nameById[L.naive.bidderId]+' excluded (likely gap)' : '');
    return [L.row.label, w?nameById[w.bidderId]:'', w?Math.round(w.amount):(L.fillBasis!=null?Math.round(L.fillBasis):''), L.count, note];
  });
  rows.push(['BUYOUT TOTAL (credible)','',Math.round(ba.credibleTotal),'','across '+ba.subsUsed.length+' subs']);
  return [header, ...rows];
}
function aoaToCsv(aoa){
  return aoa.map(row=>row.map(cell=>{
    const s = cell==null ? '' : String(cell);
    return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
}
function exportCsv(d){

  const all = [

    ...sec('General-conditions loads (%)', loadsAOA(d)),

function parseBidText(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    // unit pattern: "<desc> <qty> <uom?> @ $<unit>"  (requires explicit @)
    const um = line.match(/^(.*?)(?:\s|\t)+([\d,]+(?:\.\d+)?)\s*(ea|lf|sf|sy|cy|cf|ls|hr|lot|each|gal|ton|mbf)?\s*@\s*\$?\s*([\d,]+(?:\.\d+)?)\b/i);
    if(um){
      const qty=pmoney(um[2]), uom=(um[3]||'').toUpperCase(), unit=pmoney(um[4]);
      const desc=(um[1]||'').replace(/[.:|\-\s]+$/,'').trim()||'(no description)';
      const amount=(isFinite(qty)&&isFinite(unit))?qty*unit:NaN;
      return { id:uid(), desc, amount, kind:lineKind(desc), altIn:false, qty, unitPrice:unit, uom };
    }
    const m = line.match(/^(.*?)[\s.:|\-]*\$?\s*([\d,]+(?:\.\d+)?)\s*$/);
    const desc = (m && m[2]) ? ((m[1]||'').replace(/[.:|\-\s]+$/,'').trim() || '(no description)') : line;
    const amount = (m && m[2]) ? pmoney(m[2]) : NaN;
    return { id:uid(), desc, amount, kind: lineKind(desc), altIn:false, qty:NaN, unitPrice:NaN, uom:'' };
  });
}

/* ---------- PDF intake (pdf.js, lazy CDN load; graceful fallback to paste) ---------- */
let _pdfPromise = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfPromise) return _pdfPromise;
  _pdfPromise = new Promise((res,rej)=>{
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    const s = document.createElement('script'); s.src = base + 'pdf.min.js';
    s.onload = ()=>{ try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; res(window.pdfjsLib); } catch(e){ rej(e); } };
    s.onerror = ()=>{ _pdfPromise = null; rej(new Error('pdf.js unavailable (offline or blocked)')); };
    document.head.appendChild(s);
  });
  return _pdfPromise;
}
function itemsToLines(items, yTol){
  yTol = yTol==null ? 3 : yTol;
  const rows = items.map(it=>({ str: it.str, x: it.transform[4], y: it.transform[5] }))
                    .filter(r=>r.str && r.str.trim()!=='');
  rows.sort((a,b)=> (b.y - a.y) || (a.x - b.x));   // top-to-bottom, then left-to-right
  const lines = []; let cur = null;
  rows.forEach(r=>{
    if(!cur || Math.abs(r.y - cur.y) > yTol){ cur = { y:r.y, parts:[] }; lines.push(cur); }
    cur.parts.push(r);
  });
  return lines.map(l => l.parts.sort((a,b)=>a.x-b.x).map(p=>p.str).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean);
}
async function extractPdfText(buf){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: buf }).promise;
  let out = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    out = out.concat(itemsToLines(content.items));
  }
  return out.join('\n');
}
async function handlePdf(b, file, status){
  status.textContent = 'Reading ' + file.name + '\u2026';
  try {
    const buf = await file.arrayBuffer();
    const text = await extractPdfText(buf);
    const parsed = parseBidText(text);
    if(!parsed.length){ status.textContent = 'No priced lines found in ' + file.name + ' (scanned PDF needs OCR \u2014 try paste).'; return; }
    b.raw = b.raw.concat(parsed); save(); render();
  } catch(err){
    status.textContent = 'PDF read failed: ' + ((err && err.message) || err) + '. Use the paste box instead.';
  }
}
/* ---------- cross-deal mapping memory (label-keyed; survives across deals) ---------- */
function ensureMemory(){ if(!DB.memory || typeof DB.memory!=='object') DB.memory={bySub:{},global:{}}; if(!DB.memory.bySub) DB.memory.bySub={}; if(!DB.memory.global) DB.memory.global={}; }
function ensureBenchmarks(){ if(!Array.isArray(DB.benchmarks)) DB.benchmarks=[]; }
function memKeyDesc(desc){ return norm(desc).join(' '); }
function memKeySub(name){ return String(name||'').trim().toLowerCase(); }
function memCount(){ ensureMemory(); return Object.keys(DB.memory.global).length; }
function memBump(store, key, label){
  const e = store[key] || { counts:{}, ts:0 };
  e.counts[label] = (e.counts[label]||0) + 1; e.ts = Date.now();
  store[key] = e;
}
function memArgmax(counts){
  let best=null, bn=-1;
  for(const k in counts){ if(counts[k] > bn){ bn=counts[k]; best=k; } }   // ties resolve to first-inserted (stable)
  return best;
}
function memRecord(subName, desc, label){
  ensureMemory();
  const dk = memKeyDesc(desc); if(!dk || !label) return;
  memBump(DB.memory.global, dk, label);
  const sk = memKeySub(subName);
  if(sk) memBump(DB.memory.bySub, sk+'\u0001'+dk, label);
  save();
}
function memLookup(subName, desc){
  ensureMemory();
  const dk = memKeyDesc(desc); if(!dk) return null;
  const sk = memKeySub(subName);
  if(sk){ const s=DB.memory.bySub[sk+'\u0001'+dk]; if(s){ const l=memArgmax(s.counts); if(l) return l; } }   // per-sub wins
  const g = DB.memory.global[dk]; return g ? memArgmax(g.counts) : null;
}
function memHitRow(d, subName, desc){
  if(DB.useMemory===false) return null;
  const label = memLookup(subName, desc); if(!label) return null;
  const row = d.scope.find(s=>s.label===label);   // only apply if the label exists in THIS scope
  return row ? row.id : null;
}
function rememberDealMappings(d){
  let n=0;
  d.bidders.forEach(b=>b.raw.forEach(r=>{
    const id=b.map[r.id];
    if(id && id!=='UNMAPPED'){ const row=d.scope.find(s=>s.id===id); if(row){ memRecord(b.name, r.desc, row.label); n++; } }
  }));
  return n;
}
function autoMap(d){
  d.bidders.forEach(b=>b.raw.forEach(r=>{
    const cur = b.map[r.id];
    if(!cur || cur==='UNMAPPED'){
      const mem = memHitRow(d, b.name, r.desc);
      if(mem){ b.map[r.id] = mem; return; }          // remembered mapping first
      const bm = d.scope.length ? bestMatch(r.desc, d.scope) : null;
      b.map[r.id] = bm ? bm.id : 'UNMAPPED';
    }
  }));
  save();
}
function applyTemplate(d, name){
  const hasMaps = d.bidders.some(b=>Object.values(b.map).some(v=>v && v!=='UNMAPPED'));
  if(hasMaps && !confirm('Loading a template replaces the current scope and clears existing mappings. Continue?')) return false;
  d.trade = name; d.scope = templateRows(name);
  d.bidders.forEach(b=>{ b.map={}; b.rowStatus={}; b.split={}; });
  save(); return true;
}
function generateUnion(d){
  const hasMaps = d.bidders.some(b=>Object.values(b.map).some(v=>v && v!=='UNMAPPED'));
  if(hasMaps && !confirm('Generating scope from bids replaces the current scope and clears existing mappings. Continue?')) return;
  d.scope = clusterUnion(d);
  d.bidders.forEach(b=>{ b.map={}; b.rowStatus={}; b.split={}; });
  autoMap(d); save();
}
function deleteScopeRow(d, rowId){
  d.scope = d.scope.filter(s=>s.id!==rowId);

    Object.keys(b.map).forEach(k=>{ if(b.map[k]===rowId) b.map[k]='UNMAPPED'; });
    if(b.rowStatus) delete b.rowStatus[rowId];
    if(b.split) Object.keys(b.split).forEach(rid=>{ b.split[rid] = b.split[rid].filter(a=>a.rowId!==rowId); });
  });
  save();
}
function toggleCell(b, rowId){
  const c = cellFor(b, rowId);
  if(c.status==='INC') return;
  b.rowStatus[rowId] = c.status==='GAP' ? 'EXCL' : 'GAP';
  save(); render();
}

/* ---------- render ---------- */
let TAB = 'ingest';
const TABS = [['ingest','Ingest'],['normalize','Normalize'],['level','Level'],['award','Award'],['buyout','Buyout'],['clarify','Clarify'],['rebid','Re-bid'],['bench','Bench'],['rollup','Rollup']];

function render(){
  loadHeader();
  loadTabs();
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  const d = activeDeal();
  if(!d){ panel.appendChild(h('div',{class:'empty'},'No deal. Create one to begin.')); return; }
  if(TAB==='ingest') panel.appendChild(renderIngest(d));
  else if(TAB==='normalize') panel.appendChild(renderNormalize(d));
  else if(TAB==='level') panel.appendChild(renderLevel(d));
  else if(TAB==='award') panel.appendChild(renderAward(d));
  else if(TAB==='buyout') panel.appendChild(renderBuyout(d));
  else if(TAB==='clarify') panel.appendChild(renderClarify(d));
  else if(TAB==='rebid') panel.appendChild(renderRebid(d));
  else if(TAB==='bench') panel.appendChild(renderBench(d));
  else panel.appendChild(renderRollup(d));
  loadFoot(d);
}

function loadHeader(){

  host.innerHTML = '';
  const proj = activeProject();
  const projSel = h('select',{ title:'Project', onchange:e=>{ const list=packagesIn(e.target.value); if(list.length){ DB.active=list[0].id; save(); render(); } } });
  projectsList().forEach(p=>{ const o=h('option',{value:p}, p); if(p===proj) o.selected=true; projSel.appendChild(o); });
  const noneOpt = h('option',{value:''},'(no project)'); if(proj==='') noneOpt.selected=true; projSel.appendChild(noneOpt);

function loadTabs(){
  const host = document.getElementById('tabs');
  host.innerHTML = '';
  TABS.forEach(([id,label])=>{
    host.appendChild(h('button',{ class: id===TAB?'on':'', onclick:()=>{ TAB=id; render(); } }, label));

}
function loadFoot(d){
  const f = document.getElementById('foot');

  f.textContent = (stored ? 'Autosaved locally. ' : 'In-memory only (storage blocked in this preview \u2014 use Export to keep work, or deploy the file). ')

/* ----- Normalize ----- */
function splitEditor(d, b, r){
  if(!b.split) b.split={};
  const sp = b.split[r.id] || (b.split[r.id]=[]);
  const allocated = sp.reduce((s,a)=>s+(isFinite(a.amount)?a.amount:0),0);
  const lineAmt = isFinite(r.amount) ? r.amount : null;
  const delta = lineAmt!=null ? lineAmt-allocated : null;
  const wrap = h('div',{class:'splitbox'});
  sp.forEach((a,idx)=>{
    const sel = h('select',{ style:'width:150px', onchange:e=>{ a.rowId=e.target.value; save(); } });
    d.scope.forEach(s=>{ const o=h('option',{value:s.id}, s.label); if(a.rowId===s.id) o.selected=true; sel.appendChild(o); });
    wrap.appendChild(h('div',{class:'row', style:'gap:4px; margin-bottom:3px'},
      sel,
      h('input',{ class:'amt', style:'width:82px', value:isFinite(a.amount)?a.amount:'', placeholder:'$',
        oninput:e=>{ a.amount = e.target.value.trim()===''?NaN:pmoney(e.target.value); save(); } }),
      h('button',{ class:'x', title:'remove allocation', onclick:()=>{ b.split[r.id]=sp.filter((_,i)=>i!==idx); save(); render(); } },'\u00d7')
    ));
  });
  wrap.appendChild(h('div',{class:'row small', style:'gap:8px; align-items:center; margin-top:2px'},
    h('button',{ class:'x', onclick:()=>{ sp.push({ rowId:(d.scope[0]&&d.scope[0].id)||'', amount:(delta&&delta>0)?delta:NaN }); save(); render(); } },'+ row'),
    h('span',{class:'mut'}, 'allocated '+money(allocated)+(lineAmt!=null?(' / '+money(lineAmt)):'')),
    (delta!=null && Math.abs(delta)>=1) ? h('span',{class:'tag bad'}, (delta>0?'under ':'over ')+money(Math.abs(delta))) : (lineAmt!=null?h('span',{class:'tag'},'balanced'):null),
    h('button',{ class:'x', title:'merge back to a single mapping', onclick:()=>{ const first=sp[0] && sp[0].rowId; delete b.split[r.id]; b.map[r.id]=first||'UNMAPPED'; save(); render(); } },'merge')
  ));
  return wrap;
}
function renderNormalize(d){
  const wrap = h('div',{});
  const ctl = h('div',{class:'card'});
  ctl.appendChild(h('h3',{},'Normalized scope source'));
  const seg = h('div',{class:'seg'},
    h('button',{ class: d.scopeMode==='template'?'on':'', onclick:()=>{ d.scopeMode='template'; save(); render(); } },'Template'),
    h('button',{ class: d.scopeMode==='union'?'on':'', onclick:()=>{ d.scopeMode='union'; save(); render(); } },'Union of bids')
  );
  const ctlRow = h('div',{class:'row mb'}, seg);
  if(d.scopeMode==='template'){
    const tsel = h('select',{ onchange:e=>{ applyTemplate(d, e.target.value); render(); } });
    templateNames().forEach(n=>{ const o=h('option',{value:n}, n); if(n===d.trade) o.selected=true; tsel.appendChild(o); });
    ctlRow.appendChild(h('span',{class:'small mut'},'trade'));
    ctlRow.appendChild(tsel);
    ctlRow.appendChild(h('button',{ onclick:()=>{ if(applyTemplate(d, d.trade)) render(); } },'Reload template'));
    ctlRow.appendChild(h('button',{ onclick:()=>{ const n=prompt('Save current scope as template named:'); if(n){ DB.templates[n]=d.scope.map(s=>s.label); save(); alert('Saved template "'+n+'".'); render(); } } },'Save as template'));
  } else {
    ctlRow.appendChild(h('button',{ onclick:()=>{ generateUnion(d); render(); } },'Generate scope from bids'));
    ctlRow.appendChild(h('span',{class:'small mut'},'fuzzy-clusters every bidder line into suggested rows'));
  }
  ctl.appendChild(ctlRow);

  const stbl = h('table',{class:'lines'});
  stbl.appendChild(h('tr',{}, h('th',{},'Normalized scope line'), h('th',{style:'width:34px'},'')));
  d.scope.forEach(s=>{
    stbl.appendChild(h('tr',{},
      h('td',{}, h('input',{ class:'label', value:s.label, oninput:e=>{ s.label=e.target.value; save(); } })),
      h('td',{}, h('button',{ class:'x', onclick:()=>{ deleteScopeRow(d, s.id); render(); } },'\u00d7'))
    ));
  });
  ctl.appendChild(stbl);
  ctl.appendChild(h('div',{class:'row mt'},
    h('button',{ onclick:()=>{ const n=prompt('New scope line:'); if(n){ d.scope.push({id:uid(),label:n}); save(); render(); } } },'+ Scope line'),
    h('button',{ onclick:()=>{ autoMap(d); render(); } },'Re-run auto-map'),
    h('span',{class:'small mut'},'auto-map fills each raw line with its best match; you vet')
  ));
  ctl.appendChild(h('div',{class:'row mt', style:'border-top:1px solid var(--line); padding-top:10px; margin-top:12px'},
    h('span',{class:'small mut'},'Mapping memory'),
    h('div',{class:'seg'},
      h('button',{ class:DB.useMemory?'on':'', onclick:()=>{ DB.useMemory=true; save(); render(); } },'On'),
      h('button',{ class:!DB.useMemory?'on':'', onclick:()=>{ DB.useMemory=false; save(); render(); } },'Off')
    ),
    h('button',{ onclick:()=>{ const n=rememberDealMappings(d); alert('Remembered '+n+' mapping(s) for future deals.'); render(); } },'Remember these'),
    h('span',{class:'small mut'}, memCount()+' learned'),
    h('button',{ onclick:()=>{ if(confirm('Clear all remembered mappings across deals?')){ DB.memory={bySub:{},global:{}}; save(); render(); } } },'Clear')
  ));
  wrap.appendChild(ctl);

  if(!d.scope.length){ wrap.appendChild(h('div',{class:'empty'},'No scope lines. Load a template or generate from bids.')); return wrap; }
  if(!d.bidders.length){ wrap.appendChild(h('div',{class:'empty'},'No bidders to map. Add bids in Ingest.')); return wrap; }
  autoMap(d);

  d.bidders.forEach(b=>{
    const card = h('div',{class:'card'});
    const mapped = b.raw.filter(r=>b.map[r.id] && b.map[r.id]!=='UNMAPPED').length;
    card.appendChild(h('h3',{}, b.name, h('span',{class:'small mut'}, mapped+' / '+b.raw.length+' mapped')));
    if(!b.raw.length){ card.appendChild(h('div',{class:'small mut'},'No line items.')); wrap.appendChild(card); return; }

    const rows = b.raw.map(r=>{
      const cur = b.map[r.id];
      if(cur==='SPLIT') return { r, sc:1, mem:false, split:true };
      const memId = memHitRow(d, b.name, r.desc);
      const mem = !!(memId && cur===memId);
      let sc;
      if(mem) sc = 1;
      else if(cur && cur!=='UNMAPPED' && d.scope.length){ const row=d.scope.find(s=>s.id===cur); sc = row ? score(r.desc, row.label) : 0; }
      else sc = d.scope.length ? (bestMatch(r.desc,d.scope)||{score:0}).score : 0;
      return { r, sc, mem, split:false };
    }).sort((a,b)=>a.sc-b.sc);

    const tbl = h('table',{class:'lines'});
    tbl.appendChild(h('tr',{},
      h('th',{},'Raw line'),
      h('th',{class:'num',style:'width:96px'},'Amount'),
      h('th',{style:'width:64px'},'Type'),
      h('th',{style:'width:240px'},'Maps to'),
      h('th',{style:'width:70px'},'Match')
    ));
    rows.forEach(({r,sc,mem,split})=>{
      const k = r.kind||'base';
      let mapsCell, matchCell;
      if(split){
        mapsCell = h('td',{}, splitEditor(d,b,r));
        matchCell = h('td',{class:'scorecell'}, h('span',{class:'tag', title:'split across multiple scope rows'},'split'));
      } else {
        const sel = h('select',{ style:'width:200px', onchange:e=>{ const v=e.target.value; b.map[r.id]=v; if(v!=='UNMAPPED'){ const row=d.scope.find(s=>s.id===v); if(row) memRecord(b.name, r.desc, row.label); } save(); } });
        sel.appendChild(h('option',{ value:'UNMAPPED' }, '\u2014 unmapped'));
        d.scope.forEach(s=>{ const o=h('option',{value:s.id}, s.label); if(b.map[r.id]===s.id) o.selected=true; sel.appendChild(o); });
        const low = sc < 0.5;
        mapsCell = h('td',{}, sel,
          h('button',{ class:'x', style:'margin-left:4px', title:'Promote to new scope line',
            onclick:()=>{ const n=prompt('New scope line from this:', r.desc); if(n){ const id=uid(); d.scope.push({id,label:n}); b.map[r.id]=id; memRecord(b.name, r.desc, n); save(); render(); } } },'+'),
          h('button',{ class:'x', style:'margin-left:4px', title:'Split this line across multiple scope rows',
            onclick:()=>{ if(!b.split) b.split={}; const cur=b.map[r.id]; b.split[r.id]=[{ rowId:(cur && cur!=='UNMAPPED' && cur!=='SPLIT')?cur:((d.scope[0]&&d.scope[0].id)||''), amount:isFinite(r.amount)?r.amount:NaN }]; b.map[r.id]='SPLIT'; save(); render(); } },'split')
        );
        matchCell = h('td',{class:'scorecell'}, mem ? h('span',{class:'tag', title:'auto-mapped from memory'},'mem') : [ (sc*100).toFixed(0)+'%', low?h('span',{class:'q', title:'low confidence'},' ?'):null ]);
      }
      tbl.appendChild(h('tr',{},
        h('td',{}, r.desc || h('span',{class:'mut'},'(no description)')),
        h('td',{class:'num'}, isFinite(r.amount)?money(r.amount):h('span',{class:'tag'},'no price')),
        h('td',{}, k==='base'?h('span',{class:'mut small'},'base'):h('span',{class:'tag'+(k==='alt'&&!r.altIn?'':' bad')}, k==='alt'?(r.altIn?'alt in':'alt out'):'allow')),
        mapsCell,
        matchCell
      ));
    });
    card.appendChild(tbl);
    wrap.appendChild(card);
  });
  return wrap;
}

  tbl.appendChild(head);

  d.scope.forEach(row=>{
    const a = rowAnalysis(d,row);
    const qa = rowQtyAnalysis(d,row);
    const tr = h('tr',{}, h('td',{class:'rowhead'}, row.label));
    d.bidders.forEach(b=>{
      const c = a.byId[b.id];
      if(c.status==='INC'){
        const out = c.flagged;
        const qf = qa.byId[b.id];
        const qAnn = (qf && qf.flag) ? h('span',{class:'ann', title:'quantity differs from peers'}, '\u2195 '+qf.qty+(qf.uom?(' '+qf.uom):'')+' '+(qf.pct>0?'+':'')+Math.round(qf.pct*100)+'%')
                   : (qa.unitMismatch && qf) ? h('span',{class:'ann', title:'unit-of-measure mismatch'}, '\u26a0 '+(qf.uom||'?'))
                   : null;
        tr.appendChild(h('td',{ class:'cell inc'+((out || (qf&&qf.flag))?' out':'') },
          money(c.amount),
          out ? h('span',{class:'ann'}, (c.dir==='low'?'\u25bc ':'\u25b2 ') + (c.pct>0?'+':'') + Math.round(c.pct*100)+'%') : null,
          qAnn
        ));
      } else if(c.status==='EXCL'){
        tr.appendChild(h('td',{ class:'cell excl', title:'Disclosed carve-out \u2014 click to mark as silent gap', onclick:()=>toggleCell(b,row.id) }, 'EXCL'));
      } else {
        tr.appendChild(h('td',{ class:'cell gap', title:'Silent omission \u2014 click to mark as disclosed exclusion', onclick:()=>toggleCell(b,row.id) }, 'GAP'));
      }
    });
    const bm = rowBenchmark(d,row);
    tr.appendChild(h('td',{class:'med'}, a.median!=null?money(a.median):'\u2014',
      a.insufficient ? h('span',{class:'ann mut'},'n<3') : null,
      (bm && bm.medianStatus && bm.medianStatus!=='ok') ? h('span',{class:'ann', title:'whole field is outside the stored benchmark band'}, 'bench '+(bm.medianStatus==='over'?'\u25b2':'\u25bc')) : null));
    tbl.appendChild(tr);
  });

  const tot = h('tr',{class:'totrow'}, h('td',{class:'rowhead'},'Priced (base + incl. alt)'));
  d.bidders.forEach(b=>tot.appendChild(h('td',{class:'cell'}, money(bidderTotals(d,b).priced))));
  tot.appendChild(h('td',{class:'med'}));
  tbl.appendChild(tot);

  box.appendChild(tbl);
  wrap.appendChild(box);
  const qp = renderQtyPanel(d);
  if(qp) wrap.appendChild(qp);
  return wrap;
}

  const single = awardCalc(d), singleTotal = single ? single.rec.t.adjusted : null;

  const nameById = {}; d.bidders.forEach(b=>nameById[b.id]=b.name);

  wrap.appendChild(h('div',{class:'between mb'},

    tbl.appendChild(h('tr',{},

  card.appendChild(h('div',{class:'banner', style:'border-width:1px; margin-bottom:10px'}, h('b',{}, v.verdict)));

  v.ranked.forEach(r=>{ tbl.appendChild(h('tr',{ style:r.id===v.top.id?'font-weight:700':'' }, h('td',{}, r.name), h('td',{class:'num'}, Math.round(r.p*100)+'%'), h('td',{class:'num'}, money(r.det)))); });
  card.appendChild(tbl);
  if(!res.deterministic) card.appendChild(h('div',{class:'small mut', style:'margin-top:8px'},
    'Each missing / carved-out line is resampled ~ Normal(peer ' + (d.fillMethod||'median-ex') + ' basis, peer spread via MAD\u00d71.48), with a 10% minimum spread, clamped \u2265 0. Priced lines are held fixed. Seeded \u2014 reproducible.'));
  return card;
}
function pvMC(d){
  const res = monteCarlo(d, 10000); if(!res) return null;
  const v = mcVerdict(res);
  const wrap = h('div',{});
  wrap.appendChild(h('div',{ style:'margin-bottom:4px' }, v.verdict));
  const tbl = h('table',{class:'pv-tbl'});
  tbl.appendChild(h('tr',{}, h('th',{},'Bidder'), h('th',{class:'num'},'P(lowest)'), h('th',{class:'num'},'Adjusted')));
  v.ranked.forEach(r=>tbl.appendChild(h('tr',{}, h('td',{}, r.name), h('td',{class:'num'}, Math.round(r.p*100)+'%'), h('td',{class:'num'}, money(r.det)))));
  wrap.appendChild(tbl);
  return wrap;
}
function renderAllowances(d){
  const withAllow = d.bidders.filter(b=>allowLines(b).length);
  if(!withAllow.length) return null;
  const card = h('div',{class:'card'});
  card.appendChild(h('h3',{},'Allowances', h('span',{class:'small mut'},'carried separately \u2014 excluded from base & adjusted totals')));
  const tbl = h('table',{});
  tbl.appendChild(h('tr',{}, h('th',{},'Bidder'), h('th',{},'Allowance items'), h('th',{class:'num'},'Total')));
  withAllow.forEach(b=>{
    const items = allowLines(b).map(r=> (r.desc||'allowance') + ' ' + (isFinite(r.amount)?money(r.amount):'\u2014')).join('; ');
    tbl.appendChild(h('tr',{},
      h('td',{}, b.name),
      h('td',{class:'small'}, items),
      h('td',{class:'num'}, money(allowTotal(b)))
    ));
  });
  card.appendChild(tbl);
  return card;
}

function renderLoads(d){
  const card = h('div',{class:'card'});
  card.appendChild(h('h3',{},'General-conditions loads (%)', h('span',{class:'small mut'},'leveled as % \u2014 not comparable per-line')));
  if(!d.bidders.length){ card.appendChild(h('div',{class:'small mut'},'No bidders.')); return card; }

  const tbl = h('table',{});
  const head = h('tr',{}, h('th',{},'Load'));
  d.bidders.forEach(b=>head.appendChild(h('th',{class:'num'}, b.name)));
  head.appendChild(h('th',{class:'num'},'Median'));
  head.appendChild(h('th',{style:'width:30px'},''));
  tbl.appendChild(head);

  d.loads.forEach(load=>{
    const vals = d.bidders.map(b=>{ const v=b.loadPct[load.id]; return isFinite(v)?v:null; }).filter(v=>v!=null);
    const med = median(vals);
    const tr = h('tr',{}, h('td',{}, h('input',{ class:'label', value:load.label, oninput:e=>{ load.label=e.target.value; save(); } })));
    d.bidders.forEach(b=>{
      const v = b.loadPct[load.id];
      const flagged = isFinite(v) && med!=null && med!==0 && Math.abs((v-med)/med) > 0.25;
      tr.appendChild(h('td',{class:'num'},
        h('input',{ class:'pct', value:isFinite(v)?v:'', placeholder:'\u2014',
          oninput:e=>{ b.loadPct[load.id] = e.target.value.trim()===''?NaN:parseFloat(e.target.value); save(); } }),
        flagged ? h('span',{class:'ann'}, (v>med?'\u25b2':'\u25bc')) : null
      ));
    });
    tr.appendChild(h('td',{class:'med'}, med!=null?med+'%':'\u2014'));
    tr.appendChild(h('td',{}, h('button',{ class:'x', onclick:()=>{ d.loads=d.loads.filter(l=>l.id!==load.id); save(); render(); } },'\u00d7')));
    tbl.appendChild(tr);
  });
  card.appendChild(tbl);
  card.appendChild(h('div',{class:'row mt'},
    h('button',{ onclick:()=>{ const n=prompt('Load name:'); if(n){ d.loads.push({id:uid(),label:n}); save(); render(); } } },'+ Load')));
  return card;
}

/* ----- Clarify ----- */
function renderClarify(d){
  const wrap = h('div',{});
  if(!d.bidders.length){ wrap.appendChild(h('div',{class:'empty'},'No bidders.')); return wrap; }
  const groups = clarifications(d);
  const totalItems = groups.reduce((s,g)=>s+g.items.length,0);

  wrap.appendChild(h('div',{class:'between mb'},
    h('div',{class:'small mut',style:'max-width:660px'},'Generated from silent gaps, low/high outliers, and tie-out mismatches. These are the questions to put to each sub before award \u2014 where the fix is cheap.'),
    h('button',{ onclick:e=>copyText(clarText(d.name, groups), e.target), disabled: totalItems? null : true }, 'Copy all')
  ));

  if(!totalItems){ wrap.appendChild(h('div',{class:'empty'},'No flags. Every bid is scope-complete, consistent, and ties out.')); return wrap; }

  groups.forEach(g=>{
    const card = h('div',{class:'card clar'});
    card.appendChild(h('h3',{}, g.b.name,
      g.items.length ? h('button',{ onclick:e=>copyText(clarText(d.name, [g]), e.target) },'Copy') : h('span',{class:'small mut'},'clear')
    ));
    if(!g.items.length){ card.appendChild(h('div',{class:'small mut'},'No flags \u2014 scope-complete, consistent, ties out.')); }
    else { const ol=h('ol',{}); g.items.forEach(it=>ol.appendChild(h('li',{}, it))); card.appendChild(ol); }
    wrap.appendChild(card);
  });
  return wrap;
}

/* ---------- init ---------- */
document.getElementById('importer').addEventListener('change', e=>{ if(e.target.files[0]) importDealFile(e.target.files[0]); e.target.value=''; });
loadDB();
if(!DB.active || !DB.deals[DB.active]){
  const keys = Object.keys(DB.deals);
  if(keys.length) DB.active = keys[0]; else newDeal('Untitled deal');
}
render();
</script>
