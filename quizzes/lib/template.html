<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("apah.theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon">
<link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180">
<link rel="preload" href="/study/ap/ap-art-history/fonts/LM-regular.woff2" as="font" type="font/woff2" crossorigin>
{{KATEX_CSS}}
<style>
@font-face{font-family:"Latin Modern";font-style:normal;font-weight:400;font-display:swap;src:url("/study/ap/ap-art-history/fonts/LM-regular.woff2") format("woff2")}
@font-face{font-family:"Latin Modern";font-style:italic;font-weight:400;font-display:swap;src:url("/study/ap/ap-art-history/fonts/LM-italic.woff2") format("woff2")}
@font-face{font-family:"Latin Modern";font-style:normal;font-weight:600 700;font-display:swap;src:url("/study/ap/ap-art-history/fonts/LM-bold.woff2") format("woff2")}
@font-face{font-family:"Latin Modern";font-style:italic;font-weight:600 700;font-display:swap;src:url("/study/ap/ap-art-history/fonts/LM-bold-italic.woff2") format("woff2")}
@font-face{font-family:"Latin Modern Mono";font-style:normal;font-weight:400 500;font-display:swap;src:url("/study/ap/ap-art-history/fonts/LM-mono.woff2") format("woff2")}
@font-face{font-family:"Latin Modern Mono";font-style:normal;font-weight:600 700;font-display:swap;src:url("/study/ap/ap-art-history/fonts/LM-mono-bold.woff2") format("woff2")}

:root{--bg:#fff;--fg:#000;--muted:#4a4a4a;--line:#c9c9c9;--plate:#f5f5f3;--link:#00008b;--ok:#1d5e20;--bad:#9b1c1c;
  --serif:"Latin Modern","Computer Modern Serif","CMU Serif",Georgia,serif;--mono:"Latin Modern Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,40px);color-scheme:light}
:root[data-theme=dark]{--bg:#111110;--fg:#ecebe6;--muted:#a3a29c;--line:#34342f;--plate:#1b1b19;--link:#9db4ff;--ok:#8fd394;--bad:#ff9b9b;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:17px;line-height:1.5;font-kerning:normal;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:.5px}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}
.sc{font-variant:small-caps;text-transform:lowercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.katex{font-size:1.04em;text-rendering:auto}
.katex-display{margin:.7em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}

.runhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;max-width:1480px;margin:0 auto;padding:14px var(--gutter) 6px;font-size:14px;font-style:italic;color:var(--muted)}
.runhead a{text-decoration:none}
.runhead a:hover{text-decoration:underline}
.runhead-actions{display:flex;flex-wrap:wrap;gap:4px 18px}
.theme-btn{background:none;border:0;padding:0;font:inherit;font-style:italic;color:var(--link)}
.theme-btn:hover{text-decoration:underline}
.rule{max-width:1480px;margin:0 auto;padding-inline:var(--gutter)}
.rule hr{margin:0;border:0;border-top:.5px solid var(--fg)}

.wrap{max-width:860px;margin:0 auto;padding:0 var(--gutter) 80px}
.title{text-align:center;padding:34px 0 22px}
.title h1{margin:0;text-wrap:balance;font-size:clamp(32px,6vw,46px);line-height:1.1;font-weight:700}
.title .sub{margin:8px 0 0;font-size:18px;font-variant:small-caps;letter-spacing:.03em}
.title .meta{margin:4px 0 0;font-style:italic;color:var(--muted)}

.tabs{display:flex;justify-content:center;gap:0;margin:0 0 26px;border-bottom:.5px solid var(--fg)}
.tab{background:none;border:0;border-bottom:2.5px solid transparent;padding:8px 18px;margin-bottom:-1px;font-size:17px;color:var(--muted)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--fg);font-weight:700}
.tab:hover{color:var(--fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--fg);background:var(--bg);font-family:var(--mono);font-size:14.5px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--plate)}
.btn:disabled{opacity:.35}
.btn--solid{background:var(--fg);color:var(--bg)}
.btn--solid:hover:not(:disabled){background:var(--fg);opacity:.85}
.btn--lg{min-height:48px;font-size:15.5px;padding:0 22px}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border:1px solid currentColor;font-family:var(--mono);font-size:12px;opacity:.8}

/* booktabs tables */
.bt{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}
.bt th,.bt td{padding:4px 12px;text-align:center;font-weight:400}
.bt th[scope=row],.bt thead th:first-child{text-align:left}
.bt thead tr{border-top:1px solid var(--fg);border-bottom:.5px solid var(--fg)}
.bt tbody tr:last-child{border-bottom:1px solid var(--fg)}
.bt-wrap{overflow-x:auto;margin:0 0 16px}

/* setup */
.setup{border-bottom:1.5px solid var(--fg);padding:4px 0 22px;display:grid;gap:18px}
.setup h2,.results h2,.fr h2{margin:0;font-size:20px}
.choice-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:1px solid var(--fg);background:var(--bg);text-align:left}
.choice b{font-size:17px}
.choice span{font-size:14.5px;font-style:italic;color:var(--muted)}
.choice[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.choice[aria-pressed=true] span{color:var(--bg);opacity:.8}
.checks{display:flex;flex-wrap:wrap;gap:8px 22px}
.checks label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.checks input{width:17px;height:17px;margin:0;accent-color:var(--fg)}
.setup-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{margin:0;font-size:15px;color:var(--muted);font-style:italic}

/* run */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;font-size:15px;color:var(--muted)}
.track{height:3px;background:var(--line);margin:8px 0 14px}
.track span{display:block;height:100%;background:var(--fg);transition:width .2s ease}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin:0 0 22px}
.nav button{height:32px;padding:0;border:1px solid var(--line);background:var(--bg);font-family:var(--serif);font-size:14px;font-variant-numeric:tabular-nums}
.nav button:hover{border-color:var(--fg)}
.nav .is-answered{background:var(--plate);border-color:var(--fg)}
.nav .is-right{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nav .is-wrong{border:1.5px dashed var(--bad);color:var(--bad)}
.nav .is-current{outline:2px solid var(--fg);outline-offset:1px}
.q{border-top:1.5px solid var(--fg);padding-top:16px}
.q-eyebrow{margin:0 0 6px;font-size:14px;color:var(--muted)}
.q-prompt{margin:0 0 14px;font-size:20px;line-height:1.45;font-weight:400}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border:1px solid var(--fg);background:var(--bg);text-align:left;font-size:16.5px;line-height:1.4}
.opt:hover:not(:disabled){background:var(--plate)}
.opt .kbd{flex:none}
.opt .mark{margin-left:auto;padding-left:6px;font-family:var(--mono);font-size:14px;white-space:nowrap}
.opt.is-picked{border-width:2px;padding:9px 13px;background:var(--plate)}
.opt.is-right{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opt.is-wrong{border:1.5px dashed var(--bad);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.opt.is-wrong .mark,.opt.is-wrong .kbd{text-decoration:none}
.opt.is-dim{opacity:.5}
.fb{margin:14px 0 0;padding:12px 16px;border:.5px solid var(--fg);border-left:3px solid var(--ok)}
.fb.is-wrong{border-left-color:var(--bad)}
.fb p{margin:0}
.fb .verdict{font-weight:700;margin-bottom:4px}
.why p{margin:0 0 6px}
.steps{margin:2px 0 8px;padding-left:22px}
.steps li{margin:4px 0;padding-left:2px}
.why .why-h{margin:10px 0 2px;font-size:14.5px;color:var(--muted)}
.others{margin:0 0 4px;padding-left:20px}
.others li{margin:5px 0}
.others .tag{margin-left:6px;font-family:var(--mono);font-size:12.5px;color:var(--bad);white-space:nowrap}
.links{margin-top:6px;font-size:15px}
.step{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.step-right{display:flex;flex-wrap:wrap;gap:8px}
.confirm{margin-top:14px;padding:12px 16px;border:1px solid var(--fg);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.confirm p{margin:0;flex:1 1 220px}
.keys{margin:18px 0 0;font-size:13.5px;color:var(--muted);text-align:center}
.restart-line{margin:10px 0 0;font-size:14.5px;text-align:center}

/* results */
.results{padding-top:4px}
.score{text-align:center;padding:10px 0 18px}
.score-big{margin:0;font-size:clamp(48px,10vw,72px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score p{margin:6px 0 0}
.res-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 22px}
.res-filter{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;border-bottom:1.5px solid var(--fg);padding-bottom:6px}
.res-list{list-style:none;margin:0;padding:0}
.res-list>li{border-bottom:.5px solid var(--line)}
.res-list>li:last-child{border-bottom:1.5px solid var(--fg)}
.res-list details{padding:10px 0}
.res-list summary{display:grid;grid-template-columns:34px 22px minmax(0,1fr);gap:8px;cursor:pointer;list-style:none}
.res-list summary::-webkit-details-marker{display:none}
.res-n{font-weight:700;font-variant-numeric:tabular-nums}
.res-ok{color:var(--ok);font-weight:700}
.res-bad{color:var(--bad);font-weight:700}
.res-body{padding:8px 0 4px 64px;font-size:15.5px}
.res-body p{margin:0 0 4px}
.res-body .bt-wrap{margin:4px 0 8px}
.topics{margin:0 0 26px}
.topics h2{margin:0 0 8px}
.topics .bt{margin:0;width:100%}
.topics .bt td:last-child,.topics .bt th:last-child{text-align:left}
.topics .flag{color:var(--bad);font-style:italic}
.composite{margin:0 0 26px;padding:12px 16px;border:.5px solid var(--fg);border-left:3px solid var(--fg)}
.composite p{margin:0}
.composite p+p{margin-top:4px}

/* free response */
.fr-intro{margin:0 0 6px;font-style:italic;color:var(--muted)}
.fr{border-top:1.5px solid var(--fg);padding:18px 0 26px}
.fr h2 small{font-weight:400;font-style:italic;color:var(--muted);font-size:15px;margin-left:6px}
.fr-stem{margin:10px 0 6px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.part{margin:18px 0 0}
.part-prompt{margin:0 0 8px}
.part-prompt b{margin-right:4px}
.part textarea{width:100%;min-height:150px;padding:12px 14px;border:1px solid var(--fg);border-radius:0;background:var(--bg);font-family:var(--serif);font-size:16.5px;line-height:1.55;resize:vertical}
.part-meta{margin-top:4px;font-size:14px;color:var(--muted)}
.sol{margin-top:12px;padding:12px 18px;border:.5px solid var(--fg)}
.sol h3{margin:0 0 4px;font-size:15px}
.sol p{margin:0 0 10px}
.sol .crit{display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px 8px;margin:0 0 10px;font-size:15.5px}
.sol .crit dt{font-weight:700}
.sol .crit dd{margin:0}
.mark-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px}
.seg{display:inline-flex}
.seg button{min-width:44px;min-height:36px;padding:0 10px;border:1px solid var(--fg);background:var(--bg);font-family:var(--mono);font-size:14px}
.seg button+button{border-left:0}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.fr-actions{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.fr-score{font-size:16px}
.fr-score b{font-variant-numeric:tabular-nums}
.scale{margin-top:14px}
.scale summary{cursor:pointer;font-size:15px;color:var(--muted);font-style:italic}
.scale .bt{margin:8px 0 0}
.scale .bt td:last-child,.scale .bt th:last-child{text-align:left}
.foot{margin-top:40px;padding-top:12px;border-top:.5px solid var(--line);font-size:14px;color:var(--muted)}

@media (max-width:640px){
  .runhead-title{display:none}
  .runhead-actions{width:100%;justify-content:space-between}
  .title{padding:22px 0 16px}
  .choice-row{grid-template-columns:1fr}
  .q-prompt{font-size:18.5px}
  .res-body{padding-left:0}
  .keys{display:none}
  .fr-stem{text-align:left}
  .bt th,.bt td{padding:4px 7px}
  .sol{padding:10px 12px}
  .katex-display>.katex{font-size:.94em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.runhead,.rule,.tabs,.nav,.step,.keys,.restart-line,.res-actions{display:none!important}}
/* generic quiz additions */
.q-prompt p{margin:0}
.q-prompt p+p{margin-top:8px}
.q-ask{margin:10px 0 0!important;font-size:16px;font-style:italic;color:var(--muted)}
.blank{display:inline-block;width:3.4em;height:1em;margin:0 .12em;border-bottom:1.5px solid currentColor;vertical-align:-.12em}
.stim{margin:0 0 16px;padding:12px 16px;border:.5px solid var(--fg);background:var(--plate);font-size:16.5px;line-height:1.55;max-height:60vh;overflow:auto}
.stim-h{margin:0 0 6px!important;font-size:14px;color:var(--muted)}
.stim p{margin:0 0 8px}
.stim p:last-child{margin-bottom:0}
.fig{margin:0 0 14px;text-align:center}
.fig img{max-width:100%;height:auto;background:#fff}
:root[data-theme=dark] .fig img{filter:invert(.92) hue-rotate(180deg)}
.fig figcaption{font-size:14px;color:var(--muted);font-style:italic}
.target{margin:4px 0 0;font-style:italic}
.res-sum{display:block}
.opt>span:nth-child(2){flex:1 1 auto;min-width:0;overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto}
.sol>div{margin:0 0 10px}
.crit-pts{margin:0 0 10px;font-size:15.5px}
.crit-pts p{margin:0 0 4px}
.crit-pts ul{margin:0 0 4px;padding-left:20px}
</style>
</head>
<body>
<div class="runhead"><span class="runhead-title">{{RUNHEAD}}</span><span class="runhead-actions"><a href="{{BACK_HREF}}">&larr;&nbsp;{{BACK_LABEL}}</a>{{PDF_LINK}}<button type="button" class="theme-btn" id="theme-btn">Dark mode</button></span></div>
<div class="rule"><hr></div>

<main class="wrap">
  <header class="title">
    <h1>{{H1}}</h1>
    <p class="sub">{{SUB}}</p>
    <p class="meta">{{METALINE}}</p>
  </header>
{{TABS}}
  <section id="mc"{{MC_ROLE}}></section>
  <section id="fr" role="tabpanel" aria-labelledby="tab-fr" hidden></section>

  <p class="foot">{{FOOT}}</p>
</main>

<script id="data" type="application/json">{{DATA}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("data").textContent);
var META = DATA.meta, MC = DATA.mc, FR = DATA.fr || [], TOP = DATA.topics || {}, SEC = DATA.sections || {}, STIM = DATA.stims || {}, BY = {};
MC.forEach(function(q){ BY[q.n] = q; });
var KEY = META.key, FKEY = META.key + ".fr", HAS_FR = FR.length > 0;

function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function range(n){ var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

var S = load(KEY, null);
if (!S || !S.phase || !S.order || S.order.some(function(n){ return !BY[n]; })) S = { phase: "setup", mode: "practice", shuffleQ: false, shuffleC: false, order: [], copt: {}, ans: {}, pos: 0, full: null };
var confirmFinish = false;
var mcEl = document.getElementById("mc");

function start(nums){
  var list = nums || MC.map(function(q){ return q.n; });
  S.order = S.shuffleQ ? shuffle(list) : list.slice();
  S.copt = {};
  S.order.forEach(function(n){
    var q = BY[n], idx = range(q.options.length);
    S.copt[n] = (S.shuffleC && !q.fixed) ? shuffle(idx) : idx;
  });
  S.ans = {}; S.pos = 0; S.phase = "run"; confirmFinish = false;
  save(KEY, S); render(); focusTop();
}
function focusTop(){ var t = document.querySelector(".tabs") || document.querySelector(".title"); if (t && t.getBoundingClientRect().top < 0) t.scrollIntoView(); }

function stats(){
  var right = 0, done = 0;
  S.order.forEach(function(n){ if (n in S.ans){ done++; if (S.ans[n] === BY[n].answer) right++; } });
  return { right: right, done: done, total: S.order.length };
}
function topicShort(t){ return (META.topicPrefix || "") + t; }
function topicLabel(t){ return topicShort(t) + ", " + TOP[t].name; }
function guideLink(t, short){
  var g = TOP[t], txt = short ? g.name : topicLabel(t);
  return (META.guide && g.page) ? '<a href="' + META.guide + "#page=" + g.page + '">' + txt + "</a>" : txt;
}
function topicLinks(ts){
  ts = ts.filter(function(t){ return TOP[t]; });
  if (!ts.length || !META.guide) return "";
  return '<p class="links">Review ' + ts.map(function(t){ return guideLink(t); }).join(" &middot; ") + " in " + META.guideName + "</p>";
}
function explain(q, picked){
  var e = q.ex, h = '<div class="why"><p>' + e.idea + "</p>";
  if (e.steps.length) h += '<ol class="steps">' + e.steps.map(function(s){ return "<li>" + s + "</li>"; }).join("") + "</ol>";
  var rest = range(q.options.length).filter(function(i){ return i !== q.answer; });
  if (typeof picked === "number" && picked !== q.answer) rest = [picked].concat(rest.filter(function(i){ return i !== picked; }));
  h += '<p class="why-h sc">Why not the others</p><ul class="others">' + rest.map(function(i){
    return "<li>&ldquo;" + q.options[i] + "&rdquo;" + (i === picked ? '<span class="tag">your answer</span>' : "") + " &mdash; " + e.others[i] + "</li>";
  }).join("") + "</ul></div>";
  return h;
}
function table(q){ return q.table ? '<div class="bt-wrap">' + q.table + "</div>" : ""; }
function stim(q){ var s = q.stim && STIM[q.stim]; return s ? '<div class="stim">' + (s.title ? '<p class="stim-h sc">' + s.title + "</p>" : "") + s.html + "</div>" : ""; }
function promptHtml(q){
  return stim(q) + (q.fig || "") + '<div class="q-prompt"><p>' + q.prompt + "</p>" + (q.ask || META.ask ? '<p class="q-ask">' + (q.ask || META.ask) + "</p>" : "") + "</div>" + table(q);
}

function renderSetup(){
  mcEl.innerHTML =
    '<div class="setup">' +
      '<h2>How do you want to take it?</h2>' +
      '<div class="choice-row">' +
        '<button type="button" class="choice" data-mode="practice" aria-pressed="' + (S.mode === "practice") + '"><b>Practice</b><span>See the answer and why after each question</span></button>' +
        '<button type="button" class="choice" data-mode="exam" aria-pressed="' + (S.mode === "exam") + '"><b>Exam</b><span>Answer everything, then see your score</span></button>' +
      '</div>' +
      '<div class="checks">' +
        '<label><input type="checkbox" id="opt-sq"' + (S.shuffleQ ? " checked" : "") + '> Shuffle questions</label>' +
        '<label><input type="checkbox" id="opt-sc"' + (S.shuffleC ? " checked" : "") + '> Shuffle answer choices</label>' +
      '</div>' +
      '<div class="setup-actions"><button type="button" class="btn btn--solid btn--lg" id="go">Start' + (HAS_FR ? " multiple choice" : "") + '</button></div>' +
      '<p class="note">' + META.setupNote + " Keyboard: 1&ndash;" + Math.max.apply(null, MC.map(function(q){ return q.options.length; })) + " to answer, &larr; &rarr; to move, Enter for next.</p>" +
    '</div>';
  mcEl.querySelectorAll(".choice").forEach(function(b){ b.onclick = function(){ S.mode = b.dataset.mode; render(); }; });
  document.getElementById("opt-sq").onchange = function(e){ S.shuffleQ = e.target.checked; };
  document.getElementById("opt-sc").onchange = function(e){ S.shuffleC = e.target.checked; };
  document.getElementById("go").onclick = function(){ start(); };
}

function renderRun(){
  var n = S.order[S.pos], q = BY[n], st = stats(), practice = S.mode === "practice";
  var picked = (n in S.ans) ? S.ans[n] : null, locked = practice && picked !== null;
  var nav = S.order.map(function(m, i){
    var c = [];
    if (m in S.ans){ if (practice) c.push(S.ans[m] === BY[m].answer ? "is-right" : "is-wrong"); else c.push("is-answered"); }
    if (i === S.pos) c.push("is-current");
    return '<button type="button" class="' + c.join(" ") + '" data-go="' + i + '" aria-label="Question ' + (i + 1) + '"' + (i === S.pos ? ' aria-current="step"' : "") + ">" + (i + 1) + "</button>";
  }).join("");
  var opts = S.copt[n].map(function(oi, k){
    var cls = ["opt"], mark = "";
    if (locked){
      if (oi === q.answer){ cls.push("is-right"); mark = oi === picked ? "&check; your answer" : "&check; correct"; }
      else if (oi === picked){ cls.push("is-wrong"); mark = "&cross; your answer"; }
      else cls.push("is-dim");
    } else if (oi === picked) cls.push("is-picked");
    return '<li><button type="button" class="' + cls.join(" ") + '" data-opt="' + oi + '"' + (locked ? " disabled" : "") + '><span class="kbd">' + (k + 1) + "</span><span>" + q.options[oi] + '</span><span class="mark">' + mark + "</span></button></li>";
  }).join("");
  var fb = "";
  if (locked){
    var ok = picked === q.answer, ans = q.options[q.answer];
    fb = '<div class="fb' + (ok ? "" : " is-wrong") + '"><p class="verdict" role="status">' + (ok ? "Correct." : "Not quite. The answer is &ldquo;" + ans + "&rdquo;" + (/[.?!]$/.test(ans) ? "" : ".")) + "</p>" + explain(q, picked) + topicLinks([q.topic]) + "</div>";
  }
  var last = S.pos === S.order.length - 1, allDone = st.done === st.total;
  var nextBtn = last
    ? '<button type="button" class="btn btn--solid" id="finish">' + (practice ? "See results" : "Finish test") + "</button>"
    : '<button type="button" class="btn btn--solid" id="next">Next &rarr;</button>';
  var finishEarly = (!last && !practice) ? '<button type="button" class="btn" id="finish">Finish test</button>' : (!last && practice && allDone ? '<button type="button" class="btn" id="finish">See results</button>' : "");
  var conf = "";
  if (confirmFinish){
    var left = st.total - st.done;
    conf = '<div class="confirm"><p>' + left + " question" + (left === 1 ? " is" : "s are") + " unanswered and will be marked wrong. Finish anyway?</p>" +
      '<button type="button" class="btn" id="conf-no">Keep going</button><button type="button" class="btn btn--solid" id="conf-yes">Finish</button></div>';
  }
  var eyebrow = "Question " + q.n + (SEC[q.sec] ? " &middot; " + SEC[q.sec] : "") + (q.tag ? " &middot; " + q.tag : (q.topic ? " &middot; " + topicShort(q.topic) : ""));
  mcEl.innerHTML =
    '<div class="bar"><span>Question ' + (S.pos + 1) + " of " + st.total + " &middot; " + (practice ? "Practice" : "Exam") + " mode</span><span>" +
      (practice ? st.right + " correct of " + st.done + " answered" : st.done + " of " + st.total + " answered") + "</span></div>" +
    '<div class="track"><span style="width:' + (st.done / st.total * 100) + '%"></span></div>' +
    '<nav class="nav" aria-label="Questions">' + nav + "</nav>" +
    '<article class="q">' +
      '<p class="q-eyebrow sc">' + eyebrow + "</p>" +
      promptHtml(q) +
      '<ol class="opts">' + opts + "</ol>" + fb +
      '<div class="step"><button type="button" class="btn" id="prev"' + (S.pos === 0 ? " disabled" : "") + '>&larr; Back</button><span class="step-right">' + finishEarly + nextBtn + "</span></div>" +
      conf +
    "</article>" +
    '<p class="keys"><span class="kbd">1</span>&ndash;<span class="kbd">' + q.options.length + '</span> answer &nbsp; <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> move &nbsp; <span class="kbd">Enter</span> next</p>' +
    '<p class="restart-line"><a href="#" id="restart">Start over</a> <span class="muted">&middot; progress is saved in this browser</span></p>';

  mcEl.querySelectorAll("[data-go]").forEach(function(b){ b.onclick = function(){ go(+b.dataset.go); }; });
  mcEl.querySelectorAll("[data-opt]").forEach(function(b){ b.onclick = function(){ pick(+b.dataset.opt); }; });
  bind("prev", function(){ go(S.pos - 1); });
  bind("next", function(){ go(S.pos + 1); });
  bind("finish", finish);
  bind("conf-no", function(){ confirmFinish = false; render(); });
  bind("conf-yes", function(){ confirmFinish = false; showResults(); });
  bind("restart", function(e){ e.preventDefault(); S.phase = "setup"; save(KEY, S); render(); });
}
function bind(id, fn){ var el = document.getElementById(id); if (el) el.onclick = fn; }

function pick(oi){
  var n = S.order[S.pos];
  if (S.mode === "practice" && (n in S.ans)) return;
  S.ans[n] = oi; save(KEY, S); render();
  if (S.mode === "practice"){ var fb = mcEl.querySelector(".fb"); if (fb && fb.getBoundingClientRect().bottom > innerHeight) fb.scrollIntoView({ block: "nearest" }); }
}
function go(i){
  if (i < 0 || i >= S.order.length) return;
  S.pos = i; confirmFinish = false; save(KEY, S); render();
  var q = mcEl.querySelector(".q"); if (q && q.getBoundingClientRect().top < 0) q.scrollIntoView();
}
function finish(){
  var st = stats();
  if (st.done < st.total && !confirmFinish){ confirmFinish = true; render(); var c = mcEl.querySelector(".confirm"); if (c) c.scrollIntoView({ block: "nearest" }); return; }
  showResults();
}
function showResults(){
  S.phase = "results";
  if (S.order.length === MC.length) S.full = stats().right;
  save(KEY, S); render(); if (HAS_FR) renderFR(); focusTop();
}

/* composite score (only when the document defines one) */
function frTotal(){
  var t = 0;
  for (var i = 0; i < FR.length; i++){ var s = frScore(FR[i]); if (s === null) return null; t += s; }
  return t;
}
function frMax(){ return FR.reduce(function(a, f){ return a + frItemMax(f); }, 0); }
function compositeHtml(){
  var C = META.composite;
  if (!C || !HAS_FR) return "";
  var mc = (typeof S.full === "number") ? S.full : null, fr = frTotal(), fm = frMax(), mm = MC.length;
  if (mc === null && fr === null) return "";
  var lines = [];
  if (mc === null) lines.push("Free response: <b>" + fr + " / " + fm + "</b>. Take the full multiple-choice part to get your composite score.");
  else if (fr === null) lines.push("Multiple choice: <b>" + mc + " / " + mm + "</b>. Write and mark every free-response question to get your composite score.");
  else {
    var c = Math.round(C.mcWeight * mc / mm + C.frWeight * fr / fm), band = "";
    for (var i = 0; i < C.bands.length; i++){ if (c >= C.bands[i][0]){ band = C.bands[i][1]; break; } }
    lines.push("Composite score: <b>" + c + " / " + (C.mcWeight + C.frWeight) + "</b> &nbsp;<span class=\"muted\">= " + C.mcWeight + " &times; " + mc + "/" + mm + " + " + C.frWeight + " &times; " + fr + "/" + fm + "</span>");
    if (band) lines.push(band);
  }
  return '<div class="composite" role="status">' + lines.map(function(l){ return "<p>" + l + "</p>"; }).join("") + "</div>";
}
function targetHtml(st){
  var T = META.target, B = META.bands, h = "";
  if (st.total !== MC.length) return "";
  if (T) h += '<p class="target">' + T.label + ": " + T.mc + " / " + MC.length + " &middot; " + (st.right >= T.mc ? "met" : (T.mc - st.right) + " short") + "</p>";
  if (B) for (var i = 0; i < B.length; i++){ if (st.right >= B[i][0]){ h += '<p class="target">' + B[i][1] + "</p>"; break; } }
  return h;
}

var resFilter = "all";
function renderResults(){
  var st = stats(), pct = Math.round(st.right / st.total * 100), fullRun = st.total === MC.length;
  var missed = S.order.filter(function(n){ return S.ans[n] !== BY[n].answer; });
  var rows = S.order.map(function(n, i){
    var q = BY[n], a = S.ans[n], ok = a === q.answer;
    if (resFilter === "missed" && ok) return "";
    return '<li><details><summary><span class="res-n">' + (i + 1) + '.</span><span class="' + (ok ? "res-ok" : "res-bad") + '" aria-label="' + (ok ? "correct" : "wrong") + '">' + (ok ? "&check;" : "&cross;") + '</span><span class="res-sum">' + q.prompt + "</span></summary>" +
      '<div class="res-body">' + stim(q) + (q.fig || "") + table(q) + '<p><span class="sc">Your answer:</span> ' + (a === undefined ? "<i>skipped</i>" : q.options[a]) + "</p>" +
      (ok ? "" : '<p><span class="sc">Correct:</span> ' + q.options[q.answer] + "</p>") +
      explain(q, a) + topicLinks([q.topic]) + "</div></details></li>";
  }).join("");
  var tally = {};
  S.order.forEach(function(n){ var t = BY[n].topic; if (!t) return; tally[t] = tally[t] || { right: 0, total: 0 }; tally[t].total++; if (S.ans[n] === BY[n].answer) tally[t].right++; });
  var trows = Object.keys(TOP).filter(function(t){ return tally[t]; }).map(function(t){
    var x = tally[t], miss = x.total - x.right;
    return "<tr><th scope=\"row\">" + topicShort(t) + "</th><td>" + x.right + " / " + x.total + "</td><td>" + guideLink(t, true) +
      (miss >= 2 ? ' <span class="flag">&middot; reread this section</span>' : "") + "</td></tr>";
  }).join("");
  mcEl.innerHTML =
    '<div class="results">' +
      '<div class="score"><p class="score-big">' + st.right + " / " + st.total + "</p><p>" + pct + "% correct" + (fullRun ? "" : " &middot; retry of missed questions") + "</p>" + targetHtml(st) + "</div>" +
      '<div class="res-actions">' +
        (missed.length ? '<button type="button" class="btn btn--solid" id="retry">Retry the ' + missed.length + " missed</button>" : "") +
        '<button type="button" class="btn" id="again">Take the full test again</button>' +
        (HAS_FR ? '<button type="button" class="btn" id="to-fr">Go to free response</button>' : "") +
      "</div>" +
      compositeHtml() +
      (trows ? '<div class="topics"><h2>' + (META.byTopic || "By topic") + '</h2><table class="bt"><thead><tr><th scope="col">' + (META.topicCol || "Topic") + '</th><th scope="col">Correct</th><th scope="col">' + (META.guideCol || "Guide section") + "</th></tr></thead><tbody>" + trows + "</tbody></table>" +
        (META.topicNote ? '<p class="note" style="margin-top:6px">' + META.topicNote + "</p>" : "") + "</div>" : "") +
      '<div class="res-filter"><h2>Review</h2><span><label><input type="checkbox" id="only-missed"' + (resFilter === "missed" ? " checked" : "") + "> Show missed only</label></span></div>" +
      '<ul class="res-list">' + (rows || '<li><p class="note" style="padding:12px 0">Nothing missed.</p></li>') + "</ul>" +
    "</div>";
  bind("retry", function(){ start(missed); });
  bind("again", function(){ S.phase = "setup"; save(KEY, S); render(); });
  bind("to-fr", function(){ setTab("fr"); });
  document.getElementById("only-missed").onchange = function(e){ resFilter = e.target.checked ? "missed" : "all"; render(); };
}

function render(){
  if (S.phase === "run" && S.order.length) renderRun();
  else if (S.phase === "results" && S.order.length) renderResults();
  else { S.phase = "setup"; renderSetup(); }
}

/* free response: "epi" parts (E/P/I -> 0-4 per question) or "points" parts (0..max each) */
var frEl = document.getElementById("fr"), F = load(FKEY, null);
if (!F || typeof F !== "object") F = {};
F.drafts = F.drafts || {}; F.marks = F.marks || {}; F.open = F.open || {};
var LABELS = { 4: "Complete", 3: "Substantial", 2: "Developing", 1: "Minimal", 0: "" };
function frItemMax(f){ return f.mode === "points" ? f.parts.reduce(function(a, p){ return a + p.max; }, 0) : 4; }
function frScore(f){
  if (f.mode === "points"){
    var t = 0;
    for (var j = 0; j < f.parts.length; j++){ var v = F.marks[f.n + f.parts[j].label]; if (v === undefined || v === "") return null; t += +v; }
    return t;
  }
  var e = 0, p = 0;
  for (var i = 0; i < f.parts.length; i++){
    var m = F.marks[f.n + f.parts[i].label];
    if (!m) return null;
    if (m === "E") e++; else if (m === "P") p++;
  }
  if (e === 3) return 4;
  if (e === 2 && p === 1) return 3;
  if ((e === 2 && p === 0) || (e === 1 && p >= 1) || p === 3) return 2;
  if ((e === 1 && p === 0) || (e === 0 && p === 2)) return 1;
  return 0;
}
function words(t){ var m = t.trim().match(/\S+/g); return m ? m.length : 0; }
var SCALE = '<details class="scale"><summary>How part scores convert to 0&ndash;4</summary><table class="bt"><thead><tr><th scope="col">Score</th><th scope="col">Label</th><th scope="col">Part scores (three parts, each E, P, or I)</th></tr></thead><tbody>' +
  "<tr><td>4</td><td>Complete</td><td>three parts E</td></tr>" +
  "<tr><td>3</td><td>Substantial</td><td>two parts E and one part P</td></tr>" +
  "<tr><td>2</td><td>Developing</td><td>two E and no P; or one E and one or two P; or three P</td></tr>" +
  "<tr><td>1</td><td>Minimal</td><td>one E and no P; or no E and two P</td></tr>" +
  "<tr><td>0</td><td></td><td>anything less</td></tr></tbody></table></details>";
function frScoreHtml(f){
  var s = frScore(f), mx = frItemMax(f);
  if (s === null) return '<span class="muted">Mark every part to score this question.</span>';
  return "Score: <b>" + s + " / " + mx + "</b>" + (f.mode !== "points" && LABELS[s] ? " &middot; " + LABELS[s] : "");
}
function markButtons(f, p, id, m){
  var vals = f.mode === "points" ? range(p.max + 1).map(String) : ["E", "P", "I"];
  return vals.map(function(x){ return '<button type="button" data-mark="' + id + '" data-f="' + f.n + '" data-v="' + x + '" aria-pressed="' + (m === x) + '">' + x + "</button>"; }).join("");
}
function renderFR(){
  if (!HAS_FR) return;
  frEl.innerHTML = '<p class="fr-intro">' + META.frIntro + "</p>" +
    FR.map(function(f){
      var open = !!F.open[f.n];
      var parts = f.parts.map(function(p){
        var id = f.n + p.label, d = F.drafts[id] || "", m = (F.marks[id] === undefined ? "" : String(F.marks[id]));
        var crit = f.mode === "points"
          ? '<div class="crit-pts">' + p.rubric + "</div>"
          : '<dl class="crit"><dt>E</dt><dd>if the response ' + p.e + "</dd><dt>P</dt><dd>if " + p.p + "</dd></dl>";
        return '<div class="part"><p class="part-prompt"><b>(' + p.label + ")</b>" + p.prompt + "</p>" +
          '<label class="sc" for="fr-' + id + '">Your answer to (' + p.label + ")</label>" +
          '<textarea id="fr-' + id + '" data-fr="' + id + '" spellcheck="true">' + esc(d) + "</textarea>" +
          '<p class="part-meta" id="wc-' + id + '">' + words(d) + " words &middot; saved in this browser</p>" +
          '<div class="sol"' + (open ? "" : " hidden") + ' data-sol="' + f.n + '"><h3>Model solution (' + p.label + ")</h3><div>" + p.solution + "</div>" + crit +
            '<div class="mark-row"><span>Your mark for (' + p.label + ")" + (f.mode === "points" ? ", out of " + p.max : "") + ':</span><span class="seg" role="group" aria-label="Mark for part ' + p.label + '">' + markButtons(f, p, id, m) + "</span></div></div></div>";
      }).join("");
      return '<article class="fr"><h2>Question ' + f.n + "<small>" + f.head + "</small></h2>" +
        (f.stim ? stim(f) : "") + '<div class="fr-stem">' + f.stem + "</div>" + parts +
        '<div class="fr-actions"><span class="fr-score" id="score-' + f.n + '">' + (open ? frScoreHtml(f) : "") + "</span>" +
          '<button type="button" class="btn" data-open="' + f.n + '" aria-expanded="' + open + '">' + (open ? "Hide model solution" : "Show model solution and scoring") + "</button></div>" +
        (open ? (f.mode === "points" ? "" : SCALE) + topicLinks(f.guide || []) : "") +
        "</article>";
    }).join("") + '<div id="fr-composite">' + compositeHtml() + "</div>";
  frEl.querySelectorAll("textarea").forEach(function(t){
    t.oninput = function(){ F.drafts[t.dataset.fr] = t.value; save(FKEY, F); document.getElementById("wc-" + t.dataset.fr).innerHTML = words(t.value) + " words &middot; saved in this browser"; };
  });
  frEl.querySelectorAll("[data-open]").forEach(function(b){
    b.onclick = function(){ var n = b.dataset.open; F.open[n] = !F.open[n]; save(FKEY, F); renderFR(); var a = document.getElementById("score-" + n); if (a) a.closest(".fr").querySelector(".part").scrollIntoView({ block: "nearest" }); };
  });
  frEl.querySelectorAll("[data-mark]").forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.mark; F.marks[id] = F.marks[id] === b.dataset.v ? "" : b.dataset.v; save(FKEY, F);
      b.parentNode.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", String(F.marks[id] === x.dataset.v)); });
      var f = FR.filter(function(x){ return String(x.n) === b.dataset.f; })[0];
      document.getElementById("score-" + f.n).innerHTML = frScoreHtml(f);
      document.getElementById("fr-composite").innerHTML = compositeHtml();
      if (S.phase === "results") render();
    };
  });
}

/* tabs (only when there is a free-response part) */
function setTab(t){
  if (!HAS_FR) return;
  var mc = t === "mc";
  document.getElementById("tab-mc").setAttribute("aria-selected", String(mc));
  document.getElementById("tab-fr").setAttribute("aria-selected", String(!mc));
  mcEl.hidden = !mc; frEl.hidden = mc;
  try{ history.replaceState(null, "", mc ? location.pathname : "#free-response"); }catch(e){}
  focusTop();
}
if (HAS_FR){
  document.getElementById("tab-mc").onclick = function(){ setTab("mc"); };
  document.getElementById("tab-fr").onclick = function(){ setTab("fr"); };
}

/* keyboard */
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input") return;
  if (mcEl.hidden || S.phase !== "run") return;
  var n = S.order[S.pos], q = BY[n];
  if (/^[1-9]$/.test(e.key)){ var k = +e.key - 1; if (k < q.options.length){ e.preventDefault(); pick(S.copt[n][k]); } }
  else if (e.key === "ArrowRight"){ e.preventDefault(); go(S.pos + 1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); go(S.pos - 1); }
  else if (e.key === "Enter" && tag !== "button" && tag !== "a"){ e.preventDefault(); if (S.pos < S.order.length - 1) go(S.pos + 1); else finish(); }
});

/* theme */
var root = document.documentElement, tb = document.getElementById("theme-btn");
function syncTheme(){ var dark = root.getAttribute("data-theme") === "dark"; tb.textContent = dark ? "Light mode" : "Dark mode"; tb.setAttribute("aria-pressed", String(dark)); }
tb.onclick = function(){ var dark = root.getAttribute("data-theme") !== "dark"; root.setAttribute("data-theme", dark ? "dark" : "light"); try{ localStorage.setItem("apah.theme", dark ? "dark" : "light"); }catch(e){} syncTheme(); };
syncTheme();

render(); renderFR();
if (HAS_FR && location.hash === "#free-response") setTab("fr");
})();
</script>
</body>
